<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>債權委外題庫測驗系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root {
    --bg:#f8f7f4;
    --surface:#fff;
    --border:#e5e2dc;
    --border2:#d0ccc4;
    --text:#1a1917;
    --text2:#6b6860;
    --text3:#9c9890;
    --blue-bg:#e8f0fb;
    --blue-txt:#1a4fa0;
    --blue-bdr:#3b7dd8;
    --green-bg:#e8f5ee;
    --green-txt:#1a6e3a;
    --green-bdr:#2d9e5a;
    --red-bg:#fceaea;
    --red-txt:#9b2020;
    --red-bdr:#d94040;
    --amber-bg:#fef3e2;
    --amber-txt:#7a4800;
    --amber-bdr:#d4900a;
    --marked-bg:#f5eeff;
    --marked-txt:#6b21c8;
    --marked-bdr:#9b59e8;
    /* mapped vars */
    --accent: var(--blue-txt);
    --accent2: var(--blue-bdr);
    --accent-light: var(--blue-bg);
    --warn: var(--red-txt);
    --success: var(--green-txt);
    --muted: var(--text2);
    --opt-letter-bg: var(--blue-bg);
    --opt-letter-color: var(--blue-txt);
    --shadow: 0 1px 4px rgba(0,0,0,.07);
    --topbar-bg: var(--surface);
    --topbar-text: var(--text);
    --topbar-muted: var(--text2);
    --r:10px;
  }

  html.dark {
    --bg:#10121a;
    --surface:#1c1f2e;
    --border:#2d3148;
    --border2:#3a4060;
    --text:#dde1ee;
    --text2:#8890b0;
    --text3:#5a6080;
    --blue-bg:rgba(59,125,216,0.15);
    --blue-txt:#7eb3f5;
    --blue-bdr:#3b7dd8;
    --green-bg:rgba(45,158,90,0.15);
    --green-txt:#5dcc8a;
    --green-bdr:#2d9e5a;
    --red-bg:rgba(217,64,64,0.15);
    --red-txt:#f08080;
    --red-bdr:#d94040;
    --amber-bg:rgba(212,144,10,0.15);
    --amber-txt:#e0b060;
    --amber-bdr:#d4900a;
    --marked-bg:rgba(155,89,232,0.15);
    --marked-txt:#c09af5;
    --marked-bdr:#9b59e8;
    --shadow: 0 1px 4px rgba(0,0,0,.30);
    --topbar-bg: var(--surface);
    --topbar-text: var(--text);
    --topbar-muted: var(--text2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body, .topbar, .q-nav, .screen, .menu-btn, .option, .nav-btn, .result-btn, .wrong-item, .toast {
    transition: background-color .25s, border-color .25s, color .25s;
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 18px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── HOME ── */
  #home {
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
    background: var(--bg);
  }
  .home-inner {
    text-align: center;
    max-width: 520px;
    width: 100%;
  }
  .badge {
    display: inline-block;
    background: var(--blue-bg);
    border: 1px solid var(--blue-bdr);
    color: var(--blue-txt);
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .10em;
    text-transform: uppercase;
    padding: .3em 1em;
    border-radius: 20px;
    margin-bottom: 1.2rem;
  }
  h1 {
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -.01em;
    margin-bottom: .6rem;
    color: var(--text);
  }
  h1 span { color: var(--blue-txt); }
  .subtitle {
    color: var(--text2);
    font-size: .95rem;
    line-height: 1.7;
    margin-bottom: 1.8rem;
  }
  .home-stats {
    display: flex;
    justify-content: center;
    gap: .5rem;
    margin-bottom: 1.5rem;
  }
  .stat-item {
    flex: 1;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: .9rem .5rem;
  }
  .stat-num {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--blue-txt);
  }
  .stat-label { font-size: .75rem; color: var(--text3); margin-top: .2rem; }
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .75rem;
    margin-bottom: 1rem;
  }
  .menu-btn {
    padding: 1.2rem 1rem;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .menu-btn:hover, .menu-btn:active {
    border-color: var(--blue-bdr);
    background: var(--blue-bg);
  }
  .menu-btn.primary {
    background: var(--blue-txt);
    border-color: var(--blue-txt);
    color: #fff;
    font-weight: 700;
  }
  .menu-btn.primary:hover, .menu-btn.primary:active {
    opacity: .88;
  }
  .menu-btn.marked-btn {
    border-color: var(--marked-bdr);
    color: var(--marked-txt);
  }
  .menu-btn.marked-btn:hover, .menu-btn.marked-btn:active {
    background: var(--marked-bg);
  }
  .btn-icon { font-size: 1.5rem; display: block; margin-bottom: .45rem; }
  .btn-label { font-size: .95rem; font-weight: 700; display: block; color: inherit; }
  .btn-sub { font-size: .78rem; color: var(--text3); margin-top: .2rem; display: block; }
  .menu-btn.primary .btn-sub { color: rgba(255,255,255,.7); }
  .menu-btn.marked-btn .btn-sub { color: var(--marked-txt); opacity: .7; }
  .marked-count-badge {
    display: inline-block;
    background: var(--marked-bdr);
    color: #fff;
    border-radius: 20px;
    font-size: .7rem;
    font-weight: 700;
    padding: .1em .6em;
    margin-left: .35em;
  }

  /* ── TOPBAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1rem;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-title { font-weight: 700; font-size: 1.05rem; color: var(--blue-txt); letter-spacing: 1px; }
  .topbar-info { color: var(--text3); font-size: .88rem; font-weight: 600; }
  .topbar-back {
    background: var(--bg);
    border: 1px solid var(--border2);
    color: var(--text2);
    cursor: pointer;
    font-size: .9rem;
    font-family: inherit;
    font-weight: 600;
    padding: 0 .75rem;
    height: 34px;
    border-radius: 8px;
    transition: all .15s;
  }
  .topbar-back:hover { border-color: var(--blue-bdr); color: var(--blue-txt); }

  /* ── PROGRESS ── */
  .progress-bar {
    height: 4px;
    background: var(--border);
    position: sticky;
    top: 52px;
    z-index: 9;
  }
  .progress-fill {
    height: 100%;
    background: var(--blue-bdr);
    transition: width .3s ease;
  }

  /* ── QUESTION AREA ── */
  .q-area {
    flex: 1;
    padding: 1rem;
    max-width: 100%;
    width: 100%;
  }
  .q-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .85rem;
  }
  .q-num {
    font-size: .82rem;
    font-weight: 600;
    color: var(--blue-txt);
    background: var(--blue-bg);
    padding: .2em .8em;
    border-radius: 20px;
  }
  .mark-btn {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: .35rem .75rem;
    cursor: pointer;
    font-size: .85rem;
    font-family: inherit;
    transition: all .15s;
    color: var(--text3);
    font-weight: 600;
  }
  .mark-btn.marked {
    border-color: var(--marked-bdr);
    color: var(--marked-txt);
    background: var(--marked-bg);
  }
  .mark-btn:hover { border-color: var(--marked-bdr); color: var(--marked-txt); }

  .q-text {
    font-size: 1em;
    line-height: 1.8;
    font-weight: 400;
    margin-bottom: 1.2rem;
    color: var(--text);
    padding: .25rem 0;
  }

  .options { display: flex; flex-direction: column; gap: .55rem; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: .75rem;
    padding: .85rem 1rem;
    border-radius: var(--r);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    transition: background .1s, border-color .1s;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    font-size: 1em;
    line-height: 1.65;
    -webkit-tap-highlight-color: transparent;
  }
  .option:hover:not(:disabled), .option:active:not(:disabled) {
    background: var(--bg);
    border-color: var(--border2);
  }
  .option .opt-letter {
    flex-shrink: 0;
    font-weight: 700;
    font-size: .85em;
    color: var(--text3);
    min-width: 1.1rem;
    margin-top: .15rem;
  }
  .option:hover:not(:disabled) .opt-letter { color: var(--text2); }
  .option.selected { border-color: var(--blue-bdr); background: var(--blue-bg); }
  .option.selected .opt-letter { color: var(--blue-txt); }
  .option.correct { border-color: var(--green-bdr); background: var(--green-bg); color: var(--green-txt); }
  .option.correct .opt-letter { color: var(--green-txt); }
  .option.wrong { border-color: var(--red-bdr); background: var(--red-bg); color: var(--red-txt); }
  .option.wrong .opt-letter { color: var(--red-txt); }
  .option:disabled { cursor: default; }

  .explanation {
    margin-top: .75rem;
    padding: .85rem 1rem;
    border-radius: var(--r);
    font-size: .9em;
    line-height: 1.7;
    font-weight: 400;
  }
  .explanation.correct-exp {
    background: var(--green-bg);
    border: 1px solid var(--green-bdr);
    color: var(--green-txt);
  }
  .explanation.wrong-exp {
    background: var(--red-bg);
    border: 1px solid var(--red-bdr);
    color: var(--red-txt);
  }

  /* ── NAV ── */
  .q-nav {
    display: flex;
    gap: .6rem;
    padding: .75rem 1rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    bottom: 0;
    width: 100%;
  }
  .nav-btn {
    flex: 1;
    padding: .75rem;
    border-radius: var(--r);
    border: 1px solid var(--border2);
    background: var(--bg);
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
    height: 44px;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover, .nav-btn:active { background: var(--surface); border-color: var(--blue-bdr); color: var(--blue-txt); }
  .nav-btn.next-btn {
    background: var(--blue-txt);
    border-color: var(--blue-txt);
    color: #fff;
    font-weight: 700;
  }
  .nav-btn.next-btn:hover, .nav-btn.next-btn:active { opacity: .88; }
  .nav-btn:disabled { opacity: .32; cursor: not-allowed; }

  /* ── QUIZ LIST (全部練習) ── */
  .quiz-list-screen .q-area { padding-top: 1rem; }
  .filter-bar {
    display: flex;
    gap: .5rem;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: .4rem .9rem;
    border-radius: 2rem;
    border: 1.5px solid var(--border);
    background: none;
    color: var(--muted);
    font-size: .8rem;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
  }
  .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,200,160,.08);
  }

  /* ── EXAM RESULT ── */
  #result {
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem;
    position: relative;
  }
  .result-inner {
    max-width: 100%;
    width: 100%;
    text-align: center;
  }
  .result-score {
    font-size: 4rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: .3rem;
  }
  .result-score.pass { color: var(--green-txt); }
  .result-score.fail { color: var(--red-txt); }
  .result-verdict {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
    color: var(--text2);
  }
  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: .5rem;
    margin-bottom: 1.2rem;
  }
  .rs-item {
    text-align: center;
    background: var(--bg);
    border-radius: var(--r);
    padding: .9rem .5rem;
    border: 1px solid var(--border);
  }
  .rs-num { font-size: 1.4rem; font-weight: 700; }
  .rs-num.c { color: var(--green-txt); }
  .rs-num.w { color: var(--red-txt); }
  .rs-label { font-size: .75rem; color: var(--text3); margin-top: .15rem; }
  .result-actions { display: flex; flex-direction: column; gap: .6rem; }
  .result-btn {
    padding: .85rem;
    border-radius: var(--r);
    border: 1px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
    height: 48px;
  }
  .result-btn.primary {
    background: var(--blue-txt);
    border-color: var(--blue-txt);
    color: #fff;
    font-weight: 700;
  }
  .result-btn:hover { background: var(--surface); border-color: var(--blue-bdr); color: var(--blue-txt); }
  .result-btn.primary:hover { opacity: .88; background: var(--blue-txt); color: #fff; }

  /* ── WRONG LIST ── */
  #wrong-review { flex-direction: column; }
  .wrong-list { flex: 1; overflow-y: auto; padding: .85rem 1rem; }
  .wrong-item {
    padding: .9rem 1rem;
    border-radius: var(--r);
    border: 1px solid var(--border);
    background: var(--surface);
    margin-bottom: .6rem;
  }
  .wrong-item-q { font-size: .95rem; line-height: 1.7; margin-bottom: .45rem; color: var(--text); }
  .wrong-item-meta { font-size: .85rem; color: var(--text3); }
  .wrong-item-meta span { margin-right: 1rem; display: inline-block; }
  .wrong-item-meta .ans { color: var(--green-txt); font-weight: 700; }
  .wrong-item-meta .your { color: var(--red-txt); font-weight: 700; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    border-radius: 8px;
    padding: .6rem 1.2rem;
    font-size: .88rem;
    font-weight: 600;
    opacity: 0;
    transition: all .25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── ORDER TOGGLE ── */
  .order-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 8px;
    overflow: hidden;
  }
  .order-btn {
    background: none;
    border: none;
    padding: 0 .65rem;
    height: 32px;
    font-size: .8rem;
    font-weight: 600;
    font-family: inherit;
    color: var(--text3);
    cursor: pointer;
    transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .order-btn.active {
    background: var(--blue-txt);
    color: #fff;
  }
  .order-btn:not(.active):hover { color: var(--blue-txt); }

  /* ── THEME TOGGLE ── */
  .theme-toggle {
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
    flex-shrink: 0;
    color: var(--text2);
    -webkit-tap-highlight-color: transparent;
    padding: 0;
  }
  .theme-toggle svg { display: block; }
  .theme-toggle:hover, .theme-toggle:active { border-color: var(--blue-bdr); color: var(--blue-txt); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  @media (max-width: 480px) {
    .menu-grid { grid-template-columns: 1fr 1fr; }
    .home-inner { padding: 0 .25rem; }
  }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div style="position:absolute;top:1.2rem;right:1.5rem;">
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn-home" title="切換主題"></button>
  </div>
  <div class="home-inner">
    <div class="badge">債權委外認證</div>
    <h1>題庫<span>練習</span>系統</h1>
    <p class="subtitle">265 道題目，涵蓋民法、消費者保護法與相關法規，<br>完整練習或模擬正式考試。</p>
    <div class="home-stats">
      <div class="stat-item"><div class="stat-num">265</div><div class="stat-label">題目總數</div></div>
      <div class="stat-item"><div class="stat-num">80</div><div class="stat-label">模擬考題數</div></div>
      <div class="stat-item"><div class="stat-num">70</div><div class="stat-label">及格分數</div></div>
    </div>
    <div class="menu-grid">
      <button class="menu-btn primary" onclick="startPractice()">
        <span class="btn-icon">📚</span>
        <span class="btn-label">全部練習</span>
        <span class="btn-sub">265 題，含即時解析</span>
      </button>
      <button class="menu-btn" onclick="startExam()">
        <span class="btn-icon">📝</span>
        <span class="btn-label">模擬考試</span>
        <span class="btn-sub">隨機 80 題 · 每題 1.25 分</span>
      </button>
      <button class="menu-btn marked-btn" onclick="startMarkedPractice()" id="marked-home-btn">
        <span class="btn-icon">⭐</span>
        <span class="btn-label">錯誤標記練習 <span class="marked-count-badge" id="marked-count-badge">0</span></span>
        <span class="btn-sub">練習已標記題目</span>
      </button>
      <button class="menu-btn" onclick="showWrongList()">
        <span class="btn-icon">📋</span>
        <span class="btn-label">錯誤記錄</span>
        <span class="btn-sub">上次模擬考錯題</span>
      </button>
    </div>
  </div>
</div>

<!-- PRACTICE / MARKED PRACTICE -->
<div id="practice" class="screen">
  <div class="topbar">
    <button class="topbar-back" onclick="goHome()">← 返回</button>
    <span class="topbar-title" id="practice-title">全部練習</span>
    <div style="display:flex;align-items:center;gap:.5rem;">
      <div class="order-toggle" id="order-toggle">
        <button class="order-btn active" id="order-seq" onclick="setOrder('seq')">依序</button>
        <button class="order-btn" id="order-rand" onclick="setOrder('rand')">隨機</button>
      </div>
      <span class="topbar-info" id="practice-info"></span>
      <button class="theme-toggle" onclick="toggleTheme()"></button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="practice-progress"></div></div>
  <div class="q-area" id="practice-area"></div>
  <div class="q-nav">
    <button class="nav-btn" id="prac-prev" onclick="practiceNav(-1)">← 上一題</button>
    <button class="nav-btn next-btn" id="prac-next" onclick="practiceNav(1)">下一題 →</button>
  </div>
</div>

<!-- EXAM -->
<div id="exam" class="screen">
  <div class="topbar">
    <button class="topbar-back" onclick="confirmExitExam()">← 離開</button>
    <span class="topbar-title">模擬考試</span>
    <div style="display:flex;align-items:center;gap:.6rem;">
      <span class="topbar-info" id="exam-info"></span>
      <button class="theme-toggle" onclick="toggleTheme()"></button>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="exam-progress"></div></div>
  <div class="q-area" id="exam-area"></div>
  <div class="q-nav">
    <button class="nav-btn" id="exam-prev" onclick="examNav(-1)">← 上一題</button>
    <button class="nav-btn" id="exam-end" onclick="submitExam()" style="color:var(--red-txt);border-color:var(--red-bdr);">結束作答</button>
    <button class="nav-btn next-btn" id="exam-next" onclick="examNav(1)">下一題 →</button>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">

function saveMarked() {
  localStorage.setItem('markedIds', JSON.stringify([...markedIds]));
  updateMarkedBadge();
}
function updateMarkedBadge() {
  document.getElementById('marked-count-badge').textContent = markedIds.size;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function goHome() {
  showScreen('home');
  updateMarkedBadge();
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── RENDER QUESTION ──
function renderQuestion(q, container, answered, isExam) {
  const letters = ['A','B','C','D'];
  const opts = [q['答案A'], q['答案B'], q['答案C'], q['答案D']];
  const correct = q['答案'];
  const selected = answered;
  const isMarked = markedIds.has(q['題號']);

  let optHtml = opts.map((o, i) => {
    const l = letters[i];
    let cls = 'option';
    let disabled = '';
    if (selected) {
      disabled = 'disabled';
      if (l === correct) cls += ' correct';
      else if (l === selected) cls += ' wrong';
    }
    return `<button class="${cls}" ${disabled} onclick="handleAnswer('${l}', ${isExam})">
      <span class="opt-letter">${l}</span>
      <span>${o || ''}</span>
    </button>`;
  }).join('');

  let expHtml = '';
  if (selected) {
    if (selected === correct) {
      expHtml = `<div class="explanation correct-exp">✓ 答對了！正確答案為 ${correct}。</div>`;
    } else {
      expHtml = `<div class="explanation wrong-exp">✗ 答錯了。您選擇 ${selected}，正確答案為 ${correct}。</div>`;
    }
  }

  container.innerHTML = `
    <div class="q-header">
      <span class="q-num">第 ${q['題號']} 題</span>
      ${!isExam ? `<button class="mark-btn ${isMarked ? 'marked' : ''}" onclick="toggleMark(${q['題號']})">
        ${isMarked ? '⭐ 已標記' : '☆ 標記錯誤'}
      </button>` : ''}
    </div>
    <div class="q-text">${q['題目']}</div>
    <div class="options">${optHtml}</div>
    ${expHtml}
  `;
}

// ── MARK ──
function toggleMark(id) {
  if (markedIds.has(id)) {
    markedIds.delete(id);
    showToast('已取消標記');
  } else {
    markedIds.add(id);
    showToast('⭐ 已標記此題');
  }
  saveMarked();
  // re-render mark btn
  const btn = document.querySelector('.mark-btn');
  if (btn) {
    btn.className = 'mark-btn' + (markedIds.has(id) ? ' marked' : '');
    btn.textContent = markedIds.has(id) ? '⭐ 已標記' : '☆ 標記錯誤';
  }
}

let practiceOrder = 'seq'; // 'seq' | 'rand'
let practiceBaseList = []; // original ordered list

function setOrder(order) {
  if (practiceOrder === order) return;
  practiceOrder = order;
  document.getElementById('order-seq').classList.toggle('active', order === 'seq');
  document.getElementById('order-rand').classList.toggle('active', order === 'rand');
  // Rebuild list, try to keep current question visible
  const currentId = practiceList[practiceIdx]?.['題號'];
  practiceList = order === 'rand' ? shuffle(practiceBaseList) : [...practiceBaseList];
  practiceAnswers = {};
  practiceIdx = practiceList.findIndex(q => q['題號'] === currentId);
  if (practiceIdx < 0) practiceIdx = 0;
  renderPractice();
}

function startPractice() {
  practiceBaseList = QUESTIONS;
  practiceList = QUESTIONS;
  practiceOrder = 'seq';
  practiceIdx = 0;
  practiceAnswers = {};
  document.getElementById('practice-title').textContent = '全部練習';

  document.getElementById('order-rand').classList.remove('active');

}
function startMarkedPractice() {
  if (markedIds.size === 0) { showToast('尚無標記題目'); return; }
  practiceBaseList = QUESTIONS.filter(q => markedIds.has(q['題號']));

  practiceOrder = 'seq';
  practiceIdx = 0;
  practiceAnswers = {};
  document.getElementById('practice-title').textContent = '標記題目練習';
  document.getElementById('order-toggle').style.display = 'none';
  showScreen('practice');

}
function renderPractice() {
  const q = practiceList[practiceIdx];
  const container = document.getElementById('practice-area');
  renderQuestion(q, container, practiceAnswers[q['題號']] || null, false);
  document.getElementById('practice-info').textContent = `${practiceIdx+1} / ${practiceList.length}`;
  const pct = ((practiceIdx+1)/practiceList.length*100).toFixed(1);
  document.getElementById('practice-progress').style.width = pct + '%';
  document.getElementById('prac-prev').disabled = practiceIdx === 0;
  document.getElementById('prac-next').textContent = practiceIdx === practiceList.length-1 ? '完成 ✓' : '下一題 →';
}
function handleAnswer(letter, isExam) {
  if (isExam) {
    const q = examList[examIdx];
    if (examAnswers[q['題號']]) return;
    examAnswers[q['題號']] = letter;
    renderExam();
  } else {
    const q = practiceList[practiceIdx];
    if (practiceAnswers[q['題號']]) return;
    practiceAnswers[q['題號']] = letter;
    renderPractice();
  }
}
function practiceNav(dir) {
  if (dir === 1 && practiceIdx === practiceList.length - 1) {
    showToast('已完成所有練習題！');
    return;
  }
  practiceIdx = Math.max(0, Math.min(practiceList.length - 1, practiceIdx + dir));
  renderPractice();
  window.scrollTo(0,0);
}

// ── EXAM ──
function startExam() {
  examList = shuffle(QUESTIONS).slice(0, 80);
  examIdx = 0;
  examAnswers = {};
  showScreen('exam');
  renderExam();
}
function renderExam() {
  const q = examList[examIdx];
  const container = document.getElementById('exam-area');
  const letters = ['A','B','C','D'];
  const opts = [q['答案A'], q['答案B'], q['答案C'], q['答案D']];
  const selected = examAnswers[q['題號']] || null;

  // In exam mode: show selection only (no correct/wrong reveal)
  let optHtml = opts.map((o, i) => {
    const l = letters[i];
    let cls = 'option';
    if (selected === l) cls += ' selected';
    return `<button class="${cls}" onclick="handleExamAnswer('${l}')">
      <span class="opt-letter">${l}</span>
      <span>${o || ''}</span>
    </button>`;
  }).join('');

  const answered = Object.keys(examAnswers).length;
  container.innerHTML = `
    <div class="q-header">
      <span class="q-num">第 ${examIdx + 1} 題 / 共 ${examList.length} 題</span>
      <span style="font-size:.82rem;color:var(--text3);">已答 ${answered} 題</span>
    </div>
    <div class="q-text">${q['題目']}</div>
    <div class="options">${optHtml}</div>
  `;

  document.getElementById('exam-info').textContent = `${examIdx+1} / ${examList.length}`;
  document.getElementById('exam-progress').style.width = ((examIdx+1)/examList.length*100).toFixed(1) + '%';
  document.getElementById('exam-prev').disabled = examIdx === 0;
  document.getElementById('exam-next').disabled = examIdx === examList.length - 1;
}
function handleExamAnswer(letter) {
  const q = examList[examIdx];
  examAnswers[q['題號']] = letter;
  renderExam();
}
function examNav(dir) {
  examIdx = Math.max(0, Math.min(examList.length - 1, examIdx + dir));
  renderExam();
  window.scrollTo(0,0);
}
function submitExam() {
  const answered = Object.keys(examAnswers).length;
  const unanswered = examList.length - answered;
  const msg = unanswered > 0
    ? `尚有 ${unanswered} 題未作答，確定要結束作答並計分嗎？`
    : `確定結束作答並計算成績嗎？`;
  if (!confirm(msg)) return;

  let correct = 0;
  let wrongItems = [];
  examList.forEach(q => {
    const ans = examAnswers[q['題號']];
    if (ans === q['答案']) {
      correct++;
    } else {
      wrongItems.push({ q, selected: ans || null });
    }
  });
  lastExamWrong = wrongItems.map(w => ({ id: w.q['題號'], selected: w.selected }));
  localStorage.setItem('lastExamWrong', JSON.stringify(lastExamWrong));

  const total = examList.length;
  const score = (correct * 1.25).toFixed(2);
  const pass = parseFloat(score) >= 70;

  document.getElementById('result-score').textContent = score + ' 分';
  document.getElementById('result-score').className = 'result-score ' + (pass ? 'pass' : 'fail');
  document.getElementById('result-verdict').textContent = pass ? '🎉 恭喜通過！' : '❌ 未達及格標準';
  document.getElementById('rs-total').textContent = total;
  document.getElementById('rs-correct').textContent = correct;
  document.getElementById('rs-wrong').textContent = total - correct;
  showScreen('result');
}
function confirmExitExam() {
  if (Object.keys(examAnswers).length > 0) {
    if (!confirm('確定要離開考試？進度將不會儲存。')) return;
  }
  goHome();
}
function reviewExam() {
  // Build review from examList + examAnswers
  const content = document.getElementById('wrong-list-content');
  document.getElementById('wrong-review-title').textContent = '本次答題詳情';
  document.getElementById('wrong-review-back').onclick = () => showScreen('result');
  const html = examList.map((q, i) => {
    const sel = examAnswers[q['題號']] || '未作答';
    const correct = q['答案'];
    const isRight = sel === correct;
    return `<div class="wrong-item">
      <div class="wrong-item-q"><b>第 ${i+1} 題（原 ${q['題號']} 題）</b> ${q['題目']}</div>
      <div class="wrong-item-meta">
        <span>您的答案：<span class="${isRight ? 'ans' : 'your'}">${sel}</span></span>
        <span>正確答案：<span class="ans">${correct}</span></span>
        <span>${isRight ? '✓ 答對' : '✗ 答錯'}</span>
      </div>
    </div>`;
  }).join('');
  content.innerHTML = html || '<p style="color:var(--muted);padding:2rem;text-align:center">無資料</p>';
  showScreen('wrong-review');
}

// ── WRONG LIST ──
function showWrongList() {
  const content = document.getElementById('wrong-list-content');
  document.getElementById('wrong-review-title').textContent = '上次模擬考錯題';
  document.getElementById('wrong-review-back').onclick = goHome;
  if (lastExamWrong.length === 0) {
    content.innerHTML = '<p style="color:var(--muted);padding:2rem;text-align:center">尚無錯誤記錄，請先進行模擬考試。</p>';
  } else {
    const qMap = {};
    QUESTIONS.forEach(q => qMap[q['題號']] = q);
    const html = lastExamWrong.map(w => {
      const q = qMap[w.id];
      if (!q) return '';
      return `<div class="wrong-item">
        <div class="wrong-item-q"><b>第 ${q['題號']} 題</b> ${q['題目']}</div>
        <div class="wrong-item-meta">
          <span>您的答案：<span class="your">${w.selected || '未作答'}</span></span>
          <span>正確答案：<span class="ans">${q['答案']}</span></span>
        </div>
      </div>`;
    }).join('');
    content.innerHTML = html;
  }
  showScreen('wrong-review');
}

// ── THEME ──
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  if (isDark) document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  updateThemeIcons();
}
function updateThemeIcons() {
  const isDark = document.documentElement.classList.contains('dark');
  const moonSVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  const sunSVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
  document.querySelectorAll('.theme-toggle').forEach(btn => {
    btn.innerHTML = isDark ? sunSVG : moonSVG;
    btn.title = isDark ? '切換淺色模式' : '切換深色模式';
  });
}

// ── INIT ──
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.classList.add('dark');
  document.documentElement.setAttribute('data-theme', 'dark');
} else {
  document.documentElement.setAttribute('data-theme', 'light');
}
updateThemeIcons();
updateMarkedBadge();
</script>
