本所得額(非同 一人才需要列入當年度所得)。"}, {"id": 237, "question": "依遺產及贈與稅法第17 條規定，被繼承人僅遺有17 歲子女1 名及母 親，扣除額合計為", "option_1": "223", "option_2": "173", "option_3": "180", "option_4": "140 萬元。", "answer": 3, "explanation": "依遺產及贈與稅法第17 條規定，子女扣除額是40 萬、父母扣除額100 萬，由於子女未滿18 歲，故 子女可再加扣40 萬，所以40+40+100=180 萬。"}, {"id": 238, "question": "按遺產及贈與稅法規定，約定被繼承人死亡時給付其所指定受益人之A 人 壽保險之死亡保險金；B 勞工保險之死亡保險金；C 軍公教保險之死亡保 險金；D 撫恤金；以上何者不計入遺產總額？", "option_1": "ABCD", "option_2": "BD", "option_3": "D", "option_4": "ABC。", "answer": 4, "explanation": "依遺贈稅法第16 條第9 款規定，約定於被繼承人 死亡時，給付其所指定受益人之人壽保險金額，軍 公教人員、勞工或農民保險之保險金額及互助金， 皆不計入遺產總額。"}, {"id": 239, "question": "有關個人綜合所得稅之課徵何者正確？A 就個人綜合所得總額計徵之；B 有中華民國來源所得之個人，應就其中華民國來源之所得，課徵綜合所得 稅；C 非中華民國境內居住之個人一律免納所得稅", "option_1": "ABC", "option_2": "AB", "option_3": "B", "option_4": "BC。", "answer": 3, "explanation": "A 就個人綜合所得淨額計徵之；C 非中華民國境內 居住之個人，而有中華民國來源所得者，其應納稅 額，分別就源扣繳。"}, {"id": 240, "question": "甲父於去年1 月及8 月分別贈與其子共兩棟房子，各值新台幣600 萬 元，甲父應計稅的贈與稅淨額為", "option_1": "956 萬", "option_2": "1000 萬", "option_3": "760 萬", "option_4": "780 萬 元。", "answer": 1, "explanation": "總贈與財產為600 萬*2=1200 萬 贈與淨額為1200 萬-244 萬(免稅額)=956 萬"}, {"id": 241, "question": "某公司三位員工投保團體人壽保險，其中甲員工每月之保險費為五千元， 乙員工為三千元，丙員工為二千元，則試問該公司在新台幣多少元以內部 分，可以免視為員工之薪資所得", "option_1": "六千元", "option_2": "三千元", "option_3": "四千元", "option_4": "五千元。", "answer": 1, "explanation": "由營利事業負擔之團體壽險保險費，每人每月保險 費在新台幣2 千元以內部份，免視為被保險人之薪 資所得。 2,000+2,000+2,000=6,000 元"}, {"id": 242, "question": "下列何者正確？", "option_1": "拋棄繼承為求程序完整，得以書面向法院向法院申請 延展期間", "option_2": "拋棄繼承後，不繼承財產但負擔債務", "option_3": "拋棄繼承後，應以書 面通知因其拋棄而應為繼承之人", "option_4": "當繼承人不只一人，拋棄繼承須共同為 之。", "answer": 3, "explanation": "(1) 拋棄繼承為求程序完整，得以書面向法院申 請，不得申請延展期間(2)拋棄繼承後，不繼承財產 亦不用負擔債務(4)當繼承人其中一人拋棄繼承，其 應繼份歸屬於其他繼承人。"}, {"id": 243, "question": "遺產稅或贈與稅應納稅額在三十萬元以上，納稅義務人確有困難，不能一 次繳納現金時，得於前項規定納稅期限內，向主管稽徵機關申請，分十八 期以內繳納；每期間隔以不超過", "option_1": "二個月", "option_2": "一個月", "option_3": "半年", "option_4": "三個月 為限。", "answer": 1, "explanation": "遺產稅或贈與稅應納稅額在30 萬元以上，納稅義 務人確有困難，不能一次繳納現金時，得於納稅期 限內，向該管稽徵機關申請，分十八期以內繳納， 每期間隔以不超過二個月為限。"}, {"id": 244, "question": "某甲為自己及其父投保人壽保險，年繳保費各為二萬四千元及一萬五千 元，但其父未受其扶養，則甲在申報綜合所得稅時如採用列舉扣除法時", "option_1": "不得申報扣除", "option_2": "得扣除一萬五千元", "option_3": "得扣除一萬二千元", "option_4": "得扣除二萬 四千元。", "answer": 4, "explanation": "依所得稅法規定，納稅義務人本人、配偶或受扶養 直系親屬的人身保險費，得從個人所得總額中採列 舉申報方式扣除，但每人每年扣除數額以不超過新 台幣兩萬四千元為限。"}, {"id": 245, "question": "胎兒為繼承人時，非保留其", "option_1": "遺贈分", "option_2": "特留分", "option_3": "應繼分", "option_4": "保留分，他繼 承人不得分割遺產。", "answer": 3, "explanation": "胎兒為繼承人時，非保留其應繼分，他繼承人不得 分割遺產。"}, {"id": 246, "question": "小華父親將一千萬的房子贈與小華後，沒有其他財產，以下敘述何者錯 誤？", "option_1": "贈與人應就756 萬元計算繳納贈與稅", "option_2": "贈與稅之納稅義務人為小 華父親", "option_3": "贈與總額為780 萬元", "option_4": "稽徵機關在一定條件下可向小華課稅。", "answer": 3, "explanation": "(1)以贈與淨額課稅，贈與淨額=贈與總額1000 萬- 免稅額244 萬-扣除額0=756 萬(2)對有贈與行為 之贈與人課徵(3)贈與總額為房子價值1000 萬(4) 一定條件指贈與人有下列情形以受贈人小華為納稅 義務人：行蹤不明、逾繳納期限未繳且在境內無財 產可供執行、死亡時贈與稅尚未核課。(111 年更 新)"}, {"id": 247, "question": "若保險契約涉及訴訟，要保人的住所不在中華民國境內時，其訴訟之管轄 法院為", "option_1": "要保人以前住所", "option_2": "保險公司所在地", "option_3": "台北地區", "option_4": "雙方契約約定 地方法院為第一審管轄法院。", "answer": 4, "explanation": "保險契約涉及訴訟，示範條款要求以要保人住所所 在地為第一審管轄法院，但要保人的住所不在中華 民國境內時，其訴訟之管轄法院由雙方於契約中約 定。"}, {"id": 248, "question": "有關民法各順位繼承人之特留分之敘述，何者錯誤？", "option_1": "配偶的特留分是應 繼分的二分之一", "option_2": "祖父母的特留分是應繼分的三分之一", "option_3": "父母的特留分 是應繼分的二分之一", "option_4": "兄弟姊妹的特留分是應繼分的二分之一。", "answer": 4, "explanation": "(4)兄弟姊妹的特留分為應繼分的三分之一。"}, {"id": 249, "question": "A 滿期保險金；B 醫療保險金；C 死亡保險金；D 人壽保險單之紅利；上 述何種保險給付在一定條件下免稅", "option_1": "ABCD", "option_2": "ABC", "option_3": "BCD", "option_4": "ACD。", "answer": 1, "explanation": "滿期保險金、醫療保險金、死亡保險金、人壽保險 單之紅利皆為免稅。"}, {"id": 250, "question": "有關贈與稅，何者陳述錯誤？", "option_1": "納稅義務人為贈與人", "option_2": "免稅額之計算係 指一年之贈與", "option_3": "一年如有二次以上之贈與，不得分別計算", "option_4": "免稅額為 123 萬元。", "answer": 4, "explanation": "(4)免稅額：贈與他人每年免稅額為244 萬元。"}, {"id": 251, "question": "下列何者為是？A 遺產及贈與稅法第17 條規定，被繼承人遺有父母者， 父母每人得自遺產總額中扣除100 萬元；B 現行公告遺產稅之免稅額為 1200 萬元；C 財政部於每年12 月底應公告次年發生之繼承或贈與案件所 應適用之各項金額", "option_1": "AC", "option_2": "C", "option_3": "B", "option_4": "BC。", "answer": 1, "explanation": "(B)113 年公告遺產稅之免稅額為1333 萬元。"}, {"id": 252, "question": "直系血親卑親屬不包括？", "option_1": "乾子女", "option_2": "養子女", "option_3": "孫子女", "option_4": "以上皆是。", "answer": 1, "explanation": "直系血親卑親屬不包括乾子女。"}, {"id": 253, "question": "依遺產及贈與稅法第17 條規定，遺產稅扣除項目之敘述，何者有誤", "option_1": "父 母每人可扣除100 萬元", "option_2": "被繼承人之喪葬費用可扣除100 萬元", "option_3": "被繼承 人死亡前，依法應納之各項稅損、罰金及具有確實證明之未償債務可全額 扣除", "option_4": "配偶之扣除額為440 萬元。", "answer": 4, "explanation": "(4)配偶之扣除額為400 萬元。"}, {"id": 254, "question": "依遺產及贈與稅法第17 條規定，16 歲之未成年子女之扣除額應為", "option_1": "160 萬", "option_2": "120 萬", "option_3": "40 萬", "option_4": "250 萬 元。", "answer": 2, "explanation": "遺產及贈與稅法第17 條規定，繼承人為直系血親 卑親屬者，每人得自遺產總額中扣除四十萬元。其 有未滿十八歲者，並得按其年齡距屆滿十八歲之年 數，每年加扣四十萬元。 直系血親卑親屬扣除額40 萬元+屆滿十八歲之年 數×40 萬元=120 萬元。"}, {"id": 255, "question": "依遺產及贈與稅法第12-1 條規定，被繼承人僅遺有配偶及成年子女1 名，該遺產扣除額合計為", "option_1": "450", "option_2": "440", "option_3": "500", "option_4": "609 萬元。", "answer": 4, "explanation": "配偶扣除額：553 萬；直系血親卑親屬扣除額：56 萬。 合計609 萬元。"}, {"id": 256, "question": "被繼承人死亡遺有財產者，納稅義務人應於被繼承人死亡之日起", "option_1": "六個月", "option_2": "一個月", "option_3": "三個月", "option_4": "二個月 內，向戶籍所在地主管稽徵機關依遺產及 贈與稅法規定辦理遺產稅申報。", "answer": 1, "explanation": "被繼承人死亡遺有財產者，納稅義務人應於被繼承 人死亡之日起六個月內，向戶籍所在地主管稽徵機 關依遺產及贈與稅法規定辦理遺產稅申報。"}, {"id": 257, "question": "依遺產及贈與稅法之規定，凡居住我國境內之我國國民遺有財產者，應", "option_1": "就其在我國境內、外全部財產", "option_2": "我國境內部分財產須要，國外部分財產不 1 凡經常居住中華民國境內之中華民國國民死亡時遺 有財產者，就其在中華民國境內、境外全部遺產， 須要", "option_3": "僅就其在我國境內之財產", "option_4": "以上皆非 課遺產稅。 依遺產及贈與稅法規定，課徵遺產稅。", "answer": "", "explanation": ""}, {"id": 258, "question": "甲僅遺有子女乙與丙，甲死後遺留財產五百萬元，甲於遺囑中表示將其遺 產60%全數捐給慈善機構，僅留40%由乙、丙平均分配，則依民法規定 乙可繼承多少金額？", "option_1": "100 萬元", "option_2": "250 萬元", "option_3": "125 萬元", "option_4": "500 萬元。", "answer": 3, "explanation": "子女之應繼分為遺產之1/2，特留分為應繼分之 1/2，故子女一人可繼承125 萬元。"}, {"id": 259, "question": "下列的敘述何者有誤？", "option_1": "遺產及贈與稅法第12-1 條規定，成年子女的扣 除額為每人新台幣56 萬元", "option_2": "納稅義務人為本人投保的人身保險費，得 採標準扣除額之方式申報，自綜合所得總額中扣除", "option_3": "配偶與兩名子女共 同繼承時，配偶之應繼分為遺產總額之三分之一", "option_4": "要保人未指定身故受益 人時，該筆之死亡保險金轉作被保險人遺產。", "answer": 2, "explanation": "(2)納稅義務人為本人投保的人身保險費，得採列舉 扣除額之方式申報，自綜合所得總額中扣除。"}, {"id": 260, "question": "依遺產及贈與稅法第17 條規定，被繼承人遺有受其扶養之兄弟姊妹者， 每人得自遺產總額中扣除", "option_1": "50 萬", "option_2": "100 萬", "option_3": "45 萬", "option_4": "40 萬 元，免徵 遺產稅。", "answer": 4, "explanation": "依遺產及贈與稅法第17 條規定，被繼承人遺有受 其扶養之兄弟姊妹者，每人得自遺產總額中扣除 40 萬元，免徵遺產稅。"}, {"id": 261, "question": "下列何者正確？", "option_1": "配偶相互贈與之財產應計入贈與總額", "option_2": "贈與稅之納稅 義務人死亡時，贈與稅尚未核課者，無須繳納贈與稅", "option_3": "本國國民就其中華 民國境外之財產為贈與，應課徵贈與稅", "option_4": "以上皆非。", "answer": 3, "explanation": "(1)配偶相互贈與之財產，不須計入贈與總額(2)贈 與稅之納稅義務人死亡時，贈與稅尚未核課者，須 繳納贈與稅。"}, {"id": 262, "question": "死亡保險金一千萬且未指定身故受益人，被保險人遺有配偶、子女兩名和 父母，則被保險人之父親可分配到", "option_1": "200 萬", "option_2": "500 萬", "option_3": "0 萬", "option_4": "125 萬 元。", "answer": 3, "explanation": "在繼承開始時有當然繼承人(配偶)得與第一順位繼 承人同為繼承人，故父母無法分得遺產。"}, {"id": 263, "question": "張三(被繼承人)育有4 子，其長子較張三早死，當張三死亡可由其孫A、 B 代位其父繼承對張三之應繼分。如張三遺留保險金1000 萬元，則其孫 各可代位繼承", "option_1": "125 萬", "option_2": "250 萬", "option_3": "300 萬", "option_4": "100 萬。", "answer": 1, "explanation": "張三之遺留保險金1000 萬分給四個孩子(1 人250 萬)，而長子早死，其子A.B 可代位繼承長子分得 之財產，各可得125 萬元。"}, {"id": 264, "question": "下列何者係指被繼承人遺留的遺產總額減掉免稅額及扣除額後所剩的餘額 為", "option_1": "遺囑繼承額", "option_2": "特留分", "option_3": "課稅遺產淨額", "option_4": "應繼分。", "answer": 3, "explanation": "課稅遺產淨額=遺產總額-免稅額及-扣除額。"}, {"id": 265, "question": "有關審閱期間規定之敘述何者為是？", "option_1": "保戶得主動放棄審閱權", "option_2": "未提 供審閱期間 者契約一律無效", "option_3": "壽險商品之審閱期間不得低於 5 日", "option_4": "有提供審閱期間者無須提供契約撤銷權", "answer": 1, "explanation": "(2)僅未提供審閱期間之定型化契約無效 (3)壽險商品應提供至少3 日之審閱期間 (4)應提供契約撤銷權"}, {"id": 266, "question": "金融消費評議成立後且評議書經法院核可者，何者錯誤？A 當事人就該事 件得再行起 訴：B 當事人就該事件得再申請評議：C 評議書經法院核可 後有依法無效之原因，當事 人不得提起宣告評議無效或撤銷評議之訴： D 評議書內容如有牴觸法令而未予核可者， 法院應通知爭議處理機構及 當事人", "option_1": "ABC", "option_2": "AB", "option_3": "ABCD", "option_4": "BC", "answer": 1, "explanation": "A、B 不可就該事件再行起訴或評議 C 評議書經法院核可後有依法無效之原因，當事 人得提起宣告評議無效或撤銷評議之訴"}, {"id": 267, "question": "有關定型化契約敘述，何者有誤？", "option_1": "消保法對其權利義務的履行訂有相當 完整的規範", "option_2": "是由企業經營者與消費者雙方面所共同議定", "option_3": "條款如有疑 義時，應為有利於消費者之解釋", "option_4": "消費者只有簽訂與否的權利。", "answer": 2, "explanation": "(2)是由企業經營者單方面所預先擬具。"}, {"id": 268, "question": "金管會列舉保險業常見之低風險交易情境，如：投保A 微型保險；B 具有 保單價值準備金之保險商品；C 團體年金保險；D 客戶無高洗錢及資恐風 險之表徵，年繳保費未逾三萬元", "option_1": "ABC", "option_2": "AC", "option_3": "ABCD", "option_4": "ACD，保險公司 得進行簡化審查及持續監控措施。", "answer": 4, "explanation": "金管會列舉保險業常見之低風險交易情境，如：客 戶投保不具有保單價值準備金之保險商品、微型保 險、小額終老保險、團體年金/定期/傷害/健康/醫 療保險、客戶無高洗錢及資恐風險之表徵，年繳保 費未逾三萬元/躉繳未逾七萬五千元，強制汽車責 任險、農業保險、小額財產保險，保險公司得進行 簡化審查及持續監控措施。"}, {"id": 269, "question": "有關金融服務業公平待客原則，何者正確？", "option_1": "公司對商品銷售獎勵核給， 在酬金與業績衡平原則下應注意僅以業績目標達成做為計算基礎", "option_2": "公司應 於業務員一賣出商品就發給高額酬金以符合酬金與業績衡平原則", "option_3": "公司應 該將該原則納入教育訓練課程每年至少2 小時，業務員未完成該訓練應辦 理撤銷登錄", "option_4": "該原則共9 大指標，並增訂第10 項董事會重視情況。", "answer": 4, "explanation": "(1)公司對商品銷售獎勵核給，在酬金與業績衡平原 則下不應僅以業績目標達成做為計算基礎(2)公司不 應於業務員一賣出商品就發給高額酬金，而應將業 務員所涉稽核缺失、客戶紛爭、KYC 等非財務指標 納入考量(3)公司應該將該原則納入教育訓練課程每 年至少3 小時，業務員未完成該訓練應辦理撤銷登 錄。"}, {"id": 270, "question": "金融業引進金融科技帶來產業創新，何者為非？", "option_1": "金融科技帶來公司追求 經營效率最大化應兼顧公平待客及消費者保護", "option_2": "個人資料保護法立法目的 皆禁止個人資料蒐集或無限制保護個人資料", "option_3": "政府近年來為遵循洗錢防制 及打擊資恐相關規定，要求金融業強化辨識客戶資金來源及最終受益人身 分", "option_4": "科技帶來的便利會犧牲個資權益，這些犧牲須以法律方式明訂。", "answer": 2, "explanation": "(2)個人資料保護法立法目的是為了規範蒐集、處理 及利用個人資料，以免人格權受侵害，並促進個人 資料的合理利用。"}, {"id": 271, "question": "保險業核保理賠時需蒐集當事人之特種個資，除經當事人書面同意外，須 符合法律明文規定使得為之，下列何者為保險業蒐集之特種個資?A 健康 檢查；B 病歷；C 指紋；D 職業", "option_1": "ABD", "option_2": "BC", "option_3": "AB", "option_4": "ABC", "answer": 3, "explanation": "保險業蒐集之特種個資包含病歷、醫療、基因、性 生活、健康檢查及犯罪前科之個人資料。"}, {"id": 272, "question": "有關金融消費者保護法規定，何者有誤?A 金融服務業對金融消費者之責 任得預先約定限制；B 金融服務業對金融消費者之責任不得預先免除；C 違反預先限制之約定無效；D 金融服務業與金融消費者訂立契約條款顯失 公平者契約無效", "option_1": "BCD", "option_2": "A", "option_3": "AD", "option_4": "BC。", "answer": 3, "explanation": "A 金融服務業對金融消費者之責任，不得預先約定 限制或免除；D 金融服務業與金融消費者訂立契約 條款顯失公平者，該部分條款無效。"}, {"id": 273, "question": "為充分瞭解消費者屬性，金融服務業應A 銷售前做消費者適合度調查；B 依不同商品建立差異化事前審查機制；C 考量消費者確實瞭解所交保費係 用以購買保險商品；D 因投資型商品較複雜，得由業務員代為決定客戶投 資屬性", "option_1": "AC", "option_2": "ABC", "option_3": "ACD", "option_4": "ABCD", "answer": 2, "explanation": "D 因投資型商品較複雜，不得由業務員代為決定客 戶投資屬性。"}, {"id": 274, "question": "有關個人資料保護法，何者為非?", "option_1": "姓名、出生年月日、身分證字號、指 紋及護照號碼等皆屬個人資料", "option_2": "非公務機關蒐集個人資料僅須符合指定目 的即得為之", "option_3": "保險公司蒐集保戶資料係符合特定目的、與當事人有契約關 係且已採取適當之安全措施及經當事人同意等要件", "option_4": "當事人可請求刪除、 停止處理或利用該個人資料。", "answer": 2, "explanation": "(2)非公務機關蒐集個人資料僅須符合指定目的外， 應有特定目的，並符合下列情形之一：1.法律明文 規定。2.與當事人有契約或類似契約之關係，且已 採取適當之安全措施。3.當事人自行公開或其他已 合法公開之個人資料。4.學術研究機構基於公共利 益為統計或學術研究而有必要，且資料經過提供者 處理後或經蒐集者依其揭露方式無從識別特定之當 事人。5.經當事人同意。6.為增進公共利益所必 要。7.個人資料取自於一般可得之來源。但當事人 對該資料之禁止處理或利用，顯有更值得保護之重 大利益者，不在此限。8.對當事人權益無侵害。"}, {"id": 275, "question": "非公務機關在蒐集個人資料時，除了須符合特定目的外，尚須具有下列何 種情形之一，始得為之", "option_1": "當事人自行公開或其他已合法公開之個人資料", "option_2": "經當事人同意", "option_3": "與當事人有契約關係會類似契約關係", "option_4": "以上皆是。", "answer": 4, "explanation": "非公務機關在蒐集個人資料時，除須符合特定目的 外，尚須具有題目所述情形之一，始得為之。"}, {"id": 276, "question": "下列有關金融消費爭議處理之敘述何者錯誤？", "option_1": "消費者在評議成立後，得 於不變期間內申請爭議處理機構將評議書送法院核可", "option_2": "金融服務業即使已 依評議內容履行，爭議處理機構仍應將評議書送法院核可", "option_3": "爭議處理機構 將評議書及卷證送請該機構事務所所在地之管轄法院核可", "option_4": "評議書經法院 核可後，與民事確定判決有同一效力", "answer": 2, "explanation": "(2)金融服務業已依評議成立內容完全履行者，免送 請法院核可。"}, {"id": 277, "question": "依消保法規定，企業經營者與消費者訂立定型化契約前，應提供多久之合 理期間以審閱全部條款？", "option_1": "10 日內", "option_2": "7 日內", "option_3": "15 日內", "option_4": "30 日內。", "answer": 4, "explanation": "企業經營者與消費者訂立之一般消費之定型化契 約，應提供消費者30 日內的合理期間，以審閱全 部條款。"}, {"id": 278, "question": "下列何者應致力充實消費資訊提供消費者運用，俾能採取正確合理之消費 行為，以維護其安全與權益", "option_1": "政府", "option_2": "企業經營者", "option_3": "消費者", "option_4": "以上皆是。", "answer": 4, "explanation": "政府、企業經營者及消費者均應致力充實消費資 訊。"}, {"id": 279, "question": "依消保法規定，定型化契約條款內容違反誠信原則，對消費者顯失公平 者，應為", "option_1": "得撤銷", "option_2": "視為無記載", "option_3": "無效", "option_4": "有利於消費者解釋。", "answer": 3, "explanation": "消費者保護法第12 條：定型化契約中之條款違反 誠信原則，對消費者顯失公平者，無效。"}, {"id": 280, "question": "以下何者為金融消費評議中心之任務？A 處理所有與金融消費有關之民事 爭議；B 辦理金融服務業及金融消費者之教育宣導；C 始金融服務業及消 費者均能充分了解彼此權利義務；D 受理各種型態之消費申訴", "option_1": "ABCD", "option_2": "AD", "option_3": "ABC", "option_4": "BC。", "answer": 3, "explanation": "該中心主要業務包括：處裡所有與金融消費有關之 爭議案件，及辦理對金融服務業及金融消費者之教 育宣導，使金融服務業與金融消費者均能充分了解 正確之金融消費觀念及金融消費關係之權利與義 務，以有效預防金融消費爭議發生。"}, {"id": 281, "question": "有關金融機構確認客戶身分程序之敘述何者錯誤？", "option_1": "應以風險為基礎", "option_2": "留存確認客戶身分之程序資料，應自業務開始時起至少保存五年", "option_3": "審查範 圍擴及實質受益人", "option_4": "臨時交易者留存確認程序之資料，應自臨時性交易終 止時起至少保存五年。", "answer": 2, "explanation": "(2)留存確認客戶身分之程序資料，應自業務關係終 止時起至少保存五年。"}, {"id": 282, "question": "基於保護金融消費者之目的，下列何種情況需要在銷售過程中以錄音或錄 影的方式保留紀錄？", "option_1": "銷售投資型保險商品予屆齡退休之客戶", "option_2": "銷售含 解約金的商品予60 歲以上之客戶", "option_3": "銷售複雜性高風險商品予40 歲以上 之客戶", "option_4": "以上皆非。", "answer": 3, "explanation": "金融服務業提供之金融商品屬於複雜性高風險商品 者，前開說明及接露除以非臨櫃之自動化通路交易 或金融消費者不予同意情形外，應錄音或錄影。"}, {"id": 283, "question": "下列有關金融消費爭議處理之敘述何者錯誤？", "option_1": "消費者在評議成立後，得 於不變期間內申請爭議處理機構將評議書送法院核可", "option_2": "金融服務業即使已 依評議內容履行，爭議處理機構仍應將評議書送法院核可", "option_3": "評議書經法院 核可後，與民事確定判決有同一效力", "option_4": "爭議處理機構應於受理申請之日起 5 日內，將評議書及卷證送請爭議處理機構事務所所在地之管轄地方法院 核可。", "answer": 2, "explanation": "爭議處理機構送請法院核可前，金融服務業已依評 議成立內容完全履行者，免送請核可。"}, {"id": 284, "question": "除人身保險公司外，哪些單位於推出具有保單價值準備金之新產品或提供 與金錢有關之服務前須進行洗錢及資恐風險評估？A 個人執業保險經紀 人；B 專業再保險公司；C 保險代理人公司；D 財產保險公司", "option_1": "ABCD", "option_2": "ABC", "option_3": "BD", "option_4": "BCD。", "answer": 1, "explanation": "請參閱洗錢防制法適用之金融機構。"}, {"id": 285, "question": "依據住院醫療費用保險單示範條款規定，被保險人出院後幾日內於同一醫 院再次住院時，視為一次住院辦理", "option_1": "30", "option_2": "15", "option_3": "10", "option_4": "14 日。", "answer": 4, "explanation": "同一疾病或傷害或因此引發之併發症，被保險人出 院後14 日內於同一醫院再次住院時，視為一次住 院辦理。"}, {"id": 286, "question": "傷害保險因同一意外傷害事故致成失能後身故的保險給付", "option_1": "失能及身故保 險金的給付合計最高以保險金額為限", "option_2": "身故保險金最高以保險金額為限， 失能保險金沒有限制", "option_3": "失能保險金最高以保險金額為限，身故保險金沒有 限制", "option_4": "失能或身故保險金的給付分別最高以保險金額為限。", "answer": 1, "explanation": "傷害保險因同一意外傷害事故致成失能後身故的保 險給付，失能及身故保險金的給付總金額合計最高 以保險金額為限。"}, {"id": 287, "question": "金融服務業違反金消法致消費者受有損害，何者錯誤？", "option_1": "金融服務業故意 所致之損害，法院得依消費者請求依侵害情節酌定損害額三倍以上之懲罰 性賠償", "option_2": "消費者依金消法求償時，無須舉證金融機構的過失", "option_3": "金融服務 業過失所致之損害，法院得酌定損害額一倍以下之懲罰性賠償", "option_4": "金融服務 業如能舉證損害發生原因非因其未說明或說明不實所致者，免負賠償責 任。", "answer": 1, "explanation": "(1)金融服務業故意所致之損害，法院得依消費者請 求依侵害情節酌定損害額三倍以下之懲罰性賠償。"}, {"id": 288, "question": "依洗錢防制法規定金融機構對於一定金額以上通貨交易，應確認客戶身分 及留存客戶之交易紀錄，並向指定機構申報所稱一定金額，係指新台幣", "option_1": "二百萬", "option_2": "一百萬", "option_3": "五十萬", "option_4": "二百五十萬 以上。", "answer": 3, "explanation": "大額通貨交易之通報：金融機構或人員對於達新台 幣50 萬元以上(或等值外幣)之通貨交易(現今收復 或換鈔交易)，應向法務部調查局申報。"}, {"id": 289, "question": "下列何者有誤？", "option_1": "金融服務業刊登廣告不得有虛偽或其他足致他人誤信", "option_2": "金融服務業對金融消費者所提示之資料或說明，應確保內容真實", "option_3": "金 融服務業對金融消費者所負擔之義務不得低於廣告內容", "option_4": "金融服務業得藉 由金融教育宣導方式，對消費者引薦個別金融商品或服務。", "answer": 4, "explanation": "金融服務業從事相關銷售活動時應遵循之原則，其 一為不得藉金融教育宣導，引薦個別金融商品或服 務。"}, {"id": 290, "question": "下列何者為洗錢防制法適用之非金融事業或人員？A 會計師；B 地政士； C 銀樓業；D 不動產經紀業", "option_1": "BCD", "option_2": "ABCD", "option_3": "CD", "option_4": "ABC。", "answer": 2, "explanation": "非金融機構或人員：銀樓業、地政士、不動產經紀 業從事與不動產買賣交易有關行為；律師、公證 人、會計師為客戶準備或進行特定交易時；信託及 公司服務提供業、其他業務特性或交易型態易為洗 錢犯罪利用之事業或從業人員。"}, {"id": 291, "question": "業務員於洗錢防治上應留意客戶異常行為並協助申報，何者屬於異常交 易？A 大額保費非要保人或其他利害關係人支付，且無法提出合理說明； B 客戶要求開立禁止背書轉讓支票，達特定金額且無法提出合理說明；C 躉繳大額保費後，短期內申請大額保單借款或終止契約，且無法提出合理 4 B 客戶要求開立取消禁止背書轉讓支票，達特定金 額且無法提出合理說明。 說明；D 保戶刻意規避身份確認程序", "option_1": "CD", "option_2": "ABCD", "option_3": "BCD", "option_4": "ACD。", "answer": "", "explanation": ""}, {"id": 292, "question": "A 騎樓下的信用卡推廣；B 便利商店的購物型錄；C 逐戶拜訪的羊奶推 銷；D 電話行銷醫療險；E 信箱中的購物傳單，請問上述行銷方式哪些為 消保法中的訪問交易", "option_1": "BE", "option_2": "ACD", "option_3": "BD", "option_4": "AC。", "answer": 4, "explanation": "通訊交易：B 便利商店的購物型錄；D 電話行銷醫 療險；E 信箱中的購物傳單 訪問交易：A 騎樓下的信用卡推廣；C 逐戶拜訪的 羊奶推銷"}, {"id": 293, "question": "蒐集準保戶的資料，不包括", "option_1": "過去的違法紀錄", "option_2": "嗜好", "option_3": "家屬姓名、年齡", "option_4": "職業、地位。", "answer": 1, "explanation": "特種資料定義：有關病例、醫療、基因、性生活、 健康檢查及犯罪前科之個人資料，不得蒐集、處理 或利用。"}, {"id": 294, "question": "下列何者應致力充實消費資訊提供消費者運用，俾能採取正確合理之消費 行為，以維護其安全與權益？", "option_1": "企業經營者", "option_2": "消費者", "option_3": "政府", "option_4": "以上皆 是。", "answer": 4, "explanation": "立法目的，主要是為保護消費者的權益。"}, {"id": 295, "question": "業務員因銷售保險商品逕向要保人所蒐集之資料，下列敘述何者正確？", "option_1": "若依法律規定得免告知者，得免為告知", "option_2": "法律雖有規定但基於保護消費 者，皆需為告知，不得免除", "option_3": "不需告知要保人使用目的", "option_4": "屬公務機關之 資料蒐集。", "answer": 1, "explanation": "非公務機關蒐集個人資料之告知，有以下情況之一 者，得免為前開告知： 1.依法律規定得免為告知。2.個人資料之蒐集係公 務機關執行法定職務或非公務機關履行法定義務所 必要。3.告知將妨害公務機關執行法定義務。4.告 知將妨害公共利益。5.當事人明知應告知之內容。 6.個人資料之蒐集非基於營利之目的，且當事人顯 無不利之影響。"}, {"id": 296, "question": "保戶填寫要保書聲明同意保險人依個資法取得相關資料，即符合非公務機 關於蒐集個資時，除符合特定目的外，亦符合A 法律明文規定；B 與當事 人有契約關係且已採取適當安全措施；C 經當事人同意；D 為增進公共利 益所必要", "option_1": "AB", "option_2": "AD", "option_3": "ABCD", "option_4": "BC。", "answer": 3, "explanation": "非公務機關蒐集個人資料時，除須符合特定目的外 尚須具下列情形： 1.法律明文規定2.與當事人有契約關係且已採取適 當安全措施3.當事人自行公開或其他已合法公開之 個人資料4.學術研究機構基於公共利益為統計或學 術研究而有必要，且資料提供者處理或蒐集者依其 揭露方式無從識別特定當事人5.經當事人同意6.為 增進公共利益所必要7.個人資料取自於一般可得來 源。但當事人對該資料之禁止處理或利用，顯有更 值得保護之重大利益者，不在此限8.對當事人權益 無侵害。"}, {"id": 297, "question": "金融消費評議中心受理消費者申訴後，會先將案件移交受申訴之金融服務 業處理，金融服務業應於收到申訴之日起", "option_1": "30", "option_2": "60", "option_3": "10 日", "option_4": "15 日 內 為適當之處理，並將處理結果回覆消費者。", "answer": 1, "explanation": "金融消費評議中心受理消費者申訴後，會先將案件 移交受申訴之金融服務業處理，金融服務業應於收 到申訴之日起30 日內為適當之處理，並將處理結 果回覆消費者。"}, {"id": 298, "question": "保險業應切實確認保險身品之相關佣金、獎金及營業費用不應超過", "option_1": "責任 準備金", "option_2": "所收總保費", "option_3": "附加費用", "option_4": "保單價值準備金，而有費差損情事。", "answer": 3, "explanation": "金融消費者保護法，訂定業務人員酬金制度：酬金 制度須報董事會通過、佣金獎金不超過附加費用。"}, {"id": 299, "question": "人身保險的行銷通路中下列何者非屬於消費者保護法下的通訊交易？", "option_1": "電 話行銷", "option_2": "DM 行銷", "option_3": "業務員行銷", "option_4": "電視行銷。", "answer": 3, "explanation": "業務員行銷是訪問交易。"}, {"id": 300, "question": "何者屬於金融服務業公平待客原則之指標？A 業務人員專業性原則；B 廣 告招攬真實原則；C 申訴優先處理原則；D 商品或服務適合度原則；E 酬 金與業績衡平原則", "option_1": "ABD", "option_2": "ABCDE", "option_3": "BCD", "option_4": "ABDE。", "answer": 4, "explanation": "金融服務業公平待客原則之指標：訂約公平誠信原 則、注意與忠實義務原則、廣告招攬真實原則、商 品或服務適合度原則、告知與揭露原則、複雜性高 風險商品原則、酬金與業績衡平原則、申訴保障原 則、業務人員專業性原則。"}, {"id": 301, "question": "下列之金融機構何者適用洗錢防制法？A 證券商；B 保險公司；C 信用卡 公司；D 郵政機構", "option_1": "ABCD", "option_2": "AB", "option_3": "BD", "option_4": "BCD。", "answer": 1, "explanation": "洗錢防制法金融機構包括：銀行、信用合作社、辦 理儲金匯兌之郵政機構、票券金融公司、信用卡公 司及信託業、證券商、證券投資信託事業、證券金 融事業、證券投資顧問事業、證券集中保管事業、 期貨商、保險公司、專業再保險公司及辦理簡易人 壽保險業務之郵政機構、電子票證發行機構、電子 支付機構、槓桿交易商、期貨信託事業、期貨經理 事業，以及保險代理人公司、保險經紀人公司及個 人執業之保險代理人、保險經紀人。"}, {"id": 302, "question": "主管機關為落實對於金融消費者保護的重視 ，要求金融服務業應把公平 待客原則納入教育訓練課程，每年對於在職人員至少進行", "option_1": "10", "option_2": "3", "option_3": "12", "option_4": "5 小時 的公平待客教育訓練。", "answer": 2, "explanation": "主管機關要求金融服務業應把公平待客原則納入教 育訓練課程，每年對於在職人員至少進行3 小時的 公平待客教育訓練。"}, {"id": 303, "question": "依金消法規定，金融服務業包括 A 期貨業；B 保險業；C 證券交易所；D 證券集中保管事業", "option_1": "AB", "option_2": "ABCD", "option_3": "BCD", "option_4": "ABC。", "answer": 1, "explanation": "金融服務業包括：銀行業、證券業、期貨業、保險 業、電子票證業及其他經主管機關公告之金融服務 業；但不包括證交所、櫃買中心、集保事業、期交 所及其他經主管機關公告之事業等。"}, {"id": 304, "question": "定型化契約條款若牴觸個別磋商條款之約定時，", "option_1": "該定型化契約條款全部 無效", "option_2": "該定型化契約條款全部有效", "option_3": "該定型化契約條款牴觸部分無效", "option_4": "以上皆非。", "answer": 3, "explanation": "定型化契約條款若牴觸個別磋商條款之約定者，其 牴觸者部分無效。"}, {"id": 305, "question": "金消法規定之金融消費爭議係指辦理金融消費者與金融服務業間，因商品 或服務所生之", "option_1": "行政爭議", "option_2": "民事爭議", "option_3": "刑事爭議", "option_4": "以上皆可，屬於金融 消費爭議的適用範圍。", "answer": 2, "explanation": "金融消費爭議定義：指金融消費者與金融服務業間 因商品或服務所生之民事爭議，但不包括行政或刑 事爭議的案件。"}, {"id": 306, "question": "依據金消法規定，金融消費者係指接受金融服務業提供金融商品或服務， 但不包含 A 專業投資機構；B 符合一定財力之自然人；C 一般消費者；D 專業能力之自然人", "option_1": "AD", "option_2": "ABCD", "option_3": "BCD", "option_4": "ABD。", "answer": 4, "explanation": "金融消費者指接受金融服務業提供金融商品或服務 者。但不包括下列對象：專業投資機構、符合一定 財力或專業能力之自然人或法人。"}, {"id": 307, "question": "洗錢防制法適用之金融機構，下列何者為非？", "option_1": "銀樓業", "option_2": "漁會信用部", "option_3": "證券投資顧問事業", "option_4": "全國農業金庫。", "answer": 1, "explanation": "洗錢防制法非金融機構或人員：銀樓業；地政士及 不動產經紀業從事與不動產買賣交易有關之行為； 律師、公證人、會計師為客戶準備或進行特定交易 時；信託及公司服務提供業為客戶準備或進行特定 交易時；其他業務特性或交易型態易為洗錢犯罪利 用之事業或從業人員。"}, {"id": 308, "question": "為保護金融消費者，金融服務業依據金消法規定訂定業務人員酬金制度並 提報", "option_1": "股東大會", "option_2": "董(理)事會", "option_3": "主管機關", "option_4": "業務員代表大會 通過。", "answer": 2, "explanation": "為保護金融消費者，金融服務業應訂定業務人員酬 金制度並提報董(理)事會通過。"}, {"id": 309, "question": "金融機構自發現疑似洗錢或資恐交易日起", "option_1": "5 個營業日", "option_2": "一個月", "option_3": "15 個 營業日", "option_4": "10 個營業日 內，依申報格式簽報專責主管核定後立即申報。", "answer": 4, "explanation": "不論金額多寡，只要符合洗錢表徵，應疑似洗錢或 資恐交易之日10 個營業日內，向法務部調查局申 報。"}, {"id": 310, "question": "保險業於有攸關消費大眾權益之重大訊息發生時，應於", "option_1": "5", "option_2": "7", "option_3": "10", "option_4": "", "answer": 2, "explanation": "日內以書面向主管機關報告，並主動公開說明。 4 消費大眾權益之重大訊息發生時應以2 日內以書面 向主管機關報告，並主動公開說明。"}, {"id": 311, "question": "保險契約內容由保險公司決定，基於衡平原則，有何補救措施？", "option_1": "要保人 可解除契約", "option_2": "契約條款內容要保人可要求法院公證", "option_3": "契約條款有疑義 時，應做有利被保險人解釋", "option_4": "契約條款有疑義時，應由保險人斟酌實際情 況決定。", "answer": 3, "explanation": "根據消保法11 條： 「定型化契約條款如有疑義，應 為有利於消費者之解釋」 。"}, {"id": 312, "question": "依保險法實施細則規定，人身保險業以計算保險契約簽單保險費之利率及 危險發生率為基礎，並依主管機關規定方式計算之金額為", "option_1": "責任準備金", "option_2": "賠款準備金", "option_3": "保單價值準備金", "option_4": "解約金。", "answer": 3, "explanation": "保單價值準備金以簽單保險費之利率及危險發生率 為基礎。"}, {"id": 313, "question": "保險經紀人係基於", "option_1": "承保的保險業", "option_2": "保險人及被保險人", "option_3": "被保險人", "option_4": "要 保人 之利益，代向保險公司洽訂保險契約或提供服務而收取佣金之 人。", "answer": 3, "explanation": "保險經紀人係基於被保險人之利益，代向保險公司 洽訂保險契約或提供服務而向保險公司收取佣金之 人"}, {"id": 314, "question": "業務員參加外部共同法令遵循6 小時訓練課程，何者正確？", "option_1": "凡業務員 資格測驗合格者，不論登錄與否皆須遵守該規定", "option_2": "該課程嚴禁冒名上課及 測驗，違反業務員及代上課者皆予以撤銷登錄", "option_3": "由保險事業發展中心製作 數位課程供業務員線上學習", "option_4": "以上皆是。", "answer": 3, "explanation": "依據人身保險業務員教育訓練要點第2 條： 法令遵循課程由財團法人保險事業發展中心（以下 簡稱保發中心）製作， 以數位課程為主"}, {"id": 315, "question": "業務員應於登錄後，檢附參加所屬公司教育訓練合格證明", "option_1": "每4 年", "option_2": "每 5 年", "option_3": "每年", "option_4": "每3 年 ，向所屬公司辦理換發登錄證手續。", "answer": 2, "explanation": "依據人身保險業務員教育訓練通報暨換證作業規範 第7 條：人身保險業務員每五年，完成規定之教育 訓練課程及時數，並檢附原登錄證向所屬公司申請 換證。 故答案選擇(2)"}, {"id": 316, "question": "何種情況不得登錄為壽險業務員?A 申請登錄文件有虛偽記載；B 壽險受 有停止招攬處分尚未期滿；C 產險受有停止招攬處分尚未期滿；D 受破產 宣告尚未復權", "option_1": "ACD", "option_2": "ABCD", "option_3": "ABD", "option_4": "BCD", "answer": 3, "explanation": "依照保險業務員管理規則第7 條： 二、申請登錄之文件有虛偽之記載者。 六、受破產之宣告，尚未復權者。 八、依第十九條規定在受經營同類保險業務之保險 業、保險代理人公司、保險經紀人公司或銀行停止 招攬行為期限內者。 C 產險非屬於同類保險業務。"}, {"id": 317, "question": "業務員何時須先辦理再登錄始得招攬？A 受處分公司依管理規則第19 條 第1 項停止招攬處分期間屆滿後；B 受處分公司撤銷登錄後；C 從原公司 辦理註銷登錄後轉任其他公司時；D 取得投資型測驗合格後欲招攬投資型 保險商品時", "option_1": "ABD", "option_2": "AC", "option_3": "ABC", "option_4": "ACD。", "answer": 2, "explanation": "再登錄：指1.業務員經註銷登錄後，轉任其他公司 或離職再任職原所屬公司，重新辦理登錄者；2.受 經營同類保險業務之停止招攬處分期間屆滿後，重 新辦理登錄者。"}, {"id": 318, "question": "想成為壽險業務員需登錄至A 一般壽險公司；B 保險代理人公司或保險經 紀人公司；C 兼營保險經紀人或保險代理人業務之銀行；D 壽險公會", "option_1": "BCD", "option_2": "ABC", "option_3": "ABCD", "option_4": "ABD", "answer": 2, "explanation": "想成為壽險業務員需登錄至一般壽險公司或保險代 理人公司或保險經紀人公司或兼營保險經紀人或保 險代理人業務之銀行。"}, {"id": 319, "question": "甲現為產險經紀人公司之業務員，取得人身保險業務員資格後", "option_1": "需先辦 理產險註銷登錄後使得登錄壽險", "option_2": "得無條件登錄於另一家壽險經紀人公司", "option_3": "得無條件登錄於另一家壽險公司或人身保險代理人公司", "option_4": "以上皆非。", "answer": 2, "explanation": "產險經紀人公司之業務員，取得人身保險業務員資 格後得無條件登錄於另一家壽險經紀人公司。"}, {"id": 320, "question": "業務員曾受保險業務員管理規則第13 條撤銷登錄者，應於撤銷後", "option_1": "重新 參加業務員資格測驗合格", "option_2": "重新參加教育訓練", "option_3": "重新辦理登錄領取新的 登錄證即可", "option_4": "選項1 或2 皆可 使得登錄。", "answer": 1, "explanation": "業務員曾受保險業務員管理規則第13 條撤銷登錄 者，應於撤銷後重新參加業務員資格測驗合格。"}, {"id": 321, "question": "領有財產保險經紀人執業證照之保險經紀人，其業務員", "option_1": "僅得再登錄於另 一家非經營同類保險業務之保險經紀人公司", "option_2": "完全不得再登錄於其他公司", "option_3": "僅得再登錄於另一家非經營同類保險業務之保險代理人公司", "option_4": "得再登 錄於另一家財產保險公司。", "answer": 1, "explanation": "領有財產保險經紀人執業證照之保險經紀人，其業 務員僅得再登錄於另一家非經營同類保險業務之保 險經紀人公司。"}, {"id": 322, "question": "傷害保險失能給付保險金，按失能程度原分為11 級79 項，經參考勞工 保險及強制車險失能給付標準新增", "option_1": "鼻部缺損，致其機能永久遺存顯著障 害", "option_2": "鼻未缺損，而鼻機能暫時喪失遺存顯著障礙", "option_3": "鼻部缺損，致其機能 暫時喪失", "option_4": "鼻未缺損，而鼻機能永久遺存顯著障害 為80 項。", "answer": 4, "explanation": "傷害保險失能給付保險金，按失能程度原分為11 級79 項，經參考勞工保險及強制車險失能給付標 準新增鼻未缺損，而鼻機能永久遺存顯著障害為 80 項。"}, {"id": 323, "question": "業務員曾受第19 條撤銷登錄處分者，應於撤銷期滿", "option_1": "重新參加業務員資 格測驗合格", "option_2": "重新參加教育訓練", "option_3": "重新辦理登錄領取新的登錄證即可", "option_4": "選項1 或2 皆可 使得登錄。", "answer": 1, "explanation": "業務員曾受第19 條撤銷登錄處分者，應於撤銷期 滿重新參加業務員資格測驗合格始得登錄。"}, {"id": 324, "question": "下列何者具備保險業務員之資格", "option_1": "小張今年19 歲，剛從高職畢業，想參 加壽險公會舉辦之人身保險業務員資格測驗", "option_2": "小陶向主管機關繳銷已領有 之保險經紀人執業證書", "option_3": "老王今年35 歲，之前因犯詐欺罪被判緩刑，去 年12 月已緩刑期滿", "option_4": "小張、老王和小陶皆具備保險業務員資格。", "answer": 2, "explanation": "(1)須成年且有行為能力(3)不得為受徒刑處分完畢 或執行完畢、緩刑期滿或經赦免後未滿3 年者。"}, {"id": 325, "question": "招攬投資型保險商品業務員自完成投資型保險商品變更登錄日起應為之行 為，下列何者為非？", "option_1": "業務員應參加所屬公司基金相關課程並通過課後測 驗", "option_2": "測驗合格者須由所屬公司通報壽險公會備查", "option_3": "有關基金相關課程訓 練時數每3 年應完成9 小時", "option_4": "其中法規訓練時數至少2 小時。", "answer": 3, "explanation": "(3)該課程訓練每3 年完成6 小時，其中法規至少2 小時。"}, {"id": 326, "question": "主管機關規定凡保戶因不實之文宣、廣告而投保，之後產生疑義擬退保 時，保險公司應", "option_1": "以和解金退還", "option_2": "至少加計利息退還當年度保險費", "option_3": "至 少退還所繳全部保險費", "option_4": "至少加計利息退還所繳全部保險費。", "answer": 4, "explanation": "凡保戶因不實之文宣、廣告而投保，嗣後產生疑義 擬退保時，保險公司至少應加計利息退還所繳全部 保險費。"}, {"id": 327, "question": "", "option_1": "教育訓練制度", "option_2": "登錄制度", "option_3": "審查制度", "option_4": "獎懲制度 係為各所屬公司 加強對業務員管理，以謀保險業健全發展，業務員須依規定辦理始得招 攬。", "answer": 2, "explanation": "登錄制度之採行係為各所屬公司加強對業務員管 理，以謀保險業健全發展，業務員須依規定辦理始 得招攬。"}, {"id": 328, "question": "受停止招攬或撤銷登錄處分之業務員，對原處分公司之復查結果有異議， 得於接獲受復查結果之日起三個月內以書面具名理由向何單位申請覆核？", "option_1": "所屬公司", "option_2": "主管機關", "option_3": "各有關公會組成之申訴委員會", "option_4": "金融消費評議 中心。", "answer": 3, "explanation": "業務員對原處分公司復查結果有異議者，得於收到 復查結果之起三個月內以書面具明理由向各有關公 會之申訴委員會申請覆核，並以一次為限。"}, {"id": 329, "question": "保險經紀人公司之業務員，可同時登錄於另一家非經營同類保險業務之", "option_1": "保險經紀人公司", "option_2": "保險公司", "option_3": "保險代理人公司", "option_4": "選項1 或3 皆可。", "answer": 1, "explanation": "業務員經所屬公司同意，並取得相關資格後，保險 業、保險代理人公司之業務員得登錄於另一家非經 營同類保險業務之保險業或保險代理人公司。"}, {"id": 330, "question": "依「人身保險業務員教育訓練通報暨換證作業規範」規定，業務員教育訓 練年度計算係以", "option_1": "註銷登錄", "option_2": "停職登錄", "option_3": "再登錄", "option_4": "初次登錄 日期為 準。", "answer": 4, "explanation": "訓練年度之計算，以業務員初次辦理登錄日期為 準。"}, {"id": 331, "question": "何者為保險業務員應有之行為？", "option_1": "已通過投資型保險測驗合格尚未完成變 更登錄及招攬投資型保險商品", "option_2": "自製強調保費預定利率之招攬文宣", "option_3": "於 招攬之要保書上親自簽名並記載登錄字號", "option_4": "提醒保戶商品即將停售之訊 息。", "answer": 3, "explanation": "(1)已通過投資型保險測驗合格且向公會辦理變更登 錄，取得資格後始可招攬投資型保險商品(2)(4)保 險業務員管理規則第19 條：業務員為對要保人、 被保險人或第三人以誇大不實之宣傳、廣告或其他 不當方法招攬，予以三個月以上一年以下停止招 攬。"}, {"id": 332, "question": "參加人身保險業務員資格測驗，除年齡及學歷限制外，應具有何種身分報 名？A 台灣地區居留證；B 外僑永久居留證；C 大陸地區配偶領有長期居 留證；D 港澳居民居留入出境證", "option_1": "BCD", "option_2": "CD", "option_3": "ABC", "option_4": "BC。", "answer": 3, "explanation": "參加業務員測驗資格須成年且領有永久或是長期居 留證。"}, {"id": 333, "question": "甲經醫生診斷已罹患肝癌，經乙業務員招攬投保防癌保險，投保時甲與乙 共同隱瞞癌症之事實，甲於投保1 年6 個月後死亡，甲之家屬向保險公司 申請理賠時始發現事實，其中業務員乙之行為觸犯了？A 侵占行為；B 背 信行為；C 詐欺行為；D 偽造文書行為", "option_1": "僅構成B、C", "option_2": "僅構成A、D", "option_3": "僅構成C、D", "option_4": "僅構成A、B。", "answer": 1, "explanation": "背信行為：刑法第342 條「為他人處理事務，意 圖為自己或第三人不法之利益，或損害本人之利 益，而違背其任務之行為，致生損害於本人之財產 或其他利益者…」 詐欺行為：刑法第339 條「意圖為自己或第三人 不法之所有，以詐術使人將本人或第三人之物交付 者…」 。"}, {"id": 334, "question": "業務員以不同保險契約作不當之比較，可以予多久停止招攬行為的懲 處?", "option_1": "一個月以上三個月以下", "option_2": "三個月以上六個月以下", "option_3": "三個月以上九個 月以下", "option_4": "三個月以上一年以下。", "answer": 4, "explanation": "停止招攬：三個月以上一年以下。"}, {"id": 335, "question": "業務員受停止招攬行為處分向原所屬公司繳銷登錄證者，是指", "option_1": "變更登錄", "option_2": "停止招攬登錄", "option_3": "註銷登錄", "option_4": "撤銷登錄。", "answer": 2, "explanation": "業務員受停止招攬行為處分向原所屬公司繳銷登錄 證者，是指停止招攬登錄。"}, {"id": 336, "question": "保險業務員於處理事務時，有可能因為一些特定的利益而違背其應盡之義 務，而造成保險公司的損害，這時就可能觸犯了刑法上的", "option_1": "偽造文書", "option_2": "詐欺", "option_3": "侵占行為", "option_4": "背信。", "answer": 4, "explanation": "背信行為判斷方式為，在明知公司規定的前提下， 做出違反公司規定的行為。"}, {"id": 337, "question": "業務員未完成教育訓練，所屬公司及業務員應如何辦理？A 公司應辦理註 銷登錄；B 公司應請其1 年内補訓，如仍未完成者則辦理撤銷登錄；C 業 務員經撤銷登錄後需重新通過資格測驗才能申請登錄；D 業務員於懲處滿 1 年後，需重新通過資格測驗才能申請登錄", "option_1": "BD", "option_2": "AD", "option_3": "BC", "option_4": "AC。", "answer": 3, "explanation": "A 公司應辦理撤銷登錄；D 業務員於五年內懲處累 積2 年者將撤銷(懲處指停招)，需重新通過資格測 驗才能申請登錄。"}, {"id": 338, "question": "業務員因離職、轉任而異動時，所屬公司應向壽險公會申報", "option_1": "註銷登錄", "option_2": "停止招攬登錄", "option_3": "變更登錄", "option_4": "撤銷登錄。", "answer": 1, "explanation": "業務員因離職、轉任而異動時，所屬公司應向壽險 公會申報註銷登錄。"}, {"id": 339, "question": "壽險業務員招攬時須出示登錄證，該登錄證由哪個單位製發", "option_1": "各登錄單位", "option_2": "壽險公會", "option_3": "登錄證即測驗合格證，由辦理測驗單位製發", "option_4": "以上皆非。", "answer": 1, "explanation": "壽險業務員招攬時須出示登錄證，該登錄證由各登 錄單位製發。"}, {"id": 340, "question": "各所屬公司對於業務員予以停止招攬行為或撤銷登錄時，應A 通知業務員 本人；B 通知主管機關；C 通知各有關公會；D 刊登公報", "option_1": "AC", "option_2": "ABC", "option_3": "BC", "option_4": "ABCD。", "answer": 1, "explanation": "各所屬公司對於業務員予以停止招攬行為或撤銷登 錄時，應通知業務員本人及通知各有關公會。"}, {"id": 341, "question": "申請登錄之業務員若曾受偽造文書、侵占、詐欺、背信等徒刑處分執行完 畢或經赦免未滿", "option_1": "三年", "option_2": "二年", "option_3": "五年", "option_4": "一年 者，不得申請登錄為業 務員。", "answer": 1, "explanation": "徒刑處分完畢、緩刑期滿或經赦免後未滿三年；組 織犯罪五年。"}, {"id": 342, "question": "業務員招攬利率變動型年金保險前應完成哪些程序始得招攬？A 參加公司 至少3 小時課程；B 訓練完成後應測驗合格；C 合格成績報壽險公會備 查；D 合格成績存放公司備查", "option_1": "AB", "option_2": "ABC", "option_3": "BCD", "option_4": "ABD。", "answer": 2, "explanation": "D 受訓證明存放公司備查。"}, {"id": 343, "question": "有關銷售外幣收付非投資型保險商品應具備之資格及訓練，何者錯誤？", "option_1": "應參加匯率風險及外匯相關法規之教育訓練", "option_2": "銷售該商品之業務員須通過 壽險公會舉辦之特別測驗並完成資格登錄", "option_3": "非登錄中業務員得報考該項特 別測驗再完成資格登錄", "option_4": "訓練時數最少5 小時。", "answer": 3, "explanation": "(3)需登錄中業務員才能報考外幣測驗"}, {"id": 344, "question": "參加保險業務員資格測驗者之學歷至少為何？", "option_1": "國小以上學校畢業或同等 學歷", "option_2": "國中以上學校畢業或同等學歷", "option_3": "高中以上學校畢業或同等學歷", "option_4": "大學以上學校畢業或同等學歷。", "answer": 3, "explanation": "保險業務員資格測驗者之學歷規範：成年且具有高 中職以上學校畢業或同等學歷。"}, {"id": 345, "question": "保戶委請業務員代為繳納保險費，當業務員拿到保險費後，因手頭不方便 先拿去使用，2 天後再將保險費繳回保險公司，其行為已涉及A 偽造文書 行為；B 詐欺行為；C 侵佔行為；D 背信行為", "option_1": "AB", "option_2": "CD", "option_3": "BC", "option_4": "BD。", "answer": 2, "explanation": "背信：為他人處理事務，因其違背任務行為，導致 利益損害；侵占：不法佔有他人之物。"}, {"id": 346, "question": "依保險法第八條之一規定，所謂保險業務員係指為下列之何者從事保險招 攬之人？A 保險業；B 保險經紀人公司；C 保險代理人公司；D 兼營保險 經紀人業務之銀行", "option_1": "A", "option_2": "AB", "option_3": "ABC", "option_4": "ABCD。", "answer": 4, "explanation": "依保險法第八條之一規定，所謂保險業務員係指保 險業、保險經紀人公司、保險代理人公司或兼營保 險代理人或保險經紀人業務之銀行，從事保險招攬 之人。"}, {"id": 347, "question": "下列何者正確？A 取得業務員資格即可招攬保險；B 業務員之招攬行為僅 應受所屬公司之獎懲辦法規範；C 業務員違規情事若有犯罪嫌疑，應移送 法辦；D 業務員有違反管理規則之情事，所屬公司應予以停止招攬登錄或 撤銷登錄", "option_1": "CD", "option_2": "ABCD", "option_3": "BD", "option_4": "BCD。", "answer": 1, "explanation": "A 須完成登錄程序；B 須受到保險業務員管理規則/ 刑法/個資法等相關法令規範。"}, {"id": 348, "question": "業務員於登錄後應於", "option_1": "每3 年", "option_2": "每年", "option_3": "每5 年", "option_4": "每4 年 完成規定之 教育訓練課程及時數，並於期滿前辦妥換發登錄證手續。", "answer": 2, "explanation": "業務員於登錄後每年參加所屬公司辦理之教育訓 練。"}, {"id": 349, "question": "壽險公司現職業務員", "option_1": "不可以", "option_2": "領有經紀人資格證書才可以", "option_3": "公司同 意時才可以", "option_4": "符合登錄資格就可以 申請保險經紀人執業證書。", "answer": 1, "explanation": "業務員消極資格：不得為登錄二家經營同類保險業 務之保險業者。"}, {"id": 350, "question": "業務員不參加所屬公司所舉辦之教育訓練者，所屬公司應為其辦理", "option_1": "註銷 登錄", "option_2": "撤銷登錄", "option_3": "警告登錄", "option_4": "停止招攬登錄。", "answer": 2, "explanation": "業務員不參加所屬公司所舉辦之教育訓練者，所屬 公司應為其辦理撤銷登錄。"}, {"id": 351, "question": "保險公司對業務員的管理，下列何者為非？", "option_1": "業務員與公司間之勞務契約 依民法及相關法令規定", "option_2": "出勤行為應依業務員與保險公司之勞務契約規定", "option_3": "業務員之所有行為皆應依保險業務員管理規則", "option_4": "招攬行為之管理應依 保險業務員管理規則 辦理。", "answer": 3, "explanation": "業務員之行為，除應依保險業務員管理規則辦理， 還應依業務員所屬公司簽訂之勞務契約，依民法及 相關法令規定辦理。"}, {"id": 352, "question": "依「人身保險業務員教育訓練通報暨換證作業規範」規定，業務員因註 銷、停止招攬行為、撤銷等異動後，再辦理登錄，其間隔期間在", "option_1": "三年", "option_2": "一年", "option_3": "二年", "option_4": "四年 以上者，其教育訓練年度應重新計算。", "answer": 2, "explanation": "依「人身保險業務員教育訓練通報暨換證作業規 範」第5 條第2 項： 領有第一年至第五年度登錄證之業務員因註銷或停 止招攬等異動，再登錄間隔期間超過一年以上者， 其教育訓練年度之計算，以再登錄日期為準重新計 算。"}, {"id": 353, "question": "業務員轉任其他保險公司時，依業務員管理規則規定，應", "option_1": "先重新參加業 務員資格測驗", "option_2": "由所屬公司辦理變更登錄", "option_3": "通過所屬公司辦理一定課程 之在職教育訓練始得依規定重新登錄", "option_4": "由所屬公司辦理重新登錄。", "answer": 4, "explanation": "(1)不須重新參加資格測驗(2)由所屬公司辦理註銷 登錄(3)可直接依規定重新登錄。"}, {"id": 354, "question": "業務員登錄後第二至第五年之教育訓練課程依規定，每年至少應有", "option_1": "30", "option_2": "15", "option_3": "12", "option_4": "16 小時之訓練。", "answer": 3, "explanation": "第二至五年度共12 種課程12 小時之訓練。"}, {"id": 355, "question": "業務員不服受停止招攬登錄、撤銷登錄處分，得於受處分之通知到達之日 起", "option_1": "一年", "option_2": "三年", "option_3": "三個月", "option_4": "一個月 內，向原處分公司提出申復。", "answer": 4, "explanation": "業務員不服受停止招攬登錄、撤銷登錄處分，得於 受處分之通知到達之日起一個月內，以書面具名理 由向原處分公司提出申復。"}, {"id": 356, "question": "業務員收取要保人所繳納之現金保險費後，而再以自己或他人之信用卡刷 卡繳交之行為，下列何者正確？A 屬挪用保費之情事；B 已符合侵佔罪的 構成要件；C 所屬公司應依保險業務員管理規則第19 條第1 項規定予以 懲處登錄；D 所屬公司應逕予註銷登錄", "option_1": "ABCD", "option_2": "ABD", "option_3": "BC", "option_4": "ABC。", "answer": 4, "explanation": "D 應為停止招攬登錄。"}, {"id": 357, "question": "有關保險代理人、經紀人之敘述何者正確？", "option_1": "保險代理人、經紀人皆須投 保責任保險及保證保險，始得經營業務", "option_2": "兼有保險代理人、經紀人資格 者，均得申領執業證照", "option_3": "保險代理人公司、經紀人公司非加入商業同業公 會不得營業", "option_4": "銀行經主管機關許可得同時兼營保險代理人及經紀人業務。", "answer": 3, "explanation": "(1)保險代理人須投保責任保險；保險經紀人須投保 責任保險及保證保險，使得經營業務(2)兼有保險代 理人、經紀人資格者，僅得擇一申領執業證照(4)銀 行得經主管機關許可擇一兼營保險代理人或保險經 紀人業務。"}, {"id": 358, "question": "李小姐現為某產險公司之業務員，於取得人身保險業務員資格後", "option_1": "得登錄 於另一家壽險公司或人身保險代理人公司", "option_2": "僅得登錄於另一家壽險公司", "option_3": "得另登錄於另一家壽險公司及人身保險代理人公司", "option_4": "得登錄於另一家 人身保險經紀人公司。", "answer": 1, "explanation": "保險業、保險代理人公司、兼營保險代理人業務之 銀行之業務員則可同時於另一家非經營同類保險業 務之保險業或保險代理人業務之銀行登錄為產險及 壽險業務員。"}, {"id": 359, "question": "小王同時為甲壽險公司及乙產險公司之業務員，代收甲公司保戶繳交之保 險費後，因先挪用繳交自家之水電費，就該行為陳述何者為是？A 甲公司 應辦理撤銷登錄；B 乙公司受甲公司通知後辦理註銷登錄；C 僅甲公司應 辦理撤銷登錄，乙公司之登錄則不受限制；D 甲及乙公司皆應辦理撤銷登 錄", "option_1": "A", "option_2": "D", "option_3": "AC", "option_4": "AB。", "answer": 4, "explanation": "因在甲公司違法，故甲公司應辦理撤銷登錄，乙公 司無違法則受甲公司通知後辦理註銷登錄。"}, {"id": 360, "question": "保險業務員於登錄有效期間內，受停止招攬行為處分期間累計達多久，應 予以撤銷其業務員登錄處分？", "option_1": "五年", "option_2": "二年", "option_3": "三年", "option_4": "一年。", "answer": 2, "explanation": "保險業務員於登錄有效期間內，受停止招攬行為處 分期間累計達兩年，應予以撤銷其業務員登錄處 分。"}, {"id": 361, "question": "申請登錄業務員曾犯組織犯罪防制條例規定之罪，經有罪判刑確定，尚未 執行完畢或執行完畢、緩刑期滿或赦免後尚未逾", "option_1": "三年", "option_2": "二年", "option_3": "五年", "option_4": "一年 者，不得申請登錄。", "answer": 3, "explanation": "曾犯組織犯罪防制條例規定之罪，經有罪判刑確 定，尚未執行完畢或執行完畢、緩刑期滿或赦免後 尚未逾5 年，不得申請登錄。"}, {"id": 362, "question": "傷害保險被保險人如失蹤應如何處理？", "option_1": "依戶籍資料所載失蹤日起滿一年 仍未尋獲，保險人應先行給付保險金", "option_2": "要保人或受益人能提出證明足認被 保險人極可能因承保事故致死者，保險人應先行給付保險金", "option_3": "保險人先行 給付保險金後發現被保險人生還，要保人或受益人應歸還保險人已領之退 還已繳保費或身故保險金或喪葬費用保險金", "option_4": "以上皆是。", "answer": 4, "explanation": "以上皆為傷害保險被保險人失蹤之處理。"}, {"id": 363, "question": "住院醫療費用保險單示範條款，住院係指A 被保險人經醫師診斷其疾病必 須入院；B 被保險人經醫師診斷其傷害必須入院；C 須正式辦理住院手續 並確實在醫院接受診療；D 可於契約條款明訂包含精神衛生法第35 條之 日間留院", "option_1": "ABCD", "option_2": "ABC", "option_3": "ACD", "option_4": "AC。", "answer": 1, "explanation": "住院醫療費用保險單示範條款，住院係指被保險人 經醫師診斷其疾病或傷害必須入住醫院，且正式辦 理住院手續並確實在醫院接受診療者，包含精神衛 生法第35 條之日間留院。"}, {"id": 364, "question": "有關團體人壽保險，何者正確？", "option_1": "要保人因所屬人員大批離職致參加保險 人數不足時，保險人得終止保險契約並按日數比例退還未滿期保費", "option_2": "因業 務種類變更致危險顯著增加時，要保人應於知悉後兩週內通知保險人", "option_3": "保 險人接到危險增加之通知30 日內，得根據危險增加的程度要求增加保費 或終止契約", "option_4": "以上皆是。", "answer": 4, "explanation": "以上皆為團體人壽保險有關之敘述。"}, {"id": 365, "question": "下列何者有誤？", "option_1": "保險公證人係辦理保險標的查勘、鑑定及估價而予證明 之人", "option_2": "保險法所定各種準備金包含責任準備金、未滿期保費準備金、賠款 準備金及保單價值準備金", "option_3": "外國保險業係指依外國法律組織登記並經主管 機關許可，在本國境內經營保險之機構", "option_4": "合夥人為被保險人，其中一人讓 與保險利益於他人，契約不因之而失效。", "answer": 2, "explanation": "保險法所定各種準備金，包括責任準備金、未滿期 保費準備金、特別準備金、賠款準備金及其他經主 管機關規定之準備金。"}, {"id": 366, "question": "保險業務員管理規則係由主管機關依保險法第177 條訂定，並於民國", "option_1": "81 年10 月15 日", "option_2": "80 年4 月15 日", "option_3": "82 年4 月15 日", "option_4": "83 年10 月 15 日 起實施，自此保險業務員邁入一個新的里程碑。", "answer": 3, "explanation": "保險業務員管理規則係由主管機關依保險法第177 條訂定，民國81 年10 月15 日發布「保險業務員 管理規則」 ，並於民國82 年4 月15 日起實施。"}, {"id": 367, "question": "下列何者非屬團體保險條款規定受益人請領身故保險金時應檢具之文件", "option_1": "被保險人之除戶戶籍謄本", "option_2": "受益人之身分證明", "option_3": "被保險人死亡證明書及 保險金申請書", "option_4": "保險金申請書、受益人之戶籍謄本及印鑑證明。", "answer": 4, "explanation": "團體保險條款規定受益人請領身故保險金時應檢具 之文件有：被保險人死亡證明及除戶戶籍謄本、保 險金申請書、受益人之身分證明。"}, {"id": 368, "question": "保險業依保險法第141 條提存保證金之敘述何者正確?", "option_1": "應按資本或基金 實收總額20%繳存於國庫", "option_2": "應按資本或基金實收總額20%繳存於安定基 金", "option_3": "應按資本或基金實收總額15%繳存於安定基金", "option_4": "應按資本或基金實", "answer": 4, "explanation": "保險業依保險法第141 條提存保證金，應按資本 或基金實收總額15%繳存於國庫。 收總額15%繳存於國庫"}, {"id": 369, "question": "有關團體保險之敘述，何者正確？", "option_1": "契約涉訟時得排除小額訴訟管轄法院 之適用", "option_2": "要保人於保單屆滿日的2 週前與保險人議定續保條件，續保的 始期以原契約屆滿日的翌日零時為準", "option_3": "所謂團體係指具有5 人以上且以 購買保險而組織之團體", "option_4": "被保險人異動申請加保時，被保險人資格自異動 發生日翌日零時起生效。", "answer": 2, "explanation": "(1) 團體傷害保險單示範條款中第31 條：不得排 除消費者保護法第47 條及民事訴訟法第436 條之 九小額訴訟管轄法院(3) 「團體」是指具有五人以 上且非以購買保險而組織之下列之一(4) 第９條： 要保人因所屬人員異動而申請加保時，應以書面通 知本公司，自通知到達之翌日零時起開始生效，如 通知起保日期在後，則自該起保日零時起生效。"}, {"id": 370, "question": "保險業不動產之投資，以所投資不動產即時利用並有收益者為限；其投資 總額除自用不動產外，不得超過其資金", "option_1": "20", "option_2": "30", "option_3": "25", "option_4": "35 %。", "answer": 2, "explanation": "保險法第146-2 條，保險業對不動產之投資，以 所投資不動產即時利用並有收益者為限；其投資總 額，除自用不動產外，不得超過其資金百分之三 十。"}, {"id": 371, "question": "保險法第37 條，要保人故意不為複保險之通知或意圖不當得利而為複保 險者，其契約", "option_1": "無效", "option_2": "失效", "option_3": "停效", "option_4": "解約。", "answer": 1, "explanation": "複保險，除另有約定外，要保人應將他保險人之名 稱及保險金額通知各保險人；要保人故意不為前條 之通知或意圖不當得利而為複保險者，其契約無 效。"}, {"id": 372, "question": "在個人傷害保險契約中，被保險人於本契約有效期間內，因遭受意外傷害 事故，致其身體蒙受傷害，自傷害事故發生之日起幾日以內致成死亡者， 保險公司仍負保險責任", "option_1": "360 日", "option_2": "30 日", "option_3": "90 日", "option_4": "180 日。", "answer": 4, "explanation": "被保險人於契約有效期間內，因遭受意外傷害事故 致其身體蒙受傷害，自傷害事故發生之日起180 天內致成死亡/失能者，保險公司負保險責任。"}, {"id": 373, "question": "保險業辦理其他與保險有關業務，涉及外匯業務經營者，須經", "option_1": "金管會保 險局", "option_2": "中央銀行", "option_3": "金管會銀行局", "option_4": "台灣銀行 許可。", "answer": 2, "explanation": "保險業辦理其他與保險有關業務，涉及外匯業務經 營者，須經中央銀行許可。"}, {"id": 374, "question": "要保人對同一保險利益、同一保險事故與數保險公司分別訂立數個保險契 約稱為", "option_1": "再保險", "option_2": "合保", "option_3": "複保險", "option_4": "分保。", "answer": 3, "explanation": "要保人對同一保險利益、同一保險事故與數保險公 司分別訂立數個保險契約稱為複保險。"}, {"id": 375, "question": "依保險法規定，人身保險合作社之預定社員人數不得低於", "option_1": "800", "option_2": "1000", "option_3": "500", "option_4": "100 人。", "answer": 3, "explanation": "財產合作社300 人，人身合作社500 人。"}, {"id": 376, "question": "保險業於受接管期間內，主管機關得限制A 新業務之承接；B 受理有效契 約變更；C 受理有效契約終止；D 受理要保人以保險契約為質之借款", "option_1": "ABCD", "option_2": "A", "option_3": "ABD", "option_4": "BCD。", "answer": 1, "explanation": "接管期間，主管機關得限制：新業務承接、有效保 單變更或終止、保單借款、解約金。"}, {"id": 377, "question": "依保險法第 141 條規定，保險業應按資本或基金實收總額之多少比例， 繳存保證金於國庫？", "option_1": "5%", "option_2": "10%", "option_3": "15%", "option_4": "20%。", "answer": 3, "explanation": "依保險法第 141 條規定，保險業應按資本或基金 實收總額之15%，繳存保證金於國庫。"}, {"id": 378, "question": "有關人身保險契約之保險金信託規定，何者有誤？", "option_1": "保險業為該保險金信 託之受託人", "option_2": "要保人須於訂立保險契約時，同時洽訂信託契約", "option_3": "僅要保 人與被保險人為同一人之保險契約得洽訂信託契約", "option_4": "僅死亡保險金及失能 保險金得洽定信託契約。", "answer": 2, "explanation": "(2)要保人於保險事故發生前預先洽定信託契約。"}, {"id": 379, "question": "下列敘述何者正確？A 保險合作社簽訂之保險契約，得為分紅或不分紅保 單；B 保險公司簽訂之保險契約，以參加保單紅利者為限；C 保單紅利計 算基礎及方法應於保險契約中明定；D 保險合作社簽訂之保險契約，以參 加保單紅利者為限", "option_1": "ABC", "option_2": "AC", "option_3": "CD", "option_4": "BCD。", "answer": 3, "explanation": "保險業通則140 條 A 保險合作社簽訂之保險契約，以參加保單紅利者 為限；B 保險公司得簽訂參加保單紅利之保險契 約。"}, {"id": 380, "question": "下列何者不是團體保險條款規定被保險人請領失能保險金應檢具之文件", "option_1": "被保險人印鑑證明書", "option_2": "保險金申請書", "option_3": "受益人身分證明", "option_4": "失能診斷書。", "answer": 1, "explanation": "受益人申領失能保險金，應檢具下列文件：保險金 申請書、受益人之身分證件、失能診斷書，但必要 時本公司得要求提供意外傷害事故證明文件。"}, {"id": 381, "question": "依保險法第146 條之1 規定保險業資金購得金融債券、可轉讓定期存 單，其總額不得超過該保險業資金百分之", "option_1": "三十", "option_2": "四十五", "option_3": "三十五", "option_4": "四 十。", "answer": 3, "explanation": "金融債券、可轉讓定期存單、銀行承兌匯票、金融 機構保證商業本票，其總額不得超過該保險業資金 百分之三十五。"}, {"id": 382, "question": "團體保險被保險人由於工作場所變更，致危險有顯著增加時，應於何時通 知保險公司", "option_1": "要保人應於知悉後兩週內", "option_2": "被保險人應於兩週內", "option_3": "要保人 應於一個月內", "option_4": "要保人應於契約週年時。", "answer": 1, "explanation": "要保人或被保險人由於工作場所，設備，業務種類 或其他變更，致危險有顯著增加時要保人應於知悉 後兩週內通知保險公司。"}, {"id": 383, "question": "保險業自有資本與風險資本比率不得低於200%，若保險業有資本嚴重不 足，係指資本適足率低於", "option_1": "100%", "option_2": "150%", "option_3": "10%", "option_4": "50% 或淨值低於 零。", "answer": 4, "explanation": "保險業自有資本與風險資本比率不得低於 200%，，其中資本嚴重不足，指資本適足率低於 百分之五十或保險業淨值低於零。"}, {"id": 384, "question": "我國保險法規定，保險業於完納一切稅捐後，分派盈餘時，應先提存多少 為法定盈餘公積？", "option_1": "5%", "option_2": "10%", "option_3": "15%", "option_4": "20% ，但法定盈餘公積已達其 資本總額或基金總額時，不在此限。", "answer": 4, "explanation": "保險業於完納一切稅捐後，分派盈餘時，應先提百 分之二十為法定盈餘公積。"}],
  jingxuan_shiwu:[{"id": 1, "question": "下列何者是「風險」的要件?", "option_1": "ABCD", "option_2": "BCD", "option_3": "BD", "option_4": "ABD", "answer": 3, "explanation": "A造成的結果具有不確定性;C損失金額不限於龐大且可以金錢衡量。"}, {"id": 2, "question": "風險的發生與存在必須具備A 確定性:B有損失的可能:C有獲利的可 能:D屬於將來性的", "option_1": "ABCD", "option_2": "BD", "option_3": "ABD", "option_4": "BCD", "answer": 2, "explanation": "A風險的發生是不確定的;C風險的發生也有損失的可能。"}, {"id": 3, "question": "下列有關損失的定義,何者正確", "option_1": "無形損失非包括在風險本質中", "option_2": "保險可保的損失係指非意外事故造成之損失", "option_3": "僅指有形損失", "option_4": "有形損失 可以衡量", "answer": 4, "explanation": "(1)風險的本質包含無形損失;(2)保險可保的損失是指因意外事故造成之損失;(3)損失分有形損失與無形損失。"}, {"id": 4, "question": "事故發生時波及範圍大,影響整個大環境且較難以控制的風險為", "option_1": "常屬「純粹風險", "option_2": "基本風險", "option_3": "特定風險", "option_4": "僅第1、3 選項為是", "answer": 2, "explanation": "事故發生時波及範圍大,較難控制的風險為基本風險。"}, {"id": 5, "question": "依損失的性質,下列何者是「投機風險」的意義?", "option_1": "一定無法獲利的風險", "option_2": "可能會導致損失,也可能會產生獲利的風險", "option_3": "一定可以金錢衡量的風險", "option_4": "一定造成損失的風險", "answer": 2, "explanation": "投機風險可能導致損失,也可能產生獲利"}, {"id": 6, "question": "首先根據生命表計算合理的保險費,促使現代人壽保險制度的建立始於何時?", "option_1": "中世紀歐洲的基爾特組織", "option_2": "法國相互救濟會", "option_3": "英國衡平保險社", "option_4": "德國救濟金庫", "answer": 3, "explanation": "首先根據生命表計算合理保險費,促使現代人壽保險制度建立的為英國衡平保險社。"}, {"id": 7, "question": "有關風險的衡量的敘述,何者為是?A一個企業對員工做死亡風險衡量的目的,主要在預估一定期間內員工死亡風險發生所造成的損失金額;B損 失發生的頻率係指發生風險或意外事故的平均損失金額;C損失發生的幅 度係指一定期間內,每一個風險單位發生風險的平均次數;D損失成本為 「損失頻率乘以損失幅度", "option_1": "ABCD", "option_2": "BCD", "option_3": "A", "option_4": "AD", "answer": 4, "explanation": "B損失發生的頻率係指一定期間內,每一個風險單位發生風險的平均次數;C損失發生的幅度係指發生風險或意外事故的平均損失金額"}, {"id": 8, "question": "有關風險管理的方法,何者為非?", "option_1": "事故發生前最簡單、經濟且又安全的「風險管理方法是避免", "option_2": "事故發生前先購買保險、做好風險控管,屬風險管理方法的移轉", "option_3": "高血壓的人不要吃太油膩的食物,屬事故發生前風險管理方法的預防", "option_4": "有購買保險但投保的保險金額不足造成自己保留了必須承擔的風險,屬風險管理方法的自留。", "answer": 3, "explanation": "(3)高血壓的人不要吃太油膩的食物,屬事故發生中風險管理方法的抑制。"}, {"id": 9, "question": "下列何者正確?A計算風險損失成本屬風險管理步驟之風險確認;B特別 嚴重的風險僅指損失幅度分配非常高的風險;C不重要的風險僅指損失發 生頻率非常小的風險;D風險損失成本指損失發生頻率及幅度二項預期值 乘積", "option_1": "ABCD", "option_2": "BCD", "option_3": "AD", "option_4": "D", "answer": 4, "explanation": "風險的衡量,主要是在預估一定期間(如1年)內風險發生所造成的損失金額;B特別嚴重的風險:指損失頻率分配與損失幅度分配皆很高的風險;C不重要的風險:指損失頻率分配與損失幅度分配皆很低的風險。"}, {"id": 10, "question": "下列何者非屬特定風險之特性?", "option_1": "不含投機風險", "option_2": "僅影響特定之人", "option_3": "處理方式以保險為主", "option_4": "通常與經濟、政治、社會、及天然災害有關。", "answer": 4, "explanation": "特定風險:指波及範圍小(只影響個人)、較易控制的風險。基本風險:指波及範圍大、較難控制的風險。"}, {"id": 11, "question": "下列何者正確?A主觀風險可能經過一定期間觀察與統計而成為客觀風 險;B風險依損失是否可衡量區分為投機風險與純粹風險;C保險可保的 純粹風險僅人身上的風險及財產上的風險兩種;D特定風險在性質上常屬 於純粹風險", "option_1": "ACD", "option_2": "ABCD", "option_3": "AD", "option_4": "BCD", "answer": 3, "explanation": "B風險依損失是否可衡量區分為客觀風險與主觀風險;C保險可保的純粹風險可分為1.人身上的風險 2.財產上的風險3.責任上的風險。"}, {"id": 12, "question": "下列何者為「風險自留」的原因:A明知有風險存在而疏忽不予處理;B 自己承擔比其他處理方式更划算;C無適當處理方式;D自己有能力足以 承擔損失", "option_1": "ABC", "option_2": "BCD", "option_3": "BC", "option_4": "ABCD", "answer": 4, "explanation": "風險自留:由經濟單位所保留必須承擔的風險皆是。依照損失的幅度與頻率可分為：特別嚴重風險/重要的風險/不重要風險。"}, {"id": 13, "question": "下列何者正確?", "option_1": "損失幅度分配低的風險可能屬於不重要的風險或重要的風險", "option_2": "損失幅度分配低的風險可能屬於特別嚴重的風險或不重要的風險", "option_3": "損失頻率分配高的風險可能屬於不重要的風險或重要的風險", "option_4": "以上皆非。", "answer": 1, "explanation": "頻率高+幅度高屬於特別嚴重風險；頻率高+幅度低屬於重要風險；頻率低+幅度高屬於重要風險；頻率低+幅度低屬於不重要的風險。"}, {"id": 14, "question": "某團體員工年平均死亡率為0.326%,若死亡事故發生時,雇主預期需支 付每一位員工一百萬元的撫恤金,何者正確?A雇主預測損失成本係應用 主觀風險的觀念;B0.326%即損失幅度的預期值;C一百萬元即損失頻率 的預期值;D每位員工損失成本為3260元", "option_1": "BCD", "option_2": "BC", "option_3": "D", "option_4": "ABCD", "answer": 3, "explanation": "A客觀風險;B0.326%損失頻率;C100萬為損失幅度。"}, {"id": 15, "question": "阿華將其最近購買的一棟房子投保財產保險後,就疏忽房子之維護與管 理,這種風險因素係屬於", "option_1": "心理風險", "option_2": "實質風險", "option_3": "有形風險", "option_4": "道德風險", "answer": 1, "explanation": "因個人的不小心、冷漠、缺乏注意力,而增加風險發生的機會,稱之為心理風險(無形風險)。"}, {"id": 16, "question": "風險的分類,依性質可區分為", "option_1": "靜態風險與動態風險", "option_2": "純粹風險與投機風險", "option_3": "基本風險與特定風險", "option_4": "客觀風險與主觀風險。", "answer": 2, "explanation": "風險的分類,依損失的性質可區分為純粹風險與投機風險。"}, {"id": 17, "question": "廣義的風險管理,除彌補經濟損失外,尚包含儲蓄投資以備未來所需,此 部份之需求就可以利用年金保險、長期壽險等具有下列哪些功能,使個人 及家庭的經濟生活更能獲得保障?A儲蓄性質保單;B保單借款;C保單 復效;D身故保險金", "option_1": "BC", "option_2": "AD", "option_3": "AB", "option_4": "ABCD", "answer": 3, "explanation": "題目考的是保險的儲蓄功能,故選項只能選擇A與B。C復效係保障的持續擁有;D身故保險金保障家庭經濟生活並未保障個人經濟生活。"}, {"id": 18, "question": "人身風險事故發生時可能導致A遺族生活費用增加;B老年退休費用減 少;C醫療費用增加;D收入減少", "option_1": "ACD", "option_2": "ABCD", "option_3": "ABC", "option_4": "BCD", "answer": 1, "explanation": "B老年退休費用會增加,因可能需失能或疾病導致需增添無障礙設施,故退休費用會增加。"}, {"id": 19, "question": "下列敘述何者不正確?", "option_1": "就全體投保者而言,人壽保險保險費與保險給付間為交換價值不相等的契約", "option_2": "人壽保險之保險費計算,須受政府之嚴格管制監督", "option_3": "同一種保單對不同的購買者可能收取不同的保險費", "option_4": "人壽保險之保險費決定係在實際成本發生之前,採預估方式。", "answer": 1, "explanation": "(1)保險是集合大多數人的力量來分散風險消化損失的社會互助經濟保障制度,它是根據公平合理的制度給予他所需要的補償。"}, {"id": 20, "question": "有關因應新型冠狀病毒傳染之風險管理方法,下列何者錯誤?", "option_1": "不到人群匯集的夜市或觀光景點係採用「避免」", "option_2": "勤洗手、戴口罩並遵守社交安全距離的規定係採用「預防」", "option_3": "察覺有發燒、咳嗽等症狀時前往指定醫療院所進行篩檢並自主健康管理係採用「抑制」", "option_4": "購買年金型保險商品係採用「移轉」。", "answer": 4, "explanation": "(4)購買年金型保險則屬於儲蓄投資以備未來所需之風險管理方式。"}, {"id": 21, "question": "道德風險因素之敘述何者正確?A屬於有形風險因素;B指因個人不小 心、冷漠導致增加風險事故發生的機會;C如為領取保險金而縱火的行 為;D如疏忽維護已投保財產保險之保險標的", "option_1": "C", "option_2": "AC", "option_3": "BD", "option_4": "ABD", "answer": 1, "explanation": "道德風險因素:指凡促使被保險人意圖不當得利而故意使損失發生之條件即為道德風險因素。A屬於無形風險;B描述為心理風險;D描述為心理風險。"}, {"id": 22, "question": "下列敘述,何者不正確", "option_1": "投機風險係指事件發生的結果可能會產生獲利", "option_2": "保險的目的,在於補償因偶然事件的發生所導致經濟上的損失", "option_3": "保險所處理的風險,主要是純粹風險", "option_4": "純粹風險係指事件的結果不一定只有損失機會。", "answer": 4, "explanation": "純粹風險係指只有損失機會,而無獲利機會。保險所處理的風險,主要是純粹風險。"}, {"id": 23, "question": "風險衡量結果屬於重要的風險,則代表", "option_1": "損失頻率分配及幅度分配皆很小", "option_2": "損失頻率分配及幅度分配皆很高", "option_3": "損失頻率分配很高及幅度分配很小", "option_4": "以上皆非。", "answer": 3, "explanation": "重要的風險,具備損失頻率分配很高及幅度分配很小的屬性。"}, {"id": 24, "question": "天然災害如地震不屬於下列何種風險分類", "option_1": "純粹風險", "option_2": "靜態風險", "option_3": "特定風險", "option_4": "客觀風險。", "answer": 3, "explanation": "天然災害/自然風險事故(如地震、海嘯)的風險類別為客觀、純粹、靜態、基本風險。"}, {"id": 25, "question": "依風險發生的範圍與影響來看,兼有純粹風險與投機風險雙重性質的風險類別是", "option_1": "特定風險", "option_2": "靜態風險", "option_3": "動態風險", "option_4": "基本風險。", "answer": 4, "explanation": "基本風險:波及範圍大,較難控制,性質上純粹風險與投機風險兼而有之。"}, {"id": 26, "question": "事故發生時波及範圍小,只會影響個人而不會影響整個大環境且較容易控 制的風險為", "option_1": "基本風險", "option_2": "特定風險", "option_3": "常屬純粹風險", "option_4": "僅第2及第3選項為是。", "answer": 4, "explanation": "特定風險:指波及範圍小(只影響個人),常屬於純粹風險。事故發生時波及範圍小,較易控制的風險為特定風險,性質上常屬於純粹風險。"}, {"id": 27, "question": "一種風險不受人為之故意行為因素影響,可以觀察也可以衡量,認定上不 會因人而有不同結果之風險稱為", "option_1": "主觀風險", "option_2": "客觀風險", "option_3": "投機風險", "option_4": "純粹風險。", "answer": 2, "explanation": "客觀風險的定義係指實際損失經驗與預期損失經驗的可能變量,此種風險通常不受人為之故意行為因素影響。"}, {"id": 28, "question": "投保人身保險之個人可獲哪些稅法上優惠", "option_1": "在一定金額內之滿期保險金不用課徵遺產稅", "option_2": "憑保險費收據可免繳勞保保險費", "option_3": "保險費在一定金額內可自其綜合所得額中扣除", "option_4": "即使未指定受益人,死亡保險金亦不納入遺產稅計算。", "answer": 3, "explanation": "(1)滿期保險金也不用課徵所得稅(2)繳納的保費可以依法從他的所得額中扣除(4)遺產及贈與稅法也規定,約定之被保險人死亡時,給付其所指定受益人之人壽保險金額,不計入遺產總額課稅。"}, {"id": 29, "question": "由內政部以全國國民或地區居民為對象,依人口普查之統計基礎作成", "option_1": "部分居民生命表", "option_2": "壽險業經驗生命表", "option_3": "國民生命表", "option_4": "簡易生命表", "answer": 3, "explanation": "國民生命表是由內政部以全國國民或地區居民為對象,依人口普查之統計基礎作成。"}, {"id": 30, "question": "一個投保人壽保險的人,不論在任何意外事故發生時都有經濟上的保障, 這也就是人身保險功能中的", "option_1": "後顧無憂,晚景可恃", "option_2": "保證信用,有利投資", "option_3": "安定就業,穩定發展", "option_4": "以上皆是。", "answer": 2, "explanation": "因有經濟上的保障,因此確定了信用和償債能力。"}, {"id": 31, "question": "有關保險之敘述何者正確?", "option_1": "是一種透過多數人合作以避免風險的經濟保障制度", "option_2": "投保人壽保險的人可以確定她的信用和償還能力", "option_3": "是一種風險避免的方法", "option_4": "以上皆是。", "answer": 2, "explanation": "保險是風險轉移,而非避免風險。人身保險對國家有功能。"}, {"id": 32, "question": "人身保險對國家有哪些功能?A透過再保、拓展外交;B互助共濟、社會 安寧;C健全經營、整合金融;D形成資本、以增國富", "option_1": "ACD", "option_2": "ABCD", "option_3": "BCD", "option_4": "ABC", "answer": 1, "explanation": "形成資本、以增國富；穩定經濟,安定政治；透過再保、拓展外交。健全經營、整合金融屬選項(2)"}, {"id": 33, "question": "人身保險對個人的功能有那些?A安定就業、穩定發展;B享受優惠、稅 捐減免;C保險理財,一舉兩得;D鼓勵儲蓄,平均財富", "option_1": "BCD", "option_2": "ABC", "option_3": "ACD", "option_4": "ABCD。", "answer": 2, "explanation": "人身保險對個人的功能: 後顧無憂,晚景可恃、安定就業,穩定發展、保證信用,有利投資、享受優惠、稅捐減免、保險理財,一舉兩得。D是對社會的功能。"}, {"id": 34, "question": "投資型保險商品的設計,可以有效對抗通貨膨脹;B使得個人資金運用 及退休計畫更具彈性;C降低壽險公司經營風險;D達到金融市場整合功 能", "option_1": "AB", "option_2": "ABD", "option_3": "BD", "option_4": "ABCD。", "answer": 4, "explanation": "結合證券投資的壽險商品(投資型商品),利用盈虧自負、彈性繳費的特性,可以有效對抗通膨,讓資金運用更彈性,並降低壽險公司的經營風險,且達到金融市場整合的功能。"}, {"id": 35, "question": "我國壽險業最新奉准採用作為責任準備金提存標準為", "option_1": "臺灣壽險業第四回經驗生命表", "option_2": "臺灣壽險業第五回經驗生命表死亡率百分之九十", "option_3": "臺灣壽險業第六回經驗生命表", "option_4": "臺灣壽險業第五回經驗生命表", "answer": 3, "explanation": "我國壽險業最新奉准採用作為責任準備金臺灣壽險業第六回經驗生命表。"}, {"id": 36, "question": "家庭模式改變,夫妻皆有所得的家庭持續增加,婦女在家庭經濟上掌握更 多權力,婦女壽險市場", "option_1": "躍居主導地位", "option_2": "逐漸受到重視", "option_3": "無多大改變", "option_4": "日漸式微", "answer": 2, "explanation": "家庭模式改變,夫妻皆有所得的家庭持續增加,婦女在家庭經濟上掌握更多權力,婦女壽險市場逐漸受到重視。"}, {"id": 37, "question": "目前有許多的保險商品是為滿足消費者特殊的需要設計,在消費者的需求 上不僅要求足夠的死亡保障,而且必須依年齡、性別、職業等設計的不同 的保險商品,壽險公司所需採行的措施是將商品", "option_1": "平均化", "option_2": "統一化", "option_3": "細分化", "option_4": "獨立化", "answer": 3, "explanation": "壽險公司將商品細分化,以滿足消費者特殊的需要設計。"}, {"id": 38, "question": "由於科學發達帶來的現代化亦使危險環繞於人們四周,造成公害及一些成 年人特有的疾病如癌症、心臟病、腦血管疾病等死亡率上升,導致何種 保障需要增加?A死亡保障:B退休保障:C家庭健康保障:D意外保 障", "option_1": "ACD", "option_2": "ABCD", "option_3": "ABC", "option_4": "AC", "answer": 4, "explanation": "由於科學發達帶來的現代化亦使危險環繞於人們四周,造成公害及一些成年人特有的疾病如癌症、心臟病、腦血管疾病等死亡率上升,應該要增加死亡保障及意外保障。"}, {"id": 39, "question": "為給客戶最大的方便及最高的利益,壽險業在經營上應該特別重視 A加 強人身保險知識宣導:B業務員教育訓練:提高經營效率,降低成 本:D提高佣金比例,以安定業務員之生活", "option_1": "ABCD", "option_2": "BCD", "option_3": "ABC", "option_4": "ACD", "answer": 3, "explanation": "為給客戶最大的方便及最高的利益,壽險業在經營上應該特別重視加強人身保險知識宣導、業務員教育訓練、提高經營效率,降低成本。"}, {"id": 40, "question": "目前國內保險市場經營壽險業務之組織", "option_1": "除股份有限公司外,亦有相互合作社之組織型態", "option_2": "目前國內保險市場經營壽險業務之組織", "option_3": "有股份有限公司或合作社兩種 組織型態", "option_4": "均為股份有限公司", "answer": 4, "explanation": "目前國內保險市場經營壽險業務之組織均為股份有限公司。"}, {"id": 41, "question": "保險業如何運用金融科技及大數據技術?A用行動裝置締結保險契約,簡 化投保:B透過數據分析細分客戶,創造差異化商品:C設計外溢效果 的商品,提升保戶健康:D理賠連線醫院及第三方驗證,迅速理賠減少 保險詐欺", "option_1": "ABCD", "option_2": "BCD", "option_3": "ABC", "option_4": "ACD", "answer": 1, "explanation": "保險業利用金融科技與大數據分析來用行動裝置締結保險契約,簡化投保、透過數據分析細分客戶 創造差異化商品、設計外溢效果的商品,提升保戶健康、理賠連線醫院及第三方驗證,迅速理賠減少保險詐欺。"}, {"id": 42, "question": "壽險業總公司下的業務部,通常掌理哪些事項?A契約調查;B財務管 理;C人員監督管理;D承保理賠", "option_1": "ABCD", "option_2": "C", "option_3": "ABD", "option_4": "AD", "answer": 4, "explanation": "業務部:掌理承保、理賠、保費、分保、契約調查及分支機構有關業務事項。"}, {"id": 43, "question": "A小額終老保險;B無保單價值準備金之人身保險;C進入年金給付期間 且約定採分期給付的遞延年金保險;D即期年金保險符合主管機關對於保障型及高齡化保險商 品之定義。", "option_1": "ACD", "option_2": "ABD", "option_3": "AD", "option_4": "ABCD", "answer": 4, "explanation": "保障型及高齡化保險商品的認定標準共有四大類,包括即期年金保險、進入年金給付期間且約定採分期給付的遞延年金保險、小額終老保險、無保單價值準備金之人身保險、其他具保單價值準備金之非投資型人壽保險(不含萬能人壽保險)與投保年齡在55歲以下之投資型人壽保險(乙型)。"}, {"id": 44, "question": "有關金融科技創新及大數據應用何者正確?A科技業者透過法律許可方式 進行沙盒實驗不會受到既有法律追訴;B為落實業務員親晤保戶取得其親 簽要保文件,可透過保戶證件掃描搭配生物辨識判別其真實身分;C透過 數據分析協助保險公司統一將消費客群導向一致性業務模式;D結合科技 可設計外溢效果之保險商品,藉以改變要保人的生活作息", "option_1": "AB", "option_2": "CD", "option_3": "ABCD", "option_4": "ABD", "answer": 1, "explanation": "C透過數據分析協助保險公司細分消費客群導向更精準的業務模式;D結合科技可設計外溢效果之保險商品,藉以改變被編險人的生活作息。"}, {"id": 45, "question": "壽險公司為改善經營技術、培養專業人以適應市場發展趨向,有關公司努 力發展之重點何者為非?", "option_1": "經客戶同意透過業務員以行動裝置輸入客戶投保資料,以電子文件替代紙本要保書及相關文件與保險公司締結契約", "option_2": "運用區塊鏈技術簡化理賠調查,快速支付理賠以服務客戶", "option_3": "壽險市場已具備專業人員生存要件,行銷技術將施以個別化的教育訓練以提高行銷效果", "option_4": "設計更符合客戶需要商品,加強創新及多樣化商品設計。", "answer": 3, "explanation": "(3)壽險市場已具備專業人員生存要件,行銷技術將施以系統化的教育訓練以提高行銷效果。"}, {"id": 46, "question": "目前人身保險業所簽發的保單為", "option_1": "僅提供紙本保單", "option_2": "可利用網路投保來簽發電子保單", "option_3": "不限紙本保單", "option_4": "僅選項2、3為真。", "answer": 4, "explanation": "目前人身保險業所簽發的保單可供紙本保單及電子保單。"}, {"id": 47, "question": "人壽保險既是長期契約,隨歲月的遽增,保戶生活環境難免變遷,我們應 掌握保戶生活情形,即時建議A增加保額;B墊繳保險費;C質押借款; D加購附加險", "option_1": "ABD", "option_2": "ABCD", "option_3": "BC", "option_4": "AD", "answer": 4, "explanation": "消費者現在的需求不僅只是要有足夠的死亡保障,而且必須依年齡、性別、職業等不同設計各種不同的保險商品,以滿足他們特殊的需要。"}, {"id": 48, "question": "何者有助於商品創新?A主管機關修正新形態商品認定標準,就部分保險 商品改採核准制以縮短新商品審核流程;B運用數據解析人口老化及消費 習慣改變以細分客群;C運用區塊鏈技術共享資料建立標準流程;D改進 經營技術", "option_1": "ABCD", "option_2": "BCD", "option_3": "ABC", "option_4": "BC。", "answer": 2, "explanation": "A主管機關修正新形態商品認定標準,就部分保險商品改採「備查」而非「核准」以縮短新商品審核流程。"}, {"id": 49, "question": "保險業為適應市場發展的趨向,今後努力的重點有A設計不符需求的商 品;B培養專業人員;C透過金融科技創新簡化保單作業流程提升客戶體 驗;D加強組織的功能", "option_1": "BCD", "option_2": "ABC", "option_3": "ACD", "option_4": "BC。", "answer": 4, "explanation": "選項A應為:設計符合客戶需求的商品。選項D:保險事業的經營著重於業務員訓練、保戶服務、科技的應用以提升經營效率等等,未特別提到加強組織功能,故不選。"}, {"id": 50, "question": "有關金融科技發展與創新實驗條例,何者正確?A主管機關為科技部;B 創新實驗係指經主管機關核准或特許的金融商務實驗;C運用金融科技可 以提升客戶體驗滿足需求;D創新實驗包含科技創新或經營模式創新", "option_1": "ABC", "option_2": "BCD", "option_3": "ABCD", "option_4": "CD。", "answer": 2, "explanation": "A主管機關應為金融監督管理委員會。"}, {"id": 51, "question": "透過數據分析及金融科技技術的提升,可以協助保險業", "option_1": "業務模式更複雜", "option_2": "創造差異化提升競爭力", "option_3": "概括消費群", "option_4": "以上皆生。", "answer": 2, "explanation": "數據分析即金融科技技術的提升,使業務模式更加簡化,並更精確分析客戶所需。"}, {"id": 52, "question": "下列何者錯誤?", "option_1": "業務員行銷時應先強調保障型商品之重要性", "option_2": "壽險業利用金融科技的目的係為完全取代人的服務以利提升經營效率", "option_3": "壽險業應動態配置資產以因應低利率環境", "option_4": "壽險業應加強增員及業務員教育訓練, 防止業務員發生休勤現象。", "answer": 2, "explanation": "壽險業利用金融科技的目的在於提升客戶體驗,使得保險業與客戶間互動更為緊密。"}, {"id": 53, "question": "長年期看護保險未來將成為老年人口的重要需求,其可能的原因包含下列 何者A人類壽命普遍延長;B家庭制度的改變;C社會福利的不足;D對 通貨膨脹的恐懼", "option_1": "ABC", "option_2": "ABD", "option_3": "AC", "option_4": "ABCD。", "answer": 4, "explanation": "全選"}, {"id": 54, "question": "保險業可以運用大數據技術,透過哪些方式建立標準化之服務流程A區塊 鏈結合智能合約;B開發保險經營自動化系統;C精簡保單作業流程;D 監理沙盒實驗", "option_1": "AB", "option_2": "ABC", "option_3": "ABCD", "option_4": "CD。", "answer": 2, "explanation": "現行保險業因金融創新發展及大數據技術之應用下,可透過區塊鍊結合智能合約,精簡保單作業流程以及開發保險經營自動化系統,從定價、核保、到理賠等都能自動化,並建立標準化且錯誤率極小的服務流程。"}, {"id": 55, "question": "人身保險構成的原則符合:A互相扶助的觀念:B公平的危險分擔:C 收支相等的原則:D損失填補的作用哪幾項?", "option_1": "ABD", "option_2": "ABC", "option_3": "ACD", "option_4": "BCD", "answer": 2, "explanation": "人身保險構成的原則為:互相扶助的觀念、公平的危險分擔、收支相等原則。"}, {"id": 56, "question": "近年由於利率不斷下降,人壽保險業各險計算保險費所依據之利率,自民 國89年11月1 日起主管機關指示考量下列哪些因素可由壽險公司自 行訂定?A險種特性:B過去資金運用績效:C未來投資規劃:D 社會 經濟發展趨勢", "option_1": "ABCD", "option_2": "ACD", "option_3": "BCD", "option_4": "AB", "answer": 1, "explanation": "近年由於利率不斷下降,人壽保險業各險計算保險費所依據之利率,自民國89年11月1日起主管機關指示考量險種特性、過去資金運用績效、未來投資規劃、社會經濟發展趨勢,可由壽險公司自行訂定。"}, {"id": 57, "question": "就是將純保險 費扣除已經過的危險保費後的資金提存保管,分別按照保險種類計算,記 載於特設的帳簿", "option_1": "責任準備金", "option_2": "解約金", "option_3": "保單價值準備金", "option_4": "保單紅利", "answer": 1, "explanation": "責任準備金就是將純保險費扣除已經過的危險保費後的資金提存保管,分別按照保險種類計算,記載於特設的帳簿。"}, {"id": 58, "question": "保險法所稱之各種準備金包括:A賠款準備金:B差額準備金:C未滿 期保費準備金:D 特別準備金", "option_1": "ABC", "option_2": "ABD", "option_3": "ACD", "option_4": "BCD", "answer": 3, "explanation": "保險法所稱之各種準備金包括賠款準備金、未滿期保費準備金、特別準備金。"}, {"id": 59, "question": "如要保人選擇以儲存生息之方式給付紅利之後,當被保險人死亡時,保險 人所給付之保險金額較原保險金額為", "option_1": "高", "option_2": "不一定", "option_3": "一樣", "option_4": "低", "answer": 3, "explanation": "要保人選擇以儲存生息之方式給付紅利之後,當被保險人死亡時,保險人所給付之保險金額較原保險金額一樣。"}, {"id": 60, "question": "利率變動型年金於累積期間,保險公司依據要保人支付之保險費,減去何 種費用後依宣告利率計算年金保單價值準備", "option_1": "總保費", "option_2": "附加費用", "option_3": "純保費", "option_4": "以上皆非", "answer": 2, "explanation": "利率變動型年金於累積期間,保險公司依據要保人支付之保險費,減去附加費用後依宣告利率計算年金保單價值準備。"}, {"id": 61, "question": "利率變動型年金乙型於給付期間,保戶可領取之年金金額與下列何者無關", "option_1": "預定死亡率", "option_2": "宣告利率", "option_3": "預定利率", "option_4": "預定附加費用率", "answer": 4, "explanation": "乙型給付期的重要因素:預定死亡率、預定利率、宣告利率。宣告利率為第二年的調整係數帶入的。"}, {"id": 62, "question": "利率變動型年金保險之預定利率,不得高於下列那個期間的當月宣告利 率,且不得為負數?", "option_1": "年金開始給付日", "option_2": "契約起始日", "option_3": "繳費完成日", "option_4": "全部皆非", "answer": 1, "explanation": "利率變動型年金保險之預定利率,不得高於年金開始給付日的當月宣告利率,且不得為負數。"}, {"id": 63, "question": "利率變動型年金之宣告利率不得超過宣告前中央銀行公布之最近一個月中央政府公債次級市場殖利率,且 不得為負數", "option_1": "1年", "option_2": "10年", "option_3": "2年期", "option_4": "5年", "answer": 2, "explanation": "利率變動型年金之宣告利率不得超過宣告前中央銀行公布之最近一個月10年中央政府公債次級市場殖利率,且不得為負數。"}, {"id": 64, "question": "依保險法實施細則規定,人身保險業以計算保險契約簽單保險費之利率及 危險發生率為基礎,並依主管機關規定方式計算之金額為", "option_1": "責任準備金", "option_2": "賠款準備金", "option_3": "保單價值準備金", "option_4": "解約金。", "answer": 3, "explanation": "保險法施行細則第11條規定:「本法所稱保單價值準備金,指人身保險業以計算保險契約簽單保險費之利率及危險發生率為基礎,並依主管機關規定方式計算之準備金。」"}, {"id": 65, "question": "人身保險業自92年元月起銷售之人壽保險單,計算保險費率之生命表為", "option_1": "臺灣壽險業第四回經驗生命表", "option_2": "得自行決定", "option_3": "臺灣壽險業第三回經驗生命表", "option_4": "臺灣壽險業第三回經驗生命表死亡率百分之九十。", "answer": 2, "explanation": "民國92年起銷售之人壽保險單計算保險費基礎得自行決定。"}, {"id": 66, "question": "有關解約金敘述何者正確?A躉繳保單之解約金等於保單價值準備金;B 分期繳費保單繳費期滿後之解約金等於保單價值準備金;C躉繳保單之解 約金小於保單價值準備金;D分期繳費保單繳費期滿後之解約金小於保單 價值準備金", "option_1": "BC", "option_2": "AB", "option_3": "AD", "option_4": "CD。", "answer": 2, "explanation": "C躉繳保單之解約金等於保單價值準備金;D分期繳費保單繳費期滿後之解約金等於保單價值準備金。"}, {"id": 67, "question": "依生命表顯示30歲女性死亡率是千分之三,若有一千名30歲女性各投保 2千萬一年期的死亡保險,則:A每位女性保費是由投保人比例負擔為每人 6萬;B每人應收保費係依據收支相等原則來計算;C保險入應支出的死亡 保險金額總計為6千萬;D一年間死亡人數為6人", "option_1": "ABC", "option_2": "BC", "option_3": "BD", "option_4": "AC", "answer": 1, "explanation": "D死亡率會因性別、職業、健康狀況、體格有所影響,並非絕對人數。"}, {"id": 68, "question": "以往傳統型壽險保單皆屬強制分紅,主要是根據利差、死差做為分紅金額 之計算基礎,在此基礎下其強制分紅之標準為何?", "option_1": "只要出現利差損 or 死差損就必須分紅", "option_2": "同時出現利差益及死差益才分紅", "option_3": "僅出現死差益,即使 有利差損也必須分紅", "option_4": "以上皆非。", "answer": 3, "explanation": "以往傳統型壽險保單屬強制分紅,若僅出現死差益,即使有利差損也必須分紅。"}, {"id": 69, "question": "保險公司對於責任準備金之提存方式往往採取較穩健的作法,採比保單價 值準備金", "option_1": "較低之預定利率", "option_2": "較高之預定利率", "option_3": "較低之預定死亡率", "option_4": "較高之預定死亡率", "answer": 3, "explanation": "保險公司對於責任準備金之提存方式往往採取較穩健的作法,就是規定提存較多的責任準備金,例如採用比保單價值準備金較低之預定利率或較高之預定死亡率來計提。"}, {"id": 70, "question": "首度將台灣壽險業經驗生命表區分為男、女性,並於民國78年6月奉准采 用作為責任準備金提存標準的是台灣壽險業", "option_1": "第四回經驗生命表", "option_2": "第五回經驗生命表", "option_3": "第三回經驗生命表", "option_4": "第二回經驗生命表", "answer": 3, "explanation": "民國78年6月奉准採用作為責任準備金提存標準的是台灣壽險業第三回經驗生命表。利率變動型人壽保險其最低責任準備金之提存由主管機關另定之。"}, {"id": 71, "question": "依現行保險業各種責任準備金提存辦法規定,保險期間超過一年之人壽保 險契約中,有關利率變動型人壽保險其最低責任準備金之提存採", "option_1": "20年滿期生死合險修正制", "option_2": "25年滿期生死合險修正制", "option_3": "20年繳費終身保險修正制", "option_4": "由主管機關另定之。", "answer": 4, "explanation": "利率變動型人壽保險其最低責任準備金之提存由主管機關另定之。"}, {"id": 72, "question": "保戶投保壽險付足多久以上保費或繳費累積達有保單價值準備金時,因故 中止解約時應償付解約金?", "option_1": "半年", "option_2": "二年", "option_3": "僅限躉繳方式", "option_4": "一年。", "answer": 4, "explanation": "保戶投保壽險已付足一年以上保費或繳費累積達有保單價值準備金時,因故中止解約時應償付解約金。"}, {"id": 73, "question": "有關分紅保單分紅方式與發放年度皆應於保單條款充分揭露,以下敘述何 者錯誤?", "option_1": "如遇復效者,當年度經過期間是否分配紅利由保險公司自訂", "option_2": "第一次保單紅利發放保單年度,得由保險公司依商品特性訂定", "option_3": "如遇失效或解約者,各保單年度是否分配紅利由保險公司自訂", "option_4": "如遇被開險人身故,當年度是否分配紅利得由保險公司自行決定。", "answer": 1, "explanation": "如遇復效者,至少應依當年度經過期間比例給付紅利。"}, {"id": 74, "question": "用來作為計算將來要支付死亡保險金的保險費基礎是", "option_1": "預定死亡率", "option_2": "預定利率", "option_3": "預定營業費用", "option_4": "以上皆是。", "answer": 1, "explanation": "用來作為計算將來要支付死亡保險金的保險費基礎是預定死亡率。"}, {"id": 75, "question": "有關定期保險敘述何者正確?A其他因素不變,保險費與死亡率高低成正 比;B其他因素不變,保險費與利率高低成正比;C其他因素不變,保險 費與費用率高低成正比;D其他因素不變,保險費與利率高低成反比", "option_1": "ABC", "option_2": "ACD", "option_3": "BC", "option_4": "AD", "answer": 2, "explanation": "預定死亡率及預定附費用率與保險費成正比;預定利率與保險費成反比。"}, {"id": 76, "question": "1千名45歲的男人各投保1千萬元的死亡保險(保險期間1年),生命表 顯示45歲男人的死亡率是千分之4,則每人的保險費是", "option_1": "5千元", "option_2": "5萬 元", "option_3": "4萬元", "option_4": "4千元。", "answer": 3, "explanation": "依收支相等原則,全體保戶保費總額=全體受益人的保險金額。保險金總額=1,000萬*(1,000人*0.004)=4,000萬。保戶每人保險費=4,000萬/1,000人=4萬。"}, {"id": 77, "question": "民國95年1月1日起訂立超過一年之人壽保險契約,其純保險費較 20 年繳費終身保險為大者,最低準備金提存應採", "option_1": "25年繳費終身保險修正制", "option_2": "1年定期修正制", "option_3": "20年滿期生死合險修正制", "option_4": "20年繳費終身保險 修正制。", "answer": 4, "explanation": "(1)88年1月1日起所訂之人壽保險(2)健康保險(3)87年12月31日前所訂之人壽保險。"}, {"id": 78, "question": "有關生命表敘述何者正確?A又稱為死亡率表;B係利用大數法則統計計 算保險費;C友愛社是最早根據生命表合理計算保險費的組織;D通常采 用1百萬人為統計對象", "option_1": "ACD", "option_2": "AB", "option_3": "ABCD", "option_4": "BC。", "answer": 2, "explanation": "C不是友愛社,為衡平保險社;D採用10萬人為統計對象。"}, {"id": 79, "question": "利率變動型年金計算責任準備金之預定危險發生率,自民國101年7月1 日起以下列何者死亡率為計算基礎", "option_1": "臺灣壽險業第二回年金生命表之90%", "option_2": "臺灣壽險業第二回年金生命表之100%", "option_3": "臺灣壽險業第一回年金生命表之100%", "option_4": "臺灣壽險業第一回年金生命表之90%。", "answer": 2, "explanation": "利率變動型年金計算責任準備金之預定危險發生率自民國101年7月1日起以台灣壽險業第二回年金生命表為基礎,由各公司自行訂定。"}, {"id": 80, "question": "有關人壽保險生命表之敘述何者正確?A生命表又稱為死亡率表;B生命 表係利用收支平等原則統計出來的;C生命表作為人壽保險計算純保費的 根據;D最早依據生命表科學計算保險費的機構是英國倫敦的衡平保險社", "option_1": "ABCD", "option_2": "BCD", "option_3": "ACD", "option_4": "ABC。", "answer": 3, "explanation": "B生命表係利用大數法則統計出來的,就某團體的死亡率,加以統計列成表。收支平等原則是指:全體保戶繳入的保費總額=公司支付給全體受益人的保險金總額"}, {"id": 81, "question": "有關傳統型年金保險費率計算可使用之預定附加費用率標準,何者正確?", "option_1": "繳費期間未滿十年者,費用率不得超過總保費之10%", "option_2": "躉繳者,費用率不得超過總保費之3%", "option_3": "繳費期間滿十五年者,費用率不得超過總保費之11%", "option_4": "繳費期間未滿十五年者,費用率不得超過總保費之15%", "answer": 3, "explanation": "傳統型年金保險費率計算可使用之預定附加費用率標準: 躉繳:費用率<總保費5%；繳費期間未滿10年:費用率<總保費8.5%；繳費期間未滿15年:費用率<總保費9.5%；繳費期間滿15年:費用率<總保費11%"}, {"id": 82, "question": "為了促進人身保險制度能夠健全營運,就必須顧及下列哪幾項要素?A相 互扶助的觀念;B公平的危險分擔;C收支相等原則;D損失填補原則", "option_1": "ABC", "option_2": "AC", "option_3": "BC", "option_4": "ABCD。", "answer": 1, "explanation": "人身保險構成的三原則:相互扶助的觀念、公平的危險分擔、收支相等原則。損害填補原只適用實支實付健康險,指的是被保險人因事故發生的損失,所獲得的賠償,恰好恢復至事故發生前。"}, {"id": 83, "question": "有關人壽保險業經驗生命表,係為下列何者之準繩A壽險業計算責任準備 金;B壽險業釐訂保險費率;C壽險業評價業務營運績效", "option_1": "AB", "option_2": "B", "option_3": "A", "option_4": "ABC。", "answer": 4, "explanation": "人壽保險業經驗生命表,係以壽險業計算責任準備金、壽險業釐訂保險費率、壽險業評價業務營運績效為裝繩。"}, {"id": 84, "question": "有關保險費所累積的「責任準備金」之敘述何者錯誤?", "option_1": "透過專家的經營運作,獲利往往較一般利息優厚", "option_2": "對保戶而言既是儲蓄又是投資", "option_3": "保戶必須承擔投資風險,沒有確保一定利潤", "option_4": "保險公司可用來投資運用孳息。", "answer": 3, "explanation": "(3)責任準備金與投資風險無關"}, {"id": 85, "question": "有關分紅保險契約之敘述何者錯誤?", "option_1": "契約條文應明訂分紅方式及紅利決算基準日", "option_2": "以紅利購買增額繳清保險的部分,保險公司得依實際狀況決定分紅與否", "option_3": "變更為減額繳清保險後應維持其分紅保單之特性", "option_4": "變更為展期定期保險後應維持其分紅保單之特性。", "answer": 4, "explanation": "(4)變更成展期定期保險後,得由各保險公司依實際狀況決定分紅或不分紅保單。"}, {"id": 86, "question": "自民國94年1月1日起至101年6月30日銷售之傳統年金保險計算保 險費之預定危險發生率,採用之年金生命表以死亡率多少為基礎?", "option_1": "80%~100%", "option_2": "0.9", "option_3": "100%~120%", "option_4": "由各公司依主管機關規定自行訂定。", "answer": 4, "explanation": "自民國94年1月1日起至101年6月30日銷售之傳統年金保險計算保險費之預定危險發生率,是以年金生命表為基礎,由各公司自行決定。"}, {"id": 87, "question": "死亡率之計算基礎為A年初之死亡人數;B年度內之死亡人數;C年初之 生存人數;D年末之生存人數", "option_1": "BC", "option_2": "BD", "option_3": "AC", "option_4": "BCD。", "answer": 1, "explanation": "死亡率計算公式為:年度內之死亡人數/年初之生存人數。"}, {"id": 88, "question": "要保人解約對於保險人的影響,何者錯誤?", "option_1": "造成逆選擇的不良影響", "option_2": "保險人通常會再酌收費用作為補償", "option_3": "解約對於保險人費用分擔未產生任何影響", "option_4": "造成資金運用不利的不良影響", "answer": 3, "explanation": "提前解約,會對保險公司造成逆選擇、資金運用不利及費用無法攤回等不良影響,保險公司通常會酌收費用作為補償。(3)解約對於保險人將產生額外成本。"}, {"id": 89, "question": "責任準備金的計算與提存牽涉複雜的精算技術與法令規定,會因保險契約 之保險期間;B繳費方式;C契約生效日;D繳費期間而有差別。", "option_1": "ABD", "option_2": "ABCD", "option_3": "BD", "option_4": "ABC", "answer": 2, "explanation": "責任準備金的計算與提存,會因保險公司決算日及各種保險契約的保險期間、繳費期間、契約生效日、繳費方法各不相同。"}, {"id": 90, "question": "目前壽險業責任準備金的提存是以「臺灣壽險業第五回經驗生命表」之死 亡率的若干百分比為基礎?", "option_1": "0.8", "option_2": "1.1", "option_3": "0.9", "option_4": "100%。", "answer": 4, "explanation": "目前壽險業責任準備金的提存是以「臺灣壽險業第五回經驗生命表」之死亡率100%為基礎。"}, {"id": 91, "question": "經驗生命表編製的目的為A確定被保險人的死亡機率;B提存責任準備金 的基礎;C使壽險業者能公平、合理地釐訂費率;D計算解約金的基礎", "option_1": "ABC", "option_2": "BD", "option_3": "BC", "option_4": "BCD。", "answer": 3, "explanation": "經驗生命表編製的目的:應為壽險業釐訂保險費計算責任準備金和評價業務營運績效。"}, {"id": 92, "question": "人身保險業自92年元月起銷售之人壽保險單,計算保險費率之生命表為", "option_1": "臺灣壽險業第三回經驗生命表死亡率百分之九十", "option_2": "以調降保險費率至90%計之", "option_3": "得自行決定", "option_4": "臺灣壽險業第三回經驗生命表。", "answer": 3, "explanation": "92/1/1 起銷售的人壽保險單,保險公司得自行決定使用第三回或第四回的生命表計算保險費率。"}, {"id": 93, "question": "下列敘述何者為是", "option_1": "生存機率與死亡機率間無任何關係", "option_2": "因同一時點某人的生存機率等於1減死亡機率,所以年金生命表可以依據目前壽險業界所採的經驗表去推算", "option_3": "在同一時點下,某人之死亡與生存是互斥的", "option_4": "在同一時點下,某人之生存機率與死亡機率之合會小於1。", "answer": 3, "explanation": "(1)兩者間相加為1(2)年金生命表是依據預定危險發生率訂定(4)相加為1。"}, {"id": 94, "question": "決定壽險商品價格時,須兼顧哪些原則?A相互扶助的觀念;B公平的危 險分擔;C收支相等原則;D利潤最大化原則", "option_1": "ABC", "option_2": "BCD", "option_3": "ACD", "option_4": "ABCD。", "answer": 1, "explanation": "為了促進人身保險制度能健全營運,必須兼顧三大原則:相互扶助的觀念、公平的危險分擔、收支相等原則。"}, {"id": 95, "question": "依主管機關核定,自民國81保單年度起,每一保單年度終了應分配當年 度保單紅利係指下列哪幾項之和?A利差紅利;B費差紅利;C死差紅利", "option_1": "ABC", "option_2": "AC", "option_3": "BC", "option_4": "AB。", "answer": 2, "explanation": "民國92/12/31以前保單紅利來源=利差紅利+死差紅利。"}, {"id": 96, "question": "分紅保單是保險公司每年經營與投資所產生的A利差益;B死差損;C費 差益;D死差益,下列哪些項目分紅回饋給保戶?", "option_1": "ACD", "option_2": "ABCD", "option_3": "AB", "option_4": "BCD。", "answer": 1, "explanation": "保單紅利利源三因素:利差益、死差益、費差益。"}, {"id": 97, "question": "自民國92年起壽險業銷售之分紅保單,保單分紅的依據", "option_1": "死差益", "option_2": "利差紅利", "option_3": "該險經營損益", "option_4": "費差益。", "answer": 3, "explanation": "民國92年起壽險業銷售之分紅保單保單分紅依據為該險經營損益。"}, {"id": 98, "question": "年金受領人為多數人,各該受領人皆生存時,保險人依約給付年金如有其 中一人死亡保險人即不再給付年金,稱之", "option_1": "連生遺族年金", "option_2": "連生共存年金", "option_3": "最後生存者年金", "option_4": "定期生存年金", "answer": 2, "explanation": "連生共存年金金受領人為多數人,各該受領人皆生存時,保險人依約給付年金如有其中一人死亡,保險人即不再給付年金。"}, {"id": 99, "question": "自109.7.1 起訂定宣告利率應注意那些事項?", "option_1": "應考量區隔資產帳戶固定收益債券利息收益率", "option_2": "不得低於保證利率", "option_3": "應考量實際資產配置及投資準則訂定宣告利率", "option_4": "以上皆是", "answer": 4, "explanation": "自109.7.1 起訂定宣告利率應考量區隔資產帳戶固定收益債券利息收益率、不得低於保證利率、應考量實際資產配置及投資準則訂定宣告利率。"}, {"id": 100, "question": "「生存保險」如被保險人在保險期間內死亡時,保險公司", "option_1": "依保險金額賠償", "option_2": "退還保費", "option_3": "不負賠償責任", "option_4": "退還保單價值準備金", "answer": 3, "explanation": "生存保險定義為被保險人於保險期間內仍生存時,保險公司依契約所約定金額給付保險金,被保險人於保險期間內死亡,保險公司不負賠償責任。"}, {"id": 101, "question": "有關重大疾病保險之敘述何者錯誤", "option_1": "販售型態可直接附加在主契約或單獨之附加特約", "option_2": "保戶一旦罹患重大疾病可領取一筆保險金作為醫療之補助", "option_3": "目前市場多針對7種重大疾病提供保障", "option_4": "為維持商品開發設計之彈性,傷病定義無須明確化或標準化", "answer": 4, "explanation": "為使醫療保險商品之疾病項目及定義有遵循一致標準,減少理賠爭議,並維持商品開發設計之彈性,壽險公會所報「嚴重特定傷病疾病項目及定義」及「癌症保險」之「癌症定義」經金管會核定,將傷病定義明確化、標準化。"}, {"id": 102, "question": "關於傷害失能 11級79項新增第80項,以下敘述何者正確?", "option_1": "鼻未缺損,而鼻機能暫時遺存顯著障害者", "option_2": "鼻未缺損,而鼻機能永久遺存顯著障害者", "option_3": "鼻有缺損,而鼻機能暫時遺存顯著障害者", "option_4": "鼻有缺損,而鼻機能永久遺存顯著障害者", "answer": 2, "explanation": "108年新增鼻末缺損、但鼻機能永久顯著障害者,屬第11級失能會理賠5%,該給付標準自109年1月1日起增為第80項。"}, {"id": 103, "question": "所謂健康保險是指為彌補因 A傷害:B疾病:C酗酒:D健康檢查,造 成人們失去工作能力或就醫,而導致經濟上的損失所設計出來的保險", "option_1": "AB", "option_2": "BD", "option_3": "AC", "option_4": "ABD", "answer": 1, "explanation": "健康保險的定義為因疾病或傷害導致經濟損失,給付保險金。"}, {"id": 104, "question": "現行之長期照顧保險商品之示範條款中未明訂免責期間,惟保險公司得依 市場需求,於契約條款中增訂不得高於", "option_1": "6個月", "option_2": "3個月", "option_3": "5個月", "option_4": "2個月之免責期間", "answer": 1, "explanation": "長期照顧保險的免責期不得高於6個月。"}, {"id": 105, "question": "下列何者非投資型保險商品之種類?", "option_1": "萬能年金", "option_2": "變額萬能壽險", "option_3": "變額壽險", "option_4": "變額年金", "answer": 1, "explanation": "投資型商品的種類:變額壽險、變額萬能壽險、變額年金。"}, {"id": 106, "question": "投資型保險商品的相關費用,費用改變之通知期限由保險公司訂明,並至 少應於幾個月前通知要保人", "option_1": "3個月", "option_2": "1個月", "option_3": "4個月", "option_4": "2個月", "answer": 1, "explanation": "投資型商品費用改變之通知由保險公司訂明,並至少應於3個月前通知要保人。"}, {"id": 107, "question": "下列何者非團體保險與個人保險主要的差異?", "option_1": "以團體為基礎", "option_2": "保險金額由個人自由選擇", "option_3": "須規定最低參加人數及比例", "option_4": "保費以實際損失經驗為考量", "answer": 2, "explanation": "團體保險之特性:以團體為主,只有一張保單、需規定最低參加人數、保險金額非由個人決定、保費以實際損失經驗為考量。"}, {"id": 108, "question": "為避免投保微型保單所產生的道德危險,有關該險之風險控管機制何者為 非?", "option_1": "失能保險金得指定及變更受益人", "option_2": "保險業者須對承擔之風險妥善處理 or 適當安排再保險", "option_3": "身故保險金受益人之指定及變更以被保人之家屬 or 其法定繼承人為限", "option_4": "個別被保險人投保微型保險超過累計投保金額限制時,保險業者得自行決定處理方式", "answer": 1, "explanation": "微型保單失能保險金及傷害醫療保險金受益人為被被保險人本人,保險業不得受理其指定或變更。"}, {"id": 109, "question": "下列何者為小額終老保險與微型保險之差異?A前者為一般商業保險,後 者為政策性保險:B前者僅能投保四次,後者得於累計投保金額限制內多 次投保:C前者高齡投保時繳費期限越短保費越高,後者為彈性繳費方 式:D前者投保對象有年齡限制,後者投保對象有收入、職業或身分別 限制", "option_1": "BCD", "option_2": "BC", "option_3": "ABCD", "option_4": "AD", "answer": 1, "explanation": "A兩者皆為政策性保險。"}, {"id": 110, "question": "有關全民健康保險敘述何者正確?A保險事故包含疾病、傷害、生育;B 以強制投保為原則;C主管機關為中央健康保健署;D保險人為衛生福利 部", "option_1": "ABCD", "option_2": "AB", "option_3": "ABD", "option_4": "B。", "answer": 2, "explanation": "C主管機關為衛生福利部、D保險人為衛生福利部中央健康保險署。"}, {"id": 111, "question": "依國家發展委員會人口推估報告書之說明,何者有誤?", "option_1": "我國已邁入高齡社會", "option_2": "我國將進入超高齡社會", "option_3": "仰賴人口係指0至14歲的人口", "option_4": "青壯年人口係指15歲至64歲的人口。", "answer": 3, "explanation": "仰賴人口為0-14歲及65歲以上人口合計。"}, {"id": 112, "question": "長期照顧保險之被保險人經專科醫師診斷後判定符合長期照顧狀態者給予 保險給付,而長期照顧狀態係指被保險人符合?", "option_1": "持續6個月以上失智且依臨床失智量表評估達中度以上者", "option_2": "依巴氏量表判定3個月內有移位、如廁及沐浴等3項障礙者", "option_3": "依臨床專業評量表診斷判定5個月內有進食及移位等2項障礙者", "option_4": "以上皆是。", "answer": 2, "explanation": "(1)不得高於6個月(3)要有3項障礙者以上。"}, {"id": 113, "question": "「臺灣地區傷害保險個人職業分類表」將職業危險程度分成對從事特別危險職業者另歸入未承保類。", "option_1": "七類", "option_2": "四類", "option_3": "三類", "option_4": "五類", "answer": 3, "explanation": "「臺灣地區傷害保險個人職業分類表」將職業危險程度分成六類。"}, {"id": 114, "question": "「利率變動型年金與利率固定型年金保險商品之敘述,何者為非?", "option_1": "利率變動型年金及利率固定型年金保費繳納皆可躉繳、非躉繳,惟利率固定型年金非躉繳為定期定額", "option_2": "利率變動型年金附加費用由公司自行訂定,利率固定型年金附加費用依繳費期間介於5%-11%", "option_3": "利率變動型年金身故保障為解約金,利率固定型年金身故保障為保單價值準備金", "option_4": "利率變動型年金採固定 or 變動金額年金給付,利率固定型年金採固定金額年金給付。", "answer": 3, "explanation": "(3)利率變動型年金身故保障為保單價值準備金金額；利率固定型年金身故保障為退還已繳保費或解約金或保單價值準備金。"}, {"id": 115, "question": "利率固定型年金保險商品的繳費方式有A躉繳;B非躉繳(定期定額);C 非躉繳(不定期不定額)", "option_1": "BC", "option_2": "ABC", "option_3": "AB", "option_4": "AC。", "answer": 3, "explanation": "利率固定型年金保險商品的繳費方式有躉繳及非慢(定期定額)。"}, {"id": 116, "question": "民國94年1月至101年6月底止販售之利率變動型年金計算責任準備金 之預定危險發生率,係以年金生命表死亡率之為基礎。", "option_1": "1", "option_2": "0.9", "option_3": "100%~120%", "option_4": "自行訂定", "answer": 2, "explanation": "94年1月1日至101年6月30日之預定危險發生率之責任準備金年金生命表死亡率之90%為基礎。"}, {"id": 117, "question": "有關傷害保險何者正確?A職業類別第2類之保險費率是第1類別的1.5 倍;B個人傷害保險意外失能發生率為意外死亡發生率之40%;C個人傷 害保險重大事故特別準備金提存率為2%;D被保險人失能程度屬第2級 失能者,保險公司按失能保險金額之90%給付保險金", "option_1": "BD", "option_2": "ACD", "option_3": "BCD", "option_4": "ABCD。", "answer": 1, "explanation": "A為1.25倍;C個人傷害保險重大事故特別準備金提存率為1%。"}, {"id": 118, "question": "有關外溢效果保險的特色,何者錯誤?", "option_1": "保險公司為掌握保戶生活習慣及取得相關醫療數據,需精進大數據分析", "option_2": "商品設計有實物給付型及非實物給付型2種", "option_3": "保險公司須強化資訊安全之風險控管,以免保戶個資外洩", "option_4": "保險費計算係採總體考量,保費更公平合理,且能引導保戶規避風險,降低整體社會成本。", "answer": 4, "explanation": "(4)保險費計算考量個體差異,保費更公平合理,且能引導保戶規避風險,降低整體社會成本。"}, {"id": 119, "question": "業務員行銷投資型保險商品時,何者為非?", "option_1": "應主動出示投資型保險商品業務員資格測驗合格證及人身保險業務員登錄證", "option_2": "不得勸誘保戶以保單借款 or 貸款方式購買", "option_3": "當銷售予65歳以上保戶未能取得其同意者,免除銷售過程之錄音 or 錄影", "option_4": "應交付保戶保險商品說明書並詳細解說。", "answer": 3, "explanation": "(3)當銷售予65歳以上保戶時應當錄音或錄影,或以電子設備留存相關作業軌跡,由適當單位或主管人員覆審,確認客戶投保適當性後使得承保。"}, {"id": 120, "question": "有關旅行平安保險何者正確?A醫療費用之給付包含日額型及實支實付 型;B發生意外傷害醫療時,給付最高以保險金額1/10為限;C屬於國 際性保險,承保對象以實際從事旅遊的國內、國外旅客為限;D保險期間 原則上最長以180天為限,旅客如有需要經保險公司同意可延長", "option_1": "BC", "option_2": "ABD", "option_3": "BCD", "option_4": "ACD。", "answer": 3, "explanation": "A醫療費用之給付以實支實付為限。"}, {"id": 121, "question": "利率變動型年金於年金給付期間,預定利率不得高於何時之當月的宣告利 率?", "option_1": "契約到期日", "option_2": "給付開始日", "option_3": "保費繳完日", "option_4": "契約生效日。", "answer": 2, "explanation": "利率變動型年金於年金給付期間,預定利率不得高於年金給付開始日當月的宣告利率,且不得為負數。"}, {"id": 122, "question": "有關政府推動的長期照顧保險,何者錯誤?", "option_1": "屬於一種福利政策且為基本保障,可考慮加保一般商業長期照顧保險商品", "option_2": "由政府、雇主及民眾共同負責保險費", "option_3": "屬於強制性社會保險,保險人為衛生福利部", "option_4": "目前提供的服務皆屬實物給付。", "answer": 3, "explanation": "長期照顧保險保險人為中央健康保險署。"}, {"id": 123, "question": "以下何者為微型保險所指之經濟弱勢或特定身分者?A依農民健康保險條 例投保農民健康保險之被保險人;B符合社會救助法規定低收入戶或中低 收入戶之家庭成員;C符合身心障礙者權益保障法定義之身心障礙者;D 符合老人福利法規定領取中低收入老人生活津貼之老人", "option_1": "ABC", "option_2": "ABD", "option_3": "ABCD", "option_4": "BCD。", "answer": 3, "explanation": "以上皆為微型保險所指之經濟弱勢或特定身分者。"}, {"id": 124, "question": "下列何者非團體保險之保險金額決定基礎?", "option_1": "職位年資", "option_2": "員工的工作性質", "option_3": "薪資等級", "option_4": "團體定額。", "answer": 2, "explanation": "團體保險之保險金額決定基礎為薪資等級、職位年資、團體定額。"}, {"id": 125, "question": "有關學生團體保險之敘述,何者為非?", "option_1": "目前保險費由教育部邀集具獨立性的相關代表組成審議會逐年審議", "option_2": "學生團體保險之身故保險金受益人為被保險人之法定繼承人,醫療保險金之受益人為投保之學生", "option_3": "設置學生團體保險專戶專款專用,盈虧責任由政府負責", "option_4": "幼兒參加本保險,於保險契約訂立時已在疾病中,保險人對該項疾病不負給付保險金責任。", "answer": 4, "explanation": "「高級中等以下學校學生及教保服務機構幼兒團體保險條例」第13條第3項:學生及幼兒參加本保險,於保險契約訂立時,已在疾病中者,保險人對是項疾病,負給付保險金之責任。但高級中等學校進修部及國民補習學校學生,保險人不負給付保險金額之責任。"}, {"id": 126, "question": "有關傳統型年金保險費率計算可使用之預定附加費用率標準,何者正確?", "option_1": "繳費期間滿十五年者,費用率不得超過總保費之15%", "option_2": "繳費期間未滿十五年者,費用率不得超過總保費之15%", "option_3": "躉繳者,費用率不得超過總保費之5%", "option_4": "繳費期間未滿十年者,費用率不得超過總保費之10%。", "answer": 3, "explanation": "(1)繳費期間滿十五年者,費用率不得超過總保費之11%(2)繳費期間未滿十五年者,費用率不得超過總保費之9.5%(4)繳費期間未滿十年者,費用率不得超過總保費之8.5%。"}, {"id": 127, "question": "下列何者屬於投資型保險商品規範,由保險人接受要保人以保險契約委任 全權決定運用之投資標的之運用範圍?A公債、國庫券;B台灣存託憑 證;C外國有價證券;D結構型商品", "option_1": "ABC", "option_2": "BCD", "option_3": "ABD", "option_4": "AC。", "answer": 1, "explanation": "D結構型商品非全權委託。"}, {"id": 128, "question": "投資型保險商品的相關費用有A解約費用;B保費費用;C申購手續費; D贖回及轉換費用", "option_1": "CD", "option_2": "BCD", "option_3": "ABCD", "option_4": "BC.", "answer": 3, "explanation": "投資型保險商品的相關費用一、前置費用:如保費費用二、保單相關費用:如保單管理費、保險成本三、投資相關費用:如投資標的申購手續費、贖回及轉換費用四、後置費用:如解約費用、部分提領費用五、其他費用。"}, {"id": 129, "question": "由第三人訂立之年金保險契約,未經被保險人書面承諾,並約定保險金 額,其保險契約", "option_1": "效力未定", "option_2": "無效", "option_3": "得撤銷", "option_4": "有效。", "answer": 4, "explanation": "由第三人訂立之年金保險契約,未經被保險人書面承諾,並約定保險金額,其保險契約有效。"}, {"id": 130, "question": "下列敘述何者正確?", "option_1": "保險公司承保傷害保險時,需檢查被保險人的身體", "option_2": "定期保險通常以1年、5年、10年為期,亦有以要保人到達終身年齡為約定期限", "option_3": "外勤業務員的危險性與每天坐辦公室的行政人員危險性差不多", "option_4": "最後生存者年金之受領人有2人以上,只要其中1人仍生存,保險人就繼續依原定金額給付年金至最後1位受領人死亡為止。", "answer": 4, "explanation": "(1)保險公司承保傷害保險時,不需檢查被保險人的身體,以被保險人的職業類別為準。(2)定期保險通常以1年、6年、10年、15年或20年為期,亦有以要保人到達一定年齡為約定期限(3)舉例:賽車駕駛員或鷹架安裝工人的危險性,都比每天坐辦公室的公務員高很多。"}, {"id": 131, "question": "現行長期照顧保險有關認知功能障礙之認定,何者正確?", "option_1": "被保險人經專科醫師診斷判定該障礙為終身無法治癒者,仍受限於免責期間的約定", "option_2": "認知功能障礙常運用簡易智能測驗(MMSE)進行評估", "option_3": "被保險人依臨床失智量表(CDR)評估達嚴重程度以上者", "option_4": "被保險人經專科醫師診斷判定達5個月以上仍為持續失智狀態。", "answer": 4, "explanation": "(1)被保險人經專科醫師診斷辦定該障礙為終身無法治癒者,不受限於免責期間的約定(2)認知功能障礙常運用簡易智能測驗(MMSE)進行評估-108年11月金管會取消(3)被保險人依臨床失智量表(CDR)評估達中度程度以上者(4)被保險人經專科醫師診斷判定達5個月以上仍為持續失智狀態-不得高於6個月。"}, {"id": 132, "question": "為避免投保微型保險所產生的道德危險,有關該險之風險控管機制何者為 非?", "option_1": "身故保險金受益人僅以被保險人家屬為限", "option_2": "保險業者須對承擔之風險妥善處理 or 適當安排再保險", "option_3": "失能保險金受益人不得受理指定 or 變更", "option_4": "個別被保險人投保微型保險超過累計投保金額限制時,保險業者得自行決定處理方式。", "answer": 1, "explanation": "身故保險金受益人之指定及變更,以被保險人家屬或其法定繼承人為限。"}, {"id": 133, "question": "勞工保險之普通事故保險費,被保險人應負擔之比率為", "option_1": "0", "option_2": "0.3", "option_3": "0.2", "option_4": "10%。", "answer": 3, "explanation": "勞工保險之普通事故保險費之被保險人負擔20%、雇主負擔70%、政府負擔10%。"}, {"id": 134, "question": "目前學生團體保險之保險給付項目有A失能及身故保險金;B燒燙傷及須 重建手術保險金;C集體中毒保險金;D生活補助金", "option_1": "BCD", "option_2": "ABCD", "option_3": "ACD", "option_4": "ABC。", "answer": 2, "explanation": "學生團體保險給付項目:失能及身故保險金、燒燙傷及須重建手術保險金、集體中毒保險金、生活補助金、住院醫療保險金、傷害門診保險金。"}, {"id": 135, "question": "依保險法第13條規定,人身保險包含A傷害保險;B投資型保險;C健 康保險;D年金保險", "option_1": "BD", "option_2": "ACD", "option_3": "CD", "option_4": "ABCD。", "answer": 2, "explanation": "人身保險包含:人壽保險、傷害保險、健康保險、年金保險。"}, {"id": 136, "question": "台灣地區人口年齡結構因醫藥科學發達,死亡率降低而使得平均壽命延 長,近幾年來更因結婚率降低與生育率降低,高齡化人口所佔比例逐漸增 加,請問:當生育率降低與高齡化人口增加會帶來什麼樣的影響?", "option_1": "就業人口經濟負擔減輕", "option_2": "經濟成長率上升", "option_3": "延後退休", "option_4": "以上皆是。", "answer": 3, "explanation": "(1)就業結構的變化及高齡化導致就業人口經濟負擔增加(2)高齡化人口所佔比例逐漸增加,勞動參與率下降導致經濟成長率下降。"}, {"id": 137, "question": "高齡化社會的來臨是目前社會人口發展的趨勢,購買解決此項嚴重的社會問題。", "option_1": "傷害保險", "option_2": "年金保險", "option_3": "定期保險", "option_4": "人壽保險", "answer": 2, "explanation": "年金保險定義:對個人在特定期間或生存期間繼續提供定期性給付金額的制度或契約;因此對老年生活費能彌補社會福利的不足。"}, {"id": 138, "question": "就業保險之保險費率,目前為被保險人月投保薪資之", "option_1": "0.05", "option_2": "0.01", "option_3": "0.03", "option_4": "4%。", "answer": 2, "explanation": "由勞動部按被保險人之月投保薪資1%至2%擬定,目前為1%。"}, {"id": 139, "question": "年金保險中如被保險人身故,仍有未支領之年金餘額時,該餘額", "option_1": "其半數應作為被保險人之遺產", "option_2": "應作為被保險人之遺產", "option_3": "應作為要保人之遺產", "option_4": "不得作為被保險人之遺產。", "answer": 4, "explanation": "一般終身年金只要被保險人死亡,保險人即無給付義務;若是確定年金且被保險人死亡後尚有未領金額,保險人仍應繼續給付年金金額予應得之人。"}, {"id": 140, "question": "有關生存保險之敘述,下列何者為是?A僅在被保險人於保險期滿後仍生 存時給付保險金;B被保險人在保險期間內死亡,保險公司無給付保險金 的責任,但退還所繳保費;C滿期保險金之來源,部分來自保險公司資 本;D保險公司為準備被保險人保險期滿生存時給付保險金,需有責任準 備金的提存", "option_1": "ABCD", "option_2": "AD", "option_3": "ABD", "option_4": "AB。", "answer": 2, "explanation": "B不退還保費;C滿期金來源為自身所繳保費及其孳息、保險期間死亡被保險人所繳之保險費。"}, {"id": 141, "question": "有關國民年金制度敘述何者有誤?", "option_1": "提供老年年金、生育給付、身心障礙年金、遺屬年金及喪葬給付等保障", "option_2": "投保對象為年滿20歲以上未滿65歲於國內設有戶籍的國民", "option_3": "被保險人死亡時按其月投保金額一次發給5個月喪葬給付", "option_4": "投保對象須為沒有裝加軍保、公教保、勞保及農保的國民。", "answer": 2, "explanation": "(2)正確為投保對象為年滿25歲,未滿65歲於國內設有戶籍。"}, {"id": 142, "question": "勞工保險之職業災害保險給付項目不包括A傷病及醫療;B失業及年老; C失能及死亡;D生育及避孕", "option_1": "AB", "option_2": "BD", "option_3": "ABC", "option_4": "AD。", "answer": 2, "explanation": "勞工保險之職業災害保險給付項目為職災、傷病、失能、死亡。"}, {"id": 143, "question": "個人傷害保險短期費率一個月期為年繳保費", "option_1": "百分之十二", "option_2": "百分之二十", "option_3": "十二分之一", "option_4": "百分之十五。", "answer": 4, "explanation": "個人傷害保險短期費率一個月期為年繳保費的15%。"}, {"id": 144, "question": "現行年金保險主要型態來自於A人壽保險單示範條款;B利率變動型年金 保險單示範條款;C個人即期年金保險單示範條款;D個人遞延年金保險 單示範條款", "option_1": "ABCD", "option_2": "ABD", "option_3": "BCD", "option_4": "ACD。", "answer": 3, "explanation": "A題目為年金保險,與人壽保險單示範條款無關。"}, {"id": 145, "question": "有關投資型保險商品敘述何者錯誤?", "option_1": "專設帳簿的資產於保險公司破產時,得不受保險公司之債權人扣押", "option_2": "變額萬能壽險指彈性繳納保險費,保單現金價值有高低起伏但不可能降低至零", "option_3": "變額壽險指固定繳費,但保險金額隨著投資績效而變動", "option_4": "變額年金保險指保險費及年金額度都會變動。", "answer": 2, "explanation": "(2)變額萬能壽險指彈性繳納保險費,保單現金價值有高低起伏但可能降低至零,因為投資型保險商品盈虧自負。"}, {"id": 146, "question": "台灣地區目前正面臨老年問題發生,所以下列哪些商品成為老年人口的重 要需求?A長年期的健康保險;B長期照顧保險;C年金保險;D定期壽 險", "option_1": "ABC", "option_2": "BC", "option_3": "AB", "option_4": "ABCD", "answer": 1, "explanation": "老年生活費的準備應該以「在工作期間自作準備」及「個人自我累積養老年金」，故選A長年期的健康保險、B長期照顧保險、C年金保險,以防因退休或疾病,致沒有收入的窘境。"}, {"id": 147, "question": "年金保險的預定附加費用率與相同繳費期間之養老保險的附加費用率比較 會", "option_1": "相同", "option_2": "較高", "option_3": "較低", "option_4": "不一定。"
