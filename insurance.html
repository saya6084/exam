, "answer": 3, "explanation": "附加費用是指保險公司經營的成本。經營壽險的成本較高。(可能會有抽樣體檢)壽險年金保險的預定附加費用率與相同繳費期間之一般壽險的附加費用率較低。"}, {"id": 148, "question": "投資型保險商品非全權委託的投資標的可包含A證券投資信託基金受益憑 證;B共同信託基金受益證券;C各國中央政府發行之公債、國庫券;D 可轉讓定期存單", "option_1": "ABD", "option_2": "ABCD", "option_3": "ABC", "option_4": "BCD。", "answer": 3, "explanation": "投資型保險商品非全權委託的投資標的不包含可轉讓定期存單。"}, {"id": 149, "question": "有關投資型保險商品銷售之規範,下列何者錯誤?", "option_1": "招攬人員於銷售投資型保險商品2個月前曾協助同一保戶辦理貸款者,該員不得支領推介貸款報酬", "option_2": "當保費資金來源為貸款,原招攬人員應於承保前對客戶進行電訪並保留錄音紀錄以供查核", "option_3": "招攬人員須另具備投資型保險商品測驗合格且完整變更登錄者", "option_4": "保險業應訂定客戶紛爭處理程序納入內部控制作業之處理程序,辦理內部稽核及自行查核。", "answer": 2, "explanation": "(2)當保費資金來源為貸款、解約 or 保單解款之客戶,應另指派非銷售通路人員,於銷售商品商品且同意承保前辦理電話訪問,並應保留錄音紀錄以供查核。"}, {"id": 150, "question": "利率變動型年金在累積期間,保險公司依據要保人交付之保險費,減去附 加費用後,依何種利率計算年金保單價值準備金", "option_1": "預定利率", "option_2": "宣告利率", "option_3": "定存利率", "option_4": "以上皆是。", "answer": 2, "explanation": "利變型年金累積期間的重要因素:附加費用、宣告利率(甲/乙型一樣)。給付期間的重要因素:甲型-預定死亡率、預定利率;乙型-預定死亡率、預定利率、宣告利率。死亡率考題上可能替換成:年金生命表、年紀、性別。"}, {"id": 151, "question": "保險業結合科技設計外溢效果的保險商品,可以為客戶達到下列哪些效 果?A改變被保險人生活作息;B提升民眾健康;C透過穿戴裝置了解個 人健康狀況;D輔助保險決策", "option_1": "BC", "option_2": "ACD", "option_3": "ABCD", "option_4": "AC", "answer": 3, "explanation": "保險業結合科技設計外溢效果的保險商品,可以為客戶達到下列效果:改變被保險人生活作息、提升民眾健康、透過穿戴裝置了解個人健康狀況、輔助保險決策。"}, {"id": 152, "question": "利率變動型年金乙型在年金給付開始第一次,以當時何者換算年金金額。", "option_1": "年齡", "option_2": "年金生命表", "option_3": "預定利率", "option_4": "以上皆是。", "answer": 4, "explanation": "給付期間的重要因素:甲型-預定死亡率、預定利率;乙型-預定死亡率、預定利率、宣告利率。乙型給付期的重要因素:預定死亡率、預定利率、宣告利率。宣告利率為第二年的調整係數帶入的,考題問第一次,所以答案為預定利率、預定死亡率。死亡率在考題上可能為年金生命表、年紀、性別。"}, {"id": 153, "question": "依國家發展委員會人口推估報告書之說明,下列何者有誤?", "option_1": "我國自民國107年起邁入高齡社會", "option_2": "預估於民國115年將進入超高齡社會", "option_3": "仰賴人口係指0至14歲的人口", "option_4": "青壯年人口係指15歲至64歲的人口。", "answer": 3, "explanation": "(3)仰賴人口:0-14歲以及65歲以上人口。"}, {"id": 154, "question": "何者符合微型保險經濟弱勢條件?A無配偶且全年度綜合所得在35萬元 以下者;B夫妻兩人全年綜合所得在70萬元以下家庭之家庭成員;C特 殊境遇家庭包含弱勢單親家庭之家庭成員;D屬於內政部工作所得補助方 案實施對象家庭之家庭成員", "option_1": "ACD", "option_2": "AB", "option_3": "ABCD", "option_4": "BCD。", "answer": 3, "explanation": "經濟弱勢者以收入標準、職業、身分別為界定方式,除左列選項以外尚包含:原住民/漁民/農保被保險人/社會福利慈善團體服務對象/身心障礙者。"}, {"id": 155, "question": "利率變動型年金甲型在給付期間之責任準備金係以年金金額之預定利率與 依『新契約責任準備金利率採自動調整精算公式』計算之利率計算。", "option_1": "最小值", "option_2": "平均值", "option_3": "最大值", "option_4": "以上皆可", "answer": 1, "explanation": "甲型:預定利率與精算公式最小值；乙型:依當時預定利率為準。"}, {"id": 156, "question": "長期照顧保險之被保險人經專科醫師診斷後依診斷書判定符合長期照顧狀 態者,給予保險給付,所謂長期照顧狀態係指被保險人經專科醫師診斷符 合下列哪些情形者", "option_1": "持續6個月以上失智並有分辨上障礙且依臨床失智量表評估中等以上", "option_2": "依臨床專業評量表診斷判定5個月內有進食及移位障礙", "option_3": "依巴氏量表判定3個月內有移位、如廁及沐浴等3項障礙", "option_4": "以上皆是。", "answer": 3, "explanation": "所謂長期照顧狀態係指被保險人經專科醫師診斷符合下列二項情形之一者，1.生理功能障礙:指被保險人經專科醫師依巴氏量表診斷判定不得高於6個月以上,其進食、移位、如廁、沐浴、平地行動及更衣等六項日常生活自理能力持續存有3項以上障礙。2.認知功能障礙:指被保險人經專科醫師依巴氏量表診斷判定不得高於6個月以上,仍維持續失智狀態,並有時間、場所及人物三項分辨障礙之2項分辨障礙。"}, {"id": 157, "question": "外溢效果的保險,在人身保險現行商品之設計有哪些方式A保戶自主健康 管理;B保險公司提供抵減保險費;C保戶依保險公司要求使用穿戴型裝 置即可領得健康促進獎勵金;D目前僅有實物給付型商品", "option_1": "BC", "option_2": "ABC", "option_3": "AB", "option_4": "ABCD", "answer": 3, "explanation": "A自主健康管理方式與保險結合;C若保富身體健康檢查或利用穿戴裝置達到一定的標準,B保單便啟動未來保費減費機制、或領到健康促進獎勵金或提供健康服務諮詢等方式回饋給保戶;D目前設計有實物給付型及非實物給付型2種。"}, {"id": 158, "question": "有關學生團體保險之敘述何者錯誤?", "option_1": "辦理本保險如有不足,由專戶填補、保險人不負盈虧之責", "option_2": "主管機關為金融監督管理委員會", "option_3": "被保險人為學生,身故保險金受益人為被保險人之法定繼承人", "option_4": "保險期間每次一年且與學年之起訖日一致為原則。", "answer": 2, "explanation": "(2)主管機關在中央為教育部,在直轄市為直轄市政府,在縣(市)為縣(市)政府。"}, {"id": 159, "question": "所謂團體一年定期壽險之「平均保險費率」是依A被保險團體的危險程 度;B每一被保險員工的年齡;C每一被保險員工的保險金額;D每一被 保險員工的性別;所計算出的保險費總和除以全體被保險員工保險金額總 和計算", "option_1": "ABD", "option_2": "BCD", "option_3": "ABCD", "option_4": "ABC-", "answer": 2, "explanation": "所謂團體一年定期壽險之「平均保險費率」是按訂定本契約或續保時,依要保人的危險程度及每一被保險人的性別、年齡、保險金額所算出的保險費總和除以全體被保險人保險金額總和計算。『被保險團體』的危險程度→應改為『要保人』，答案為2。"}, {"id": 160, "question": "團體保險已漸為一般公司行號、企業團體所利用;目前壽險公司所推出之 團體保險不包括哪一種", "option_1": "團體責任保險", "option_2": "團體傷害保險", "option_3": "團體健康保險", "option_4": "團體人壽保險。", "answer": 1, "explanation": "團體保險的種類:團體壽險、團體傷害保險、團體健康保險、團隊年金保險。"}, {"id": 161, "question": "依據「保險業辦理微型保險業務應注意事項」規定,微型保險附加費用率 上限為", "option_1": "純保費之10%", "option_2": "總保費之15%", "option_3": "純保費之15%", "option_4": "總保費之10%。", "answer": 2, "explanation": "依據「保險業辦理微型保險業務應注意事項」規定,微型保險附加費用率上限為總保費之15%。"}, {"id": 162, "question": "有關年金保險之敘述何者錯誤?", "option_1": "社會年金保險的種類依保險事故別分為年老、失能及遺屬三種年金", "option_2": "年金給付以被保險人生存為條件者即具有保險功能", "option_3": "年金給付不以個人或被保險人的生存為條件者,稱為確定年金", "option_4": "連生共存年金中多名年金受領人,若僅其中1人生存,保險人仍應依約給付年金。", "answer": 4, "explanation": "(4)連生共存年金為年金受領人有2人以上,各該人皆生存時,保險人依約給付年金。"}, {"id": 163, "question": "下列何者為招攬人員銷售優體壽險商品應有之行為?", "option_1": "完成優體壽險商品之在職教育訓練始進行銷售", "option_2": "於招攬時即承諾消費者可適用優體費率", "option_3": "與其他同業之優體壽險費率、核保項目、標準進行不當比較", "option_4": "通過優體壽險商品測驗且完成登錄者始進行銷售。", "answer": 1, "explanation": "保險公司應慎選招攬人,事先完成必要之在職訓練,且不得於招攬時即承諾消費者可適用優體費率。也不得與其他同業之優體壽險費率、核保項目、標準進行不當比較(4)無須另行辦理登錄。"}, {"id": 164, "question": "利率變動型年金之責任準備金於累計期間,是以何者為基礎提存", "option_1": "保單價值準備金全額", "option_2": "所繳保費總和", "option_3": "純保費總和", "option_4": "以上皆是。", "answer": 1, "explanation": "利變年金責任準備金於累積期間,以年金保單價值準備金全額提存。"}, {"id": 165, "question": "有關勞工退休金採新制者何者有誤?", "option_1": "勞工退休請領時須併入個人綜合所得申報", "option_2": "每月提撥率得由勞工自由決定", "option_3": "勞工自願提繳的部分得自當全度個人綜合所得總額中全數扣除", "option_4": "勞工按月提繳退休金,可選擇儲存於勞保局設立之勞工退休金個人專戶。", "answer": 2, "explanation": "(2)應是雇主每月依「勞工退休條例」負擔勞工退休金提繳率不得低於勞工每月工資6%。且勞工得在其每月工資6%範圍內,自願另行提繳退休金。"}, {"id": 166, "question": "工業化的結果,各種意外事故劇增,促使人民重視保障,各公司在保險商 品設計上亦以提高保障機能為主,其商品種類以業務成長迅速。", "option_1": "生死合險", "option_2": "儲蓄保險", "option_3": "定期保險及終身保險", "option_4": "生存保險", "answer": 3, "explanation": "事故加劇,故以提高保障機能為主,因此需增加死亡保障。死亡保險分為定期保險及終身保險。"}, {"id": 167, "question": "年金保險契約之生存年金部分", "option_1": "得有除外責任", "option_2": "不得有除外責任期間,但得有除外責任原因", "option_3": "不得有除外責任原因,但得有除外責任期間", "option_4": "不得有除外責任。", "answer": 4, "explanation": "年金保險生存年金為保險人承諾在被保險人生存期間定期支付約定金額的一種契約,故年金保險不得有除外責任。"}, {"id": 168, "question": "以下何者為是?", "option_1": "人身保險四種類型中包含責任保險", "option_2": "人壽保險中包括生存保險、死亡保險及健康保險", "option_3": "將保險區分財產保險及人身保險兩類是依據我國保險法第十三條規定", "option_4": "人身保險包括責任保險及人壽保險。", "answer": 3, "explanation": "(1)(4)人身保險四種類型:人壽、傷害、健康、年金；(2)人壽保險中包括生存保險、死亡保險及生死合險。"}, {"id": 169, "question": "年金給付開始日為民國94年以前之利率變動型年金保險,下列何者可能 被引用作為計算保險費之基礎?", "option_1": "年金生命表死亡率之90%", "option_2": "年金生命表死亡率之130%", "option_3": "年金生命表死亡率之110%", "option_4": "年金生命表死亡率之70%。", "answer": 3, "explanation": "94年以前以年金生命表死亡率之100%-120%為基礎。"}, {"id": 170, "question": "利率變動型年金甲型於給付期間,保戶可領取之年金金額與下列何者有 關:A預定死亡率;B預定附加費用率;C預定利率;D宣告利率", "option_1": "AC", "option_2": "AB", "option_3": "AD", "option_4": "ABC。", "answer": 1, "explanation": "利率變動型年金甲型於給付期間,是以預定死亡率、預定利率來換算定額年金。"}, {"id": 171, "question": "團體保險內每位員工對每單位保險金額應繳的保險費通常係以何種費率乘 以保險金額總額計算?", "option_1": "分級保險費率", "option_2": "平均保險費率", "option_3": "平衡保險費率", "option_4": "團體保險費率。", "answer": 2, "explanation": "團體保險是以每位員工對每單位保險金額應繳的保險費,通常係以平均保險費率乘以保險金額總額來計算。"}, {"id": 172, "question": "利率變動型年金保險費率相關規範中,下列何者為不可採行者?", "option_1": "預定利率不得高於年金給付開始日當月之宣告利率", "option_2": "宣告利率不得超過宣告前中央銀行公布之最近一個月10年期中央政府公債次級市場殖利率", "option_3": "宣告利率下限無規定,且得為負值", "option_4": "預定附加費用率由公司自行訂定,並明訂於契約條款中。", "answer": 3, "explanation": "(3)宣告利率不得為負數。"}, {"id": 173, "question": "有關人身保險業務員登錄之敘述何者錯誤?", "option_1": "未依規定期限完成換證之業務員,所屬公司應停止其招攬行為", "option_2": "登錄證分為第1年至第5年度之登錄證與第6年度起登錄證二種", "option_3": "業務員自初次登錄日起每滿5年須完成教育訓練並辦理換證", "option_4": "未依規定期限完成換證之業務員,其登錄資格及測驗合格證號將被取消。", "answer": 2, "explanation": "(2)登錄證期限五年,故每五年需換證因此該選項不正確。"}, {"id": 174, "question": "有關實支實付醫療保險控管何者正確?", "option_1": "每一被保險人向同一保險人投保實支實付保險張數上限為3張", "option_2": "整體保險業於醫療保險及傷害醫療保險投保1張銜接原給付限額具自負額商品,該張可不列入張數計算", "option_3": "適用於由要保單位負擔保費之旅平險、微型保險所含之實支實付型傷害醫療保險", "option_4": "以上皆是。", "answer": 2, "explanation": "(1)每一被保險人投保實支實付醫療保險(含日額 or 實支實付給付擇一之商品)張數上限為3張,不分是否為同一保險人(3)不包括:學生團體保險、團體保險、旅平險、微型保險。"}, {"id": 175, "question": "利率變動型年金甲型在年金給付開始時,以當時之換算定額年金。", "option_1": "預定利率", "option_2": "年金生命表", "option_3": "年齡", "option_4": "以上皆是", "answer": 4, "explanation": "利率變動型年金甲型:年金給付開始時,以當時之預定死亡率(年齡、性別、年金生命表)、及預定利率換算定額年金。"}, {"id": 176, "question": "下列敘述何者錯誤?", "option_1": "長期照顧保險給付可分為一筆 or 分期給予固定金額二種", "option_2": "被保險人經專科醫師診斷判定認知功能障礙為終身無法治癒者,仍須符合契約條款約定之期間限制才可符合認知功能障礙", "option_3": "若契約條款明定免責期間,被保險人的生理功能障礙 or 認知功能障礙狀態須超過免責期,保險公司才會給付長期照顧保險金", "option_4": "外溢效果的保險可以達到事前預防風險的效益。", "answer": 2, "explanation": "經專科醫師診斷判定生理或認知功能障礙為終身無法治癒者,不受多少個月之限制。"}, {"id": 177, "question": "我國壽險業目前將傷害保險失能程度分為?", "option_1": "6級28項", "option_2": "11級79項", "option_3": "11級80項", "option_4": "12級80項。", "answer": 3, "explanation": "我國壽險業目前將傷害保險失能程度分為11級80項。"}, {"id": 178, "question": "有關年金保險敘述何者正確?A可分為社會性年金保險及商業性年金保險;B年金保險契約必須記載給付方法;C未滿15歲之未成年人不得投保年金保險;D受益人不得為被保險人本人", "option_1": "BC", "option_2": "ABCD", "option_3": "A", "option_4": "AB。", "answer": 4, "explanation": "C未滿15歲之未成年人得投保年金保險;D年金受益人於被保險人生存期間為被保險本人。"}, {"id": 179, "question": "下列何者屬投資型保險商品規範,由保險人接受要保人以保險契約委任全權決定運用之投資標的之運用範圍A公債、國庫券;B台灣存託憑證;C 外國有價證券;D結構型商品", "option_1": "BCD", "option_2": "AC", "option_3": "ABC", "option_4": "ABD", "answer": 3, "explanation": "結構型商品為非全委。"}, {"id": 180, "question": "利率變動型年金躉繳者附加費用率不得超過總保費之", "option_1": "0.05", "option_2": "0.085", "option_3": "由公司自行訂定", "option_4": "10%。", "answer": 3, "explanation": "利率變動型年金躉繳者附加費用率由公司自行訂定。"}, {"id": 181, "question": "保險業務員如有下列何種情事,所屬公司得處以停止招攬或撤銷登錄之處分?A對要保人、被保險人或第三人以誇大不實之宣傳、廣告或其他不當之方法為招攬者;B以誇大不實之方式就不同保險契約內容作不當之比較;C以不當之方法慫恿要保人終止有效契約而投保新契約致使要保人受損害者;D不參加商品說明會、專業課程訓練或參加該訓練成績不合格者", "option_1": "BD", "option_2": "ABCD", "option_3": "ABC", "option_4": "AC。", "answer": 3, "explanation": "不參加商品說明會不為撤銷登錄事項。"}, {"id": 182, "question": "有關小額終老保險何者正確?A主約、附約的預定附加費用率皆不得超過總保費之10%;B保險費約為其他終身壽險的七成左右;C主約、附約個 別被保險人之投保年齡加計繳費期間之數值最高皆不超過90;D主約、 附約皆不得有增額或加倍給付之設計,並以承保單一保險事故為限", "option_1": "BCD", "option_2": "ABC", "option_3": "ABCD", "option_4": "BC。", "answer": 1, "explanation": "正確答案是1。A.附約預定附加費用率不得超過總保費之15%。"}, {"id": 183, "question": "利率變動型年金保險費的計算基礎包括A預定危險發生率;B預定附加費 用率;C宣告利率;D通貨膨脹率", "option_1": "ABC", "option_2": "AB", "option_3": "ABD", "option_4": "BC。", "answer": 1, "explanation": "利率變動型年金保險費的計算基礎為預定危險發生率、宣告利率、預定利率、預定附加費用率。"}, {"id": 184, "question": "有關利率變動型年金之敘述何者為非?", "option_1": "乙型於給付期間通常無紅利給付", "option_2": "若採分紅方式設計應明訂計算方式及給付方式", "option_3": "於累積期間不論甲型 or 乙型,均無紅利給付", "option_4": "甲型於給付期間僅採不分紅方式設計。", "answer": 4, "explanation": "累積期:甲乙均無紅利。給付期:甲型可採分紅與不分紅,乙型無紅利。"}, {"id": 185, "question": "利率變動型年金保險乙型,其給付期間第二年度開始可領取之年金金額係 以前一年度可領取之年金金額乘以當年度而得之。", "option_1": "調整係數", "option_2": "浮動係數", "option_3": "風險係數", "option_4": "變動係數", "answer": 1, "explanation": "累積期間:依宣告利率累積保價金。給付期間:甲型固定,乙型依照調整係數。"}, {"id": 186, "question": "年金生命表的死亡率越高,其保險費", "option_1": "不一定", "option_2": "沒有影響", "option_3": "越高", "option_4": "越低。", "answer": 4, "explanation": "年金保險以被保險人生存為給付條件,故年金生命表的死亡率越高,其保險費越低。"}, {"id": 187, "question": "下列那些是預收第一次保險費相當額送金單記載事項?A 保險種類:B 繳費方法:C保單預定利率:D要保人、被保險人姓名與地址", "option_1": "ABD", "option_2": "BCD", "option_3": "ABC", "option_4": "AB", "answer": 1, "explanation": "第一次保險費相當額送金單內容應包含:要/被保險人地址、姓名、保險種類、繳費方式、保險金額、保險費。"}, {"id": 188, "question": "下列何項為保險公司授權業務員之招攬範圍?A說明填寫要保書注意事 項:B轉送要保文件及保險單:C收取續期保險費:D解釋保險商品內容 及保險單條款", "option_1": "AB", "option_2": "ABD", "option_3": "ABC", "option_4": "ABCD", "answer": 2, "explanation": "保險公司授權業務員之招攬範圍:說明填寫要保書注意事項、轉送要保文件及保險單、解釋保險商品內容及保險單條款。"}, {"id": 189, "question": "業務員應充分了解要保人及被保險人並據實向公司提出報告,何者為業務 員應評估內容?A.要保人及被保險人之投保目的及需求;B.客戶承擔風險 之能力及財務狀況;C.身故受益人與要保人關係是否為配偶、直系親屬或 指定法定繼承人;D.要保人及被保險人是否投保其他商業保險", "option_1": "ABC", "option_2": "BD", "option_3": "ABD", "option_4": "ABCD", "answer": 3, "explanation": "C業務員應注意要保人與被保險人及被保險人與受益人之關係。"}, {"id": 190, "question": "哪些是保戶申請要保前應該提供給保戶之資料?A條款樣本;B人壽保險 投保人須知;C保單紅利試算表;D保險商品和定存利率比較表", "option_1": "ABCD", "option_2": "AB", "option_3": "BCD", "option_4": "ABC。", "answer": 2, "explanation": "僅有商品條款樣本、「人壽保險投保人須知」應提供給保戶。"}, {"id": 191, "question": "下列何者非壽險公司承保新契約時契約選擇之程序?", "option_1": "業務員的選擇", "option_2": "核保人員的選擇", "option_3": "公司體檢醫師的選擇", "option_4": "生存調查人員的選擇。", "answer": 4, "explanation": "壽險公司承保新契約時,契約選擇的程序可以分為三個階段(一)業務員的選擇(二)公司體檢醫師的選擇(三)核保人員的選擇。"}, {"id": 192, "question": "保戶以現金繳納保險費 or 開立支票之發票人非為要保人、被保險人及受益 人,保險公司", "option_1": "應於次月底前全數聯繫要保人", "option_2": "不須做任何處理", "option_3": "僅現金繳納應於次月底前全數聯繫要保人,通知其繳費情況", "option_4": "應於次月底前依比率選取要保人抽樣聯繫。", "answer": 4, "explanation": "有權代收保費之人代收之保費為現金或開立支票之發票人非為要保人、被保險人及受益人,應於次月底前以當月開立送金單、預收保費證明 or 收據比率之1%或不低於500件抽樣選取要保人聯繫。"}, {"id": 193, "question": "以支票繳納相當於第一次保費全部 or 一部分金額時,若該支票退票則保險 契約", "option_1": "有效,但保險公司得催繳保險費", "option_2": "不發生效力", "option_3": "效力終止", "option_4": "停效。", "answer": 2, "explanation": "若以支票繳納相當於第一次保費全部或一部分金額時,如保險公司不同意承保,或該支票退票或未兌現時,則保險契約不發生效力。"}, {"id": 194, "question": "契約危險選擇應考量之項目?A被保險人的收入;B要保人的投保動機; C過保險人職業;D被保險人的既往症、現症、家族遺傳病史", "option_1": "BCD", "option_2": "ABCD", "option_3": "CD", "option_4": "BD", "answer": 2, "explanation": "以上皆為契約危險選擇應考量的項目。"}, {"id": 195, "question": "保險業授權代收保險費之人包括A保險公司授權之所屬業務員B保險經 紀人 or 其所屬保險業務員C保險公司未登錄之收費員D保險代理人 or 其所屬保險業務員", "option_1": "AD", "option_2": "ABC", "option_3": "ABCD", "option_4": "ABD。", "answer": 1, "explanation": "保險業授權所屬保險業務員、保險代理人或其所屬保險業務員代收保險費。"}, {"id": 196, "question": "要保人在繳付相當於第一次保險費的金額時,保險契約", "option_1": "即時成立", "option_2": "等到保險公司同意承保時才成立", "option_3": "於契約成立後,效力溯自繳費日開始起算", "option_4": "僅第2及第3選項為是。", "answer": 4, "explanation": "要保人在繳付相當於第一次保險費的金額時,保險契約要等到保險公司同意承保時才成立,但是契約成立後,效力溯自繳費日開始起算。"}, {"id": 197, "question": "依保險業授權代收保險費應注意事項之規定,何者為非?", "option_1": "保險業授權所屬保險業務員、保險經紀人及保險代理人 or 其所屬保險業務員代收保險費", "option_2": "有權代收保險費之人未將所領之逾期送金單繳回者,保險業不得再發給新單", "option_3": "有權代收保險費之人代收以現金繳納保險費,單張保單當期以新台幣5萬元為上限", "option_4": "以上皆非。", "answer": 1, "explanation": "(1)保險業授權所屬保險業務員、保險代理人或其所屬保險業務員代收保險費。"}, {"id": 198, "question": "有關保險業授權代收保險費之相關規定,何者為非?", "option_1": "保戶以支票繳納第一次保險費發生支票退票 or 未兌現時,保險契約不發生效力", "option_2": "保險業授權保險經紀人代收保險費,應要求保險經紀人訂定控管機制並納入保險經紀合約", "option_3": "保險業應規定代收保險費之繳回期限,如以業務員本人 or 他人開立的非即期支票繳納則屬挪用保費情形", "option_4": "業務員填寫送金單時發生塗改,不論塗改處為何,該送金單一律無效。", "answer": 2, "explanation": "授權代收保險費之人:保險業授權所屬保險業務員、保險代理人或其所屬保險業務員,無保險業授權保險經紀人。"}, {"id": 199, "question": "契約危險選擇應考量之項目?A被保險人的收入;B要保人的投保動機; C被保險人職業;D被保險人的既往症、現症、家族遺傳病史", "option_1": "CD", "option_2": "ABCD", "option_3": "BD", "option_4": "BCD。", "answer": 2, "explanation": "業務員在契約選擇上應注意之事項:1.身體上的危險:被保險人的既往症、現症、家族遺傳病史;2.環境上的危險:被保險人職業;3.道德上的危險:被保險人的收入、要保人的投保動機。"}, {"id": 200, "question": "下列何者錯誤?", "option_1": "投保金額不同則體檢項目不同", "option_2": "業務員必要時可協助被保險人隱瞞既往症以利核保", "option_3": "體檢時業務員應避免做出妨礙體檢之行動", "option_4": "業務員必須親自會晤被保險人", "answer": 2, "explanation": "(2)應據實地把現在的健康狀況、既往症寫出來。"}, {"id": 201, "question": "為避免有人藉保險謀取不法利益,業務員招攬時應留意A保單中死亡受益 人指定是否為被保險人血親之外第三人;B要保人、被保險人無收入而投 保高額保險金;C要保人透露近期有向多家保險公司購買保險商品;D保 險人近期有多筆小額理賠", "option_1": "ABC", "option_2": "BCD", "option_3": "ACD", "option_4": "ABCD。", "answer": 4, "explanation": "有違常理的情形,要對真實的情況瞭解並探究其原因,以免有投機取巧的情事發生。"}, {"id": 202, "question": "下列何者係壽險業務員招攬時應注意事項?A受益人是否被拒保;B投保 金額是否過高至有道德風險之虞;C受益人對被保險人是否有保險利益; D要保人是否有家族遺傳疾病", "option_1": "BC", "option_2": "B", "option_3": "ABCD", "option_4": "BCD。", "answer": 2, "explanation": "A保障標的是被保險人,不須核保受益人體況; C應了解要保人對被保險人是否具有保險利益; D不需檢視要保人是否有家族遺傳疾病。"}, {"id": 203, "question": "下列何者正確?A要保人如尚未成年,皆須經過法定代理人簽章同意契約 始生效;B被保險人之職業須確實填寫;C要保人 or 被保險人不能親自填 寫者,保險契約得由業務員代為填寫再由保戶親自簽名;D保險契約保戶 親自簽名處如為保戶親自按摺印,其意思表示及效力與親簽一樣", "option_1": "ABD", "option_2": "BD", "option_3": "BC", "option_4": "ABC。", "answer": 2, "explanation": "A未成年人已婚者,為有行為能力之人。C如要保人或被保險人不能親自填寫,得由其家屬代寫,但要註明經過,填寫完成,仍應由要保人及被保險人親自簽章。"}, {"id": 204, "question": "要保人以自己為被保險人投保人壽保險,業務員對其家族應注意", "option_1": "是否有人患有遺傳性疾病", "option_2": "是否有人從事危險職業", "option_3": "家人是否已投保", "option_4": "以上皆應注意。", "answer": 1, "explanation": "契約選擇程序,身體上的危險包含:被保險人所患之既往症、現症及家族遺傳疾病,所以選項(1)是對的。(2)環境上的危險,重點在被保險人,不是家族。(3)應該是要注意家人是否為受益人。"}, {"id": 205, "question": "下列何者是保險公司核保的參考依據?A醫師的體檢報告書;B調查員的 調查報告;C保戶填寫的要保文件;D業務員報告書", "option_1": "BCD", "option_2": "ABD", "option_3": "ABCD", "option_4": "ABC。", "answer": 3, "explanation": "保險公司核保的參考依據有醫師的體檢報告書、調查員的調查報告、保戶填寫的要保文件、業務員報告書。"}, {"id": 206, "question": "當A被保險人投保的保險金額相當高;B被保險人過去有未能承保的紀 錄;C被保險人過去有增加其他條件仍不能承保的紀錄;D要保人與被保 險人非同一人,業務員應洽經驗較豐富公司之專任醫師 or 特約醫師擔任體檢工作", "option_1": "ABC", "option_2": "ACD", "option_3": "BCD", "option_4": "ABCD", "answer": 1, "explanation": "D要保人與被保人非同一人,不是體檢必要條件。"}, {"id": 207, "question": "壽險業務員招攬必須親自會晤受益人;B親自會晤被保險人;C取得由 要、被保人親簽之文件;D於要保書上親自簽名;以上何者正確?", "option_1": "ABCD", "option_2": "ABC", "option_3": "CD", "option_4": "BCD。", "answer": 4, "explanation": "壽險業務員招攬必須會見本人做登記,有關「要保人」與「被保險人」之簽名應由其本人親簽,以避免日後引起糾紛。"}, {"id": 208, "question": "壽險業授權代收保險費之人包括A保險公司授權之所屬業務員;B保險經 紀人 or 其所屬保險業務員;C保險公司未登錄之收費員;D保險代理人 or 其所屬保險業務員", "option_1": "AD", "option_2": "ABC", "option_3": "ABCD", "option_4": "ABD。", "answer": 1, "explanation": "壽險業授權代收保險費之人包括保險業務員、保險代理人或其所屬保險業務員。"}, {"id": 209, "question": "有關業務員協助保戶填寫要保書之敘述,何者有誤?", "option_1": "業務員應事先提供「人壽保險投保人須知供保戶閱讀", "option_2": "保戶於要保書上所填基本資料應與戶籍上登記資料相同", "option_3": "業務員招攬報告書須先會見保戶本人,再由業務員親自填寫", "option_4": "要保書中保戶住所 or 居所地址得先暫填業務員之住所 or 居所。", "answer": 4, "explanation": "(4)要保書中保戶駐所或居所地址不得為業務員之住所或居所。"}, {"id": 210, "question": "依保險業授權代收保險費應注意事項之規定,下列敘述何者為非", "option_1": "保險業對於以支票繳納保費者,應限制發票人不得為有權代收保險費之人", "option_2": "送金單上不得增列警語增加保戶責任", "option_3": "保險業應限制代收保險費人領取送金單之份數", "option_4": "保戶繳費後收到的送金單係為已遺失 or 毀損者,保險業不得付法律責任。", "answer": 4, "explanation": "(4)保戶繳費後收到的送金單係為已遺失或毀損者,仍應對該保戶付法律責任。"}, {"id": 211, "question": "何者是防止道德風險之重要資料,應慎重處理A被保險人體格檢查書;B 被保險人告知書;C被保險人之生存調查單;D業務員填寫的招攬報告書", "option_1": "ABCD", "option_2": "AD", "option_3": "ABC", "option_4": "AB。", "answer": 1, "explanation": "全選。"}, {"id": 212, "question": "保險業授權代收保險費之人收取以下列何種方式繳納保險費時,應同時交 付保戶送金單、預收保費證明 or 收據?A現金;B信用卡授權書;C支 票;D劃撥匯款單", "option_1": "AC", "option_2": "ABCD", "option_3": "AB", "option_4": "ABC", "answer": 1, "explanation": "有權代收保險費之人收取以現金或支票方式繳納保險費時,應同時交付保戶送金單、預收保費證明或收據。"}, {"id": 213, "question": "哪些是保戶申請要保前應該提供給保戶之資料?A條款樣本;B人壽保險 投保人須知;C商品說明書;D保單紅利試算表", "option_1": "BCD", "option_2": "AB", "option_3": "ABCD", "option_4": "ABC。", "answer": 4, "explanation": "在客戶填寫要保文件前,須將有關商品條款樣本、人壽保險投保人須知、商品說明書提供給保戶,使保戶對契約各項內容及規定有充分了解。"}, {"id": 214, "question": "下列何者非保險業授權代收保險費之人?", "option_1": "保險代理人", "option_2": "保險代理人所屬業務員", "option_3": "保險經紀人所屬業務員", "option_4": "保險公司授權之所屬業務員。", "answer": 3, "explanation": "保險業授權代收保險費之人:保險代理人或其所屬業務員、保險公司授權之所屬業務員。"}, {"id": 215, "question": "業務員接受客戶投保時,必須", "option_1": "親自會晤受益人", "option_2": "親自會晤保險人", "option_3": "親自會晤被保險人", "option_4": "以上皆是。", "answer": 3, "explanation": "業務員接受客戶投保時,必須親自會晤被保險人。"}, {"id": 216, "question": "人壽保險行銷過程依序為A解決:B問題:C決心:D 滿意:E接近", "option_1": "E BADC", "option_2": "BA ECD", "option_3": "E BACD", "option_4": "B E ACD", "answer": 3, "explanation": "人壽保險行銷過程:接近→問題→解決→決心→滿意。"}, {"id": 217, "question": "一般家庭的應急預備金不包括", "option_1": "喪亡處理預備金", "option_2": "醫療預備金", "option_3": "子女教育金", "option_4": "借款償還金", "answer": 3, "explanation": "應急預備金應包含:醫療預備金、喪亡處理預備金、借款償還金、臨時預備金。"}, {"id": 218, "question": "保單活化轉換生效後,請問下列何者情況下,不得申請保單轉換回復?", "option_1": "轉換後保險契約已開始給付保險金 or 已有申請理賠紀錄", "option_2": "原保險契約之保險事故已發生始主張撤銷該次轉換", "option_3": "自轉換生效日起三年後始主張撤銷該次轉換", "option_4": "以上皆是", "answer": 4, "explanation": "保單活化轉換生效後,除下列情形,保險公司應提供回復原契約之權利:(1)轉換後保險契約已開始給付保險金或已有申請理賠紀錄(2)原保險契約之保險事故已發生始主張撤銷該次轉換(3)自轉換生效日起三年後始主張撤銷該次轉換。"}, {"id": 219, "question": "有關保單活化之敘述何者正確?A舊保單需投保時間夠長已累積有保單價 值準備金;B若舊保單之保單價值準備金不足轉換支付新契約保費時,則 無法轉換;C保單活化制度對保戶百利無一害;D屬於功能性轉換,將他 益型保單轉化成自益型保單", "option_1": "ACD", "option_2": "AD", "option_3": "ABD", "option_4": "ABC。", "answer": 2, "explanation": "B如產生差額需補繳保費或由保險公司退還差額。C保單轉換後保單預定利率變低,保費成本相對較高,部分保單透過解約並扣除稅額後可能比保單轉換更划算,且轉換後的醫療險、年金險或長照險所提供的保障,會因為保戶的生存時間長短,或保單理賠給付的方式不同,可能出現領到的總金額低於轉換前的壽險保單,所以並不是百利無一害。"}, {"id": 220, "question": "有關保單轉換前進行變更適合度評估,何者正確?A確認的對象除了要保 人還包括被保險人;B目的係透過保險配置使保單活化更能符合現況需 求;C應考量轉換新保單之預定利率較舊保單高,保費成本相對較高;D 舊保單透過解約並扣除稅額後可能比保單轉換更划算", "option_1": "ABD", "option_2": "BD", "option_3": "AB", "option_4": "ABCD。", "answer": 1, "explanation": "C應考量轉換新保單之預定利率較舊保單低,保費成本相對較高。"}, {"id": 221, "question": "保單轉換生效後發生何種情事,保險公司不應提供回復契約之權利?", "option_1": "保險公司無不實引導轉換,且舊保單之保險事故已發生始主張撤銷該次轉換", "option_2": "轉換後新保單已開始給付保險金 or 已有申請理賠紀錄", "option_3": "保險公司無不實引導轉換,且轉換生效日起3年後始主張撤銷該次轉換", "option_4": "以上皆是。", "answer": 4, "explanation": "以上皆為保單轉換生效後,保險公司不應提供回復契約之情事。"}, {"id": 222, "question": "保險規劃書是向顧客說明保險公司提供的保障內容,用來解決顧客家庭經 濟問題最有效的方式,該規劃書最少應具備A契約內容;B保險名稱及特 色;C退佣比例;D給付範圍及金額", "option_1": "BD", "option_2": "AB", "option_3": "ABD", "option_4": "ABCD.", "answer": 3, "explanation": "保險規劃書最少應具備保險名稱及特色、契約內容以及給付範圍及金額。"}, {"id": 223, "question": "有關保單活化之敘述,何者錯誤?", "option_1": "保戶可考量實際需求僅作部分轉換,但轉換後則無法再轉回舊保單", "option_2": "保單活化目的使保戶重新檢視自身保單所需,以提升退休生活的保障", "option_3": "利用舊保單之保單價值準備金轉換投保醫療險、長照險 or 年金保險", "option_4": "保戶限向同一壽險公司之舊保單身故保險金轉換成新契約之生前養老金。", "answer": 1, "explanation": "(1)保戶可考量實際需求僅作部分轉換,轉換後除部分情形外,保險公司應提供回復契約之權利。"}, {"id": 224, "question": "編製生活規劃書的目的在幫助客戶", "option_1": "準備子女所需要的預備金", "option_2": "了解父母所需要的費用", "option_3": "趁早準備配偶所需要的費用", "option_4": "預定目標,估列將來需要的各種費用。", "answer": 4, "explanation": "編製生活規劃書的目的在幫助客戶預定目標,估列將來需要的各種費用。"}, {"id": 225, "question": "人身保險業初年度保費收入之行銷通路來源占率由大至小順序為", "option_1": "壽險公司、保險經紀人/代理人、銀行保險、其他通路", "option_2": "銀行保險、壽險公司、其他通路、保險經紀人/代理人", "option_3": "銀行保險、壽險公司、保險經紀人/代理人、其他通路", "option_4": "壽險公司、銀行保險、保險經紀人/代理人、其他通路。", "answer": 3, "explanation": "人身保險業初年度保費收入之行銷通路來源占率:銀行保險53.57%>壽險公司38.44%>保險經紀人/代理人7.34%>其他通路0.65%(截至108/12)"}, {"id": 226, "question": "人身保險行銷過程順序為A成交;B發現問題;C解決對策;D接近", "option_1": "BDCA", "option_2": "DBCA", "option_3": "DBAC", "option_4": "DABC。", "answer": 2, "explanation": "人身保險行銷過程順序:接近→發現問題→提出解決對策→成交。"}, {"id": 227, "question": "一般而言,哪些經濟準備是任何一個家庭不可或缺的?A購買住宅的費 用;B子女受教育、結婚費用;C應急需要的預備金;D遺族生活資金", "option_1": "ABD", "option_2": "BCD", "option_3": "ABCD", "option_4": "CD", "answer": 3, "explanation": "五項經濟準備是不可或缺的:遺族生活資金、晚年生活資金、購屋資金、子女教育及結婚資金、應急的預備金"}, {"id": 228, "question": "下列敘述何者正確?", "option_1": "業務員應專為其所屬公司從事保險招攬", "option_2": "業務員已登錄於人壽保險公司,因另取得產險資格後,得登錄於財產保險經紀人公司招攬財產保險商品", "option_3": "業務員即使同時擁有人身保險及財產保險業務員資格,仍僅得擇一登錄", "option_4": "保險從業人員通過壽險公會舉辦之人身保險業務員資格測驗即可開始招攬", "answer": 1, "explanation": "(2)取得相關資格後,保險業、保險代理人公司之業務員得登錄於另一家非經營同類保險業務之保險業或保險代理人公司;保險經紀人公司之業務員得登錄於另一家非經營同類保險業務之保險經紀人公司。(3)同時擁有人身保險及財產保險業務員資格,得登錄於另一家非經營同類保險業務。(4)保險從業人員通過壽險公會舉辦之人身保險業務員資格測驗,由所屬公司為其辦理登錄,並領得登錄證後,即為該公司從事業務招攬人員。"}, {"id": 229, "question": "下列敘述何者錯誤?", "option_1": "業務來源全由公司專職員工招攬者,稱為直接通路", "option_2": "業務來源僅全由保險代理人 or 兼營保險代理人業務之銀行所招攬者,稱為間接通路", "option_3": "兼採直接、間接通路者稱為混合通路制度", "option_4": "目前保險業務行銷方式可分為直接、間接與混合通路等3種", "answer": 2, "explanation": "間接通路:係指業務來源全由保險代理人或兼營保險代理人業務之銀行所招攬者,或經紀人,或兼營保險經紀人業務之銀行代替客戶洽訂之契約。"}, {"id": 230, "question": "計算夫婦兩人的養老資金時,夫婦二人共同生活的養老期間,係以何種方 式計算", "option_1": "以退休時,丈夫的平均餘命計算", "option_2": "以退休時,妻子的平均餘命計算", "option_3": "以妻子死亡時,丈夫的平均餘命計算", "option_4": "以丈夫死亡時,妻子的平均餘命計算。", "answer": 1, "explanation": "晚年生活資金:夫婦兩人的養老金(以丈夫退休時的平均餘命計算)、妻子寡居期間的生活資金(以丈夫死亡時妻子的平均餘命計算)、晚年的生活資金。"}, {"id": 231, "question": "業務員售後服務的開端是從開始。", "option_1": "客戶繳納初期保險費", "option_2": "保險公司完成核保", "option_3": "業務員拿到保險單", "option_4": "業務員遞交客戶保單", "answer": 4, "explanation": "業務員售後服務的開端是從遞交客戶保單開始。"}, {"id": 232, "question": "何者符合準保戶的選擇標準?A身體不健康的人;B付得起保險費的人; C便於拜訪的人;D保險保障規劃少的人", "option_1": "BD", "option_2": "BCD", "option_3": "ABD", "option_4": "ABCD.", "answer": 2, "explanation": "保險公司會做契約對身體、環境、道德做選擇,因此體況不佳者不予承保。"}, {"id": 233, "question": "下列何者正確?A評估保障需求是否足夠係依據保費支出不超過年收入的 十分之一為原則;B評估保費負擔能力係依據保險的保障額度約為年收入 之10倍;C保險是透過互助合作來分散風險,所以業務員準保戶的選擇 為身體不健康的人;D因保險行銷需透過面談及詳細說明,所以業務員準保戶的選擇應為便於拜訪的人", "option_1": "ABD", "option_2": "D", "option_3": "ABCD", "option_4": "CD。", "answer": 2, "explanation": "A評估保障需求是否足夠係依據保險的保障額度約為年收入之10倍;B評估保費負擔能力係依據保費支出不超過年收入的十分之一為原則;C保險是透過互助合作來分散風險,所以業務員準保戶的選擇為身體健康的人。"}, {"id": 234, "question": "電話行銷人員行銷保險A應說明行銷目的及確認要保人身分;B應告知行 銷人員姓名、登錄字號及所屬公司名稱;C依個人資料保護法,電話行銷 過程不得錄音並備份存檔;D電話行銷人員若違反辦理電話行銷業務應注 意事項,所屬公司應依規定予以懲處", "option_1": "ABCD", "option_2": "AB", "option_3": "ABD", "option_4": "BD。", "answer": 3, "explanation": "C電話行銷過程應該經過要保人同意全程錄音並備份存檔。"}, {"id": 235, "question": "完整的人身保險行銷過程,應包含A蒐集資料、發現問題;B準備、自我 介紹;C提示解決的對策;D成交、售後服務;其行銷順序應為", "option_1": "ABCD", "option_2": "BCAD", "option_3": "ACBD", "option_4": "BACD。", "answer": 4, "explanation": "完整的人身保險行銷過程為:準備、自我介紹→蒐集資料、發現問題→提示解決的對策→成交、售後服務。"}, {"id": 236, "question": "由於壽命的不斷延長,替客戶安排保險時,應考慮的保障項目為A醫療費 用;B配偶的安葬費用;C遺族的生活費用;D老年的生活費用", "option_1": "ABCD", "option_2": "ABD", "option_3": "ABC", "option_4": "ACD。", "answer": 4, "explanation": "由於壽命的不斷延長,替客戶安排保險時,應考慮的保障項目應生活規劃的項目:遺族的生活資金、晚年的生活資金、購屋資金、子女教育及結婚資金、應急的預備金。"}, {"id": 237, "question": "保險業經營電話行銷業務時,在行銷過程應經要保人同意全程錄音並備份 存檔列管,其保存期限不得低於保險契約期滿或通知要保人不同意承保後 幾年?", "option_1": "永久保存", "option_2": "2年", "option_3": "3年", "option_4": "5年。", "answer": 4, "explanation": "其保存期限不得低於保險契約期滿或通知要保人不同意承保後5年。"}, {"id": 238, "question": "編製生活規劃書的目的在幫助客戶", "option_1": "準備子女所需要的預備金", "option_2": "了解父母所需要的費用", "option_3": "趁早準備配偶所需要的費用", "option_4": "如何利用人壽保險來準備他所需要的各種費用。", "answer": 4, "explanation": "生活規劃書就是利用生命週期表,將家庭未來的經濟需要考慮在內,並配合其時間,做有計畫的準備,可讓客戶了解必要準備的資金,並提供適當的具體準備方式。"}, {"id": 239, "question": "人身保險業透過仲介行銷通路販售保險商品,現行仲介行銷通路有A銀 行;B保險業務員;C保險經紀人;D保險公證人", "option_1": "ABC", "option_2": "BC", "option_3": "AC", "option_4": "ABCD。", "answer": 1, "explanation": "仲介行銷通路:保險業務員、經紀人/代理人、銀行賣保險。"}, {"id": 240, "question": "開拓企業團體的集體投保,可節省說明時間;B由薪津中代為扣除保 險費;C提高繼續率;D不必經過核保手續的好處,上列何者為正確", "option_1": "BCD", "option_2": "ABCD", "option_3": "ABC", "option_4": "ACD", "answer": 3, "explanation": "透過企業團體的優點是招攬省時、承保條件優渥、保費可自薪津扣除及可提高繼續率。D仍經核保評估後始可生效。"}, {"id": 241, "question": "保險代理人及保險經紀人之規定下列何者正確", "option_1": "得從事未經主管機關核准之外國保險業經營 or 介紹保險商品", "option_2": "未繳交保證金 or 投保責任保險得執行業務", "option_3": "得為未經主管機關核准之保險業經營 or 介紹保險商品", "option_4": "應有固定業務處所,並設立獨立帳簿記載業務收支。", "answer": 4, "explanation": "保險代理人及保險經紀人應經主管機關許可,(2)繳存保證金並投保相關保險,領有執業證照後,始得執行經營或執行業務。(1)(4)不得經營非經主管機關核准之保險業務或國外保險業務。"}, {"id": 242, "question": "壽險行銷通路若分為仲介行銷及直接行銷,下列何者係屬直接行銷通路? A郵寄行銷;B電話行銷;C職域或關係企業行銷;D架設網路平台行銷", "option_1": "AB", "option_2": "ABD", "option_3": "ABCD", "option_4": "BC。", "answer": 3, "explanation": "賣方主動-郵寄、電話行銷、職域或關係企業行銷、架設網路平台。買方主動-語音電話、網路、櫃台行銷、電視行銷。"}, {"id": 243, "question": "以下敘述何者正確?A家庭生活資金計算係以老么大學畢業的期間作為必 要期間計算;B購屋資金計算係考量一旦家庭斷絕經濟來源後如何繼續繳 付剩餘房屋借款;C借款償還金係以每月償還額乘上償還期間計算償還總 額;D臨時預備金一般為現在每個月的生活費用的6個基數", "option_1": "BCD", "option_2": "ABD", "option_3": "ABC", "option_4": "ABCD。", "answer": 3, "explanation": "D臨時預備金一般為現在每個月的生活費用的3個基數。"}, {"id": 244, "question": "保險經紀人係基於利益,代向保險公司洽訂保險契約或提供服務而收取佣金之人。", "option_1": "保險人及被保險人", "option_2": "要保人", "option_3": "被保險人", "option_4": "承保的保險業之", "answer": 3, "explanation": "保險經紀人:基於被保險人之利益,代向保險人洽訂保險契約,而向承保之保險業收取佣金之人。(可以是個人、合夥公司或法人)"}, {"id": 245, "question": "保險經紀人係基於利益,代向保險公司洽定保險契約或提供服務而收取佣金之人", "option_1": "保險人及被保險人", "option_2": "要保人", "option_3": "承保的保險業", "option_4": "被保險人之", "answer": 4, "explanation": "保險經紀人係基於被保險人之利益,代向保險公司洽定保險契約或提供服務而收取佣金之人。"}, {"id": 246, "question": "人壽保險商品死亡給付對保單價值準備金之最低比率規範何者正確?A比 率依年齡級距分為六組;B死亡給付對保價金之最低比率随高齡遞增;C 保險業需於契約條款明訂不符合最低比率時之保費繳交限制;D招攬時要 妥為解說", "option_1": "ABD", "option_2": "CD", "option_3": "BCD", "option_4": "ABCD。", "answer": 2, "explanation": "A比率依年齡級距分為七組;B死亡給付對保價金之最低比率随高齡遞減。"}, {"id": 247, "question": "下列哪些保險中途解約時,其已交付未到期之保費應返還?", "option_1": "終身壽險、傷害保險、年金保險、團體健康保險", "option_2": "一年定期壽險、健康保險、傷害保險", "option_3": "養老保險、一年定期壽險、傷害保險、健康保險", "option_4": "以上皆是。", "answer": 2, "explanation": "投保長期壽險,在解約時若是契約已經有解約金,則保險公司將於接獲解約通知後,一個月內償付解約金;而意外傷害保險、健康保險或1年期定期壽險部分,保險公司接獲解約通知後,會從當期已繳保險費中扣除已過期的保險費,將未滿期的保險費退還。"}, {"id": 248, "question": "實支實付醫療保險副本理賠之控管措施,不適用於何種保險?A傷害保 險;B微型保險;C旅行平安保險;D學生團體保險", "option_1": "ABC", "option_2": "BD", "option_3": "BC D", "option_4": "ABCD.", "answer": 3, "explanation": "保險業招攬及核保作業控管自律規範第21條：每一被保險人投保實支實付型醫療保險上限三張,上開上限於醫療保險及傷害醫療保險採分別計算。另保戶原已投保一張實支實付商品另行向同一保險公司投保一張銜接原給付限額之自負額商品者,該張自負額商品可不列入張數計算。照上述推論,正確答案應是3（副本理賠措施不包括學生團體保險、團體保險、旅平險、微型保險）。"}, {"id": 249, "question": "依保險業務員管理規則規定,投資型保險相關專業課程測驗得辦理單位為", "option_1": "財團法人保險事業發展中心", "option_2": "主管機關認可之保險相關單位", "option_3": "壽險公會", "option_4": "以上皆可負責辦理。", "answer": 4, "explanation": "財團法人保險事業發展中心、主管機關認可之保險相關單位、壽險公會皆可負責辦理投資型保險相關專業課程測驗。"}, {"id": 250, "question": "年金保險中如被保險人身故,仍有未支領之年金餘額時,該餘額", "option_1": "其半數應作為被保險人之遺產", "option_2": "應作為被保險人之遺產", "option_3": "應給付給其他應得之人", "option_4": "應作為要保人之遺產。", "answer": 3, "explanation": "年金保險中如被保險人身故,仍有未支領之年金餘額時,該餘額應給付給身故受益人或其他應得之人。"}, {"id": 251, "question": "年金保險契約敘述何者為是?A得由本人或第三人訂立之;B未經被保人 書面承認並約定保險金額者無效;C利害關係人均得代要保人交付保險 費;D保險人對於保險費得以訴訟請求交付", "option_1": "AC", "option_2": "ABC", "option_3": "ACD", "option_4": "BCD。", "answer": 1, "explanation": "B年金保險未經被保人書面承認並約定保險金額者有效;D保險人對於保險費不得以訴訟請求交付。"}, {"id": 252, "question": "某甲投保每年複利增值3%之二十年期養老保險,保額20萬元,某甲在 投保後第二年死亡,則其可獲得的死亡保險金為元。", "option_1": "206000", "option_2": "20萬", "option_3": "218545", "option_4": "212180", "answer": 4, "explanation": "保險金算法為 $20\\text{萬} \\times 1.03 \\times 1.03 = 212,180$。"}, {"id": 253, "question": "下列何者不是團體保險條款規定被保險人請領失能保險金應檢具之文件?", "option_1": "受益人身份證明", "option_2": "失能診斷書", "option_3": "保險金申請書", "option_4": "被保險人印鑑證明書", "answer": 4, "explanation": "根據團體一年定期人壽保險單示範條款規定,受益人申領「失能保險金」時,應檢具下列文件:失能診斷書、保險金申請書、受益人身份證明。"}],
  amo_fagui:[{"id": 1, "question": "張三以自己為要保人，對下列何者之生命或身體無保險利益：A 借錢給張三的李四；B 張三本人；C 欠張三錢的王老五", "option_1": "A", "option_2": "AC", "option_3": "ABC", "option_4": "BC", "answer": 1, "explanation": ""}, {"id": 2, "question": "________乃法定繼承人對遺產依法得繼承之數額", "option_1": "特留分", "option_2": "持分", "option_3": "法定繼承額", "option_4": "應繼分", "answer": 4, "explanation": ""}, {"id": 3, "question": "A 人壽保險；B 實支實付型的健康保險；C 年金保險；D 日額型健康保險，以上何者適用分攤原則", "option_1": "AB", "option_2": "BD", "option_3": "ABCD", "option_4": "B", "answer": 4, "explanation": ""}, {"id": 4, "question": "人壽保險單示範條款約定，保險契約因保險單借款本息逾保單價值準備金而停效者，要保人於復效時", "option_1": "均須經保險公司同意始得復效", "option_2": "須清償全部欠繳保險單借款本息始得復效", "option_3": "於停效後6個月內之復效申請始得部分清償後復效", "option_4": "得部分清償欠繳保險單借款本息後復效，其未償餘額並不得逾保險單借款約定可借金額之上限", "answer": 4, "explanation": ""}, {"id": 5, "question": "人壽保險費除於簽訂保險契約時尚未確定者外，無論其交付方式為何應於何時交付", "option_1": "契約生效後", "option_2": "契約生效前", "option_3": "契約生效時", "option_4": "發生保險事故前", "answer": 2, "explanation": ""}, {"id": 6, "question": "下列之金融機構何者適用洗錢防制法？A 證券商；B 保險公司；C 信用卡公司；D 郵政機構", "option_1": "ABCD", "option_2": "AB", "option_3": "BD", "option_4": "BCD", "answer": 1, "explanation": ""}, {"id": 7, "question": "下列有關金融消費爭議處理之敘述錯誤？", "option_1": "消費者在評議成立後，得於不變期間內申請爭議處理機構將評議書送法院核可", "option_2": "金融服務業即使已依評議內容履行，爭議處理機構仍應將評議書送法院核可", "option_3": "爭議處理機構將評議書及卷證送請該機構事務所所在地之管轄法院核可", "option_4": "評議書經法院核可後，與民事確定判決有同一效力", "answer": 2, "explanation": ""}, {"id": 8, "question": "下列有關保險代位原則之敘述，何者正確？", "option_1": "人壽保險與產物保險依法均得代位請求權", "option_2": "人壽保險不得代位行使請求權", "option_3": "指事故發生時，由保險人代位行使被保險對第三人之請求權", "option_4": "以上皆是", "answer": 2, "explanation": ""}, {"id": 9, "question": "下列有關保險法第105條規定之敘述何者為非", "option_1": "被保險人得隨時依本條為撤銷並通知要保人即生效力", "option_2": "被保險人依本條行使撤銷權時，視為要保人終止契約", "option_3": "由第三人訂立之死亡保險契約須經被保險人書面同意並約定保險金額，否則契約無效", "option_4": "被保險人得隨時依本條所為之同意得隨時撤銷", "answer": 1, "explanation": ""}, {"id": 10, "question": "下列何者不是保險契約之成立要件", "option_1": "受益人與被保險人間須有保險利益", "option_2": "意思表示一致", "option_3": "要保人須具有行為能力", "option_4": "支付對價", "answer": 1, "explanation": ""}, {"id": 11, "question": "下列何者不是團體保險條款規定被保險人請領失能保險金應檢具之文件", "option_1": "被保險人印鑑證明書", "option_2": "保險金申請書", "option_3": "受益人身分證明", "option_4": "失能診斷書", "answer": 1, "explanation": ""}, {"id": 12, "question": "下列何者正確？", "option_1": "配偶相互贈與之財產應計入贈與總額", "option_2": "贈與稅之納稅義務人死亡時，贈與稅尚未核課者，無須繳納贈與與稅", "option_3": "本國國民就其中華民國境外之財產為贈與，應課徵贈與稅", "option_4": "以上皆非", "answer": 3, "explanation": ""}, {"id": 13, "question": "下列何者正確？", "option_1": "滿7歲之未成年人皆為限制行為能力人，其所為意思表示及所受意思表示應得法定代理人允許", "option_2": "法院依聲請權人聲請其家屬有精神障礙致不能為意思表示者，得為監護宣告或輔助宣告", "option_3": "未滿7歲之未成年人投保時，僅由法定代理人在法定代理人欄位親簽同意已足", "option_4": "限制行為能力人為日常生活必需之意思表示，仍應得法定代理人允許", "answer": 2, "explanation": ""}, {"id": 14, "question": "下列何者正確？A 取得業務員資格即可招攬保險；B 業務員之招攬行為僅應受所屬公司之獎懲辦法規範；C 業務員違規情事若有犯罪嫌疑，應移送法辦；D 業務員有違反管理規則之情事，所屬公司應予以停止招攬登錄或撤銷登錄", "option_1": "CD", "option_2": "ABCD", "option_3": "BD", "option_4": "BCD", "answer": 1, "explanation": ""}, {"id": 15, "question": "下列何者正確？A 滿期保險給付所含之利益所得，受益人享有免納利息所得之稅法優惠；B 勞工退休請領勞退帳戶退休金時，屬退職所得須計入個人綜所稅總額；C 醫療費用支出曾受保險給付，得再以醫療費扣除額中申報；D 死亡保險金指定法定繼承人，各該繼承人領取保險金後須繳納遺產稅", "option_1": "ABC", "option_2": "ABD", "option_3": "AB", "option_4": "BD", "answer": 3, "explanation": ""}, {"id": 16, "question": "下列何者有誤？", "option_1": "保險公證人係辦理保險標的查勘、鑑定及估價而予證明之人", "option_2": "保險法所定各種準備金包含責任準備金、未滿期保費準備金、賠款準備金及保單價值準備金", "option_3": "外國保險業係指依外國法律組織登記業並經主管機關許可，在本國現內經營保險業之機構", "option_4": "合夥人為被保險人，其中一人讓與保險利益於他人，契約不因之而失效", "answer": 2, "explanation": ""}, {"id": 17, "question": "下列何者依保險法規定得代為交付保險費 A 信託業；B 被保險人；C 受益人；D 保險業務員", "option_1": "BCD", "option_2": "BC", "option_3": "ABCD", "option_4": "ABC", "answer": 4, "explanation": ""}, {"id": 18, "question": "下列何者具備保險業務員之資格", "option_1": "小張今年19歲，剛從高職畢業，想參加壽險公會舉辦之人身保險業務員資格測驗", "option_2": "小陶向主管機關繳銷已領有之保險經紀人執業證書", "option_3": "老王今年35歲，之前因犯詐欺罪被判緩刑，去年12月已緩刑期滿", "option_4": "小張、老王和小陶皆具備保險業務員資格", "answer": 2, "explanation": ""}, {"id": 19, "question": "下列何者非屬於傷害保險的除外責任", "option_1": "被保險人飲酒後駕(騎)車，其吐氣或血液所含酒精成份超過道路交通法令規定標準者", "option_2": "被保險人犯罪行為", "option_3": "要保人、被保險人的故意行為", "option_4": "以上皆非", "answer": 4, "explanation": ""}, {"id": 20, "question": "下列何者非屬團體保險條款規定受益人請領身故保險金時應檢具之文件", "option_1": "被保險人之除戶戶籍謄本", "option_2": "受益人之身分證明", "option_3": "被保險人死亡證明書及保險金申請書", "option_4": "保險金申請書、受益人之戶籍謄本及印鑑證明", "answer": 4, "explanation": ""}, {"id": 21, "question": "下列何者係指被繼承人遺留的遺產總額減掉免稅額及扣除額後所剩的餘額為", "option_1": "遺囑繼承額", "option_2": "特留分", "option_3": "課稅遺產淨額", "option_4": "應繼分", "answer": 3, "explanation": ""}, {"id": 22, "question": "下列何者是旅行平安險與傷害險的不同 A 保險期間可否因特殊事故延長；B 承保時間計算之標準；C 除外責任項目；D 承保事故", "option_1": "CD", "option_2": "ACD", "option_3": "AC", "option_4": "BCD", "answer": 3, "explanation": ""}, {"id": 23, "question": "下列何者為非？", "option_1": "要保人希望投保的金額稱為保險金額", "option_2": "保險事故發生後保險公司給付之金額稱為保險金", "option_3": "保險公司就平準繳費的保險契約將來可能發生的給付責任所提存的金額稱為責任準備金", "option_4": "保險公司同意承保之金額稱為保險金額", "answer": 1, "explanation": ""}, {"id": 24, "question": "下列何者為保險契約構成部份 A 附著之要保書；B 批註書；C 廣告文宣；D 保單條款", "option_1": "ABCD", "option_2": "ABD", "option_3": "AD", "option_4": "ACD", "answer": 2, "explanation": ""}, {"id": 25, "question": "下列何者為是？A 傷害保險之保險費不得以訴訟請求交付；B 利害關係人不得代要保人交付保險費；C 傷害保險之保險費到期未交付不適用寬限期間之規定；D 由第三人訂立之傷害保險契約，未經被保險人書面同意並約定保險金額者契約無效", "option_1": "ABCD", "option_2": "D", "option_3": "AD", "option_4": "AC", "answer": 2, "explanation": ""}, {"id": 26, "question": "下列何者適用分攤原則", "option_1": "實支實付型的健康保險", "option_2": "年金保險", "option_3": "人壽保險", "option_4": "以上皆非", "answer": 1, "explanation": ""}, {"id": 27, "question": "下列何者應盡力充實消費資訊提供消費者運用，俾能採取正確合理之消費行為，以維護其安全與權益", "option_1": "政府", "option_2": "企業經營者", "option_3": "消費者", "option_4": "以上皆是", "answer": 4, "explanation": ""}, {"id": 28, "question": "下列敘述何者正確？", "option_1": "保險契約有效期間是要保人與保險公司約定，交付保險費的期間", "option_2": "受益人是指保險事故發生時身體遭受損害，享有賠償請求權之人", "option_3": "受益人是指經要保人指定，享有保險金請求權的人", "option_4": "團體保險契約之死亡受益人由要保人指定", "answer": 3, "explanation": ""}, {"id": 29, "question": "下列敘述何者正確？A 保險合作社簽訂之保險契約，得為分紅或不分紅保單；B 保險公司簽訂之保險契約，以參加保單紅利束為限；C 保單紅利計算其基礎及方法應依保險型定；D 保險合作社簽訂之保險契約，以參加保單紅利者為限", "option_1": "ABC", "option_2": "AC", "option_3": "CD", "option_4": "BCD", "answer": 3, "explanation": ""}, {"id": 30, "question": "下列敘述何者錯誤？", "option_1": "經常居住國外之非中華民國國民，其在國內之贈與應課贈與稅", "option_2": "死亡事實或贈與行為發生前2年內，被繼承人或贈與人自願喪失中華民國國籍，免課徵遺產稅或贈與稅", "option_3": "經常居住國外之中華民國國民，其在國內之贈與應課贈與稅", "option_4": "經常居住國內之中華民國國民，對於其在中華民國境外財產之贈與應課贈與稅", "answer": 2, "explanation": ""}, {"id": 31, "question": "分攤原則其主要目的是", "option_1": "確定保險人賠償責任", "option_2": "使要保人不致不當得利", "option_3": "使被保險人不致不當得利", "option_4": "以上皆非", "answer": 3, "explanation": ""}, {"id": 32, "question": "月繳或季繳保險契約第二期以後分期保險費到期未交付，其寬限期間之起算日為", "option_1": "保險費應繳日", "option_2": "催告到達之翌日", "option_3": "保險費應繳日之翌日", "option_4": "催告到達之日", "answer": 3, "explanation": ""}, {"id": 33, "question": "主管機關為落實對於金融消費者保護的重視，要求金融服務業應把公平待客原則納入教育訓練課程，每年對於在職人員至少進行____小時的公平待客教育訓練", "option_1": "10", "option_2": "3", "option_3": "12", "option_4": "5", "answer": 2, "explanation": ""}, {"id": 34, "question": "以下何者正確？A 含保證給付的年金保險，受益人得申請貼現提前給付；B 遞延年金保險在年金給付開始前如有保單借款，給付開始時應就當時年金保單價值準備金扣除保單借款本金計算年金金額；C 保險人為避免以不實醫療證明詐領保險金，得經要保人同意調閱被保險人就醫資料；D 住院醫療費用保險期間以一年為原則", "option_1": "ABCD", "option_2": "AD", "option_3": "BCD", "option_4": "ABC", "answer": 2, "explanation": ""}, {"id": 35, "question": "以下何者為金融消費評議中心之任務？A 處理所有與金融消費有關之民事爭議；B 辦理金融服務業及金融消費者之教育宣導；C 始金融服務業及消費者均能充分了解彼此權利義務；D 受理各種型態之消費申訴", "option_1": "ABCD", "option_2": "AD", "option_3": "ABC", "option_4": "BC", "answer": 3, "explanation": ""}, {"id": 36, "question": "以受監護宣告尚未撤銷者為被保險人投保之人壽保險契約，其喪葬費用保險金額如超過遺產及贈與稅法有關喪葬費扣除額1/2時", "option_1": "保險人完全不負給付保險金責任，無須退還已繳保費", "option_2": "保險人僅就超過部分不負給付保險金責任，無息退還超過部分之已繳保費", "option_3": "保險人僅就超過部分不負給付保險金責任，加計利息退還超過部分之已繳保費", "option_4": "保險人完全不負給付保險金責任，無息退還已繳保費", "answer": 2, "explanation": ""}, {"id": 37, "question": "以被保險人終身為期，不附生存條件之死亡保險契約，如保險費已付足二年以上而有不交付時，保險人", "option_1": "得以被保險人指定的方式處理", "option_2": "得解除契約", "option_3": "僅得減少保險金額", "option_4": "得終止契約", "answer": 3, "explanation": ""}, {"id": 38, "question": "甲父於去年1月及8月分別贈 option_4": "BC", "answer": 4, "explanation": ""}, {"id": 57, "question": "有關契約撤銷權何者正確？A 不論有無體檢保件之要保人均得主張行使；B 各種人身保險契約皆適用；C 不論何時簽訂之人身保險契約皆適用；D 保險公司應於簽收保單時以明顯字體提醒保戶如何行使契約的撤銷及效果", "option_1": "BCD", "option_2": "ABCD", "option_3": "AD", "option_4": "ABD", "answer": 3, "explanation": ""}, {"id": 58, "question": "有關要保人何者為非？", "option_1": "須投保時填寫要保書並盡善盡告知、通知保險公司保險事故發生之義務", "option_2": "向保險人申請訂立保險契約之人", "option_3": "有指定各項保險金受益人、申請保險單借款及聲明保費自動墊繳之權利", "option_4": "以上皆是", "answer": 3, "explanation": ""}, {"id": 59, "question": "有關個人綜合所得稅之課徵何者正確？A 就個人綜合所得總額計徵之；B 有中華民國來源所得之個人，應就其中華民國來源之所得，課徵綜合所得稅；C 非中華民國境內居住之個人一律免納所得稅", "option_1": "ABC", "option_2": "AB", "option_3": "B", "option_4": "BC", "answer": 3, "explanation": ""}, {"id": 60, "question": "有關勞工自願提撥薪資一定百分比至個人勞退帳戶，何者正確？A 提撥年度個人所得總額減少有減稅效果；B 退休後請領該帳戶退休金屬退職所得，不計入個人綜合所得總額；C 退休後請領該帳戶退休金，應計入個人綜合所得總額；D 該退休金屬人身保險給付，依所得稅法規定全額免稅", "option_1": "BD", "option_2": "AC", "option_3": "ABD", "option_4": "AD", "answer": 2, "explanation": ""}, {"id": 61, "question": "有關復效規定之敘述何者為非？", "option_1": "停效後超過6個月之復效，如被保險人之危險程度有重大變更之情形者，保險人得拒絕其復效", "option_2": "約定復效之期限，自停止效力之日起不得低於2年", "option_3": "停效後超過6個月之復效，要保人填寫復效申請並繳清欠繳保險費、約定之利息及其他費用後，於翌日上午零時恢復其效力", "option_4": "停效後6個月內之復效於要保人繳清欠繳保險費、約定之利息及其他費用後，翌日上午零時恢復其效力", "answer": 3, "explanation": ""}, {"id": 62, "question": "有關最大誠信原則何者正確？A 契約訂立時要保人或被保險人應將有關的重要事實告訴保險人；B 業務員應於親晤被保險人後誠實填報業務員報告書；C 要保人違反告知義務時保險人得解除契約；D 為維護契約安定性，如保險事故發生保險人才知要保人違反告知義務時，且危險發生基於未說明事實者，仍不得解除契約", "option_1": "ABC", "option_2": "ABCD", "option_3": "AC", "option_4": "ACD", "answer": 3, "explanation": ""}, {"id": 63, "question": "有關減額繳清保險之敘述，何者正確？A 與原保險同一種類；B 與原保險期間相同；C 與原保險之保險金額相同；D 與原保險之繳費方式相同", "option_1": "A", "option_2": "ABC", "option_3": "AB", "option_4": "ABD", "answer": 3, "explanation": ""}, {"id": 64, "question": "有關傷害保險受益人申請失能保險金，下列何者錯誤？", "option_1": "保險人基於審核保險金需要得對被保險人身體予以檢驗", "option_2": "保險人得經受益人同意調閱被保險人就醫相關資料", "option_3": "保險人得自付費用另徵詢其他醫師之醫學專業意見", "option_4": "受益人應檢具被保險人除戶戶籍謄本", "answer": 4, "explanation": ""}, {"id": 65, "question": "有關傷害保險契約，下列敘述何者正確", "option_1": "僅得以自己為被保險人投保", "option_2": "以職業為危險估計的主要依據", "option_3": "一律採「追溯生效」", "option_4": "契約效力自保單所載翌日零時起生效", "answer": 2, "explanation": ""}, {"id": 66, "question": "有關團體人壽保險，何者正確？", "option_1": "要保人因所屬人員大批離職致參加保險人數不足時，保險人得終止保險契約並按日數比例退還未滿期保費", "option_2": "因業務種類變更致危險顯著增加時，要保人應於知悉後兩週內通知保險人", "option_3": "保險人接到危險增加之通知30日內，得根據危險增加的程度要求增加保費或終止契約", "option_4": "以上皆是", "answer": 4, "explanation": ""}, {"id": 67, "question": "有關團體保險之敘述，何者正確？", "option_1": "契約涉訟時得排除小額訴訟管轄法院之適用", "option_2": "要保人於保單屆滿日的2週前與保險人議定續保條件，續保的始期以原契約屆滿日的翌日零時為準", "option_3": "所謂團體係指具有5人以上且以購買保險而組織之團體", "option_4": "被保險人異動申請加保時，被保險人資格自異動發生日翌日零時起生效", "answer": 2, "explanation": ""}, {"id": 68, "question": "有關實支實付住院醫療費用保險之陳述何者正確？A 具有損害填補的原則；B 只要是住院醫療相關費用皆可給付；C 對於全民健保核付的費用不給付；D 對於保險對象自行負擔之一定項目費用給付", "option_1": "B", "option_2": "ACD", "option_3": "ABCD", "option_4": "AB", "answer": 2, "explanation": ""}, {"id": 69, "question": "有關銷售外幣收付非投資型保險商品應具備之資格及訓練，何者錯誤？", "option_1": "應參加匯率風險及外匯相關法規之教育訓練", "option_2": "銷售該商品之業務員須通過壽險公會舉辦之特別測驗並完成資格登錄", "option_3": "非登錄中業務員得報考該項特別測驗再完成資格登錄", "option_4": "訓練時數最少5小時", "answer": 3, "explanation": ""}, {"id": 70, "question": "有關贈與稅，何者陳述錯誤？", "option_1": "納稅義務人為贈與人", "option_2": "免稅額之計算係指一年之贈與", "option_3": "一年如有二次以上之贈與，不得分別計算", "option_4": "免稅額為123萬元", "answer": 4, "explanation": ""}, {"id": 71, "question": "死亡保險金300萬未指定身故受益人，如被保險人僅有配偶和兄弟姊妹，該保險金應如何分配？", "option_1": "配偶200萬、兄弟姊妹100萬", "option_2": "配偶100萬、兄弟姊妹200萬", "option_3": "配偶150萬、兄弟姊妹150萬", "option_4": "按人數平均分配", "answer": 3, "explanation": ""}, {"id": 72, "question": "死亡保險金一千萬且未指定身故受益人，被保險人還有配偶、子女兩名和父母，則被保險人之父親可分配到", "option_1": "200萬", "option_2": "500萬", "option_3": "0萬", "option_4": "125萬元", "answer": 3, "explanation": ""}, {"id": 73, "question": "老王去年度共有三次贈與，贈與其子1棟房屋2000萬元，贈與其妻轎車200萬元，贈與其女出嫁禮金80萬元，則老王今年度課稅贈與淨額為______萬元", "option_1": "1980", "option_2": "1860", "option_3": "1756", "option_4": "2060", "answer": 3, "explanation": ""}, {"id": 74, "question": "住院醫療費用保險單示範條款，住院係指 A 被保險人經醫師診斷其疾病必須入院；B 被保險人經醫師診斷其傷害必須入院；C 須正式辦理住院手續並確實在醫院接受診療；D 可於契約條款明訂包含精神衛生法第35條之日間留院", "option_1": "ABCD", "option_2": "ABC", "option_3": "ACD", "option_4": "AC", "answer": 1, "explanation": ""}, {"id": 75, "question": "何者正確？A 凡向產險公司投保之保費皆不得列舉扣除；B 現行長期照顧特別扣除額為每人每年12萬元；C 團體投資型保險每人每月保費2千元以內免視為被保險人薪資所得；D 團體保單經驗分紅退費之給付免納所得稅。", "option_1": "ABCD", "option_2": "AD", "option_3": "BD", "option_4": "BCD", "answer": 3, "explanation": ""}, {"id": 76, "question": "何者非要保人可指定受益人領取之保險金？A 失能保現金；B 醫療保險金；C 終身壽險保險金；D 年金保險金", "option_1": "BCD", "option_2": "ACD", "option_3": "ABD", "option_4": "AB", "answer": 3, "explanation": ""}, {"id": 77, "question": "何種情況不得登錄為壽險業務員？A 由請登錄文件有虛偽記載；B 壽險業有信用扣押處分尚未期滿；C 產險受有停止招攬處分尚未期滿；D 受破產宣告尚未復權", "option_1": "ACD", "option_2": "ABCD", "option_3": "ABD", "option_4": "BCD", "answer": 3, "explanation": ""}, {"id": 78, "question": "何調主力近因原則？", "option_1": "非民法中的因果關係", "option_2": "是指導致被保險人死亡或受傷的最主要或最有效的原因", "option_3": "導致保險事故發生的主要近因不一定是保險單上所保的危險，且保險人仍應負責", "option_4": "以上皆是", "answer": 2, "explanation": ""}, {"id": 79, "question": "利率變動型年金保險乙型，其給付期間第2年度開始每年可領取之年金金額係以前1年度可領取之年金金額乘以當年度", "option_1": "調整係數", "option_2": "浮動係數", "option_3": "風險係數", "option_4": "變動係數而得之。", "answer": 1, "explanation": ""}, {"id": 80, "question": "李君以自己為被保險人，身故受益人欄位僅寫配偶及子女，投保當時育有一子，投保後再生育一子一女，李君死亡時，其妻、子、女皆生存，共有幾人可享有保險金受領權？", "option_1": "2人", "option_2": "3人", "option_3": "4人", "option_4": "5人", "answer": 3, "explanation": ""}, {"id": 81, "question": "李嗣以其子李玖為被保險人購買人身保險，當李嗣死亡時李玖未辦理變更要保人且其他利害關係人也未代為繳續保險費，若該保險單已累積有保單價值準備金，則該保單價值準備金應", "option_1": "列入李嗣之遺產總額，申報遺產稅", "option_2": "視為保險給付，但列入所得", "option_3": "由李玖申請領回", "option_4": "視為保險給付，不列入所得。", "answer": 1, "explanation": ""}, {"id": 82, "question": "依「人身保險業務員教育訓練通報暨換證作業規範」規定，業務員因註銷、停止招攬行為、撤銷等異動後，再辦理登錄，其間隔期間在____以上者，其教育訓練年度應重新計算", "option_1": "三年", "option_2": "一年", "option_3": "二年", "option_4": "四年", "answer": 2, "explanation": ""}, {"id": 83, "question": "依人壽保險單示範條款規定，受益人喪失受益權時，", "option_1": "如無其他受益人受領保險金，該保險金作為被保險人遺產" , "option_1": "不得申報扣除", "option_2": "得扣除一萬五千元", "option_3": "得扣除一萬二千元", "option_4": "得扣除二萬四千元", "answer": 4, "explanation": ""}, {"id": 135, "question": "某甲曾於五年前投保死亡保險200萬元，後該保險因未繳保費於去年一月停效，今年十月又辦理復效完畢，某甲於復效兩個月後即跳海自殺身故，保險人對本案應如何處理？", "option_1": "不給付死亡保險金，但退還所繳保費", "option_2": "完全不給付", "option_3": "應照保險金額理賠", "option_4": "僅返還保單價值準備金", "answer": 4, "explanation": ""}, {"id": 136, "question": "為防堵不良醫療院所配合保戶要求開立不實醫療證明或診斷書詐領保險金之行為，金管會修正住院醫療費用保險單示範條款，下列敘述何者正確", "option_1": "保險公司得依其他醫生的第二意見決定理賠與否", "option_2": "108年度已簽發的醫療保險單，經保險公司寄送保單權益變更通知書後亦得適用", "option_3": "保險公司得憑該條款調閱被保險人的就醫紀錄，不須另外取得授權", "option_4": "以上皆是", "answer": 1, "explanation": ""}, {"id": 137, "question": "為保護金融消費者，金融服務業依據金消法規定訂定業務人員酬金制度並提報", "option_1": "股東大會", "option_2": "董(理)事會", "option_3": "主管機關", "option_4": "業務員代表大會通過", "answer": 2, "explanation": ""}, {"id": 138, "question": "要保人中途請求終止契約，如果交付的保險費累積達有保單價值準備金，可以領回", "option_1": "已繳全部保險費加計利息", "option_2": "已積存責任準備金之金額", "option_3": "由保險公司決定可領之金額", "option_4": "解約金表所列解約金額", "answer": 4, "explanation": ""}, {"id": 139, "question": "要保人以契約或遺囑變更受益人時，非經通知，不得對抗", "option_1": "保險人", "option_2": "受益人", "option_3": "被保險人", "option_4": "保險業務員", "answer": 1, "explanation": ""}, {"id": 140, "question": "要保人在保險契約有效期間內得申請減少保險金額，但不得低於最低承保金額，其減少部分視為", "option_1": "解除部分契約", "option_2": "終止契約", "option_3": "無效", "option_4": "停效", "answer": 2, "explanation": ""}, {"id": 141, "question": "要保人自停效日起6個月後申請復效者，保險人得於要保人申請復效日起 A 日內要求提供可保證明，或於收到前項可保證明後 B 日內不為拒絕視為同意復效，請問 A、B 應為", "option_1": "A為5，B為15", "option_2": "A為5，B為10", "option_3": "A為10，B為30", "option_4": "A為10，B為15", "answer": 1, "explanation": ""}, {"id": 142, "question": "要保人或被保險人對於保險人的書面詢問若有故意隱匿或因過失遺漏，或為不實之說明，足以變更或減少保險人對於危險之估計者，保險人得", "option_1": "停止契約", "option_2": "終止契約", "option_3": "撤銷契約", "option_4": "解除契約", "answer": 4, "explanation": ""}, {"id": 143, "question": "要保人故意致被保險人於死者，保險人", "option_1": "無須給付保險金，但應退還所繳保險費", "option_2": "須給付保險金", "option_3": "無須給付保險金，但應退還保單價值準備金予應得之人或解交國庫", "option_4": "無須給付保險金，退還保單加值準備金及所繳保險費", "answer": 3, "explanation": ""}, {"id": 144, "question": "要保人破產時，保險契約仍為________之利益而存在", "option_1": "保險人", "option_2": "被保險人", "option_3": "要保人", "option_4": "破產債權人", "answer": 4, "explanation": ""}, {"id": 145, "question": "要保人終止保險契約，繳費累積達有保單價值準備金，保險人應於接到通知後______內償付解約金", "option_1": "十五天", "option_2": "二個月", "option_3": "一個月", "option_4": "二十天", "answer": 3, "explanation": ""}, {"id": 146, "question": "要保人對下列何者應通知保險人之義務", "option_1": "為保險人所知者", "option_2": "經保險人聲明不必通知者", "option_3": "為被保險人所知者", "option_4": "依通常注意為保險人所應知，或無法諉為不知者", "answer": 3, "explanation": ""}, {"id": 147, "question": "旅行平安保險單示範條款有延長保險期間之規定，其要件不包括", "option_1": "被保險人須為乘客", "option_2": "該交通工具因故延遲抵達為被保險人所能控制", "option_3": "該交通工具之預定抵達時刻在保險契約期間內", "option_4": "搭乘之交通工具須領有載客執照", "answer": 2, "explanation": ""}, {"id": 148, "question": "除人身保險公司外，哪些單位於推出具有保單價值準備金之新產品或提供與金錢有關之服務前須進行洗錢及資恐風險評估？A 個人執業保險經紀人；B 專業再保險公司；C 保險代理人公司；D 財產保險公司", "option_1": "ABCD", "option_2": "ABC", "option_3": "BD", "option_4": "BCD", "answer": 1, "explanation": ""}, {"id": 149, "question": "張三為要保人，對下列何者生命或身體有保險利益？A 借錢給張三的李四；B 張三本人；C 欠張三前的王老五", "option_1": "A", "option_2": "BC", "option_3": "AB", "option_4": "ABC", "answer": 2, "explanation": ""}, {"id": 150, "question": "現行人壽保險單示範條款規定，要保人或受益人應於知悉被保險人死亡或其他保險事故時", "option_1": "於十日內", "option_2": "依契約規定日期，不得少於五日內", "option_3": "三十日內", "option_4": "即時通知保險公司", "answer": 2, "explanation": ""}, {"id": 151, "question": "被保險人投保健康保險後，因疾病致成失能時，保險人", "option_1": "退還所繳保險費", "option_2": "應給付保險金", "option_3": "酌給慰問金", "option_4": "不給付保險金", "answer": 2, "explanation": ""}, {"id": 152, "question": "陳光華的父親曾於生前投保傷害保險貳百萬元，並以陳光華為死亡保險金受益人，但陳光華一直到父親因疾病死亡後二年，始知父親投保，此時保險公司", "option_1": "仍應如額給付保險金", "option_2": "陳光華須證明確係不知其父投保事實才延遲申請，否則保險公司仍得拒絕給付", "option_3": "僅給付保單價值準備金", "option_4": "以上皆非", "answer": 4, "explanation": ""}, {"id": 153, "question": "傷害保險中被保險人因同一意外事故致成失能等級表所列二項以上失能程度者，何者有誤？", "option_1": "保險人應給付失能程度較嚴重者，且最高以保險金額為限", "option_2": "意外事故合併以前的失能可領較嚴重項目失能保險金者，按較嚴重項目給付", "option_3": "若二項失能項目皆屬同一手但失能等級不同時，給付較嚴重項目失能保險金", "option_4": "若二項失能項目屬於同一手時，僅給付依項失能保險金", "answer": 1, "explanation": ""}, {"id": 154, "question": "傷害保險被保險人如失蹤應如何處理？", "option_1": "依戶籍資料所載失蹤日起滿一年仍未尋獲，保險人應先行給付保險金", "option_2": "要保人或受益人能提出證明足認被保險人極可能因承保事故致死者，保險人應先行給付保險金", "option_3": "保險人先行給付保險金後發現被保險人生還，要保人或受益人應歸還保險人已領之退還已繳保費或身故保險金或喪葬費用保險金", "option_4": "以上皆是", "answer": 4, "explanation": ""}, {"id": 155, "question": "傷害保險費率係按被保險人 A 薪資；B 性別；C 職業；D 工作環境，之不同作為主要的依據", "option_1": "BCD", "option_2": "CD", "option_3": "ABC", "option_4": "ABCD", "answer": 2, "explanation": ""}, {"id": 156, "question": "業務員不服受停止招攬登錄、撤銷登錄處分，得於受處分之通知到達之日起______內，向原處分公司提出申復", "option_1": "一年", "option_2": "三年", "option_3": "三個月", "option_4": "一個月", "answer": 4, "explanation": ""}, {"id": 157, "question": "業務員不參加所屬公司所舉辦之教育訓練者，所屬公司應為其辦理", "option_1": "註銷登錄", "option_2": "撤銷登錄", "option_3": "警告登錄", "option_4": "停止招攬登錄", "answer": 2, "explanation": ""}, {"id": 158, "question": "業務員因離職、轉任而異動，所屬公司應向壽險公會申報", "option_1": "註銷登錄", "option_2": "停止招攬登錄", "option_3": "變更登錄", "option_4": "撤銷登錄", "answer": 1, "explanation": ""}, {"id": 159, "question": "業務員收取要保人所繳納之現金保險費後，而再以自己或他人之信用卡刷卡繳交之行為，下列何者正確？A 屬挪用保費之情事；B 已符合侵占罪的構成要件；C 所屬公司應依保險業務員管理規則第19條第1項規定予以懲處登錄；D 所屬公司應逕予註銷登錄", "option_1": "ABCD", "option_2": "ABD", "option_3": "BC", "option_4": "ABC", "answer": 4, "explanation": ""}, {"id": 160, "question": "業務員於登錄後應於______完成規定之教育訓練課程及時數，並於期滿前妥善換發登錄證手續", "option_1": "每3年", "option_2": "每年", "option_3": "每5年", "option_4": "每4年", "answer": 2, "explanation": ""}, {"id": 161, "question": "業務員參加外部共同法令遵循6小時訓練課程，何者正確？", "option_1": "凡業務員資格測驗合格者，不論登錄與否皆須遵守該規定", "option_2": "該課程嚴格禁冒名上課及測驗，違反業務員及代上課者皆予以撤銷登錄", "option_3": "由保險事業發展中心製作數位課程供業務員線上學習", "option_4": "以上皆是", "answer": 3, "explanation": ""}, {"id": 162, "question": "業務員曾受第19條撤銷登錄處分者，應於撤銷期滿", "option_1": "重新參加業務員資格測驗合格", "option_2": "重新參加教育訓練", "option_3": "重新辦理登錄領取新的登錄證即可", "option_4": "選項1或2皆可使得登錄", "answer": 1, "explanation": ""}, {"id": 163, "question": "當要保人屆期未交保費，保險人自動墊繳其應繳保費及利息，若保單價值準備金之餘額不足墊繳一日的保險費且催告到達後30天仍未繳費時，保險契約效力即", "option_1": "無效", "option_2": "停止", "option_3": "終止", "option_4": "以上皆非", "answer": 2, "explanation": ""}, {"id": 164, "question": "壽險業務員招攬時須出示登錄證，該登錄證由哪個單位製發", "option_1": "各登錄單位", "option_2": "壽險公會", "option_3": "登錄證即測驗合格證，由辦理測驗單位製發", "option_4": "以上皆非", "answer": 1, "explanation": ""}, {"id": 165, "question": "對於損害填補原則之敘述何者正確？A 防止被保險人不當得利；B 需保險人有二張以上保險單才可能發生；C 僅適用於人身保險；D 僅適用於財產保險", "option_1": "AD", "option_2": "A", "option_3": "BD", "option_4": "ABC", "answer": 2, "explanation": ""}, {"id": 166, "question": "遞延年金保險第二期以後保險費如未依約繳付，不適用何者規定？A 寬限期；B 停效；C 變更為減額繳清保險", "option_1": "AB", "option_2": "AC", "option_3": "BC", "option_4": "ABC", "answer": 1, "explanation": ""}, {"id": 167, "question": "遺產稅及贈與稅納稅義務人，應於稽徵機關送達核定稅額通知書之日起______內，繳清應納稅款", "option_1": "二個月", "option_2": "一個月", "option_3": "半年", "option_4": "三個月", "answer": 1, "explanation": ""}, {"id": 168, "question": "遺產稅或贈與稅應納稅額在三十萬元以上，納稅義務人確有困難，不能一次繳納現金時，得於納稅期限內，向該管稽徵機關申請，分______以內繳納", "option_1": "十八期", "option_2": "六期", "option_3": "三十六期", "option_4": "二十四期", "answer": 1, "explanation": ""}, {"id": 169, "question": "贈與人在一年內贈與他人之財產總值超過贈與稅免稅額時，應於超過免稅額之贈與行為發生後______，向贈與人戶籍所在地之稅捐機關申報", "option_1": "二個月內", "option_2": "十日內", "option_3": "三十日內", "option_4": "二十日內", "answer": 3, "explanation": ""}, {"id": 170, "question": "關於保單申請復效期限屆滿前之通知，以下敘述何者正確？", "option_1": "需於至少三個月前發出通知", "option_2": "屬於法定義務，並應註明於契約條款中", "option_3": "為保障保戶權益，應以雙掛號通知", "option_4": "以上皆是", "answer": 1, "explanation": ""}, {"id": 171, "question": "關於寬限期間之述敘，何者錯誤？A 逾寬限期間仍未繳付保險費者，契約至寬限期間終了之翌日起終止效力；B 如在寬限期間發生保險事故，保險公司仍負給付責任；C 年繳或半年繳件，自保單所載之交付日期之翌日起算30日為寬限期間；D 季繳或月繳件，至催告到達日期之翌日起算30日為寬限期間", "option_1": "ABCD", "option_2": "BCD", "option_3": "ACD", "option_4": "CD", "answer": 3, "explanation": ""}, {"id": 172, "question": "關於遺產稅款之繳納方式有 A 現金繳納；B 實物抵繳；C 分期繳納；D 部分現金繳納，部分實物一次抵繳", "option_1": "ABCD", "option_2": "AC", "option_3": "BCD", "option_4": "ABD", "answer": 1, "explanation": ""}],
  amo_shiwu:[{"id": 1, "question": "1千名45歲的男人各投保1千萬元的死亡保險(保險期間1年)，生命表顯示45歲男人的死亡率是千分之4，則每人的保險費是", "option_1": "5千元", "option_2": "5萬元", "option_3": "4萬元", "option_4": "4千元", "answer": 3, "explanation": ""}, {"id": 2, "question": "A 小額終老保險；B 無保單價值準備金之人身保險；C 進入年金給付期間且約定採分期給付的遞延年金保險；D 即期年金保險，符合主管機關對於保障型及高齡化保險商品之定義", "option_1": "ACD", "option_2": "ABD", "option_3": "AD", "option_4": "ABCD", "answer": 4, "explanation": ""}, {"id": 3, "question": "一種風險不受人為之故意行為因素影響，可以觀察也可以衡量，認定上不會因人而有不同結果之風險稱為", "option_1": "主觀風險", "option_2": "客觀風險", "option_3": "投機風險", "option_4": "純粹風險", "answer": 2, "explanation": ""}, {"id": 4, "question": "人身保險業自92年元月起銷售之人壽保險單，計算保險費率之生命表為", "option_1": "臺灣壽險業第四回經驗生命表", "option_2": "得自行決定", "option_3": "臺灣壽險業第三回經驗生命表", "option_4": "臺灣壽險業第三回經驗生命表死亡率百分之九十", "answer": 2, "explanation": ""}, {"id": 5, "question": "人身保險對個人的功能有那些？A 安定就業、穩定發展；B 享受優惠、稅捐減免；C 保險理財，一舉兩得；D 鼓勵儲蓄，平均財富", "option_1": "BCD", "option_2": "ABC", "option_3": "ACD", "option_4": "ABCD", "answer": 2, "explanation": ""}, {"id": 6, "question": "下列何者正確？", "option_1": "損失幅度分配低的風險可能屬於不重要的風險或重要的風險", "option_2": "損失幅度分配低的風險可能屬於特別嚴重的風險或不重要的風險", "option_3": "損失頻率分配高的風險可能屬於不重要的風險或重要的風險", "option_4": "以上皆非", "answer": 1, "explanation": ""}, {"id": 7, "question": "下列何者正確？A 評估保障需求是否足夠係依據保費支出不超過年收入的十分之一為原則；B 評估保費負擔能力係依據可保險的保障額度約為年收入之10倍；C 保險是透過互助合作來分散風險，所以業務員準保戶的選擇為身體不健康的人；D 因保險行銷需透過面談及詳細說明，所以業務員準保戶的選擇應為便於拜訪的人", "option_1": "ABD", "option_2": "D", "option_3": "ABCD", "option_4": "CD", "answer": 2, "explanation": ""}, {"id": 8, "question": "下列何者非保險業授權代收保險費之人", "option_1": "保險代理人", "option_2": "保險代理人所屬業務員", "option_3": "保險經紀人所屬業務員", "option_4": "保險公司授權之所屬業務員", "answer": 3, "explanation": ""}, {"id": 9, "question": "下列何者非壽險公司承保新契約時契約選擇之程序？", "option_1": "業務員的選擇", "option_2": "核保人員的選擇", "option_3": "公司體檢醫師的選擇", "option_4": "生存調查人員的選擇", "answer": 4, "explanation": ""}, {"id": 10, "question": "下列何者非屬特定風險之特性？", "option_1": "不含投機風險", "option_2": "僅影響特定之人", "option_3": "處理方式以保險為主", "option_4": "通常與經濟、政治、社會、及天然災害 })();

  fontSize=Math.max(12,Math.min(24,fontSize+d));

  inQuiz=(name==='quiz');
  document.getElementById('end-btn').style.display=(name!=='home')?'':'none';
  if(name==='home'){
    document.querySelector('.topbar-logo').textContent='保險題庫';
  }
  closeCfg();
}
function goHome(){showScr('home');updateMarkedList()}

/* ═══ HOME ═══ */
function selSrc(id){
  selSrcId=id;
  document.querySelectorAll('.src-card').forEach(c=>c.classList.remove('on'));
  document.getElementById('src-'+id).classList.add('on');
  const c=COUNTS[id];
  document.getElementById('cnt-fagui').textContent=c.fagui+' 題';
  document.getElementById('cnt-shiwu').textContent=c.shiwu+' 題';
  checkReady();
}
function selCat(id){
  selCatId=id;
  document.querySelectorAll('.cat-btn').forEach(c=>c.classList.remove('on'));
  document.getElementById('cat-'+id).classList.add('on');
  checkReady();
}
function checkReady(){
  document.getElementById('start-btn').disabled=!(selSrcId&&selCatId);
}
function startQuiz(qs){
  if(qs){questions=qs;isMarked=true}
  else{questions=DATA[selSrcId+'_'+selCatId].slice();isMarked=false}
  cur=0;answers={};skipped={};cor=0;wrg=0;
  showScr('quiz');
  render();
}

/* ═══ HELPERS ═══ */
function getSK(q){
  return isMarked?(q._sk||(selSrcId+'_'+selCatId)):(selSrcId+'_'+selCatId);
}
function updateStats(){
  const total=questions.length;
  const aCnt=Object.keys(answers).length;
  const sCnt=Object.keys(skipped).length;
  document.getElementById('s-prog').textContent=(cur+1)+'/'+total;
  document.getElementById('s-ans').textContent=aCnt+sCnt;
  document.getElementById('s-cor').textContent=cor;
  document.getElementById('s-wrg').textContent=wrg;
  const pct=Math.round((aCnt+sCnt)/total*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-lbl').textContent='第 '+(cur+1)+' 題';
  document.getElementById('prog-pct').textContent=pct+'%';
}

/* ═══ DOTS ═══ */
function buildDots(gridId){
  const grid=document.getElementById(gridId);
  if(!grid)return;
  grid.innerHTML='';
  questions.forEach((q,i)=>{
    const d=document.createElement('div');
    d.className='dot';
    d.textContent=i+1;
    if(i===cur)d.classList.add('dcur');
    if(answers[i]!==undefined)d.classList.add(answers[i].correct?'dok':'dno');
    else if(skipped[i])d.classList.add('dsk');
    if(marked[getSK(q)+'_'+q.id])d.classList.add('dmk');
    d.onclick=()=>{cur=i;closeCfg();render()};
    grid.appendChild(d);
  });
}
function renderCfgDots(){buildDots('dots-grid-cfg')}

/* ═══ QUIZ RENDER ═══ */
function render(){
  const q=questions[cur];
  const ua=answers[cur];
  const rev=ua!==undefined;
  const sk=getSK(q);

  // meta badges
  document.getElementById('q-meta').innerHTML=
    `<span class="q-num-badge">第 ${cur+1} 題</span>`+
    `<span class="q-cat-badge">${isMarked?(SRC_LBL[sk]||sk):(selCatId==='fagui'?'保險法規':'保險實務')}</span>`+
    (q.id?`<span class="q-cat-badge" style="font-size:.72rem">#${q.id}</span>`:'');

  // mark button
  document.getElementById('mark-btn').classList.toggle('on',!!marked[sk+'_'+q.id]);

  // question text
  document.getElementById('q-text').textContent=q.question||'';

  // options
  const optsEl=document.getElementById('opts');
  optsEl.innerHTML='';
  [q.option_1,q.option_2,q.option_3,q.option_4].forEach((o,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';
    if(rev){
      btn.disabled=true;
      if(i+1===q.answer)btn.classList.add('ok');
      else if(ua&&i+1===ua.chosen)btn.classList.add('no');
      else btn.classList.add('dim');
    }
    btn.innerHTML=`<span class="opt-k">${'ABCD'[i]}</span>${o}`;
    if(!rev)btn.onclick=()=>pick(i+1);
    optsEl.appendChild(btn);
  });

  // explanation
  const exp=document.getElementById('exp');
  const expTxt=q.explanation||'';
  if(rev&&expTxt.trim()){exp.textContent='📌 解析：'+expTxt;exp.className='exp show'}
  else{exp.className='exp'}

  // actions: ← 上一題  |  下一題→/查看結果  |  [略過] right-bottom
  const isLast=cur===questions.length-1;
  const prevDis=cur===0?'disabled':'';
  const nextDis=!rev?'disabled':'';
  const nextLabel=isLast?'查看結果':'下一題 →';
  const nextFn=isLast?'showResult()':'goNext()';
  const skipBtn=rev?'':
    `<button class="btn skip-abs" onclick="skipQ()">略過</button>`;
  document.getElementById('act').innerHTML=
    `<button class="btn" onclick="goPrev()" ${prevDis}>← 上一題</button>`+
    `<button class="btn pri" onclick="${nextFn}" ${nextDis}>${nextLabel}</button>`+
    skipBtn;

  updateStats();
}

function pick(chosen){
  if(answers[cur]!==undefined)return;
  const q=questions[cur];
  const correct=chosen===q.answer;
  answers[cur]={chosen,correct};
  delete skipped[cur];
  if(correct)cor++;else wrg++;
  render();
}
function skipQ(){
  skipped[cur]=true;delete answers[cur];
  if(cur<questions.length-1){cur++;render();}
  else showResult();
}
function goPrev(){if(cur>0){cur--;render();}}
function goNext(){
  if(cur<questions.length-1){cur++;render();}
  else showResult();
}
function toggleMark(){
  const q=questions[cur];const sk=getSK(q);const mk=sk+'_'+q.id;
  if(marked[mk])delete marked[mk];else marked[mk]={srcKey:sk,qId:q.id};
  render();updateMarkedList();
}

/* ═══ RESULT ═══ */
function showResult(){
  const total=questions.length;
  const answered=Object.keys(answers).length;
  const skipCount=Object.keys(skipped).length;
  const pct=Math.round(cor/total*100);
  const pass=pct>=70;
  document.getElementById('rs-prog').textContent=total;
  document.getElementById('rs-ans').textContent=answered;
  document.getElementById('rs-cor').textContent=cor;
  document.getElementById('rs-wrg').textContent=wrg+skipCount;
  document.getElementById('result-card-wrap').innerHTML=`
  <div class="result-card">
    <div class="rscore ${pass?'pass':'fail'}">${pct}</div>
    <p style="font-size:.82rem;color:var(--text3);margin-bottom:8px">分（滿分100分）</p>
    <div class="rbadge ${pass?'pass':'fail'}">${pass?'恭喜通過！':'未達及格線（70分）'}</div>
    <div class="rstats">
      <div class="rstat"><div class="rstat-l">總題數</div><div class="rstat-v">${total}</div></div>
      <div class="rstat"><div class="rstat-l">答對</div><div class="rstat-v" style="color:var(--green-txt)">${cor}</div></div>
      <div class="rstat"><div class="rstat-l">答錯／略過</div><div class="rstat-v" style="color:var(--red-txt)">${wrg+skipCount}</div></div>
    </div>
    <div class="rdesc">及格線 70 分（答對 ${Math.ceil(total*0.7)} 題）${pass?'<br>建議繼續複習，保持最佳狀態。':'<br>請針對錯誤考點複習後再次應試。'}</div>
    <div class="rbtn-row">
      <button class="btn" onclick="reviewWrong()">📝 複習錯題</button>
      <button class="btn" onclick="reviewMarkedAll()">🔖 標註題練習</button>
      <button class="btn pri" onclick="goHome()">🏠 返回首頁</button>
    </div>
  </div>`;
  showScr('result');
}

/* ═══ MARKED ═══ */
function updateMarkedList(){
  const tags=document.getElementById('marked-tags');
  const keys=Object.keys(marked);
  if(!keys.length){tags.innerHTML='<span class="no-marked">尚無標註題目</span>';return}
  const groups={};
  keys.forEach(k=>{const info=marked[k];(groups[info.srcKey]=groups[info.srcKey]||[]).push(info.qId)});
  tags.innerHTML='';
  Object.entries(groups).forEach(([sk,ids])=>{
    const t=document.createElement('span');t.className='marked-tag';
    t.textContent=`${SRC_LBL[sk]||sk}（${ids.length}題）`;
    t.onclick=()=>startMarkedGroup(sk,ids);tags.appendChild(t);
  });
}
function startMarkedGroup(sk,ids){
  const qs=ids.map(id=>{const q=DATA[sk].find(q=>q.id===id);return q?{...q,_sk:sk}:null}).filter(Boolean);
  if(qs.length)startQuiz(qs);
}
function reviewWrong(){
  const qs=Object.entries(answers).filter(([,a])=>!a.correct)
    .map(([i])=>{const q=questions[+i];return{...q,_sk:getSK(q)}});
  if(!qs.length){alert('沒有錯題！');return}startQuiz(qs);
}
function reviewMarkedAll(){
  const keys=Object.keys(marked);if(!keys.length){alert('尚無標註題目');return}
  const groups={};
  keys.forEach(k=>{const info=marked[k];(groups[info.srcKey]=groups[info.srcKey]||[]).push(info.qId)});
  const all=[];
  Object.entries(groups).forEach(([sk,ids])=>ids.forEach(id=>{const q=DATA[sk].find(q=>q.id===id);if(q)all.push({...q,_sk:sk})}));
  if(!all.length){alert('找不到標註題目');return}startQuiz(all);
}

/* init */
updateMarkedList();
showScr('home');
</script>
</body>
</html>
