<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保險考題練習系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --fs:16px;
  --bg:#f8f7f4;--surface:#fff;--border:#e5e2dc;--border2:#d0ccc4;
  --text:#1a1917;--text2:#6b6860;--text3:#9c9890;
  --blue-bg:#e8f0fb;--blue-txt:#1a4fa0;--blue-bdr:#3b7dd8;
  --green-bg:#e8f5ee;--green-txt:#1a6e3a;--green-bdr:#2d9e5a;
  --red-bg:#fceaea;--red-txt:#9b2020;--red-bdr:#d94040;
  --amber-bg:#fef3e2;--amber-txt:#7a4800;--amber-bdr:#d4900a;
  --marked-bg:#f5eeff;--marked-txt:#6b21c8;--marked-bdr:#9b59e8;
  --r:10px;--rl:14px;
  --shell:720px;
}
[data-theme=dark]{
  --bg:#10121a;--surface:#1c1f2e;--border:#2d3148;--border2:#3a4060;
  --text:#dde1ee;--text2:#8890b0;--text3:#5a6080;
  --blue-bg:rgba(59,125,216,0.15);--blue-txt:#7eb3f5;--blue-bdr:#3b7dd8;
  --green-bg:rgba(45,158,90,0.15);--green-txt:#5dcc8a;--green-bdr:#2d9e5a;
  --red-bg:rgba(217,64,64,0.15);--red-txt:#f08080;--red-bdr:#d94040;
  --amber-bg:rgba(212,144,10,0.15);--amber-txt:#e0b060;--amber-bdr:#d4900a;
  --marked-bg:rgba(155,89,232,0.15);--marked-txt:#c09af5;--marked-bdr:#9b59e8;
}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-size:var(--fs);background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}

/* ══ TOP BAR ══ */
.topbar{
  position:sticky;top:0;z-index:300;
  background:var(--surface);border-bottom:1px solid var(--border);
  height:48px;
}
.topbar-inner{
  max-width:var(--shell);margin:0 auto;
  padding:0 16px;height:100%;
  display:flex;align-items:center;
}
/* Left slot */
.topbar-left{display:flex;align-items:center;width:80px;flex-shrink:0}
/* Center slot */
.topbar-center{flex:1;text-align:center}
.topbar-logo{font-weight:700;font-size:1rem;color:var(--blue-txt);letter-spacing:2px}
/* Right slot */
.topbar-right{display:flex;align-items:center;justify-content:flex-end;width:80px;flex-shrink:0}

/* Gear icon button */
.gear-btn{
  width:34px;height:34px;border-radius:8px;
  border:1px solid var(--border2);background:var(--bg);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;padding:0;
  color:var(--text2);
}
.gear-btn:hover{border-color:var(--blue-bdr);color:var(--blue-txt)}
.gear-btn svg{width:16px;height:16px;display:block}

/* End button */
.end-btn{
  font-size:.82rem;font-weight:600;font-family:inherit;
  color:var(--text3);border:1px solid var(--border2);
  background:var(--bg);border-radius:8px;
  padding:0 10px;height:30px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.end-btn:hover{color:var(--red-txt);border-color:var(--red-bdr)}

/* ══ FULLSCREEN SETTINGS PANEL ══ */
.cfg-overlay{
  position:fixed;inset:0;z-index:400;
  background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateY(-100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
.cfg-overlay.open{transform:translateY(0)}

.cfg-topbar{
  position:sticky;top:0;z-index:10;
  background:var(--surface);border-bottom:1px solid var(--border);
  height:48px;display:flex;align-items:center;
  padding:0 16px;flex-shrink:0;
}
.cfg-topbar-inner{
  max-width:var(--shell);margin:0 auto;width:100%;
  display:flex;align-items:center;
}
.cfg-title{font-weight:700;font-size:1rem;color:var(--text);flex:1;text-align:center}
.cfg-close{
  width:34px;height:34px;border-radius:8px;
  border:1px solid var(--border2);background:var(--bg);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:var(--text2);transition:all .15s;
  margin-left:auto;flex-shrink:0;
}
.cfg-close:hover{border-color:var(--blue-bdr);color:var(--blue-txt)}

.cfg-body{max-width:var(--shell);margin:0 auto;width:100%;padding:24px 16px 40px;display:flex;flex-direction:column;gap:20px}

/* Section in panel */
.cfg-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.cfg-section-title{font-size:.72rem;font-weight:700;letter-spacing:2px;color:var(--text3);text-transform:uppercase;padding:12px 16px 0}
.cfg-section-body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.cfg-row{display:flex;align-items:center;gap:12px}
.cfg-label{font-size:.85rem;font-weight:600;color:var(--text2);min-width:72px;flex-shrink:0}

/* Font controls */
.fs-controls{display:flex;align-items:center;gap:8px}
.fs-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);background:var(--bg);color:var(--text2);font-weight:700;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.fs-btn:hover{border-color:var(--blue-bdr);color:var(--blue-txt)}
.fs-val{font-size:.9rem;font-weight:700;color:var(--blue-txt);min-width:38px;text-align:center}

/* Minimal theme toggle */
.theme-toggle-wrap{display:flex;align-items:center;gap:10px}
.theme-sw{
  display:flex;align-items:center;
  background:var(--bg);border:1px solid var(--border2);
  border-radius:100px;padding:3px;
  cursor:pointer;transition:border-color .15s;
  gap:2px;
}
.theme-sw:hover{border-color:var(--blue-bdr)}
.theme-sw-opt{
  width:34px;height:28px;border-radius:100px;
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;transition:background .2s;
  cursor:pointer;
}
.theme-sw-opt.active{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12)}
[data-theme=dark] .theme-sw-opt.active{box-shadow:0 1px 4px rgba(0,0,0,.4)}
.theme-sw-label{font-size:.85rem;color:var(--text2)}

/* Dots in panel — fully expanded */
.dots-panel-full{padding:0}
.dots-legend{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px 8px}
.dl{font-size:.75rem;color:var(--text3);display:flex;align-items:center;gap:4px}
.dlc{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.dots-grid-full{display:flex;flex-wrap:wrap;gap:5px;padding:4px 16px 16px}
.dot{width:34px;height:26px;border-radius:6px;border:1px solid var(--border2);background:var(--bg);font-size:.68rem;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;user-select:none}
.dot:hover{border-color:var(--blue-bdr);color:var(--blue-txt)}
.dot.dok{background:var(--green-bg);border-color:var(--green-bdr);color:var(--green-txt)}
.dot.dno{background:var(--red-bg);border-color:var(--red-bdr);color:var(--red-txt)}
.dot.dsk{background:var(--amber-bg);border-color:var(--amber-bdr);color:var(--amber-txt)}
.dot.dmk{box-shadow:0 0 0 2px var(--marked-bdr)}
.dot.dcur{border-color:var(--blue-bdr);font-weight:900;color:var(--blue-txt);box-shadow:0 0 0 2px rgba(59,125,216,.3);transform:scale(1.08)}
.dot.dok.dcur,.dot.dno.dcur,.dot.dsk.dcur{color:inherit}

/* ══ SHELL ══ */
.shell{max-width:var(--shell);margin:0 auto;padding:18px 16px 60px}

/* ══ HOME ══ */
.home-header{text-align:center;padding:20px 0 6px}
.home-header h1{font-size:1.2rem;font-weight:700}
.home-sub{text-align:center;font-size:.85rem;color:var(--text2);margin-bottom:20px}
.sec-lbl{font-size:.7rem;font-weight:700;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:8px}

.src-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.src-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--rl);padding:14px;cursor:pointer;transition:all .15s}
.src-card:hover{border-color:var(--blue-bdr)}
.src-card.on{border-color:var(--blue-bdr);background:var(--blue-bg)}
.src-card-icon{font-size:1.2rem;margin-bottom:5px}
.src-card-name{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:3px}
.src-card.on .src-card-name{color:var(--blue-txt)}
.src-card-desc{font-size:.82rem;color:var(--text3);line-height:1.5}

.cat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.cat-btn{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);transition:all .15s}
.cat-btn:hover{border-color:var(--blue-bdr)}
.cat-btn.on{border-color:var(--blue-bdr);background:var(--blue-bg)}
.cat-btn-name{font-size:1rem;font-weight:700;color:var(--text2);margin-bottom:2px}
.cat-btn.on .cat-btn-name{color:var(--blue-txt)}
.cat-btn-count{font-size:.82rem;color:var(--text3)}

.start-wrap{text-align:center;margin-bottom:20px}
.start-btn{background:var(--blue-txt);color:#fff;border:none;padding:11px 40px;border-radius:var(--r);font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:1px;transition:opacity .15s}
.start-btn:hover{opacity:.87}
.start-btn:disabled{opacity:.35;cursor:not-allowed}

.marked-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px}
.marked-box-title{font-size:.82rem;font-weight:700;color:var(--marked-txt);margin-bottom:10px}
.marked-tags{display:flex;flex-wrap:wrap;gap:6px}
.marked-tag{background:var(--marked-bg);border:1px solid var(--marked-bdr);color:var(--marked-txt);padding:4px 12px;border-radius:20px;font-size:.82rem;font-weight:700;cursor:pointer;transition:opacity .15s}
.marked-tag:hover{opacity:.75}
.no-marked{font-size:.82rem;color:var(--text3)}

/* ══ QUIZ ══ */
/* Stats row above question */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center}
.stat-l{font-size:.72rem;color:var(--text3);margin-bottom:2px}
.stat-v{font-size:1.1rem;font-weight:700}
.stat-v.g{color:var(--green-txt)}.stat-v.r{color:var(--red-txt)}

/* Progress bar */
.prog-wrap{margin-bottom:10px}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.prog-lbl{font-size:.82rem;color:var(--text3)}
.prog-pct{font-size:.82rem;color:var(--text3)}
.prog-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue-bdr);border-radius:3px;transition:width .3s}

/* Question card */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px 18px 16px;position:relative}
.q-meta{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap;align-items:center}
.q-num-badge{font-size:.82rem;font-weight:600;color:var(--blue-txt);background:var(--blue-bg);padding:2px 9px;border-radius:20px}
.q-cat-badge{font-size:.78rem;color:var(--text3);background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:20px}
.q-mark-btn{position:absolute;top:14px;right:14px;background:var(--bg);border:1px solid var(--border2);border-radius:50%;width:28px;height:28px;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--text3)}
.q-mark-btn.on{border-color:var(--marked-bdr);background:var(--marked-bg);color:var(--marked-txt)}
.q-mark-btn:hover{border-color:var(--marked-bdr);color:var(--marked-txt)}
.q-text{font-size:1em;line-height:1.75;margin-bottom:14px;padding-right:32px}

.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:1em;color:var(--text);line-height:1.55;transition:background .1s,border-color .1s;background:var(--surface);text-align:left;width:100%;font-family:inherit}
.opt:hover:not(:disabled){background:var(--bg);border-color:var(--border2)}
.opt:disabled{cursor:default}
.opt-k{font-weight:700;min-width:15px;color:var(--text3);font-size:.85em;flex-shrink:0;margin-top:2px}
.opt.ok{background:var(--green-bg);border-color:var(--green-bdr);color:var(--green-txt)}
.opt.ok .opt-k{color:var(--green-txt)}
.opt.no{background:var(--red-bg);border-color:var(--red-bdr);color:var(--red-txt)}
.opt.no .opt-k{color:var(--red-txt)}
.opt.dim{opacity:.4}

.exp{margin-top:11px;padding:10px 13px;background:var(--amber-bg);border:1px solid var(--amber-bdr);border-radius:var(--r);font-size:.9em;color:var(--amber-txt);line-height:1.65;display:none}
.exp.show{display:block}

/* action row — prev | next centred; skip absolute right */
.act{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;position:relative;min-height:38px}
.btn{padding:8px 20px;border-radius:var(--r);font-size:1rem;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:all .12s;font-family:inherit;white-space:nowrap;height:38px;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--blue-txt);border-color:var(--blue-txt);color:#fff}
.btn.pri:hover{opacity:.88}
.btn.skip-abs{position:absolute;right:0;top:0;font-size:1rem;padding:8px 16px;height:38px}
.btn.skip-abs:hover{background:var(--bg);border-color:var(--border2)}
.btn:disabled{opacity:.32;cursor:not-allowed}

/* Result */
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:26px;text-align:center;margin-top:12px}
.rscore{font-size:3rem;font-weight:700;line-height:1;margin-bottom:4px}
.rscore.pass{color:var(--green-txt)}.rscore.fail{color:var(--red-txt)}
.rbadge{display:inline-block;font-size:.82rem;font-weight:600;padding:3px 13px;border-radius:20px;margin-bottom:14px}
.rbadge.pass{background:var(--green-bg);color:var(--green-txt)}.rbadge.fail{background:var(--red-bg);color:var(--red-txt)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.rstat{background:var(--bg);border-radius:var(--r);padding:12px}
.rstat-l{font-size:.72rem;color:var(--text3);margin-bottom:2px}
.rstat-v{font-size:1.3rem;font-weight:700}
.rdesc{font-size:.88rem;color:var(--text2);margin-bottom:16px;line-height:1.8}
.rbtn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:480px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .src-row,.cat-row{grid-template-columns:1fr}
  .topbar-left,.topbar-right{width:60px}
}
</style>
</head>
<body data-theme="light">

<!-- ══ FULLSCREEN SETTINGS OVERLAY ══ -->
<div class="cfg-overlay" id="cfg-overlay">
  <div class="cfg-topbar">
    <div class="cfg-topbar-inner">
      <div style="width:34px"></div><!-- spacer -->
      <div class="cfg-title">設定</div>
      <button class="cfg-close" onclick="closeCfg()">✕</button>
    </div>
  </div>
  <div class="cfg-body">

    <!-- Font size -->
    <div class="cfg-section">
      <div class="cfg-section-title">顯示設定</div>
      <div class="cfg-section-body">
        <div class="cfg-row">
          <div class="cfg-label">字體大小</div>
          <div class="fs-controls">
            <button class="fs-btn" onclick="chFS(-1)">−</button>
            <div class="fs-val" id="fs-val">16px</div>
            <button class="fs-btn" onclick="chFS(1)">＋</button>
          </div>
        </div>
        <div class="cfg-row">
          <div class="cfg-label">顯示模式</div>
          <div class="theme-toggle-wrap">
            <div class="theme-sw" onclick="toggleTheme()" id="theme-sw">
              <!-- sun (light) -->
              <div class="theme-sw-opt active" id="sw-light">
                <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor" style="color:#d4900a">
                  <circle cx="10" cy="10" r="4"/>
                  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <line x1="10" y1="2" x2="10" y2="4"/>
                    <line x1="10" y1="16" x2="10" y2="18"/>
                    <line x1="2" y1="10" x2="4" y2="10"/>
                    <line x1="16" y1="10" x2="18" y2="10"/>
                    <line x1="4.1" y1="4.1" x2="5.5" y2="5.5"/>
                    <line x1="14.5" y1="14.5" x2="15.9" y2="15.9"/>
                    <line x1="15.9" y1="4.1" x2="14.5" y2="5.5"/>
                    <line x1="5.5" y1="14.5" x2="4.1" y2="15.9"/>
                  </g>
                </svg>
              </div>
              <!-- moon (dark) -->
              <div class="theme-sw-opt" id="sw-dark">
                <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor" style="color:#7eb3f5">
                  <path d="M15.5 12.6A7 7 0 0 1 7.4 4.5 7 7 0 1 0 15.5 12.6z"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Dots (quiz only) -->
    <div class="cfg-section" id="cfg-dots-section" style="display:none">
      <div class="cfg-section-title">題號總覽</div>
      <div class="dots-legend">
        <span class="dl"><span class="dlc" style="background:var(--green-bdr)"></span>答對</span>
        <span class="dl"><span class="dlc" style="background:var(--red-bdr)"></span>答錯</span>
        <span class="dl"><span class="dlc" style="background:var(--amber-bdr)"></span>略過</span>
        <span class="dl"><span class="dlc" style="background:transparent;outline:2px solid var(--marked-bdr);outline-offset:-1px"></span>標註</span>
        <span class="dl"><span class="dlc" style="background:transparent;outline:2px solid var(--blue-bdr);outline-offset:-1px"></span>目前</span>
      </div>
      <div class="dots-grid-full" id="dots-grid-cfg"></div>
    </div>

  </div>
</div>

<!-- ══ TOP BAR ══ -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <button class="gear-btn" id="gear-btn" onclick="openCfg()" title="設定">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="3"/>
          <path d="M10 2v1.5M10 16.5V18M2 10h1.5M16.5 10H18M4.22 4.22l1.06 1.06M14.72 14.72l1.06 1.06M15.78 4.22l-1.06 1.06M5.28 14.72l-1.06 1.06"/>
        </svg>
      </button>
    </div>
    <div class="topbar-center">
      <div class="topbar-logo">保險題庫</div>
    </div>
    <div class="topbar-right">
      <button class="end-btn" id="end-btn" onclick="goHome()" style="display:none">結束測驗</button>
    </div>
  </div>
</div>

<!-- ══ SHELL ══ -->
<div class="shell">

  <!-- HOME -->
  <div id="screen-home">
    <div class="home-header"><h1>人身保險業務員資格測驗</h1></div>
    <div class="home-sub">精選考題 ‧ 阿摩題庫 ‧ 保險法規 ‧ 保險實務</div>

    <div class="sec-lbl">選擇來源</div>
    <div class="src-row">
      <div class="src-card" id="src-jingxuan" onclick="selSrc('jingxuan')">
        <div class="src-card-icon">📚</div>
        <div class="src-card-name">精選考題</div>
        <div class="src-card-desc">法規 384 題 ／ 實務 253 題<br>歷屆精選重點考題</div>
      </div>
      <div class="src-card" id="src-amo" onclick="selSrc('amo')">
        <div class="src-card-icon">🎯</div>
        <div class="src-card-name">阿摩題庫</div>
        <div class="src-card-desc">法規 172 題 ／ 實務 90 題<br>阿摩線上練習題庫</div>
      </div>
    </div>

    <div class="sec-lbl">選擇科目</div>
    <div class="cat-row">

於 死或雖未致死者，喪失其受益權。因此保險公司仍 需給付全額失能保險金。"}, {"id": 8, "question": "有關保險法之規定何者正確？", "option_1": "人身保險契約得為指示式或無記名式", "option_2": "除要保人 外，其餘利害關係人不得向保險人請求保險契約謄本", "option_3": "受 益人有疑議時，其保險金額作為被保險人遺產", "option_4": "本法之強制規定不得以 契約變更之，但有利於被保險人者不在 此限", "answer": 4, "explanation": "(1)保險法第49 條規定：保險契約除人身保險外， 得為指示式或無記名式。 (2)保險法第44 條規定：利害關係人，均得向保險 人請求保險契約謄本。 (3)保險法第45 條規定：受益人有疑義時，推定要 保人為自己之利益而訂定。"}, {"id": 9, "question": "有關保險利益原則之敘述，何者為非？", "option_1": "又稱為可保利益原則", "option_2": "存在目 的系避免賭博行為發生", "option_3": "要保人對於為其管理財產之人具有保險利益", "option_4": "債權人對債務人之保險利益沒有限制。", "answer": 4, "explanation": "(4)債務人，債權人僅能於債務人所欠的債務金額內 具有保險利益。"}, {"id": 10, "question": "下列何者不是限制行為能力人訂定保險契約之生效方式？", "option_1": "於限制原因消 滅後自己承認", "option_2": "經被保險人同意", "option_3": "經其法定代理人事後承認", "option_4": "經其法定 代理人事前允許。", "answer": 2, "explanation": "限制行為能力人訂定保險契約，須經其法定代理人 之同意(事前允許或事後承認)，或於限制原因消滅 自己承認使有效。"}, {"id": 11, "question": "有關保險利益之敘述，何者有誤？", "option_1": "凡基於有效契約而生之利益，得為保 險利益", "option_2": "被保險人死亡，保險契約除另有訂定外，仍為繼承人之利益而存 在", "option_3": "合夥人為被保險人時，其中一人讓與保險利益於他人者，保險契約失 其效力", "option_4": "要保人對於因財產上之現有利益而生之期待利益，有保險利益。", "answer": 3, "explanation": "(3)合夥人或共有人聯合為被保險人時，其中一人或 數人讓與保險利益於他人者，保險契約不因之而失 效。"}, {"id": 12, "question": "死亡保險金受益人為被保險人配偶王大華，被保險人亡故前已離婚且再 婚，則被保險人死亡時該死亡保險金歸", "option_1": "前配偶王大華", "option_2": "要保人或其他 應得之人", "option_3": "被保險人遺產", "option_4": "再婚之配偶。", "answer": 1, "explanation": "此案屬於受益人有確定者，則被保險人死亡時該死 亡保險金歸此約定受益人。"}, {"id": 13, "question": "有關代位原則敘述何者錯誤？", "option_1": "財產保險適用", "option_2": "因為人身無價，故人壽 保險不適用", "option_3": "又稱為權利代位", "option_4": "保險人於賠償後須經被保險人同意始得 代位行使被保險人對於第三人之請求權。", "answer": 4, "explanation": "(4)保險人於賠償後，可直接向加害第三人要求賠 償。"}, {"id": 14, "question": "各項保險給付之受益人，何者錯誤？", "option_1": "滿期保險金受益人由要保人指定， 變更時由要保人申請", "option_2": "紅利給付之受益人皆為要保人", "option_3": "醫療給付之受益 人以被保險人為限，且不得事後加以變更", "option_4": "身故保險金如作為被保險人遺 產，依民法繼承順位分配。", "answer": 2, "explanation": "(2)若紅利未特別指定予何人，紅利原則上應由要保 人領取。"}, {"id": 15, "question": "有關最大誠信原則何者正確？A 契約訂立時要保人或被保險人應將有關的 重要事實告訴保險人；B 業務員應於親晤被保險人後誠實填報業務員報告 書；C 要保人違反告知義務時保險人得解除契約；D 為維護契約安定性， 如保險事故發生保險人才知要保人違反告知義務時，且危險發生基於未說 明事實者，仍不得解除契約", "option_1": "ABC", "option_2": "ABCD", "option_3": "AC", "option_4": "ACD", "answer": 3, "explanation": "B 業務員於親晤被保險人後誠實填報業務員報告書 不屬於最大誠信原則；D 為維護契約安定性，如保 險事故發生保險人才知要保人違反告知義務時，且 危險發生基於未說明事實者，得解除契約"}, {"id": 16, "question": "有關要保人何者為非？", "option_1": "須投保時填寫要保書並善盡告知、通知保險公司 保險事故發生之義務", "option_2": "向保險人申請訂立保險契約之人", "option_3": "有指定各項保 險金受益人、申請保險單借款及聲明保費自動墊繳之權利", "option_4": "以上皆是。", "answer": 3, "explanation": "失能保險金、醫療保險金、年金保險金之受益人皆 為被保險人本人。"}, {"id": 17, "question": "何者非要保人可指定受益人領取之保險金?A 失能保現金；B 醫療保險 金；C 終身壽險保險金；D 年金保險金", "option_1": "BCD", "option_2": "ACD", "option_3": "ABD", "option_4": "AB", "answer": 3, "explanation": "失能保險金、醫療保險金、年金保險金之受益人皆 為被保險人本人。"}, {"id": 18, "question": "有關要保人之敘述何者正確?A 保險契約當事人；B 自然人；C 機關行號； D 對保險對象需具有保險利益", "option_1": "CD", "option_2": "ABCD", "option_3": "ABD", "option_4": "BCD。", "answer": 2, "explanation": "ABCD 皆正確。"}, {"id": 19, "question": "債權人未經債務人書面承認而逕以債務人為被保險人訂立之年金保險契約", "option_1": "無效", "option_2": "失其效力", "option_3": "需債務人同意後才有效", "option_4": "有效。", "answer": 4, "explanation": "債權人未經債務人書面承認而逕以債務人為被保險 人訂立之年金保險契約有效。"}, {"id": 20, "question": "依保險法第20 條規定基於有效契約而生之利益", "option_1": "得為保險利益", "option_2": "僅得對 有效契約有保險利益", "option_3": "不得為保險利益", "option_4": "以上皆是。", "answer": 1, "explanation": "保險法第20 條規定，於有效契約而生之利益，亦 得為保險利益。"}, {"id": 21, "question": "下列何者錯誤？", "option_1": "失能保險金的受益人原則上為被保險人本人，如要變更 須在保險事故發生前", "option_2": "要保人可隨時終止保險契約", "option_3": "受益人應在知悉保 險事故發生後，於法定或契約約定期間內通知保險公司，並檢具所需文件 申領保險金", "option_4": "受益人係經要保人指定，享有保險金請求權的人。", "answer": 1, "explanation": "被保險人若身體遭受失能必須就醫治療時，為使失 能保險金能確實作為支應被保險人因失能所引起的 各項費用，所以失能保險之受益人以被保險人本人 為限，且不得加以變更。"}, {"id": 22, "question": "有關主力近因原則之敘述，何者正確？A 類似民法上的相當因果關係；B 常用於傷害保險與健康保險之賠償責任認定；C 導致被保險人死亡原因有 2 個以上，而每個原因有因果關係雖有中斷，其最先發生原因仍為主力近 因；D 即指最直接或最接近被保險人死亡的原因", "option_1": "ABD", "option_2": "ABCD", "option_3": "AB", "option_4": "BC。", "answer": 3, "explanation": "主力近因是指致被保險人死亡或受傷最主要或有效 的原因，而不是最直接或最接近的原因，類似民法 中的因果關係，假設原因有2 個以上，且每個原因 之間有因果關係且未中斷時，則以最先發生並造成 一連串事故之原因為主力近因。"}, {"id": 23, "question": "受益人經指定後", "option_1": "經被保險人同意於保險事故發生前得變更受益人", "option_2": "不 得再變更受益人", "option_3": "於保險事故發生前得變更受益人", "option_4": "於保險事故發生後 得變更受益人。", "answer": 1, "explanation": "受益人經要保人指定後，要保人在保險事故發生 前，仍得以契約或遺囑處分之。要保人行使變更受 益人之處分權時，應通知保險公司並檢附被保險人 同意書。"}, {"id": 24, "question": "張三以自己為要保人，對下列何者之生命或身體無保險利益：A 借錢給張 三的李四；B 張三本人；C 欠張三錢的王老五", "option_1": "A", "option_2": "AC", "option_3": "ABC", "option_4": "BC。", "answer": 1, "explanation": "要保人對於下列個人之生命或身體有保險利益： 本人或家屬、生活費或教育費養給之人、債務人、 為本人管理財產獲利益之人。"}, {"id": 25, "question": "依保險法第17 條之規定，要保人或被保險人，對於保險標的物無保險利 益者，保險契約", "option_1": "有效", "option_2": "無效", "option_3": "失其效力", "option_4": "以上皆非。", "answer": 3, "explanation": "要保人或被保險人，對於保險標的物無保險利益 者，保險契約失其效力。"}, {"id": 26, "question": "依據保險法規定，要保人的權力包含A 變更失能及醫療保險金之受益人； B 行使契約撤銷權；C 申請契約變更；D 申請保險單借款、聲明續期保險 費自動墊繳", "option_1": "ABCD", "option_2": "ABD", "option_3": "ABC", "option_4": "BCD。", "answer": 4, "explanation": "A 失能及醫療保險金之受益人以被保險人本人為 限，且不得事後加以變更。"}, {"id": 27, "question": "某甲為支應其子某乙之學費向丙銀行貸款，請問下列何者對某甲具有保險 利益？A 甲；B 乙；C 丙銀行；D 某甲投保的保險公司", "option_1": "BCD", "option_2": "AB", "option_3": "ABC", "option_4": "A。", "answer": 3, "explanation": "甲提供乙學費，甲即為乙生活費或教育費所仰給之 人，則乙對甲有保險利益；丙銀行借款給甲，甲是 債務人，丙是債權人，債權人對債務人有保險利 益。Ａ甲對自己有保險利益；Ｂ乙對甲有保險利 益；Ｃ丙銀行是債權人，對甲也有保險利益"}, {"id": 28, "question": "對於要保人的敘述，何者錯誤", "option_1": "要保人訂立保險契約不得委由代理人代理", "option_2": "要保人可以為自然人或法人", "option_3": "要保人負有交付保險費之義務", "option_4": "要保人 對被保險人須具有保險利益。", "answer": 1, "explanation": "依保險法第46 條： 「保險契約由代理人訂立者，應 載明代訂之意旨」之規定辦理，故得委由代理人代 理。"}, {"id": 29, "question": "按照我國保險法條規定，受益人有疑義時，推定誰為受益人？", "option_1": "要保人", "option_2": "被保險人", "option_3": "被保險人之法定繼承人", "option_4": "以上三者皆可。", "answer": 1, "explanation": "依保險法第45 條第2 項規定： 「受益人有疑義 時，推定要保人為自己之利益而訂立」即由法律推 定以要保人為受益人。"}, {"id": 30, "question": "有關保險受益人之規定，何者正確？A 因保險給付不同可區分為滿期、身 故、失能或醫療、年金及紅利等受益人；B 為人身保險契約關係人；C 保 險事故發生時有權受領保險金，而失能保險金之受益人不以被保險人為 限；D 與要保人、被保險人須具有保險利益", "option_1": "BCD", "option_2": "AB", "option_3": "ABCD", "option_4": "ABD。", "answer": 2, "explanation": "C 保險事故發生時有權受領保險金，而失能保險金 之受益人僅以被保險人為限；D 要保人只對被保險 人具有保險利益。"}, {"id": 31, "question": "人壽保險受益人之指定何者正確？A 除自然人外，得指定法人；B 得指定 一人或數人；C 可同時指定自然人及法人；D 訂立保險契約時得僅載明確 定受益人之方法(", "option_1": "", "option_2": "", "option_3": "", "option_4": "", "answer": 1, "explanation": ")ABCＤ(2)ABC(C)BD(4)ABD。 2 指定時不限於指出受益人之姓名，即以類名指定亦 可，如配偶、子女。"}, {"id": 32, "question": "下列何者不是保險契約之成立要件", "option_1": "受益人與被保險人間須有保險利益", "option_2": "意思表示一致", "option_3": "要保人須具有行為能力", "option_4": "支付對價。", "answer": 1, "explanation": "(1)要保人與被保險人間須有保險利益。"}, {"id": 33, "question": "要保人對下列何者之生命或身體，無保險利益", "option_1": "債務人", "option_2": "本人", "option_3": "為本人 管理財產或利益之人", "option_4": "生活費或教育費所收受之人。", "answer": 4, "explanation": "要保人對於生活費或教育費所仰給之人有保險利 益。"}, {"id": 34, "question": "依保險法之規定，受益人於請求保險金時，應以", "option_1": "有保險利益者", "option_2": "生存 者", "option_3": "有保險利益者且生存者", "option_4": "有行為能力者 為限。", "answer": 2, "explanation": "依保險法之規定，受益人於請求保險金時，應以生 存者為限。"}, {"id": 35, "question": "人壽保險契約是以人的生命或身體為保險標的，所以適用", "option_1": "損害填補原則", "option_2": "分攤原則", "option_3": "保險代位原則", "option_4": "以上皆非。", "answer": 4, "explanation": "人身保險契約僅適用保險利益原則、最大誠信原 則、主力近因原則。產險除了適用上述三項原則 外，另適用損害填補、分攤、保險代位原則。"}, {"id": 36, "question": "A 人壽保險；B 實支實付型的健康保險；C 年金保險；D 日額型健康保 險，以上何者適用分攤原則", "option_1": "AB", "option_2": "BD", "option_3": "ABCD", "option_4": "B。", "answer": 4, "explanation": "分攤原則：指保險人和保險人之間，在保險事故發 生後對理賠金額的分攤。除實支實付型的健康險商 品較適用損害填補原則及分攤原則外，在人壽保險 並不適用分攤原則。"}, {"id": 37, "question": "何謂主力近因原則？", "option_1": "非民法中的因果關係", "option_2": "是指導致被保險人死亡或 受傷的最主要或最有效的原因", "option_3": "導致保險事故發生的主要近因不一定是保 險單上所保的危險，且保險人仍應負責", "option_4": "以上皆是。", "answer": 2, "explanation": "主力近因：指導致被保險人死亡或受傷的最主要或 最有效的原因，類似我國民法上的相當因果關係， 如果導致保險事故發生的主要近因為保單上所保的 危險，則保險人自應負責，反之則不必負責。"}, {"id": 38, "question": "受益人的產生方式 A 約定；B 指定；C 確定；D 法定", "option_1": "AB", "option_2": "BCD", "option_3": "ABD", "option_4": "ABCD。", "answer": 3, "explanation": "受益人的產生方式有約定、指定、法定3 種方式。"}, {"id": 39, "question": "要保人以契約或遺囑變更受益人時，非經通知，不得對抗", "option_1": "保險人", "option_2": "受 益人", "option_3": "被保險人", "option_4": "保險業務員。", "answer": 1, "explanation": "處分保單保單權利，如受益人之指定與變更(需被 保險人書面同意)、保單貸款等。"}, {"id": 40, "question": "有關分攤原則敘述何者正確？A 由保險代位原則延伸而來；B 又稱為攤派 原則；C 分攤原則指保險費之分攤應公平合理；D 人壽保險及年金保險不 適用分攤原則", "option_1": "ABD", "option_2": "BD", "option_3": "BC", "option_4": "ABC。", "answer": 2, "explanation": "A 是從損害填補原則延伸而來；B 對於理賠金額之 分攤。"}, {"id": 41, "question": "甲提供生活費或教育費給乙，則", "option_1": "甲與乙互無保險利益", "option_2": "乙對甲有保險 利益", "option_3": "甲與乙互有保險利益", "option_4": "甲對乙有保險利益。", "answer": 2, "explanation": "要保人對以下人有保險利益：本人或其家屬、生活 費或教育費仰給之人、債務人、為本人管理財產或 利益之人。"}, {"id": 42, "question": "下列有關受益人產生之敘述何者為是？", "option_1": "無人數的限制", "option_2": "可為約定、指 定、法定", "option_3": "受益人有疑義時，推定要保人為自己之利益而訂立", "option_4": "以上皆 是。", "answer": 4, "explanation": "全選。"}, {"id": 43, "question": "下列有關保險人之規定，何者為非？", "option_1": "目前國內之保險公司，均為股份有 限公司", "option_2": "非保險業不得兼營保險業務", "option_3": "保險法之規定，保險業之組織以 股份有限公司或合作社為限", "option_4": "人身保險人可為法人或自然人。", "answer": 4, "explanation": "(4)人身保險人僅能為法人。"}, {"id": 44, "question": "下列何者正確？", "option_1": "滿7 歲之未成年人皆為限制行為能力人，其所為意思 表示及所受意思表示應得法定代理人允許", "option_2": "法院依聲請權人聲請其家屬有 精神障礙致不能為意思表示者，得為監護宣告或輔助宣告", "option_3": "未滿7 歲之 未成年人投保時，僅由法定代理人在法定代理人欄位親簽同意已足", "option_4": "限制 行為能力人為日常生活必需之意思表示，仍應得法定代理人允許。", "answer": 2, "explanation": "(1)滿7 歲之未成年人為限制行為能力人，其所為 意思表示及所受意思表示應得法定代理人允許，惟 未成年人已婚者，有行為能力(3)子女未滿7 歲， 須由法定代理人代簽孩子姓名及在法定代理人簽名 欄位上親自簽名同意(4)限制行為能力人為日常生活 必需之意思表示，不須得法定代理人允許。"}, {"id": 45, "question": "下列敘述何者正確？", "option_1": "保險契約有效期間是要保人與保險公司約定，交付 保險費的期間", "option_2": "受益人是指保險事故發生時身體遭受損害，享有賠償請求 權之人", "option_3": "受益人是指經要保人指定，享有保險金請求權的人", "option_4": "團體保險 契約之死亡受益人由要保人指定。", "answer": 3, "explanation": "(1)保險契約有效期間是要保人交付保險費後，保險 公司應負保險責任期間(2)受益人是要保人指定或要 保人或被保險人約定，保險事故發生時或約定情況 發生時，享有賠償請求權之人(4)團體保險契約之死 亡受益人被保險人家屬或指定法定繼承人 。"}, {"id": 46, "question": "下列何者依保險法規定得代為交付保險費 A 信託業；B 被保險人；C 受益 人；D 保險業務員", "option_1": "BCD", "option_2": "BC", "option_3": "ABCD", "option_4": "ABC。", "answer": 4, "explanation": "保險業務員不可代為交付保險費。"}, {"id": 47, "question": "下列有關保險代位原則之敘述，何者正確？", "option_1": "人壽保險與產物保險依法均 得代位行使請求權", "option_2": "人壽保險不得代位行使請求權", "option_3": "指事故發生時，由 保險人代位行使被保險對第三人之請求權", "option_4": "以上皆是。", "answer": 2, "explanation": "(1)僅產物保險得行使代位請求權(3)指保險人於給 付賠償後，保險人代位行使被保險對第三人之請求 權。"}, {"id": 48, "question": "有關保險利益原則敘述何者正確？A 又稱為可保利益；B 指要保人對於被 保險人生命身體因具有利害關係而可享有的合法及不合法的經濟利益；C 要保人對於為其管理財產或利益之人有保險利益；D 保險利益包含現有利 益及期待利益", "option_1": "ABCD", "option_2": "AC", "option_3": "ABC", "option_4": "ACD。", "answer": 4, "explanation": "B 保險利益指要保人應對於被保險人之生命或身體 因具有利害關係而可享有之合法經濟利益。"}, {"id": 49, "question": "保險利益須存在於", "option_1": "被保險人與受益人間", "option_2": "要保人與受益人間", "option_3": "要保人 與被保險人間", "option_4": "要保人與保險人間。", "answer": 3, "explanation": "保險利益：指要保人應對於被保險人之生命或身體 因具有利害關係而可享有之合法經濟利益。"}, {"id": 50, "question": "要保人訂立契約須", "option_1": "具有行為能力", "option_2": "不須具有行為能力", "option_3": "限制行為能力 於限制原因消滅後自己承認", "option_4": "僅1、", "answer": 3, "explanation": "為是。 4 訂立契約之雙方當事人必須具有行為能力，若為限 制行為能力之人，須經法定代理人同意或於限制原 因消滅後自己承認。"}, {"id": 51, "question": "要保人對下列何者應付通知保險人之義務", "option_1": "為保險人所知者", "option_2": "經保險人 聲明不必通知者", "option_3": "為被保險人所知者", "option_4": "依通常注意為保險人所應知，或 無法諉為不知者。", "answer": 3, "explanation": "要保人對為被保險人所知者應付通知保險人之義 務。"}, {"id": 52, "question": "分攤原則其主要目的是", "option_1": "確定保險人賠償責任", "option_2": "使要保人不致不當得利", "option_3": "使被保險人不致不當得利", "option_4": "以上皆非。", "answer": 3, "explanation": "分攤原則其主要目的是使被保險人不致不當得利， 由損害填補原則延伸而來。"}, {"id": 53, "question": "對於損害填補原則之敘述何者正確？A 防止被保險人不當得利；B 需保險 人有二張以上保險單才可能發生；C 僅適用於人身保險；D 僅適用於財產 保險", "option_1": "AD", "option_2": "A", "option_3": "BD", "option_4": "ABC。", "answer": 2, "explanation": "B 僅一張即可發生；C 只適用於實支實付健康險； D 可適用於實施時付健康險。"}, {"id": 54, "question": "有關人身保險契約之保險費何者為非？", "option_1": "信託業依信託契約有交付保險 費義務者， 由信託業代為交付", "option_2": "僅應由要保人依保險契約交付", "option_3": "保險 契約簽定時保險費能確 定者，應於保險契約生效前交付之", "option_4": "可分一次及 分期交付兩種", "answer": 2, "explanation": "保險法第115 條規定：利害關係人，均得代要保 人交付保險費。"}, {"id": 55, "question": "下列有關電子保單的敘述何者為非？", "option_1": "保險人與要保人共同約定", "option_2": "約 定後不能恢復紙本", "option_3": "保費費率應該反映成本", "option_4": "以上皆是", "answer": 2, "explanation": "約定保單型態為電子保單後，仍舊可以與保險公司 申請補發紙本保單"}, {"id": 56, "question": "有關受益人之一為維持契約效力代繳險費之規定，何者錯誤：", "option_1": "受益人 領取保險金仍 依保單所載順序及比例給付", "option_2": "受益人待繳保險費屬民法上 無因管理", "option_3": "受益人代繳 保費，不影響與其他受益人間對於保險金有連帶 債權之關係", "option_4": "代繳保費之受益人得 要求保險人不得將保險金給付給其他 受益人", "answer": 4, "explanation": "受益人經指定後，要保人得於保險事故發生前，以 契約或遺囑處分。"}, {"id": 57, "question": "關於保險費及保險費率之敘述各項何者正確：A 保險費繳納的方式可分為 一次繳清及分期交付二種：B 一次繳清的保險費又稱為躉繳保險費：C 保險費是保險公司依據保 險金額、保險費率及繳費方式等因素所計算出 要保人每期應交付保險公司的金額：D 分期交付保險費又分為每年、每 半年、每季及每月交付等四種，按年分期交付的保險費 又稱為年繳保險 費", "option_1": "ABD", "option_2": "BCD", "option_3": "ABC", "option_4": "ABCD", "answer": 4, "explanation": "以上選項皆正確"}, {"id": 58, "question": "有關「繳費期間」之敘述何者正確？", "option_1": "於繳費期間屆滿後，保險契約持 續有效到保險 期間終了", "option_2": "「繳費期間」和「保險期間」一定相同", "option_3": "繳 費期間是要保人與保險公司 所約定之保險契約存續期", "option_4": "要保人不得約定 交付保險費的繳費期間比保險期間短的 保險契約", "answer": 1, "explanation": "(2)繳費期間與保險期間不一定相同 (3)要保人與保險公司所約定之保險契約存續期指的 是保險期間 (4)無此項規定"}, {"id": 59, "question": "契約之解除與契約之終止，對契約效力而言", "option_1": "解除為自解除之日起消 滅，終止為自始不存在", "option_2": "解除為自始不存在，終止為自終止之日起消滅", "option_3": "自解除或終止之日起不存在", "option_4": "皆為自始不存在", "answer": 2, "explanation": "契約解除一經解除則溯及訂立時自始無效，且保險 人無須退還保費。 契約終止指的是保險契約的當事人不願讓契約存 續，中途使之效力終止，因此終止之契約效力為自 終止日起消滅。契約終止前發生之保險事故，保險 人仍應付保險責任。"}, {"id": 60, "question": "住院醫療費用保險若包含保證續保條款，保險公司可按續保生效當時重新 計算保險費 A 陳報主管機關之費率：B 該險種之經驗費率：C 被保險人 年齡：D 被保險人身體狀況", "option_1": "AC", "option_2": "BD", "option_3": "BCD", "option_4": "ACD", "answer": 1, "explanation": "根據住院醫療費用保險單示範條款第12 條規定： 保證續保適用時，續保時，按續保生效當時依規定 陳報主管機關之費率及被保險人年齡重新計算保險 費。"}, {"id": 61, "question": "要保人自停效日起6 個月後申請復效者，保險人得於要保人申請復效日起 A 日內要求提供可保證明，或於收到前項可保證明後B 日內不為拒絕視為 同意復效，請問A、B 應為", "option_1": "A 為5，B 為15", "option_2": "A 為5，B 為10", "option_3": "A 為 10，B 為30", "option_4": "A 為10，B 為15。", "answer": 1, "explanation": "要保人自停效日起6 個月後申請復效者，保險人得 於要保人申請復效日起5 日內要求提供可保證明， 或於收到前項可保證明後15 日內不為拒絕者，視 為同意復效。"}, {"id": 62, "question": "以受監護宣告尚未撤銷者為被保險人投保之人壽保險契約，其喪葬費用保 險金額如超過遺產及贈與稅法有關喪葬費扣除額1/2 時", "option_1": "保險人完全不 負給付保險金責任，無須退還已繳保費", "option_2": "保險人僅就超過部分不負給付保 2 以受監護宣告尚未撤銷者為被保險人投保之人壽保 險契約，其喪葬費用保險金額如超過遺產及贈與稅 法有關喪葬費扣除額1/2 時，保險人僅就超過部分 險金責任，無息退還超過部分之已繳保費", "option_3": "保險人僅就超過部分不負給付 保險金責任，加計利息退還超過部分之已繳保費", "option_4": "保險人完全不負給付保 險金責任，無息退還已繳保費。 不負給付保險金責任，無息退還超過部分之已繳保 費。", "answer": "", "explanation": ""}, {"id": 63, "question": "保戶以網址取代紙本保單條款之規定，何者正確？", "option_1": "保單條款是保險人與 被保險人共同遵守的約定", "option_2": "保戶同意後不能再向保險人申請紙本保單", "option_3": "保險人因此節省的紙張印製成本需於附加費用反映", "option_4": "以上皆是。", "answer": 3, "explanation": "(1)保單條款是保險人與要保人共同遵守的約定(2) 保戶同意後能再向保險人申請紙本保單。"}, {"id": 64, "question": "甲以無體檢保件投保後，發覺保險內容非當初本意，故書面向保險人行使 契約撤銷權，其契約", "option_1": "自書面送達時起自始無效", "option_2": "自書面到達之翌日零 時起自始無效", "option_3": "因無體檢保件，故甲不得主張撤銷權", "option_4": "自書面到達之日 零時起自始無效。", "answer": 2, "explanation": "無論有無體檢，要保人得於收到保單翌日起十日內 以書面檢同保險單撤銷契約，自書面到達之翌日零 時起自始無效。"}, {"id": 65, "question": "何者為適用人身保險之法定無效事由？A 契約訂立時保險標的危險已發生 或已消滅；B 由第三人訂立之死亡保險契約，未經被保險人書面同意並約 定保險金額；C 被保險人以不實年齡投保，其真實年齡已超過保險人所定 保險年齡限度者；D 要保人意圖不當得利而為複保險", "option_1": "ABD", "option_2": "BCD", "option_3": "ABCD", "option_4": "ABD", "answer": 3, "explanation": "ABCD 皆為法定無效事由。"}, {"id": 66, "question": "有關利率變動型年金之敘述，何者為非？", "option_1": "若採分紅方式設計應明訂計算 方式及給付方式", "option_2": "甲型於給付期間僅採不分紅方式設計", "option_3": "於累積期間不 論甲型或乙型，均無紅利給付", "option_4": "乙型於給付期間通常無紅利給付。", "answer": 2, "explanation": "(2)甲型於給付期間可採分紅或不分紅方式。"}, {"id": 67, "question": "下列何者正確？", "option_1": "保險契約因違反告知義務而解除時，保險人應返還所收 保費", "option_2": "保險契約因保險人破產而中止，其終止後之保費已交付者無須返還", "option_3": "保險人對於要保人或被保險人因履行道德上之義務所致之損害，不負賠 償責任", "option_4": "訂立保險契約時僅要保人知悉危險已發生，保險人得請求償還費 用，其已收受之保費無須返還。", "answer": 4, "explanation": "(1)保險契約因違反告知義務而解除時，保險人無須 返還所收保費。(2)保險契約因保險人破產而中止， 其終止後之保險費，已交付者，保險人應返還之。 (3)保險人對於要保人或被保險人因履行道德上之義 務所致之損害，負賠償責任。"}, {"id": 68, "question": "保險契約法定終止事由有A 保險人破產時；B 要保人任意終止時；C 保險 契約停效後且已逾申請復效所訂期限；D 保險標的物非因保險契約所載之 事故而完全滅失時", "option_1": "AD", "option_2": "ACD", "option_3": "BC", "option_4": "ABC。", "answer": 1, "explanation": "保險契約法定終止事由有保險人破產時、保險標的 物非因保險契約所載之事故而完全滅失時。"}, {"id": 69, "question": "下列何者正確？A 要保人得於收到保單翌日起十日內以書面檢同保險單終 止契約；B 契約撤銷效力自要保人書面意思表示到達保險人翌日零時起生 效；C 契約撤銷效力自要保人郵寄郵戳當日零時起生效；D 撤銷生效前如 發生保險事故，保險人仍應應負保險責任", "option_1": "ACD", "option_2": "AB", "option_3": "BD", "option_4": "BCD", "answer": 3, "explanation": "A 要保人得於收到保單翌日起十日內以書面檢同保 險單撤銷契約；C 契約撤銷效力自要保人郵寄郵戳 翌日零時起生效。"}, {"id": 70, "question": "保險契約如約定事項顯失公平者，該部分之約定無效，下列何者非無效事 由？", "option_1": "免除或減輕保險人依保險法應負之義務", "option_2": "使要保人、受益人或被 保險人拋棄或限制其依保險法所享之權利", "option_3": "加重保險人之義務", "option_4": "其他於 要保人、受益人或被保險人有重大不利益之情事。", "answer": 3, "explanation": "加重保險人之義務非約定無效事由。"}, {"id": 71, "question": "有關年金保險敘述，何者為是？A 保險費不得以訴訟方式請求交付；B 利 害關係人得代要保人交付保險費；C 保險費到期未交付不適用寬限期間之 規定；D 由第三人訂立之契約，未經被保險人書面同意並約定保險金額者 契約無效", "option_1": "BCD", "option_2": "ABC", "option_3": "ABD", "option_4": "AB。", "answer": 2, "explanation": "D 由第三人訂立之年金保險契約，未經被保險人書 面同意並約定保險金額者契約仍有效。"}, {"id": 72, "question": "有關保險契約之敘述，何者正確？", "option_1": "當事人一方違背特約條款時，即使危 險已發生，他方仍得解除契約", "option_2": "當事人一方對於他方應通知之事項怠於通 知者，僅於故意造成，他方始得據為解約之原因", "option_3": "非因要保人或被保險人 行為致危險增加時，要保人或被保險人如未及時通知，對於保險人因此所 受之損失，免負賠償責任", "option_4": "以上皆是。", "answer": 1, "explanation": "(2)當事人一方對於他方應通知之事項怠於通知者， 如為故意隱匿，或因過失，遺漏或為不實之說明， 他方始得據為解約之原因(3)非因要保人或被保險人 行為致危險增加時，要保人或被保險人如未及時通 知，對於保險人因此所受之損失，應負賠償責任"}, {"id": 73, "question": "依保險法規定，傷害保險之保險費", "option_1": "到期未交付不適用寬限期間之規定", "option_2": "保險人不得以訴訟請求交付", "option_3": "利害關係人不得代要保人交付", "option_4": "以上皆 非。", "answer": 4, "explanation": "(1)到期未交付適用寬限期間之規定(2)保險人得以 訴訟請求交付(3)利害關係人得代要保人交付。"}, {"id": 74, "question": "主管機關訂定示範條款目的為A 確立保險商品在社會上的信譽；B 減少條 款文字或解釋上的分歧；C 授權訂定條款的彈性提高市場競爭力；D 使保 險業販售同商品時有統一作業處理方式", "option_1": "AC", "option_2": "ABC", "option_3": "ABD", "option_4": "BD。", "answer": 3, "explanation": "主管機關訂定示範條款目的為使各人身保險業在販 售同一種類的保險單時有統一的作業處理方式，減 少因條款文字說明或解釋的分歧與不明而導致無謂 的糾紛，確立人身保險商品在社會上的信譽。"}, {"id": 75, "question": "有關傷害醫療保險金之敘述，何者為非？", "option_1": "實支實付型之保險給付，保險 公司僅就符合意外傷害事故，且於登記合格的醫院或診所治療之實際醫療 費用，超過全民健康保險部分給付", "option_2": "保險公司基於審核保險金需要，得對 3", "option_3": "日額型每次傷害給付日數不得超過180 日，但 超過180 日繼續治療者，受益人若能證明被保險 人之治療與該意外傷害事故具有因果關係者，不在 被保險人身體予以檢驗，另得徵詢其他醫師專業意見，所生費用由保險公 司負擔(3)日額型每次傷害給付日數不得超過180 日", "option_4": "一般以附約方式處 理，分成實支實付與日額型2 種。 此限。", "answer": "", "explanation": ""}, {"id": 76, "question": "要保人在保險契約有效期間內得申請減少保險金額，但不得低於最低承保 金額，其減少部分視為", "option_1": "解除契約", "option_2": "終止契約", "option_3": "無效", "option_4": "停效。", "answer": 2, "explanation": "要保人在保險契約有效期間內得申請減少保險金 額，但不得低於最低承保金額，其減少部分視為終 止契約。"}, {"id": 77, "question": "下列何者為非?", "option_1": "要保人希望投保的金額稱為保險金額", "option_2": "保險事故發生後 保險公司給付之金額稱為保險金", "option_3": "保險公司就平準繳費的保險契約將來可 能發生的給付責任所提存的金額稱為責任準備金", "option_4": "保險公司同意承保之金 額稱為保險金額。", "answer": 1, "explanation": "(1)保險金額是保險公司同意承保的金額。"}, {"id": 78, "question": "保險公司於保單申請復效期限屆滿前提供哪些服務?A 於申請復效期限屆 滿前3 個月通知要保人申請復效；B 通知以書面、電子郵件、簡訊或其他 約定方式擇一方式；C 依要保人最後留存公司聯絡資料通知；D 屬於法定 義務", "option_1": "AD", "option_2": "CD", "option_3": "ABCD", "option_4": "ABC", "answer": 4, "explanation": "D 屬強化服務非法定義務。"}, {"id": 79, "question": "依保險法規定，保費超過寬限期間而仍未交付，除約定得由保險公司自動 墊繳者外，保險單即停止效力，要保人於催告期間繳付保費應", "option_1": "以郵局劃 撥繳費", "option_2": "依原約定方式繳費", "option_3": "以網路連線交付", "option_4": "於保險公司營業所交 付。", "answer": 4, "explanation": "依保險法規定，保險費於催告期間由要保人繳付 者，不論原繳費的地點如何約定，保費應於保險公 司營業所交付之。"}, {"id": 80, "question": "有自動墊繳的保險契約，給付保險金時", "option_1": "應扣還墊繳保費之利息", "option_2": "應扣 還墊繳保費", "option_3": "無需扣還墊繳保費", "option_4": "應扣還墊繳保費本息", "answer": 4, "explanation": "有自動墊繳的保險契約，給付保險金時應扣還墊繳 保費本息。"}, {"id": 81, "question": "人壽保險單示範條款約定，保險契約因保險單借款本息逾保單價值準備金 而停效者，要保人於復效時", "option_1": "均須經保險公司同意始得復效", "option_2": "須清償全 部欠繳保險單借款本息始得復效", "option_3": "於停效後6 個月內之復效申請始得部 分清償後復效", "option_4": "得部分清償欠繳保險單借款本息後復效，其未償餘額並不 得逾保險單借款約定可借金額之上限。", "answer": 4, "explanation": "若因保單借款本息已逾保單價值準備金，而使保單 停效，欲恢復效力，須先清償欠款，但清償方式可 採部分清償，且未償餘額不可以超過原保單借款可 借金額之上限。"}, {"id": 82, "question": "年金保險中，不論被保險人生存與否，保險公司保證給付期間的年金保險 稱為", "option_1": "遞延年金保險", "option_2": "即期年金保險", "option_3": "保證金額年金保險", "option_4": "保證期間年 金保險。", "answer": 4, "explanation": "年金保險的給付原則為被保險人生存時給付，但法 令另有規定，保險公司須設計保證的給付方式，不 論被保險人生存與否，保證給付固定期間的年金， 稱為保證期間年金。"}, {"id": 83, "question": "保戶違反告知義務時，保險人得", "option_1": "解除契約返還已繳保費", "option_2": "解除契約並 按解約金列表給付", "option_3": "解除契約不返還保費", "option_4": "終止契約並按解約金列表給 付。", "answer": 3, "explanation": "保戶違反告知義務足以變更或減少保險人對危險之 估計者，保險人得解除契約，契約自始無效，且保 險人無須返還保費。"}, {"id": 84, "question": "債權人未經債務人書面承認而逕以債務人為被保險人訂立之年金保險契約", "option_1": "停效", "option_2": "無效", "option_3": "有效", "option_4": "視情形而定。", "answer": 3, "explanation": "年金保險契約是生存契約，且年金保險契約無道德 風險問題，故仍有效。"}, {"id": 85, "question": "失能保險金不論被保險人失能次數及程度如何，受益人得請領之總金額皆 不得超過", "option_1": "責任準備金", "option_2": "保險金額", "option_3": "所繳保險費總額", "option_4": "保單價值準備 金。", "answer": 2, "explanation": "被保險人於本契約有效期間內因不同義務傷害事故 申領失能保險金時，保險公司累計給付金額最高以 保險金額為限。"}, {"id": 86, "question": "遞延年金保險第二期以後保險費如未依約繳付，不適用何者規定？A 寬限 期；B 停效；C 變更為減額繳清保險", "option_1": "AB", "option_2": "AC", "option_3": "BC", "option_4": "ABC。", "answer": 1, "explanation": "第二期以後分期保險費到期未交付時，自保險單所 載交付日期起三十日仍未交付者，本公司得自翌日 起按第十三條規定將本契約變更為減額繳清保險， 使本契約繼續有效。"}, {"id": 87, "question": "月繳或季繳保險契約第二期以後分期保險費到期未交付，其寬限期間之起 算日為", "option_1": "保險費應繳日", "option_2": "催告到達之翌日", "option_3": "保險費應繳日之翌日", "option_4": "催告 到達之日。", "answer": 3, "explanation": "月繳或季繳者，寬限期限之起算得免經催告之程 序，保險契約的寬限期間自保險單所載交付日期的 翌日起OO 日(不得低於三十日)。"}, {"id": 88, "question": "申請復效時，要保人可以在保險契約停止效力6 個月內清償欠繳保險費扣 除停效期間的", "option_1": "危險保險費", "option_2": "儲蓄保險費", "option_3": "純保險費", "option_4": "附加保險費 後之餘額及保險契約約定之利息後，翌日上午零時起開始恢復其效力。", "answer": 1, "explanation": "保險契約停效後，要保人可以在保險契約停止效力 起6 個月內清償保險險費扣除停效期間危險保險費 後的餘額及保險契約約定之利息後，翌日上午零時 起開始恢復其效力。"}, {"id": 89, "question": "保險金的支付除情況特殊外，保險公司應於收齊所需文件後", "option_1": "15 日", "option_2": "5 日", "option_3": "1 個月", "option_4": "10 日 內給付，逾期保險公司應按年利一分加計利息給 付。", "answer": 1, "explanation": "保險金的給付：保險公司應於收齊申請文件後15 日內給付保險金額，逾期保險公司應按年利一分加 計利息給付。"}, {"id": 90, "question": "下列何者不屬於住院醫療保險所稱醫院？A 健檢中心；B 安養中心；C 診 所；D 國術館", "option_1": "BD", "option_2": "ABCD", "option_3": "AB", "option_4": "ABD。", "answer": 2, "explanation": "醫院：依照醫療法規定，領有開業執照並設有病房 收治病人之公、私立及財團法人醫院。診所、國術 館、安養中心等皆不屬於醫院範疇。"}, {"id": 91, "question": "保險事故的通知，如要保人或被保險人不於所規定之期限內通知者，除非 下列何種情形之一，否則對保險人所受之損失應自負賠償責任", "option_1": "為他方所 知者", "option_2": "依通常注意為他方所應知，或無法諉為不知者", "option_3": "一方對於他方經 聲明不必通知者", "option_4": "以上皆是。", "answer": 4, "explanation": "通知之除外情形，當事人之一對下列各款，不負通 知義務：為他方所知者依；通常注意為他方所應 知，或無法諉為不知者；一方對於他方經聲明不必 通知者。"}, {"id": 92, "question": "保險業因業務或財務狀況顯著惡化，不能支付其債務或無法履行契約責任 或有損被保險人之權益之虞時，下列何者為主管機關得為之處分A 監管、 接管；B 勒令停業清理；C 直接處分轉售；D 命令解散", "option_1": "ABCD", "option_2": "AC", "option_3": "ABC", "option_4": "ABD。", "answer": 4, "explanation": "保險法第149 條，主管機關應依下列規定對保險 為監管、接管、勒令停業清理或命令解散之處分。"}, {"id": 93, "question": "有關保單價值準備金之計算，除依主管機關規定外並以何者為基礎？A 危 險發生率；B 附加費用率；C 簽單保險費之利率；D4 行庫每月初牌告之2 年期定存最高利率平均值", "option_1": "ABCD", "option_2": "BCD", "option_3": "AC", "option_4": "ABC。", "answer": 3, "explanation": "保單價值準備金依保險法施行細則之規定，係指人 身保險業以計算保險契約簽單保險費之利率及危險 發生率為基礎。"}, {"id": 94, "question": "下列何者非受益人申領失能保險金應檢具之文件？", "option_1": "保險金申請書及受益 人之身分證明", "option_2": "保險單或其謄本", "option_3": "意外傷害事故證明文件", "option_4": "失能診斷 書。", "answer": 3, "explanation": "受益人申領「失能保險金」時應檢具下列文件： 保險金申請書、保險單或其謄本、失能診斷書；但 必要時本公司得要求提供意外傷害事故證明文件、 受益人的身分證明。"}, {"id": 95, "question": "下列何者是旅行平安險與傷害險的不同A 保險期間可否因特殊事故延長； B 承保時間計算之標準；C 除外責任項目；D 承保事故", "option_1": "CD", "option_2": "ACD", "option_3": "AC", "option_4": "BCD。", "answer": 3, "explanation": "傷害保險契約條款與旅行平安險不同之處：保險期 間之延長、承保期間、除外責任。 (B)承保時間計算之標準都是以保單所載日時為準 (旅平險承保期間最長180 天，傷害險都是一年一 約) (D)承保事故都是意外事故 答案為AC"}, {"id": 96, "question": "要保人行使契約撤銷權生效後，則", "option_1": "契約自行使撤銷權當日起無效", "option_2": "保 險人應計息退還保險費", "option_3": "契約自始無效", "option_4": "保險人得扣除手續費。", "answer": 3, "explanation": "要保人行使契約撤銷權生效後，其效力 (1)自要保人書面之意思表示到達翌日零時起，該契 約自始無效(2)保險人應無息退還要保人所繳保險 費。"}, {"id": 97, "question": "為保障被保險人之基本權益，並維護金融之安定，依保險法規定保險業應 設置", "option_1": "安定基金", "option_2": "業務發展基金", "option_3": "消費者保護基金", "option_4": "消費者補償基金。", "answer": 1, "explanation": "維護金融之安定 故名 安定基金。"}, {"id": 98, "question": "有關人壽保險單示範條款復效通知之規定，何者有誤？", "option_1": "保險人於契約停 效後至得申請復效之期限屆滿前一個月通知要保人復效權利", "option_2": "保險人以書 面、電子郵件、簡訊或其他約定方式擇一通知", "option_3": "通知須載明未於期限屆滿 前申請復效者，契約效力自期限屆滿之日翌日上午零時起終止", "option_4": "保險人依 要保人最後留存之聯絡資料發出通知，視為已完成通知。", "answer": 1, "explanation": "自109 年1 月1 日起，保險公司於申請復效期限 屆滿前至少三個月將以書面、電子郵件、簡訊或其 他約定方法擇一通知，要保人行使申請復效之權 利。"}, {"id": 99, "question": "有關人壽保險單示範條款保險費自動墊繳之規定，下列何者為非", "option_1": "每次墊 繳保險費的本息，應由保險公司出具憑證交予要保人", "option_2": "保單價值準備金不 足墊繳一日之保險費時，自翌日起契約效力停止", "option_3": "自動墊繳係以墊繳當時 之保單價值準備金扣除借款本息後之餘額辦理", "option_4": "自動墊繳經約定後仍可再 變更。", "answer": 2, "explanation": "保單價值準備金不足墊繳一日之保險費時，經催告 到達後逾30 日仍未交付保險費時，契約效力停 止。"}, {"id": 100, "question": "保險契約變更為繳清保險後，契約之保險種類", "option_1": "改變", "option_2": "不變", "option_3": "不一定", "option_4": "以上皆非。", "answer": 2, "explanation": "減額繳清之效力：不需再繳保費、險種不變、保險 期間不變、保險金額減少。"}, {"id": 101, "question": "保險契約改變為繳清保險以後，", "option_1": "不可以", "option_2": "二年內可以", "option_3": "一年內可以", "option_4": "隨時可以 申請恢復原契約。", "answer": 1, "explanation": "減額繳清的保單保險金額僅會減少，且不得恢復。"}, {"id": 102, "question": "依人壽保險單示範條款規定，受益人喪失受益權時，", "option_1": "如無其他受益人受 領保險金，該保險金作為被保險人遺產", "option_2": "要保人除聲明放棄處分權外，得 於事故發生前通知保險人重新指定受益人", "option_3": "如有其他受益人受領保險金， 喪失受益權之受益人原應得部分，按其他受益人原約定比例分歸其他受益 人", "option_4": "以上皆是。", "answer": 4, "explanation": "全選。"}, {"id": 103, "question": "要保人於保險契約停止效力之日起6 個月後申請恢復效力時，下列敘述何 者正確A 提出申請書；B 繳清欠繳的保險費扣除停效期間的危險保險費； C 提供被保險人可保證明", "option_1": "BC", "option_2": "AB", "option_3": "ABC", "option_4": "AC。", "answer": 3, "explanation": "六個月內的復效：補繳保費、扣除停效期間危險保 費後的餘額及利息。 六個月後的復效：上述條件之外，保險公司得於申 請復效之日起五日內要求要保人提供被保險人可保 證明。"}, {"id": 104, "question": "下列何者為人壽保險單示範條款載明之除外責任？", "option_1": "被保險人心神喪失所 致事故", "option_2": "被保險人因飲酒後駕車所致事故", "option_3": "被保險人從事特技表演等競 賽活動所致事故", "option_4": "要保人故意致被保險人於死。", "answer": 4, "explanation": "人壽保險的除外責任： 一、要保人故意致被保險人於死。 二、被保險人故意自殺或自成失能。但自契約訂立 或復效之日起二年後故意自殺致死者，本公司仍負 給付身故保險金或喪葬費用保險金之責任。 三、被保險人因犯罪處死或拒捕或越獄致死或失 能。"}, {"id": 105, "question": "為防堵不良醫療院所配合保戶要求開立不實醫療證明或診斷書詐領保險金 之行為，金管會修正住院醫療費用保險單示範條款，下列敘述何者正確？", "option_1": "保險公司得依其他醫生的第二意見決定理賠與否", "option_2": "108 年度已簽發的 醫療保險單，經保險公司寄送保單權益變更通知書後亦得適用", "option_3": "保險公司 得憑該條款調閱被保險人的就醫紀錄，不須另外取得授權", "option_4": "以上皆是。", "answer": 1, "explanation": "(2)108 年12 月底前投保的舊保單不溯及既往(3)保 險公司得基於審核保險金需要，徵詢其他醫師專業 意見經受益人同意調閱被保險人之就醫相關資料。"}, {"id": 106, "question": "要保人以保險單為質向保險人借款，借款到期應將本息償還保險公司，逾 期未償之本息超過保單價值準備金時，保險契約？", "option_1": "無效", "option_2": "立即失效", "option_3": "經書面通知到達後逾三十天仍未繳付時，保險契約之效力停止", "option_4": "立即停 效。", "answer": 4, "explanation": "借款本息如超過保單價值準備金時，保單效力即停 止，保險公司應於停效日前30 日內以書面通知要 保人。"}, {"id": 107, "question": "年金保險的保費一次繳清後，保險公司立即開始給付年金者稱為", "option_1": "遞延年 金", "option_2": "即期年金", "option_3": "付清年金", "option_4": "躉繳年金。", "answer": 2, "explanation": "即期年金：保險費躉繳 (一次繳清)，於契約生效後 即進入年金給付期間。 遞延年金：保險費分期交付，於繳費終了後或經過 一定的期間或被保險人到達一定年齡才進入年金給 付期間。"}, {"id": 108, "question": "利率變動型年金保險乙型，其給付期間第2 年度開始每年可領取之年金金 額係以前1 年度可領取之年金金額乘以當年度", "option_1": "調整係數", "option_2": "浮動係數", "option_3": "風險係數", "option_4": "變動係數 而得之。", "answer": 1, "explanation": "給付期間第二年度開始每年可領取之年金金額係以 前一年度可領取之年金金額乘以當年度「調整係 數」而得之"}, {"id": 109, "question": "年金開始給付後，要保人即不得要求辦理", "option_1": "減額繳清保險", "option_2": "減少年金金 額", "option_3": "終止契約或保險單借款", "option_4": "以上皆是。", "answer": 4, "explanation": "全選。"}, {"id": 110, "question": "某甲於94 年10 月1 日向某保險公司投保養老保險，同日繳納第一次保 險費，並於次日接受體檢，同月5 日保險公司同意承保，據知某甲於承保 前一日車禍而死，試問保險公司應", "option_1": "僅返還所繳保險費", "option_2": "不一定理賠， 視個案而定", "option_3": "理賠", "option_4": "不理賠。", "answer": 3, "explanation": "保險公司在同意承保前預收相當於第一期保險費， 而在同意承保之意思表示前發生應予給付之保險事 故時，保險公司仍負保險責任。"}, {"id": 111, "question": "契約撤銷權之規定適用於個人", "option_1": "十年期以上", "option_2": "兩年期以上", "option_3": "五年期以上", "option_4": "一年期 人身保險契約。", "answer": 2, "explanation": "契約撤銷權之規定適用於自84 年4 月1 日起簽訂 之個人兩年期以上人身保險契約。"}, {"id": 112, "question": "利率變動型年金保險甲型為", "option_1": "變動年金金額", "option_2": "不固定年金金額", "option_3": "彈性年 金金額", "option_4": "固定年金金額。", "answer": 4, "explanation": "利率變動型年金保險甲型為固定年金金額。 甲是固定的，乙是變動的。"}, {"id": 113, "question": "要保人終止保險契約，而保險費已付足一年以上者，保險人應於接到通知 後一個月內償付解約金，其金額不得低於要保人應得保單價值準備金之", "option_1": "二分之一", "option_2": "四分之一", "option_3": "四分之三", "option_4": "三分之一。", "answer": 3, "explanation": "要保人終止保險契約，而保險費已付足一年以上 者，保險人應於接到通知後一個月內償付解約金， 其金額不得低於要保人應得保單價值準備金之四分 之三。"}, {"id": 114, "question": "某甲購買傷害險時任職於國中教師，兩年後轉任救生員一職，未告知保險 公司，後來發生意外事故致死，則保險公司在傷害險部分", "option_1": "按原收保險費 與應收保險費比例理賠", "option_2": "依原投保金額理賠", "option_3": "補足保費差額後理賠原保 險金額", "option_4": "不予理賠。", "answer": 1, "explanation": "意外險的費率看的是職業等級，被保險人職業變 更，而致危險增加者，於危險發生前，按差額比例 增收未滿期保險金；未通知而發生事故，危險發生 後，按原收保費與應收保費比例折算保險金。"}, {"id": 115, "question": "復效的契約其保險費之計算", "option_1": "視個別契約而定", "option_2": "由要保人與保險公司重 新約定", "option_3": "按原投保年齡標準", "option_4": "按復效時年齡計算。", "answer": 3, "explanation": "復效的契約其保險費之計算，是依原保單的保單價 值準備金及原投保年齡的標準繼續繳費。"}, {"id": 116, "question": "當要保人屆期未交保費，保險人自動墊繳其應繳保費及利息，若保單價值 準備金之餘額不足墊繳一日的保險費且經催告到達後逾30 天仍未繳費 2 自動墊繳保價金不足，沒有成功墊繳，等於保費沒 有繳，只要保費沒有繳，就是走沒有繳費的流程： 時，保險契約效力即", "option_1": "無效", "option_2": "停止", "option_3": "終止", "option_4": "以上皆非。 先催告，進入30 天寬限，再來就停效。", "answer": "", "explanation": ""}, {"id": 117, "question": "責任準備金的提存與下列哪些費率因子有關？A 預定死亡率B 預定營業費 用率C 預定利率", "option_1": "AC", "option_2": "AB", "option_3": "BC", "option_4": "ABC。", "answer": 1, "explanation": "責任準備金的提存與預定死亡率及預定利率有關。"}, {"id": 118, "question": "被保險人因犯罪處死或拒捕或越獄致死，如保險費付足2 年以上者，保險 人", "option_1": "得給付申請部分保險金", "option_2": "不得給付保險金", "option_3": "應將其保單價值準備金 返還予應得之人", "option_4": "以上皆非。", "answer": 3, "explanation": "被保險人因犯罪處死或拒捕或越獄致死，如保險費 付足2 年以上者，保險人應將其保單價值準備金返 還予應得之人。"}, {"id": 119, "question": "依民法第八條第三項規定，失蹤人為遭遇特別災難者，得於特別災難終了 滿", "option_1": "三年", "option_2": "七年", "option_3": "五年", "option_4": "一年 後，為死亡宣告。", "answer": 4, "explanation": "特別災難失蹤1 年；一般失蹤7 年；80 歲以上3 年。"}, {"id": 120, "question": "依據保單示範條款，保險公司應於保單申請復效期限屆滿前至少幾個月， 通知要保人申請復效之權利？", "option_1": "1 個月", "option_2": "2 個月", "option_3": "3 個月", "option_4": "6 個月。", "answer": 3, "explanation": "依據保單示範條款，保險公司應於保單申請復效期 限屆滿前至少三個月，以書面、電子郵件、簡訊或 其他方式通知要保人申請復效之權利。"}, {"id": 121, "question": "保險法第131 條第2 項有關意外傷害之要件，何者為是？A 非由疾病引 起；B 單獨事故；C 外來事故；D 突發事故", "option_1": "ABD", "option_2": "ACD", "option_3": "ABCD", "option_4": "ABC。", "answer": 2, "explanation": "傷害保險契約的定義係指非由疾病引起之突發外來 事故所致者。"}, {"id": 122, "question": "關於保單申請復效期限屆滿前之通知，以下敘述何者正確？", "option_1": "需於至少三 個月前發出通知", "option_2": "屬於法定義務，並應註明於契約條款中", "option_3": "為保障保戶 權益，應以雙掛號通知", "option_4": "以上皆是。", "answer": 1, "explanation": "(2)屬強化服務，非法定義務(3)以書面、電子郵 件、簡訊或其他約定方式擇一通知要保人申請復效 之權利。"}, {"id": 123, "question": "壽險契約終止後", "option_1": "僅主契約部分可恢復", "option_2": "附約部分可恢復", "option_3": "雙方同意後 可以恢復", "option_4": "不能恢復原契約。", "answer": 4, "explanation": "契約終止為要保人提出解約，拿走了解約金，不能 再恢復。"}, {"id": 124, "question": "李嗣以其子李玖為被保險人購買人身保險，當李嗣死亡時李玖未辦理變更 要保人且其他利害關係人也未代為續繳保險費，若該保險單已累積有保單 價值準備金，則該保單價值準備金應", "option_1": "列入李嗣之遺產總額，申報遺產 稅", "option_2": "視為保險給付，但列入所得", "option_3": "由李玖申請領回", "option_4": "視為保險給付，不 列入所得。", "answer": 1, "explanation": "保單價值準備金給要保人領，要保人死亡，變成遺 產，依法申報遺產稅。"}, {"id": 125, "question": "人壽保險保險事故發生前，要保人得變更受益人，但須經何人之書面承認 者始生效力", "option_1": "受益人", "option_2": "保險人", "option_3": "被保險人", "option_4": "要保人。", "answer": 3, "explanation": "受益人變更的聲請要件：未發生保險事故前、需被 保險人同意。"}, {"id": 126, "question": "陳光華的父親曾於生前投保傷害保險貳百萬元，並以陳光華為死亡保險金 受益人，但陳光華一直到父親因疾病死亡後二年，始知父親投保，此時保 險公司", "option_1": "仍應如額給付保險金", "option_2": "陳光華須證明確係不知其父投保事實才 延遲申請，否則保險公司仍得拒絕給付", "option_3": "僅給付保單價值準備金", "option_4": "以上 皆非。", "answer": 4, "explanation": "傷害保險契約的定義係指非由疾病引起之突發外來 事故所致者。題目陳光華父親因疾病死亡故不理 賠。"}, {"id": 127, "question": "保險人破產時，保險契約", "option_1": "不因之而失效", "option_2": "於破產宣告日終止", "option_3": "停效", "option_4": "保險人應返還全部保險費。", "answer": 2, "explanation": "保險人破產時，保險契約於破產宣告日終止，其終 止後之保費，已交付者，應返還之。"}, {"id": 128, "question": "有關傷害保險契約，下列敘述何者正確", "option_1": "僅得以自己為被保險人投保", "option_2": "以職業為危險估計的主要依據", "option_3": "一律採「追溯生效」", "option_4": "契約效力自保單 所載翌日零時起生效。", "answer": 2, "explanation": "(1)只要符合保險利益均可；(3)(4)生效以保單所載 時日。"}, {"id": 129, "question": "投保旅行平安保險時，若僅有要保人知保險事故已發生者，保險公司", "option_1": "依 事故比例退還部分保險費", "option_2": "加計利息退還保險費", "option_3": "僅退還所收保險費", "option_4": "不退還所收保險費。", "answer": 4, "explanation": "僅有要保人知保險事故已發生者，契約無效且不退 還所收保險費。"}, {"id": 130, "question": "保險業因業務或財務狀況顯著惡化，不能支付其債務或無法履行契約責任 或有損被保險人之權益之虞時，下列何者非主管機關得為之處分", "option_1": "監管、 接管", "option_2": "勒令停業清理", "option_3": "直接處分轉售", "option_4": "得為1、", "answer": 2, "explanation": "選項之處分。 3 主管機關得為之處分：監管、接管、勒令停業清 理、命令解散。"}, {"id": 131, "question": "附保證期間之年金保險，被保險人於保險契約年金保證期間內尚未領取之 金額稱為", "option_1": "年金保額", "option_2": "未支領年金餘額", "option_3": "生存年金金額", "option_4": "年金金額。", "answer": 2, "explanation": "附保證期間之年金保險，被保險人於保險契約年金 保證期間內尚未領取之金額稱為未支領年金餘額。"}, {"id": 132, "question": "某甲曾於五年前投保死亡保險200 萬元，後該保險因未繳保費於去年一月 停效，今年十月又辦理復效完畢，某甲於復效兩個月後即跳海自殺身故， 保險人對本案應如何處理？", "option_1": "不給付死亡保險金，但退還所繳保費", "option_2": "完 全不給付", "option_3": "應照保險金額理賠", "option_4": "僅返還保單價值準備金。", "answer": 4, "explanation": "被保險人故意自殺應自訂約或複效之日起二年後始 生效力。此題複效僅二個月，保險人不付給付保險 金之責，但保費付足二年以上者，保險公司應返還 保單價值準備金於應得之人。"}, {"id": 133, "question": "有關實支實付型住院醫療費用保險之陳述何者正確？A 具有損害填補的原 則；B 只要是住院醫療相關費用皆可給付；C 對於全民健保核付的費用不 給付；D 對於保險對象自行負擔之一定項目費用給付", "option_1": "B", "option_2": "ACD", "option_3": "ABCD", "option_4": "AB。", "answer": 2, "explanation": "B 被保險人住院期間所發生，且全民健康保險規定 其保險對象應自行負責即不屬於全民健康保險給付 範圍下一定項目之住院醫療費用及手術費用予以給 付。"}, {"id": 134, "question": "有關保險法之規定何者正確？", "option_1": "傷害保險之受益人故意傷害被保險人未遂 時，要保人得撤銷其受益權利", "option_2": "要保人故意致被保險人於死者，保險人雖 不負給付保險金額之責，但仍應將保單價值準備金繳交國庫", "option_3": "人壽保險受 益人故意致被保險人於死或雖未致死者，喪失其受益權", "option_4": "以上皆是", "answer": 3, "explanation": "(1)受益人故意傷害被保險人未遂時，喪失其受益 權，要保人不須要撤銷其受益權。(2)要保人故意致 被保險人於死者，保險人雖不負給付保險金額之 責，但仍應將保單價值準備金返還予應得之人。"}, {"id": 135, "question": "傷害保險的被保險人從事下列何種活動，致成死亡或傷害時，除契約另有 約定外，保險公司不負給付保險金之責？A 滑翔翼；B 汽機車競賽或表 演；C 跆拳道；D 馬術", "option_1": "AB", "option_2": "ABCD", "option_3": "BC", "option_4": "BCD。", "answer": 4, "explanation": "傷害保險之不保事項：被保險人從事角力、摔跤、 柔道、空手道、跆拳道、馬術、拳擊、特技表演、 汽車、機車及自行車競賽或表演。"}, {"id": 136, "question": "有關長期照顧保險，下列何者錯誤？", "option_1": "被保險人身故時保險金尚有未完全 給付者，以被保險人法定繼承人為受益人", "option_2": "被保險人身故時契約效力即行 終止", "option_3": "各項保險金受益人皆為被保險人，保險人不受理指定或變更", "option_4": "要 保人於契約有效期間不得申請減少保險金額。", "answer": 4, "explanation": "(4)要保人於契約有效期間內，得申請減少保險金 額。"}, {"id": 137, "question": "因違反告知而得解除契約之權利，自保險公司知有解除原因經過", "option_1": "二年", "option_2": "一年", "option_3": "一個月", "option_4": "二個月 不行使而消滅。", "answer": 3, "explanation": "因違反告知而得解除契約之權利，自保險公司知有 解除原因經過一個月不行使而消滅。"}, {"id": 138, "question": "有關契約撤銷權何者正確？A 不論有無體檢保件之要保人均得主張行使； B 各種人身保險契約皆適用；C 不論何時簽訂之人身保險契約皆適用；D 保險公司應於簽收保單回條以明顯字體提醒保戶如何行使契約撤銷及效果", "option_1": "BCD", "option_2": "ABCD", "option_3": "AD", "option_4": "ABD。", "answer": 3, "explanation": "B、C 適用於自81/4/1 起簽訂之個人2 年期以上 人身保險契約。"}, {"id": 139, "question": "有關保險契約復效之陳述何者正確？A 其保險費之計算重新約定；B 可維 持原保險單歷年繳費的保單價值準備金；C 較重新投保更為有利", "option_1": "ABC", "option_2": "AB", "option_3": "AC", "option_4": "BC。", "answer": 4, "explanation": "A 保險費按照原投保年齡的標準繼續繳費。"}, {"id": 140, "question": "依保險法第43 條規定，保險契約應以", "option_1": "要保書", "option_2": "保險單或暫保單", "option_3": "體 檢報告書", "option_4": "送金單 為之。", "answer": 2, "explanation": "依保險法第43 條規定，保險契約應以保險單或暫 保單為之。"}, {"id": 141, "question": "傷害保險費率係按被保險人Ａ薪資；Ｂ性別；Ｃ職業；Ｄ工作環境，之不 同作為主要的依據", "option_1": "BCD", "option_2": "CD", "option_3": "ABC", "option_4": "ABCD。", "answer": 2, "explanation": "傷害保險費率係按被保險人的職業類別做區分。"}, {"id": 142, "question": "依個人傷害保險示範條款規定，附加日額給付醫療保險金之傷害保險，其 每次傷害給付日數不得超過", "option_1": "180 日", "option_2": "60 日", "option_3": "90 日", "option_4": "30 日。", "answer": 3, "explanation": "依個人傷害保險示範條款規定，附加日額給付醫療 保險金之傷害保險，其每次傷害給付日數不得超過 90 日。"}, {"id": 143, "question": "年金保險不論被保險人生存與否，保險公司保證給付金額的年金保險稱為", "option_1": "保證期間年金保險", "option_2": "保證金額年金保險", "option_3": "遞延年金保險", "option_4": "即期年金保 險。", "answer": 2, "explanation": "年金保險不論被保險人生存與否，保險公司保證給 付金額的年金保險稱為保證金額年金保險。"}, {"id": 144, "question": "依我國保險法第59 條規定，保險契約內所載增加危險之情形，非由於要 保人或被保險人之行為所致者，要保人或被保險人應於知悉後", "option_1": "十日內", "option_2": "三十日內", "option_3": "五日內", "option_4": "二十日內 通知保險人。", "answer": 1, "explanation": "風險增加：不由要被保人所致者，10 日內通知保 險人；風險增加由要被保人所致者，應於知悉後通 知保險人。"}, {"id": 145, "question": "實支實付型住院醫療費用保險之給付內容，不包含下列哪項費用？", "option_1": "管灌 飲食以外之膳食費", "option_2": "來往醫院之救護車費", "option_3": "超等住院之病房費差額", "option_4": "特 別護士之護理費。", "answer": 2, "explanation": "住院醫療費用示範條款第6 條，給付內容不包含救 護車費。"}, {"id": 146, "question": "保單如累積達有保單價值準備金且辦理解約時，依保險法規定保險公司應 於接到通知後", "option_1": "一個月", "option_2": "二個月", "option_3": "十五天", "option_4": "二十天 內償付解約金。", "answer": 1, "explanation": "要保人得隨時終止契約，保險費已付足一年以上或 繳費累積達有保單價值準備金者，保險人應於接到 通知一個月內償付解約金。"}, {"id": 147, "question": "下列何者非屬於傷害保險的除外責任", "option_1": "被保險人飲酒後駕(騎)車，其吐氣 或血液所含酒精成份超過道路交通法令規定標準者", "option_2": "被保險人犯罪行為", "option_3": "要保人、被保險人的故意行為", "option_4": "以上皆非。", "answer": 4, "explanation": "皆為傷害保險除外責任。"}, {"id": 148, "question": "現行人壽保險單示範條款規定，要保人或受益人應於知悉被保險人死亡或 其他保險事故時", "option_1": "於十日內", "option_2": "依契約規定日期，不得少於五日內", "option_3": "三十 日內", "option_4": "即時 通知保險公司。", "answer": 2, "explanation": "人壽保險單示範條款第十條： 要保人或受益人應於知悉本公司應負保險責任之事 故後○○日(不得少於五日)內通知保險公司。"}, {"id": 149, "question": "要保人破產時，保險契約仍為", "option_1": "保險人", "option_2": "被保險人", "option_3": "要保人", "option_4": "破產債權 人 之利益而存在。", "answer": 4, "explanation": "要保人破產時，保險契約仍為破產債權人之利益而 存在。"}, {"id": 150, "question": "保險法第34 條規定保險人應付之賠償金額確定後，應於約定期限內給付 之，無約定者應於接到通知後幾日內給付之", "option_1": "10 日", "option_2": "30 日", "option_3": "20 日", "option_4": "15 日。", "answer": 4, "explanation": "保險法規定保險公司應於收齊所需文件後15 日內 為給付，如因可歸責於保險公司之事由而逾期給付 者，保險公司應按年利一分加計利息給付。"}, {"id": 151, "question": "利率變動型年金保險甲型為固定年金金額，在年金給付開始日，保險公司 以當時所累積之年金保單價值準備金，依據當時", "option_1": "十年期公債殖利率", "option_2": "預定利率", "option_3": "宣告利率", "option_4": "定存利率 及年金生命表計算可以領取之年金金 額。", "answer": 2, "explanation": "利率變動型年金保險甲型為固定年金金額，在年金 給付開始日，保險公司以當時所累積之年金保單價 值準備金(如有保險單借款應扣除保險單借款及其 應負利息後)，依據當時預定利率及年金生命表計 算可以領取之年金金額。"}, {"id": 152, "question": "關於寬限期間之述敘，何者錯誤？A 逾寬限期間仍未繳付保險費者，契約 至寬限期間終了之翌日起終止效力；B 如在寬限期間發生保險事故，保險 公司仍負給付責任；C 年繳或半年繳件，自保單所載之交付日期之翌日起 30 日為寬限期間；D 季繳或月繳件，至催告到達日期之翌日起30 日為寬 限期間", "option_1": "ABCD", "option_2": "BCD", "option_3": "ACD", "option_4": "CD。", "answer": 3, "explanation": "A 人壽保險之保險費到期未交付者，除契約另有訂 定外，經催告到達後屆30 日仍不交付時，保險契 約之效力停止；B 年繳或半年繳者，自催告到達翌 日起OO 日(不得低於30 日)內為寬限期；C 月繳 或季繳者則不另為催告，自保險單所載交付日期之 翌日起OO 日(不得低於30 日)為寬限期間。"}, {"id": 153, "question": "有關自動墊繳保險費利息之計算何者正確？", "option_1": "自寬限期限終了當日起算", "option_2": "按當時市場利率計算", "option_3": "自應繳日翌日起算", "option_4": "自寬限期間終了翌日起 算。", "answer": 4, "explanation": "墊繳保險費的利息，自寬限期間終了的翌日起，按 當時保險公司公告的利率計算(不得超過本保單辦 理保單借款的利率)。"}, {"id": 154, "question": "下列有關保險法第105 條規定之敘述何者為非", "option_1": "被保險人得隨時依本條 為撤銷並通知要保人即生效力", "option_2": "被保險人依本條行使撤銷權時，視為要保 人終止契約", "option_3": "由第三人訂立之死亡保險契約須經被保險人書面同意並約定 保險金額，否則契約無效", "option_4": "被保險人得隨時依本條所為之同意得隨時撤 銷。", "answer": 1, "explanation": "撤銷之方式應以書面通知保險人及要保人。被保險 人依前項規定行使其撤銷權者，視為要保人終止保 險契約。"}, {"id": 155, "question": "有關住院醫療費用保險何者錯誤？", "option_1": "如有保證續保條款時，保險人不得拒 絕續保及不得依續保當時之費率規定重新計算保費", "option_2": "被保險人於契約有效 期間屆滿出院，因同一疾病於出院後14 日內於同一醫院再住院，保險人 就再住院部分不給付保險金", "option_3": "保戶如前往非屬健保特約院所就醫，保險人 於限額內得按實際支出費用不低於65%給付", "option_4": "以上皆非。", "answer": 1, "explanation": "(1)保證續保在續保時，保險公司可按續保當時費率 重新起算；(2)(3)均正確。"}, {"id": 156, "question": "依保險法規定，關於未來事項之特約條款，於未屆履行期前危險已發生， 或其履行為不可能，或在訂約地為不合法而未履行者，保險契約", "option_1": "因之失 效", "option_2": "不因之而失效", "option_3": "停止效力", "option_4": "自始無效。", "answer": 2, "explanation": "依「保險法第」69 條：關於未來事項之特約條 款，於未屆履行期 前危險已發生，或其履行為不 可能，或在訂約地為不合法而未履行者，保險契約 不因之而失效。"}, {"id": 157, "question": "保險公司接到要保人申請保險單借款，應於", "option_1": "一個月內", "option_2": "二個月內", "option_3": "三 個月內", "option_4": "半年內 貸給可借之金額。", "answer": 1, "explanation": "依「保險法」第 120 條第2 項：保險人於接到要 保人之借款通知後，得於一個月以內之期間，貸給 可得質借之金額。"}, {"id": 158, "question": "有關健康保險何者為是？A 保險費不得以訴訟方式請求交付；B 利害關係 人不得代要保人交付保險費；C 保險費到期未交付不適用寬限期間之規 定；D 由第三人訂立之契約，未經被保險人書面同意並約定保險金額者契 約無效", "option_1": "AC", "option_2": "ACD", "option_3": "ABD", "option_4": "D。", "answer": 4, "explanation": "A 健康保險、傷害保險未有規定不得訴訟請求；B 利害關係人可代要保人交付保險費；C 保險費到期 未交付適用寬限期間之規定。"}, {"id": 159, "question": "傷害保險中被保險人因同一意外事故致成失能等級表所列二項以上失能程 度者，何者有誤？", "option_1": "保險人應給付失能程度較嚴重者，且最高以保險金額 為限", "option_2": "意外事故合併以前的失能可領較嚴重項目失能保險金者，按較嚴重 項目給付", "option_3": "若二項失能項目皆屬同一手但失能等級不同時，給付較嚴重項 目失能保險金", "option_4": "若二項失能項目屬於同一手時，僅給付依項失能保險金。", "answer": 1, "explanation": "(1)保險人應給付各該項失能保險金之和，且最高以 保險金額為限。"}, {"id": 160, "question": "有關傷害保險受益人申請失能保險金，下列何者錯誤？", "option_1": "保險人基於審核 保險金需要得對被保險人身體予以檢驗", "option_2": "保險人得經受益人同意調閱被保 險人就醫相關資料", "option_3": "保險人得自付費用另徵詢其他醫師之醫學專業意見", "option_4": "受益人應檢具被保險人除戶戶籍謄本。", "answer": 4, "explanation": "傷害保險受益人申請失能保險金，保險人基於審核 保險金需要得對被保險人身體予以檢驗，另得徵詢 其他醫師之醫學專業意見另並得經受益人同意調閱 被保險人就醫相關資料因此所生費用由保險公司負 擔 。"}, {"id": 161, "question": "下列何者為是？ A 人壽保險之保險費可以訴訟方法請求交付；B 利害關 係人得代要保人交付保險費；C 受益人經指定後，要保人對其保險利益喪 失處分權；D 受益人得於部分條件下將其利益轉讓他人", "option_1": "BD", "option_2": "BCD", "option_3": "ABCD", "option_4": "B。", "answer": 1, "explanation": "A 人壽保險之保險費不得以訴訟方式請求交付；C 受益人經指定後，要保人對其保險利益除聲明放棄 處分權者外仍得以契約或遺囑處分之。"}, {"id": 162, "question": "要保人或被保險人對於保險人的書面詢問若有故意隱匿或因過失遺漏，或 為不實之說明，足以變更或減少保險人對於危險之估計者，保險人得", "option_1": "停 4 要保人或被保險人對於保險人的書面詢問應據實說 明，要保人有故意隱匿或因過失遺漏，或為不實之 止契約", "option_2": "終止契約", "option_3": "撤銷契約", "option_4": "解除契約。 說明，足以變更或減少保險人對於危險之估計者， 保險人得解除契約；其危險發生後亦同。", "answer": "", "explanation": ""}, {"id": 163, "question": "有關減額繳清保險之敘述，何者正確？A 與原保險同一種類；B 與原保險 期間相同；C 與原保險之保險金額相同；D 與原保險之繳費方式相同", "option_1": "A", "option_2": "ABC", "option_3": "AB", "option_4": "ABD。", "answer": 3, "explanation": "C 與原保險金額不同；D 已躉繳了，故繳費方式不 同。"}, {"id": 164, "question": "旅行平安保險單示範條款有延長保險期間之規定，其要件不包括", "option_1": "被保險 人須為乘客", "option_2": "該交通工具因故延遲抵達為被保險人所能控制", "option_3": "該交通工 具之預定抵達時刻在保險契約期間內", "option_4": "搭乘之交通工具須領有載客執照。", "answer": 2, "explanation": "如被保險人以乘客身分搭乘領有載客執照之交通工 具，該交通工具之預定抵達時刻係在本契約的保險 期間內，因故延遲抵達而非被保險人所能控制者， 本保險單自動延長有效期限至被保險人終止乘客身 分時為止，但延長之期限不得超過二十四小時。"}, {"id": 165, "question": "以下何者正確？A 含保證給付的年金保險，受益人得申請貼現提前給付； B 遞延年金保險在年金給付開始前如有保單借款，給付開始時應就當時年 金保單價值準備金扣除保單借款本金計算年金金額；C 保險人為避免以不 實醫療證明詐領保險金，得經要保人同意調閱被保險人就醫資料；D 住院 醫療費用保險期間以一年為原則", "option_1": "ABCD", "option_2": "AD", "option_3": "BCD", "option_4": "ABC。", "answer": 2, "explanation": "B 遞延年金保險在年金給付開始前如有保單借款， 給付開始時應就當時年金保單價值準備金扣除保險 單借款及其應付利息計算年金金額；C 保險人為避 免以不實醫療證明詐領保險金，得經受益人同意調 閱被保險人就醫資料。"}, {"id": 166, "question": "保險公司對即期年金應負的保險責任由何時開始", "option_1": "要保人交付保費", "option_2": "保 險人同意承保", "option_3": "保險人同意承保且送達保單", "option_4": "保險人同意承保且要保人 繳付全部保險費。", "answer": 4, "explanation": "保險公司應負責任的開始應自同意承保且收取全部 保險費後負保險責任。如題目改遞延年金，應自同 意承保且收取第一期保險費後負保險責任。"}, {"id": 167, "question": "以被保險人終身為期，不附生存條件之死亡保險契約，如保險費已付足二 年以上而有不交付時，保險人", "option_1": "得以被保險人指定的方式處理", "option_2": "得解除 契約", "option_3": "僅得減少保險金額", "option_4": "得終止契約。", "answer": 3, "explanation": "以被保險人終身為期，不附生存條件之死亡保險契 約，如保險費已付足二年以上而有不交付時，保險 人僅得減少保險金額。"}, {"id": 168, "question": "要保人中途請求終止契約，如果交付的保險費累積達有保單價值準備金， 可以領回", "option_1": "已繳全部保險費加計利息", "option_2": "已積存責任準備金之金額", "option_3": "由保 險公司決定可領之金額", "option_4": "解約金表所列解約金額。", "answer": 4, "explanation": "要保人中途請求終止契約，如果交付的保險費累積 達有保單價值準備金，保險人應於接到通知一個月 內償付解約金，其金額不得少於要保人應得保單價 值準備金3/4。"}, {"id": 169, "question": "有關復效規定之敘述何者為非？", "option_1": "停效後超過6 個月之復效，如被保險 人之危險程度有重大變更之情形者，保險人得拒絕其復效", "option_2": "約定復效之期 限，自停止效力之日起不得低於2 年", "option_3": "停效後超過6 個月之復效，要保 人填寫復效申請並繳清欠繳保險費、約定之利息及其他費用後，於翌日上 午零時恢復其效力", "option_4": "停效後6 個月內之復效於要保人繳清欠繳保險費、 約定之利息及其他費用後，翌日上午零時恢復其效力。", "answer": 3, "explanation": "(3)停效後超過6 個月之復效，保險公司得於申請 復效之日5 日內要求要保人提供被保險人可保證 明。"}, {"id": 170, "question": "傷害保險契約生效日", "option_1": "一律自保單所載始日零時起生效", "option_2": "原則上自保險 單上所載的日時開始生效", "option_3": "不得由契約當事人約定生效時間", "option_4": "原則上自 保險單所載始日午夜十二時起生效。", "answer": 2, "explanation": "傷害保險契約生效日原則上自保險單上所載的日時 開始生效。"}, {"id": 171, "question": "依人壽保險單示範條款規定，約定以金融機構轉帳繳納保險費者，何種繳 別須經催告程序以計算寬限期間", "option_1": "月繳", "option_2": "季繳", "option_3": "年繳", "option_4": "以上皆是。", "answer": 4, "explanation": "如果第二期以後保險費的繳付是以金融機構轉帳， 或是指定地點交付或保險公司派員前往收取以外的 繳費方式，不管繳別為何均應催告。"}, {"id": 172, "question": "受益人變更，保險公司應", "option_1": "實地調查變更情形", "option_2": "僅就書面審核即可", "option_3": "除 書面審核外，亦需實地調查", "option_4": "以上皆非。", "answer": 2, "explanation": "受益人變更聲請方式：書面通知保險人。"}, {"id": 173, "question": "保險費的繳納方式有A 向保險公司所在地或指定地點交付；B 保險公司派 員收取；C 約定以金融機構轉帳；D 保險業務員墊繳", "option_1": "BCD", "option_2": "BD", "option_3": "AB", "option_4": "ABC。", "answer": 4, "explanation": "保險費的繳納方式有：向保險公司所在地或指定地 點交付、保險公司派員收取及約定以金融機構轉 帳。"}, {"id": 174, "question": "下列何者不是保險人依保險法第64 條解除契約之要件", "option_1": "要保人隱匿或遺 漏不為說明，或為不實之說明", "option_2": "須足以變更或減少保險人對於危險之估計", "option_3": "要保人之不實告知，須在契約訂立時", "option_4": "要保人之不實告知，須在保險 事故發生時。", "answer": 4, "explanation": "錯誤(4)：訂立契約時要保人或被保險人對於保險人 之書面詢問應據實說明，要保人故意隱匿，或因過 失，遺漏或為不實之說明，足以變更或減少保險人 對危險之估計者，保險人得解除契約；其危險發生 後亦同。"}, {"id": 175, "question": "發生保險事故以後發覺被保險人投保年齡不實而致短繳保險費，且其錯誤 非可歸責於保險公司者，受益人可得之金額為", "option_1": "要保人不得要求補繳短繳 保險費，僅按原繳保險費比例減少保險金額", "option_2": "原保險金額減掉應補繳之保 費", "option_3": "已繳保費加計利息退還要保人", "option_4": "保險人無息退還所有已繳保費。", "answer": 1, "explanation": "如於保險事故後始發覺短繳保險費者，保險公司得 按原繳保費與應繳保險費之比例減少保險金額，而 不得請求補足差額。"}, {"id": 176, "question": "有關完全失能等級之敘述，何者有誤？", "option_1": "永久喪失咀嚼機能係指因器質障 害，除流質食物外不能攝取者", "option_2": "失明係指視力永久在萬國式視力表0.02 以下", "option_3": "四肢機能永久完全喪失係指經3 個月以後，其機能仍完全喪失者", "option_4": "喪失言語機能係指構成語言之四種語音機能，有三種以上不能構音。", "answer": 3, "explanation": "(3)四肢機能永久完全喪失係指經六個月後其機能仍 完全喪失者。"}, {"id": 177, "question": "雇主為員工投保團體人壽保險的好處是", "option_1": "可因此不必投保勞工保險", "option_2": "與 壽險業建立良好關係，方便資金融通", "option_3": "降低員工流動率", "option_4": "以上皆非。", "answer": 3, "explanation": "雇主為員工投保團體人壽保險的好處是降低員工流 動率、增進員工福利。"}, {"id": 178, "question": "依據人壽保險單示範條款之規定，人壽保險契約約定有自動墊繳者，應以 當時的", "option_1": "保險金", "option_2": "保單責任準備金", "option_3": "投保金額", "option_4": "保單價值準備金 自動墊繳其應繳的保險費及利息。", "answer": 4, "explanation": "壽保險契約約定有自動墊繳者，應以當時的保單價 值準備金自動墊繳其應繳的保險費及利息。"}, {"id": 179, "question": "下列何者為是？A 傷害保險之保險費不得以訴訟請求交付；B 利害關係人 不得代要保人交付保險費；C 傷害保險之保險費到期未交付不適用寬限期 間之規定；D 由第三人訂立之傷害保險契約，未經被保險人書面同意並約 保險金額者契約無效", "option_1": "ABCD", "option_2": "D", "option_3": "AD", "option_4": "AC。", "answer": 2, "explanation": "A 傷害保險之保險費得以訴訟請求交付；B 利害關 係人得代要保人交付保險費；C 傷害保險之保險費 到期未交付適用寬限期間之規定。"}, {"id": 180, "question": "要保人故意致被保險人於死者，保險人", "option_1": "無須給付保險金，但應退還所繳 保險費", "option_2": "須給付保險金", "option_3": "無須給付保險金，但應退還保單價值準備金予 應得之人或解交國庫", "option_4": "無須給付保險金，退還保單加值準備金及所繳保險 費。", "answer": 3, "explanation": "要保人故意致被保險人於死者，保險人不負給付保 險金之責。但保險費付足二年以上者，保險公司應 將其保單價值準備金返還予應得之人。"}, {"id": 181, "question": "被保險人投保健康保險後，因疾病致成失能時，保險人", "option_1": "退還所繳保險費", "option_2": "應給付保險金", "option_3": "酌給慰問金", "option_4": "不給付保險金。", "answer": 2, "explanation": "被保險人因疾病或傷害致成失能時，保險人應給付 保險金。"}, {"id": 182, "question": "下列何者為保險契約構成部份A 附著之要保書；B 批註書；C 廣告文宣； D 保單條款", "option_1": "ABCD", "option_2": "ABD", "option_3": "AD", "option_4": "ACD。", "answer": 2, "explanation": "保險契約構成不包括廣告文宣。"}, {"id": 183, "question": "由第三人訂立之年金保險契約，未經被保險人書面承諾，並約定保險金 額，其保險契約", "option_1": "效力未定", "option_2": "無效", "option_3": "得撤銷", "option_4": "有效。", "answer": 4, "explanation": "由第三人訂立之年金保險契約，未經被保險人書面 承諾，並約定保險金額，其保險契約有效。"}, {"id": 184, "question": "年金保險契約下列何者為是A 得由本人或第三人訂立之；B 未經保險人書 面承認並約定保險金額契約無效；C 利害關係人均得代要保人交付保險 2 年金保險係以被保險人生存為給付條件故不會產生 道德風險；保險法規定人壽/年金保險不得訴訟請 費；D 保險人對於保險費得以訴訟請求交付", "option_1": "BC", "option_2": "AC", "option_3": "ABCD", "option_4": "ABC。 求。", "answer": "", "explanation": ""}, {"id": 185, "question": "人壽保險費除於簽訂保險契約時尚未確定者外，無論其交付方式為何應於 何時交付", "option_1": "契約生效後", "option_2": "契約生效前", "option_3": "契約生效時", "option_4": "發生保險事故 前。", "answer": 2, "explanation": "壽保險費除於簽訂保險契約時尚未確定者外，無論 其交付方式為何應於契約生效前交付。"}, {"id": 186, "question": "哪些情況繳納保險費,於繳納綜合所得稅時不得扣除?A 父母申報代繳成年 子女壽險保 費，且子女已自行報稅 B 車險及火險的保費 C 申報代繳兄 弟姊妹的壽險保費 D 為受其 扶養之直系血親尊親屬繳納之壽險保費", "option_1": "ABCD", "option_2": "BC", "option_3": "ABC", "option_4": "AD", "answer": 3, "explanation": "下列情形之保費，不能以列舉方式扣除： (1)非直系親屬間如兄弟姐妹互為繳納保險費者 (2)子女已成年並自行報稅者之父母代繳保險費 (3)因個人綜合所得稅以「戶」為申報單位，而要保 人與被保險人非同一戶申報戶內者 (4)未經核准在台銷售之境外保單 (5)汽車保險、火災保險、責任保險等非屬人身保險 之保費"}, {"id": 187, "question": "死亡保險契約，要保人所指定之受益人如在被保險人死亡後才身故，且保 險公司尚未 給付保險金時，則保險金應作為", "option_1": "歸屬國庫", "option_2": "被保險人之 遺產", "option_3": "受益人之遺產", "option_4": "要保人之遺產", "answer": 3, "explanation": "被保險人早於受益人身故，故此筆保險金應領之人 為受益人，受益人身故後，成為受益人之遺產"}, {"id": 188, "question": "我國民法對於第一順位繼承人之見解，下列敘述何者錯誤？", "option_1": "母與父離 婚，子女仍對 其父母有繼承權", "option_2": "父死母再嫁者，子女仍對其母有繼承權", "option_3": "男子入贅於妻家，將喪失其對父母之繼承權", "option_4": "繼父母與繼子女之間， 不得相互繼承", "answer": 3, "explanation": "男子入贅仍保有其對父母之繼承權"}, {"id": 189, "question": "依遺產及贈與稅法第17 條規定，被繼承人僅遺有成年子女1 名及母親， 扣除額合計為", "option_1": "223", "option_2": "173", "option_3": "180", "option_4": "140 萬元。", "answer": 4, "explanation": "依遺贈稅法第17 條規定，子女扣除額是40 萬(已 滿18 歲)、父母扣除額100 萬，所以 40+100=140 萬。"}, {"id": 190, "question": "依遺產及贈與稅法第17 條規定，配偶之扣除額為", "option_1": "400", "option_2": "500", "option_3": "350", "option_4": "493 萬元。", "answer": 1, "explanation": "遺贈稅法第17 條規定，配偶扣除額為400 萬元。"}, {"id": 191, "question": "依遺產及贈與稅法第17 條規定，祖父母之扣除額為", "option_1": "40", "option_2": "45", "option_3": "100", "option_4": "50 萬元。", "answer": 1, "explanation": "遺贈稅法第17 條規定，祖父母扣除額為40 萬 元。"}, {"id": 192, "question": "依遺產及贈與稅法第17 條規定，成年子女之扣除額為", "option_1": "100", "option_2": "120", "option_3": "50", "option_4": "40 萬元。", "answer": 4, "explanation": "遺贈稅法第17 條規定，成年子女之扣除額為40 萬元。"}, {"id": 193, "question": "老王去年度共有三次贈與，贈與其子1 棟房屋2000 萬元，贈與其妻轎車 200 萬元，贈與其女出嫁禮金80 萬元，則老王今年度課稅贈與總額為", "option_1": "2280", "option_2": "2080", "option_3": "2200", "option_4": "2000 萬元。", "answer": 4, "explanation": "贈與總額-免稅額-扣除額=課稅贈與淨額 1.夫妻間之贈與不計入贈與總額。 2.父母於子女婚嫁時所贈與之財務，總金額不超過 100 萬元也不計入。 故贈與總額為2000 萬元"}, {"id": 194, "question": "關於遺產稅款之繳納方式有A 現金繳納；B 實物抵繳；C 分期繳納；D 部 分現金繳納，部分實物一次抵繳", "option_1": "ABCD", "option_2": "AC", "option_3": "BCD", "option_4": "ABD。", "answer": 1, "explanation": "以上皆可"}, {"id": 195, "question": "何者正確？A 凡向產險公司投保之保費皆不得列舉扣除；B 現行長期照顧 特別扣除額為每人每年12 萬元；C 團體投資型保險每人每月保費2 千元 以內免視為被保險人薪資所得；D 團體保單經驗分紅退費之給付免納所得 稅。", "option_1": "ABCD", "option_2": "AD", "option_3": "BD", "option_4": "BCD。", "answer": 3, "explanation": "A 向產險公司投保之意外傷害險、健康險，該保費 可扣除；C 團體壽險之保費，每人每月保費2 千元 以內免視為被保險人薪資所得。"}, {"id": 196, "question": "下列何者正確？A 滿期保險給付所含之利益所得，受益人享有免納利息所 得之稅法優惠；B 勞工退休請領勞退帳戶退休金時，屬退職所得須計入個 人綜所稅總額；C 醫療費用支出曾受保險給付，得再以醫療費扣除額申 報；D 死亡保險金指定法定繼承人，各該繼承人領取保險金後須繳納遺產 稅", "option_1": "ABC", "option_2": "ABD", "option_3": "AB", "option_4": "BD。", "answer": 3, "explanation": "C 醫療費用支出曾受保險給付，不得再以醫療費扣 除額申報；D 死亡保險金指定法定繼承人，各該繼 承人領取保險金無須繳納遺產稅。"}, {"id": 197, "question": "有關拋棄繼承何者錯誤？", "option_1": "繼承人中一人拋棄，其應繼分歸屬於其他繼承 人", "option_2": "拋棄繼承無須開具遺產清冊但需書面呈報法院", "option_3": "遺屬在知悉得繼承 之時起3 個月內表示，且不得申請延長", "option_4": "屬單獨行為需經法院同意始生 效。", "answer": 4, "explanation": "(4)屬單獨行為，只要程序完整，無須法院同意。"}, {"id": 198, "question": "甲生前投保20 萬元之死亡保險未指定受益人，但另有債務25 萬元，假 設甲死後除了保險金外沒有其他財產，而僅有一子乙，又乙未向法院表示 拋棄繼承，則乙", "option_1": "繼承保險金但無須償還任何債務", "option_2": "以保險金償還債務 後仍餘債務5 萬元須償還", "option_3": "僅就繼承之保險金償還債務即可", "option_4": "不繼承保 險金亦無須繼承債務。", "answer": 3, "explanation": "如乙未向法院表示拋棄繼承，則乙僅就繼承之保險 金償還債務即可。"}, {"id": 199, "question": "下列的敘述何者有誤?", "option_1": "納稅義務人為自己投保之人身保險費可採列舉扣 除額方式申報自綜合所得總額中扣除", "option_2": "配偶與子和女共同繼承時，配偶特 留分為應繼分之1/2", "option_3": "配偶與子和女共同繼承時，配偶應繼分為遺產總額 之1/2", "option_4": "死亡保險未指定身故受益人時，該死亡保險金作為被保險人遺 產。", "answer": 3, "explanation": "(3)配偶與子和女共同繼承時，應繼分按人數平均分 配。"}, {"id": 200, "question": "下列敘述何者錯誤？", "option_1": "凡屬人身保險之保險給付，在一定條件下不論其項 目名稱均得依法免納所得稅", "option_2": "軍公教保險之保險給付免納所得稅", "option_3": "人壽 保險之解約金屬人身保險之保險給付範圍", "option_4": "壽險滿期保險金在一定條件下 得享有免稅優惠。", "answer": 3, "explanation": "人身保險、勞工保險、軍公教保險之保險給付及壽 險滿期保險金在一定條件下免納所得稅。"}, {"id": 201, "question": "A 謀求員工福利；B 為員工退休或退職提存準備金；C 減輕雇主責任；D 減免營利事業所得稅，上述何者是企業投保團體人壽保險之主要目的？", "option_1": "ABC", "option_2": "ACD", "option_3": "ABCD", "option_4": "BCD。", "answer": 3, "explanation": "企業投保團體壽險主要目的：為謀員工的福利、為 員工退休或退職提存準備金、為防意外災變影響員 工生活並減輕雇主的責任、減免營利事業所得稅。"}, {"id": 202, "question": "依民法第八條對失蹤人為死亡宣告之期限，何者正確？A 如遇特別災難於 災難終了滿三年後；B 一般失蹤滿七年後；C 失蹤人為八十歲以上於失蹤 滿一年後；D 得由利害關係人向檢察官聲請宣告", "option_1": "B", "option_2": "BD", "option_3": "ABCD", "option_4": "ABC。", "answer": 1, "explanation": "失蹤宣告： 一般失蹤滿7 年；80 歲以上失蹤人滿3 年；特別 災難事故滿1 年。"}, {"id": 203, "question": "死亡保險金300 萬未指定身故受益人，如被保險人僅有配偶和兄弟姊妹， 該保險金應如何分配？", "option_1": "配偶200 萬、兄弟姊妹100 萬", "option_2": "配偶100 萬、 兄弟姊妹200 萬", "option_3": "配偶150 萬、兄弟姊妹150 萬", "option_4": "按人數平均分配。", "answer": 3, "explanation": "應繼分：配偶 1/2，兄弟姊妹1/2。"}, {"id": 204, "question": "依現行遺產及贈與稅法規定，祖父母之扣除額為", "option_1": "100 萬", "option_2": "56 萬", "option_3": "111 萬", "option_4": "445 萬 元。", "answer": 2, "explanation": "祖父母扣除額每人56 萬。"}, {"id": 205, "question": "依現行遺產稅及贈與稅法規定，直系血親卑親屬每人扣除額為？", "option_1": "45 萬", "option_2": "56 萬", "option_3": "55 萬", "option_4": "40 萬。", "answer": 2, "explanation": "依現行遺產稅及贈與稅法規定，直系血親卑親屬每 人扣除額為56 萬。"}, {"id": 206, "question": "依遺產及贈與稅法第12-1 條規定，被繼承人遺有父母者，父母每人可扣 除額為", "option_1": "100 萬", "option_2": "138 萬", "option_3": "445 萬", "option_4": "400 萬。", "answer": 2, "explanation": "依遺產及贈與稅法第12-1 條規定，被繼承人遺有 父母者，父母每人可扣除額為138 萬。"}, {"id": 207, "question": "依現行遺產及贈與稅法規定，贈與稅之免稅額為", "option_1": "200 萬", "option_2": "250 萬", "option_3": "123 萬", "option_4": "244 萬 元。", "answer": 4, "explanation": "遺產及贈與稅法條文第22 條：贈與稅納稅義務 人，每年得自贈與總額中減除免稅額244 萬元。"}, {"id": 208, "question": "依遺產及贈與稅法第12-1 條規定，現行被繼承人之喪葬費用扣除額為", "option_1": "100 萬", "option_2": "50 萬", "option_3": "40 萬", "option_4": "138 萬 元。", "answer": 4, "explanation": "依遺產及贈與稅法第12-1 條規定，現行被繼承人 之喪葬費用扣除額為138 萬。"}, {"id": 209, "question": "", "option_1": "特留分", "option_2": "持分", "option_3": "法定繼承額", "option_4": "應繼分 乃法定繼承人對遺產依法得繼 承之數額。", "answer": 4, "explanation": "應繼分：各繼承人對於遺產上之一切權利義務所得 繼承之比例。"}, {"id": 210, "question": "某甲一家投保人壽保險，全年所繳保費：某甲及其配偶合計為二萬四千 元、成年長子二萬五千元、未成年次子一萬二千元，某甲於申報綜合所得 稅時採用列舉扣除法，則一年可扣除的保險費為", "option_1": "八萬五千元", "option_2": "八萬四 千元", "option_3": "六萬元", "option_4": "六萬一千元。", "answer": 3, "explanation": "依所繳保費加總試算-每人最高扣除額為24,000 24,000+24,000(25,000 超過)+12,000=60,000"}, {"id": 211, "question": "遺產稅或贈與稅應納稅額在三十萬元以上，納稅義務人確有困難，不能一 次繳納現金時，得於納稅期限內，向該管稽徵機關申請，分", "option_1": "十八期", "option_2": "六期", "option_3": "三十六期", "option_4": "二十四期 以內繳納。", "answer": 1, "explanation": "遺產稅或贈與稅應納稅額在三十萬元以上，納稅義 務人確有困難，不能一次繳納現金時，得於納稅期 限內，向該管稽徵機關申請分18 期以內繳納，每 次間隔以不超過2 個月為限。"}, {"id": 212, "question": "被保險人之法定繼承人可以拋棄繼承被保險人之債務，但應於知悉其得繼 承之時起", "option_1": "二個月", "option_2": "一個月", "option_3": "三個月", "option_4": "六個月 內以書面向法院表示。", "answer": 3, "explanation": "被保險人之法定繼承人可以拋棄繼承被保險人之債 務，但應於知悉其得繼承之時起三個月內以書面向 法院表示。"}, {"id": 213, "question": "以下何者得不計入贈與總額？A 捐贈公有事業機構之財產；B 扶養義務人 為受扶養人支付之生活費；C 配偶相互贈與之財產；D 父母於子女婚嫁時 所贈與之財物，總金額不超過200 萬元", "option_1": "ACD", "option_2": "ABC", "option_3": "ABCD", "option_4": "AC。", "answer": 2, "explanation": "D 父母於子女婚嫁贈與財務，免稅額100 萬。"}, {"id": 214, "question": "依民法規定第一順位繼承人全部拋棄繼承，由其次親等人辦理繼承者，稱 為", "option_1": "代位繼承", "option_2": "概括繼承", "option_3": "共同繼承", "option_4": "隔代繼承。", "answer": 4, "explanation": "當所有第一順位繼承人全部拋棄繼承，由其直系親 卑親屬隔代繼承。"}, {"id": 215, "question": "贈與人在一年內贈與他人之財產總值超過贈與稅免稅額時，應於超過免稅 額之贈與行為發生後", "option_1": "二個月內", "option_2": "十日內", "option_3": "三十日內", "option_4": "二十日內，向贈 與人戶籍所在地之稅捐機關申報。", "answer": 3, "explanation": "贈與納稅義務人應於行為發生後30 天內，向贈與 人戶籍所在地之稅捐機關申報。"}, {"id": 216, "question": "李君以自己為被保險人，身故受益人欄位僅寫配偶及子女，投保當時育有 一子，投保後再生育一子一女，李君死亡時，其妻、子、女皆生存，共有 幾人可享有保險金受領權？", "option_1": "2 人", "option_2": "3 人", "option_3": "4 人", "option_4": "5 人。", "answer": 3, "explanation": "繼承權利由當然繼承人(配偶)加上順位繼承人繼 承，人數為其身故時之當然繼承人及順位繼承人數 量分，此題有配偶1 人以及2 子1 女，共4 人。"}, {"id": 217, "question": "下列敘述何者錯誤？", "option_1": "經常居住國外之非中華民國國民，其在國內之贈與 應課贈與稅", "option_2": "死亡事實或贈與行為發生前2 年內，被繼承人或贈與人自 願喪失中華民國國籍，免課徵遺產稅或贈與稅", "option_3": "經常居住國外之中華民國 國民，其在國內之贈與應課贈與稅", "option_4": "經常居住國內之中華民國國民，對於 其在中華民國境外財產之贈與應課贈與稅。", "answer": 2, "explanation": "(2)死亡事實或贈與行為發生前2 年內，被繼承人 或贈與人自願喪失中華民國國籍，需課徵遺產稅或 贈與稅。"}, {"id": 218, "question": "某甲身故後留有死亡保險金1000 萬元，因未指定身故受益人，若某甲沒 有其他遺產，但立有遺囑將保險金全部歸配偶所有，在僅有配偶和父母之 情形下，則該保險金，某甲父親可領到", "option_1": "333 萬", "option_2": "125 萬", "option_3": "250 萬", "option_4": "500 萬 元。", "answer": 2, "explanation": "遺囑處份：立有遺囑時，依照被保險人遺囑分配， 但必須考慮遺囑內容是否侵害到法定繼承人特留分 應繼分1000*1/2=500；特留分500*1/2=250； 父親可領125 萬元。"}, {"id": 219, "question": "有關贈與稅敘述何者正確？", "option_1": "贈與人逾繳納期限尚未繳納，且在中華民國 境內有財產可供執行，以受贈人為納稅義務人", "option_2": "贈與人行蹤不明者，仍應 以贈與人為納稅義務人", "option_3": "贈與稅未繳清前得先行分割遺產或辦理移轉登記", "option_4": "贈與人死亡時贈與稅尚未核課者，以受贈人為納稅義務人。", "answer": 4, "explanation": "(1)贈與人逾繳納期限尚未繳納，且在中華民國境內 無財產可供執行，以受贈人為納稅義務人(2)贈與人 行蹤不明者，以受贈人為納稅義務人(3)贈與稅未繳 清前不得先行分割遺產或辦理移轉登記"}, {"id": 220, "question": "共同居住之家人投保人壽保險，全年所繳保費：阿公二萬元、父母共二萬 四千元、未成年長子二萬五千元、未成年次子一萬二千元；若全家合併申 報綜合所得稅且採用列舉扣除法，則一年可扣除的保險費為", "option_1": "十一萬七千 元", "option_2": "八萬元", "option_3": "十二萬元", "option_4": "十萬四千元。", "answer": 2, "explanation": "每人每年扣除數額以不超過新台幣24,000 元為 限。但全民健康保險之保險費不受金額限制。 20,000+24,000+24,000+12,000=80,000"}, {"id": 221, "question": "保險金受領人為數人時，其受益之分配應詳載於保險單，如其數額尚未確 定者應", "option_1": "墊交保費之受益人可獨得", "option_2": "由受益人間彼此協商", "option_3": "平均分受其 權利", "option_4": "依應繼分比例分配。", "answer": 3, "explanation": "由多位受益人共同領取保險金，其受領之順序及比 例詳載於保險單，否則未經確定者，應依民法第 271 條之規定由各受益人平均分受其權利。"}, {"id": 222, "question": "依據所得稅法第14 條規定，員工依勞工退休條例自願提繳之退休金，合 計在每月工資", "option_1": "8%", "option_2": "5%", "option_3": "10%", "option_4": "6% 範圍內，不計入提繳年度薪資 所得課稅。", "answer": 4, "explanation": "依據所得稅法第14 條規定，員工依勞工退休條例 自願提繳之退休金，合計在每月工資6%範圍內， 不計入提繳年度薪資所得課稅。"}, {"id": 223, "question": "依據民法繼承編之規定，A 父母；B 子女 ; C 兄弟姊妹 ; D 祖父母，在繼 承開始時之繼承順序為何", "option_1": "BADC", "option_2": "BACD", "option_3": "ABCD", "option_4": "BCAD。", "answer": 2, "explanation": "法定繼承人的優先順序為當然繼承人(配偶)→第一 順位(直系血親卑親屬)→第二順位(父母)→第三順 位(兄弟姊妹)→第四順位(祖父母)。"}, {"id": 224, "question": "二人以上同時遇難，不能證明死亡之先後時，", "option_1": "視為同時死亡", "option_2": "推定年 紀大者先死", "option_3": "推定同時死亡", "option_4": "由法院裁定。", "answer": 3, "explanation": "民法第11 條規定，同時遇難，無法證明先後，推 定為同時死亡。"}, {"id": 225, "question": "有關繼承的敘述何者正確？", "option_1": "繼父母與繼子女間為直系血親相互有繼承權", "option_2": "父死母再嫁者，子女對其母喪失繼承權", "option_3": "男子入贅妻家後喪失對父母 之繼承權", "option_4": "非婚生子女經準正後對其生父有繼承權。", "answer": 4, "explanation": "(1)繼父母與繼子女間之間是直系姻親而非血親，故 其相互間無繼承問題(2)父死母再嫁者，子女仍對其 親生父母有繼承權(3)男子入贅妻家後對原父母之繼 承權不受影響。"}, {"id": 226, "question": "繼承人拋棄繼承時，下列敘述何者錯誤？", "option_1": "須經法院同意", "option_2": "須以書面呈 報法院", "option_3": "書面通知因其拋棄而應為繼承之人", "option_4": "不繼承財產，亦不用負擔 任何債務。", "answer": 1, "explanation": "拋棄繼承為繼承人之單獨行為，只要程序完整，無 須法院同意。"}, {"id": 227, "question": "遺產稅及贈與稅納稅義務人，應於稽徵機關送達核定納稅通知書之日起", "option_1": "二個月", "option_2": "一個月", "option_3": "半年", "option_4": "三個月 內，繳清應納稅款。", "answer": 1, "explanation": "稅款得申請延長兩個月繳清稅款，超過30 萬以上 得分18 期，以不超過2 個月為限"}, {"id": 228, "question": "有關勞工自願提撥薪資一定百分比至個人勞退帳戶，何者正確？A 提撥年 度個人所得總額減少有減稅效果；B 退休後請領該帳戶退休金屬退職所 得，不計入個人綜合所得總額；C 退休後請領該帳戶退休金，應計入個人 綜合所得總額；D 該退休金屬人身保險給付，依所得稅法規定全額免稅", "option_1": "BD", "option_2": "AC", "option_3": "ABD", "option_4": "AD。", "answer": 2, "explanation": "BD 勞退退休金屬退職所得，計入個人綜合總額所 得，故要課稅。 勞保老年給付：屬人身保險給付全額免稅"}, {"id": 229, "question": "老王投保20 萬元之死亡保險，受益人為小明，但另有債務25 萬元，假 設老王除了保險金外沒有其他財產，而老王只有一子小明，小明向法院表 示拋棄繼承，則小明", "option_1": "須償還債務5 萬元", "option_2": "須償還債務25 萬", "option_3": "僅領取 20 萬元保險金", "option_4": "不繼承保險金亦無須償還任何債務。", "answer": 3, "explanation": "有指定受益人+拋棄繼承：領保險金且無須繼承負 債；無指定受益人+拋棄繼承：不領保險金且無須 繼承負債。"}, {"id": 230, "question": "依現行規定遺產及贈與稅法規定，遺產稅稅率最高課稅級距為？", "option_1": "10%", "option_2": "15%", "option_3": "20%", "option_4": "30%。", "answer": 3, "explanation": "依現行規定遺產及贈與稅法規定，遺產稅稅率最高 課稅級距為20%。"}, {"id": 231, "question": "依遺產及贈與稅法規定，遺產總額包括被繼承人死亡前", "option_1": "五年", "option_2": "二年", "option_3": "六年", "option_4": "一年 內贈與配偶及子女、父母、兄弟姊妹、祖父母等法定繼承 人及上述法定繼承人配偶的財產。", "answer": 2, "explanation": "依遺產及贈與稅法規定，遺產總額包括被繼承人死 亡前2 年內贈與配偶及直系血親卑親屬、父母、兄 弟姊妹、祖父母等法定繼承人及上述法定繼承人配 偶的財產。"}, {"id": 232, "question": "甲僅遺有子女乙與丙，甲死後遺留財產1000 萬元，甲於遺囑中表示將其 遺產60%全數捐給慈善機構，僅留40%由乙、丙平均分配，則依民法規 定乙可繼承多少金額？", "option_1": "400 萬元", "option_2": "250 萬元", "option_3": "200 萬元", "option_4": "500 萬元。", "answer": 2, "explanation": "因60%遺產侵犯到特留分，因此要計算特留分。 特留分為應繼分1/2，因此先計算乙的應繼分 乙的應繼分為1000 萬/2=500 萬 乙的特留分為500 萬/2=250 萬"}, {"id": 233, "question": "繼承人中一人拋棄繼承，其應繼分歸屬於", "option_1": "國庫", "option_2": "次順位繼承人", "option_3": "其他 繼承人", "option_4": "被繼承人。", "answer": 3, "explanation": "繼承人中一人拋棄繼承，其應繼分歸屬於其他繼承 人。"}, {"id": 234, "question": "若保險金在死亡保險中未指定身故受益人之受領順序及比例時，又被保險 人僅列有子女和配偶，則該保險金應如何分配？", "option_1": "配偶、子女各二分之一", "option_2": "配偶三分之二、子女三分之一", "option_3": "按人數平均分配", "option_4": "配偶獨領。", "answer": 3, "explanation": "若保險金在死亡保險中未指定身故受益人之受領順 序及比例時，又被保險人僅列有子女和配偶，則該 保險金按人數平均分配。"}, {"id": 235, "question": "遺囑人於不違反關於", "option_1": "特留分", "option_2": "應繼分", "option_3": "保留分", "option_4": "遺贈分 規定之範 圍內，得以遺囑自由處分遺產。", "answer": 1, "explanation": "被保險人立有遺囑時，依照被保險人的遺囑分配， 但必須考慮被保險人的遺囑內容是否有侵害到法定 繼承人的特留分。"}, {"id": 236, "question": "訂立要保人甲與被保險人乙為不同人之人壽保險，若變更要保人為丙，何 者正確？A 有保單價值準備金且超過贈與免稅額，甲須申報贈與稅；B 有 保單價值準備金且超過贈與免稅額，丙須申報贈與稅；C 丙非同時為受益 人者，則受益人須將保險給付列入當年度基本所得額；D 丙同時為受益人 者，須將保險給付列入當年度基本所得額", "option_1": "BC", "option_2": "ACD", "option_3": "BD", "option_4": "AC。", "answer": 4, "explanation": "B 有保單價值準備金且超過贈與免稅額，甲須申報 贈與稅(贈與人為納稅義務人)；D 丙同時為受益人 者，不須將保險給付列入當年度基
