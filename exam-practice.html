<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>考試題庫練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#25507F;
  --navy-deep:#1A3A63;
  --paper:#FDFAF3;
  --brass:#BE9A57;
  --brass-light:#E4D3AE;
  --stamp-green:#2F8F5B;
  --stamp-red:#C24A3C;
  --ink:#2b2b2b;
  --ink-soft:#5b5347;
  --line:#e3d9c2;
  --surface:#ffffff;
  --surface-soft:#FFFDF7;
  --body-bg-1:#E9F1FB;
  --body-bg-2:#FBF7EA;
  --body-bg-3:#FDFAF3;
  --msg-bg:#F1F7EE;
  --msg-border:#bcd9ab;
  --msg-text:#356b2c;
  --msg-err-bg:#FBEDEA;
  --msg-err-border:#e3b3a9;
  --remark-bg:#FBF7EA;
  --wrongbank-bg:#FBF1E3;
  --correct-bg:#F1F8F0;
  --wrong-bg:#FBF0EE;
}
body.dark{
  --navy:#5C93D1;
  --navy-deep:#8FBBEB;
  --paper:#1E232C;
  --brass:#D9BA80;
  --brass-light:#4A3F2A;
  --stamp-green:#5FBE8D;
  --stamp-red:#E28B7A;
  --ink:#EDEAE0;
  --ink-soft:#AFA997;
  --line:#3A4150;
  --surface:#262C37;
  --surface-soft:#232A34;
  --body-bg-1:#11151b;
  --body-bg-2:#15191f;
  --body-bg-3:#181c22;
  --msg-bg:#233428;
  --msg-border:#3d6b46;
  --msg-text:#9fd9ac;
  --msg-err-bg:#3a2624;
  --msg-err-border:#7a4640;
  --remark-bg:#2c2a1e;
  --wrongbank-bg:#2f2a1c;
  --correct-bg:#1c3324;
  --wrong-bg:#3a2420;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:linear-gradient(160deg,var(--body-bg-1) 0%,var(--body-bg-2) 60%,var(--body-bg-3) 100%);
  font-family:'Noto Sans TC',sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  padding:24px 12px 60px;
  transition:background .2s;
}
.app{
  width:100%;
  max-width:720px;
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 18px 44px rgba(37,80,127,0.18),0 2px 8px rgba(0,0,0,0.06);
  border:1px solid var(--line);
}
.cover{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
  color:#fff;
  padding:18px 20px 16px;
  position:relative;
  min-height:54px;
}
.cover h1{
  font-family:'Noto Serif TC',serif;
  font-weight:900;
  font-size:19px;
  margin:0 0 2px;
  letter-spacing:0.5px;
}
.cover .sub{
  font-size:12.5px;
  opacity:0.86;
  font-family:'IBM Plex Mono',monospace;
}
.cover-actions{
  position:absolute;
  top:14px;
  right:16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.cover-home-btn{
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.4);
  color:#fff;
  font-size:12px;
  padding:6px 12px;
  border-radius:20px;
  cursor:pointer;
}
.cover-home-btn:hover{background:rgba(255,255,255,0.24);}
.dark-toggle-btn{
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.4);
  color:#fff;
  font-size:14px;
  width:30px;
  height:30px;
  line-height:1;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.dark-toggle-btn:hover{background:rgba(255,255,255,0.24);}
.body{padding:20px;}
h2.section-title{
  font-family:'Noto Serif TC',serif;
  font-size:16px;
  color:var(--navy-deep);
  margin:0 0 10px;
  border-left:4px solid var(--brass);
  padding-left:10px;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:16px;
}
.msg-banner{
  background:var(--msg-bg);
  border:1px solid var(--msg-border);
  color:var(--msg-text);
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  margin-bottom:16px;
  line-height:1.5;
}
.msg-banner.error{background:var(--msg-err-bg);border-color:var(--msg-err-border);color:var(--stamp-red);}
.drop-zone{
  border:2px dashed var(--brass);
  border-radius:12px;
  padding:32px 16px;
  text-align:center;
  background:var(--surface-soft);
  cursor:pointer;
  transition:background .15s;
}
.drop-zone:hover,.drop-zone.dragover{background:var(--brass-light);}
.drop-zone .big{font-size:15px;color:var(--navy-deep);font-weight:600;margin-bottom:6px;}
.drop-zone .small{font-size:12px;color:var(--ink-soft);}
input[type=file]{display:none;}
.btn{
  display:inline-block;
  font-family:'Noto Sans TC',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:9px 18px;
  border-radius:8px;
  border:1px solid var(--navy);
  background:var(--navy);
  color:#fff;
  cursor:pointer;
  text-align:center;
}
.btn:hover{background:var(--navy-deep);}
.btn.secondary{background:var(--surface);color:var(--navy);}
.btn.secondary:hover{background:#eef3fa;}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff;}
.btn.brass:hover{filter:brightness(0.95);}
.btn.ghost{background:transparent;color:var(--stamp-red);border-color:var(--stamp-red);}
.btn.ghost:hover{background:#fbeeeb;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.bank-summary{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.bank-summary .count{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--navy-deep);font-weight:700;}
.bank-summary .count span{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:8px;}
.class-item{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.class-item input{accent-color:var(--navy);width:16px;height:16px;}
.class-item .cnt{margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;}
.select-links{font-size:12px;color:var(--navy);margin:6px 0 2px;}
.select-links a{color:var(--navy);cursor:pointer;text-decoration:underline;margin-right:12px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px;color:var(--ink-soft);}
.checkline input{accent-color:var(--navy);width:15px;height:15px;}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.wrongbank-callout{
  background:var(--wrongbank-bg);border:1px solid var(--brass);border-radius:10px;
  padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.wrongbank-callout .txt{font-size:13px;color:var(--navy-deep);}
.stat-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
.stat-line a{color:var(--navy);cursor:pointer;text-decoration:underline;}
.start-btn-wrap{margin-top:6px;}
.start-btn{width:100%;padding:14px;font-size:15.5px;border-radius:10px;}

/* quiz screen */
.entry-bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.entry-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tag{background:var(--surface-soft);color:var(--navy-deep);border-radius:12px;padding:2px 9px;font-size:11.5px;}
.entry-right{display:flex;align-items:center;gap:10px;}
.zoom-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1;}
.flag-btn{border:none;background:none;font-size:18px;cursor:pointer;color:var(--brass);}
.timer{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--navy-deep);}
.exam-timer{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;text-align:center;color:var(--navy-deep);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;}
.exam-timer.warn{color:var(--stamp-red);border-color:var(--stamp-red);}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink);}
.field-row input{width:90px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-soft);color:var(--ink);font-size:15px;text-align:center;font-family:inherit;}
.preset-btns{display:flex;gap:8px;}
.preset-btn{flex:1;text-align:center;padding:8px 0;border:1.5px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink-soft);cursor:pointer;background:var(--surface);}
.preset-btn.active{border-color:var(--brass);color:var(--navy-deep);font-weight:700;background:var(--brass-light);}
.bank-strip{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:9px 2px;margin-bottom:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;}
.bank-strip .bs-name{flex:1 1 140px;min-width:0;font-weight:600;color:var(--navy-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bank-strip .bs-count{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;}
.bank-strip .bs-links{display:flex;align-items:center;gap:4px;white-space:nowrap;margin-left:auto;}
.bank-strip .bs-links a{color:var(--navy);text-decoration:underline;cursor:pointer;padding:2px 4px;}
.bank-strip .bs-links a.dis{color:var(--ink-soft);opacity:.5;text-decoration:none;cursor:not-allowed;}
.bank-strip .bs-links a.del{color:var(--stamp-red);}
.bank-strip .bs-links i{color:var(--line);font-style:normal;}
.rv-status{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;}
.rv-status.ok{color:var(--stamp-green);background:var(--correct-bg);border:1px solid var(--stamp-green);}
.rv-status.bad{color:var(--stamp-red);background:var(--wrong-bg);border:1px solid var(--stamp-red);}
.rv-status.none{color:var(--ink-soft);background:var(--surface-soft);border:1px solid var(--line);}
.rv-mine{flex:0 0 auto;font-size:11px;color:var(--navy-deep);background:var(--brass-light);border-radius:999px;padding:2px 8px;align-self:center;}
.rv-legend{display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-soft);margin:18px 0 8px;}
.rv-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;}
.rv-dot.ok{background:var(--stamp-green);} .rv-dot.bad{background:var(--stamp-red);} .rv-dot.none{background:var(--line);}
.rv-palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-bottom:16px;}
.rv-pal{height:34px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:12px;cursor:pointer;font-family:inherit;}
.rv-pal.ok{background:var(--correct-bg);border-color:var(--stamp-green);color:var(--stamp-green);}
.rv-pal.bad{background:var(--wrong-bg);border-color:var(--stamp-red);color:var(--stamp-red);}
.rv-pal.current{outline:2.5px solid var(--navy);outline-offset:1px;font-weight:700;}
.exam-stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-soft);margin:16px 0 8px;}
.exam-stat a{font-size:11px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;opacity:.8;white-space:nowrap;}
.exam-stat a:hover{color:var(--stamp-red);opacity:1;}
.exam-btn-row{display:flex;gap:10px;}
.exam-btn-row .btn{width:auto;padding:14px 8px;font-size:15.5px;border-radius:10px;font-weight:700;}
.exam-btn-row .exam-main{flex:3;}
.exam-btn-row .exam-refresh{flex:1;background:#D23B2E;color:#fff;border:0;box-shadow:0 2px 6px rgba(210,59,46,.35);}
body.dark .exam-btn-row .exam-refresh{background:#E0584B;}
.rf-ic{display:inline-flex;vertical-align:-4px;margin-right:2px;}
.rf-ic.spin{animation:rfspin .7s cubic-bezier(.4,0,.2,1);}
@keyframes rfspin{to{transform:rotate(-360deg);}}
.rf-flash{animation:rfflash .9s ease-out;}
@keyframes rfflash{0%{opacity:0;transform:translateY(8px);box-shadow:0 0 0 3px rgba(210,59,46,.45);}40%{opacity:1;transform:none;}100%{box-shadow:0 0 0 0 rgba(210,59,46,0);}}
@media (prefers-reduced-motion:reduce){.rf-ic.spin,.rf-flash{animation:none;}}
.exam-btn-row .exam-refresh:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}
.modal-mask{position:fixed;inset:0;background:rgba(20,24,32,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;}
.modal-box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px 20px 16px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3);}
.modal-msg{font-size:15px;line-height:1.7;white-space:pre-line;margin-bottom:16px;}
.modal-btns{display:flex;justify-content:flex-end;gap:10px;}
.modal-btns .btn{padding:9px 18px;font-size:14px;}
.modal-btns .modal-danger{background:#D23B2E;color:#fff;border:0;}
.stepper{display:flex;align-items:stretch;}
.stepper input[type=number]{width:72px;border-radius:8px 0 0 8px;-moz-appearance:textfield;appearance:textfield;}
.stepper input[type=number]::-webkit-inner-spin-button,.stepper input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.stepper-btns{display:flex;flex-direction:column;}
.stepper-btns button{flex:1;width:32px;border:1px solid var(--line);border-left:0;background:var(--surface);color:var(--navy);font-size:11px;cursor:pointer;padding:0;line-height:1;}
.stepper-btns button:first-child{border-radius:0 8px 0 0;border-bottom:0;}
.stepper-btns button:last-child{border-radius:0 0 8px 0;}
.stepper-btns button:active{background:var(--brass-light);}
.rv-spacer{height:64px;}
.rv-drawer{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:720px;margin:0 auto;}
.rv-bar{width:100%;display:flex;justify-content:space-between;align-items:center;font-family:inherit;background:linear-gradient(135deg,#24507F,#1B3A63);color:#fff;border:0;padding:14px 18px;font-size:14px;font-weight:600;cursor:pointer;border-radius:12px 12px 0 0;}
.rv-chev{transition:transform .25s;}
.rv-drawer.open .rv-chev{transform:rotate(180deg);}
.rv-sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:8px 14px 12px;max-height:55vh;overflow:auto;box-shadow:0 -6px 20px rgba(0,0,0,.14);display:none;}
.rv-drawer.open .rv-sheet{display:block;}
.rv-grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 6px;}
.rv-sheet .rv-legend{margin:6px 0 8px;} .rv-sheet .rv-palette{margin-bottom:4px;}
.rv-bar{}
body.dark .cover{background:linear-gradient(135deg,#2F4F78,#1F3856);}
body.dark .rv-bar{background:linear-gradient(135deg,#2E5A5C,#1F4144);border-top:1px solid #4A7F80;}
@media (max-width:720px){.rv-bar,.rv-sheet{border-radius:0;}}
.rv-pal-toggle{display:flex;justify-content:center;margin:16px 0 4px;}
.rv-pal-toggle span{font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;}
.mode-grid{display:flex;flex-direction:column;gap:14px;margin-top:6px;}
.mode-card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:22px 20px;cursor:pointer;}
.mode-card:hover{border-color:var(--brass);}
.mode-title{font-size:19px;font-weight:700;color:var(--navy-deep);margin-bottom:6px;}
.mode-desc{font-size:13px;color:var(--ink-soft);line-height:1.7;}
.mode-meta{margin-top:10px;font-size:12px;color:var(--brass);font-weight:600;}
.progress-bar-track{height:6px;background:#eee0c4;border-radius:4px;overflow:hidden;margin-bottom:16px;}
.jump-open-btn{
  background:var(--surface-soft);border:1px solid var(--brass);color:var(--navy-deep);
  border-radius:12px;padding:2px 10px;font-size:11.5px;font-weight:600;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;
}
.jump-open-btn:hover{background:var(--brass-light);}
.jump-panel{
  background:var(--surface);border:1px solid var(--brass);border-radius:10px;
  padding:12px 14px;margin:-6px 0 16px;
}
.jump-panel-title{font-size:13px;font-weight:600;color:var(--navy-deep);margin-bottom:10px;}
.jump-class-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.jump-class-btn{
  border:1px solid var(--line);background:var(--surface-soft);color:var(--navy-deep);
  border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.jump-class-btn:hover{border-color:var(--brass);}
.jump-class-btn .cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
.jump-input-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.jump-input-row .jump-cancel-btn{margin-left:auto;}
.jump-input-row input[type=number]{
  width:80px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px;
  font-family:'IBM Plex Mono',monospace;background:var(--surface);color:var(--ink);text-align:center;
}
.jump-cancel-btn{font-size:12px;padding:5px 12px;}
.jump-go-btn{font-size:12px;padding:5px 12px;}
.progress-bar-fill{height:100%;background:var(--brass);transition:width .2s;}
.question-text{font-size:18px;line-height:1.65;margin-bottom:16px;color:var(--ink);font-weight:600;white-space:pre-line;}
.option-row{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--surface);font-size:16px;line-height:1.55;
}
.option-row:hover{border-color:var(--brass);}
.option-row .mark{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px;}
.option-row.correct{border-color:var(--stamp-green);background:var(--correct-bg);}
.option-row.correct .mark{background:var(--stamp-green);border-color:var(--stamp-green);}
.option-row.wrong{border-color:var(--stamp-red);background:var(--wrong-bg);}
.option-row.wrong .mark{background:var(--stamp-red);border-color:var(--stamp-red);}
.option-row.selected:not(.correct):not(.wrong){border-color:var(--navy);}
.option-row.selected:not(.correct):not(.wrong) .mark{background:var(--navy);border-color:var(--navy);}
.option-row input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px;flex:0 0 auto;}
.remark-box{
  background:var(--remark-bg);border:1px solid var(--brass);border-radius:8px;padding:10px 14px;
  font-size:13px;color:var(--navy-deep);margin:6px 0 16px;white-space:pre-line;
}
.explanation-wrap{ margin:6px 0 16px; }
.explanation-toggle{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;
  font-size:13px;color:var(--brass);font-weight:600;padding:4px 2px;
}
.explanation-toggle:hover{ text-decoration:underline; }
.explanation-box{
  background:transparent;border-style:dashed;margin:4px 0 0;
}
.multi-hint{font-size:12px;color:var(--brass);margin:-4px 0 10px;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;}
.nav-row .spacer{flex:1;}

/* results */
.hero{text-align:center;padding:20px 0 10px;}
.hero .score{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:700;line-height:1;}
.hero .score.green{color:var(--stamp-green);}
.hero .score.gold{color:var(--brass);}

<body>
<div class="app" id="app"></div>

<script>
(function(){
"use strict";

/* ---------- storage wrapper ----------
   Uses Claude's window.storage when available (in-chat use).
   Falls back to localStorage automatically when the file is opened
   standalone in a phone/desktop browser, so progress still persists. */
var LS_PREFIX = 'examprep::';
function lsGet(key){
  try { return localStorage.getItem(LS_PREFIX+key); } catch(e){ return null; }
}
function lsSet(key, value){
  try {
    if (value === '' || value === null || value === undefined) localStorage.removeItem(LS_PREFIX+key);
    else localStorage.setItem(LS_PREFIX+key, value);
  } catch(e){ /* storage unavailable (e.g. private mode) - ignore */ }
}
var Store = {
  get: function(key, shared){
    shared = !!shared;
    if (window.storage){
      return window.storage.get(key, shared)
        .then(function(r){ return r ? r.value : null; })
        .catch(function(){ return lsGet(key); });
    }
    return Promise.resolve(lsGet(key));
  },
  set: function(key, value, shared){
    shared = !!shared;
    if (window.storage){
      return window.storage.set(key, value, shared)
        .then(function(){ return true; })
        .catch(function(){ lsSet(key, value); return true; });
    }
    lsSet(key, value);
    return Promise.resolve(true);
  }
};

var BANK_KEY = 'examprep-bank-v1';
var PROGRESS_KEY = 'examprep-progress-v1';
var SESSION_KEY = 'examprep-session-v1';
var REVIEW_SESSION_KEY = 'examprep-review-session-v1';
var EXAM_SESSION_KEY = 'examprep-exam-session-v1';
var LASTKIND_KEY = 'examprep-lastkind-v1';
var EXAMTIME_KEY = 'examprep-examtime-v1';
var EXAMPAPER_KEY = 'examprep-exampaper-v1';
var BANKSRC_KEY = 'examprep-banksources-v1';
var DARKMODE_KEY = 'examprep-darkmode-v1';
var SETUP_DONE_KEY = 'examprep-setup-done-v1';

/* ---------- data holders ---------- */
var ALL = [];
var CLASS_ORDER = [];
var CLASS_COUNTS = {};
var BY_ID = {};

var STATE = {
  screen: 'import', // import | home | setup (練習題目) | examsetup (模擬測驗) | quiz | results | examreview
  selectedClasses: {},
  setup: {
    types: { Single:true, Multi:true },
    randomOrder: false,
    randomOptions: false,
    showAllAnswers: false
  },
  quiz: null,
  reviewQuiz: null,
  examQuiz: null,
  bankSources: [], // names of the files the current bank was imported from
  examPaper: null,       // the fixed 70-question 測驗 paper: { questions:[...], results:null|{...} }
  examReviewFrom: 'results', // where 返回 leads from the 測驗瀏覽 screen: 'results' | 'home'
  reviewPaletteOpen: false, // 跳題表 collapsed or not while browsing a 測驗
  examReviewIndex: 0, // position while browsing all questions after a 測驗
  examTimeLimit: 60, // minutes, chosen before starting a 測驗
  quizKind: 'practice', // which slot the quiz screen is currently showing: 'practice' | 'review' | 'exam'
  wrongBank: [],
  seenBank: [],
  cumulative: { answered:0, correct:0 },       // 練習
  reviewStats: { answered:0, correct:0 },      // 複習錯題
  examStats: { answered:0, correct:0 },        // 測驗
  textScale: 1,
  importMessage: '',
  importIsError: false,
  results: null,
  darkMode: false,
  explanationOpen: {},
  jumpPanelOpen: false,
  jumpSelectedClass: null,
  setupConfigured: false,
  showFullSetup: false
};

/* ---------- indexing ---------- */
function rebuildIndexes(){
  CLASS_ORDER = [];
  CLASS_COUNTS = {};
  BY_ID = {};
  ALL.forEach(function(q){
    if(!(q.class in CLASS_COUNTS)){ CLASS_COUNTS[q.class]=0; CLASS_ORDER.push(q.class); }
    CLASS_COUNTS[q.class]++;
    BY_ID[q.id]=q;
  });
  CLASS_ORDER.forEach(function(c){ if(!(c in STATE.selectedClasses)) STATE.selectedClasses[c]=true; });
  STATE.wrongBank = (STATE.wrongBank||[]).filter(function(id){ return id in BY_ID; });
  STATE.seenBank = (STATE.seenBank||[]).filter(function(id){ return id in BY_ID; });
}

function indexOfQuestionInQuiz(quiz, cls, sn){
  var target = parseInt(sn, 10);
  var targetIsNum = !isNaN(target);
  for (var i=0;i<quiz.questions.length;i++){
    var qq = quiz.questions[i];
    if (qq.class!==cls) continue;
    if (qq.sn===sn) return i;
    if (targetIsNum && parseInt(qq.sn,10)===target) return i;
  }
  return -1;
}

/* ---------- normalization / parsing ---------- */
function toBool(v){
  if (v === true) return true;
  if (v === false || v === undefined || v === null) return false;
  var s = v.toString().trim().toLowerCase();
  return s === 'true' || s === '1' || s === 'y' || s === 'yes' || s === '對' || s === '是';
}

function csvRowToQuestion(row){
  if (!row) return null;
  function get(){
    for (var i=0;i<arguments.length;i++){
      var k = arguments[i];
      if (row[k] !== undefined && row[k] !== null && row[k].toString().trim() !== '') return row[k];
    }
    return '';
  }
  var cls = get('科目','class','Class').toString().trim();
  var sn = get('題號','sn','SN').toString().trim();
  var typeRaw = get('題型','type','Type').toString().trim();
  var type = /Multi|複選/i.test(typeRaw) ? 'Multi' : 'Single';
  var question = get('題目','question','Question').toString().trim();
  var opt1 = get('選項1','option1','選項一').toString().trim();
  var opt2 = get('選項2','option2','選項二').toString().trim();
  var opt3 = get('選項3','option3','選項三').toString().trim();
  var opt4 = get('選項4','option4','選項四').toString().trim();
  var optTexts = [opt1,opt2,opt3,opt4].filter(function(s){ return s.length>0; });
  var correctRaw = get('正確答案(選項編號)','正確答案','answer','Answer').toString();
  var correctNums = correctRaw.split(/[,，、\s]+/).map(function(s){ return parseInt(s,10); }).filter(function(n){ return !isNaN(n); });
  var options = optTexts.map(function(t,i){ return { option:t, answer: correctNums.indexOf(i+1)>=0 }; });
  var remark = get('法源依據/備註','備註','法源依據','remark','Remark').toString().trim();
  var explanation = get('答案解釋','解釋','explanation','Explanation').toString().trim();
  if (!cls || !sn || !question || options.length<2) return null;
  return { id: cls+'-'+sn, class:cls, sn:sn, type:type, question:question, options:options, remark:remark, explanation:explanation };
}

function normalizeItem(item){
  if (!item || typeof item !== 'object') return null;
  if (Array.isArray(item.options) && item.options.length && typeof item.options[0] === 'object' && ('option' in item.options[0] || 'text' in item.options[0])){
    var cls = (item.class||item['科目']||'').toString().trim();
    var sn = (item.sn||item['題號']||'').toString().trim();
    var typeRaw = (item.type||item['題型']||'Single').toString().trim();
    var type = /Multi|複選/i.test(typeRaw) ? 'Multi' : 'Single';
    var question = (item.question||item['題目']||'').toString().trim();
    var options = item.options.map(function(o){
      return { option:(o.option!==undefined?o.option:o.text||'').toString().trim(), answer: toBool(o.answer) };
    }).filter(function(o){ return o.option.length>0; });
    var remark = (item.remark!==undefined?item.remark:(item['法源依據/備註']||item['備註']||'')).toString().trim();
    var explanation = (item.explanation!==undefined?item.explanation:(item['答案解釋']||item['解釋']||'')).toString().trim();
    if (!cls || !sn || !question || options.length<2) return null;
    return { id: cls+'-'+sn, class:cls, sn:sn, type:type, question:question, options:options, remark:remark, explanation:explanation };
  }
  return csvRowToQuestion(item);
}

function parseCSVText(text){
  if (!window.Papa) return [];
  var res = Papa.parse(text, { header:true, skipEmptyLines:true });
  return (res.data||[]).map(normalizeItem).filter(Boolean);
}

function parseTXTText(text){
  var lines = text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  var out = [];
  for (var i=0;i<lines.length;i++){
    try {
      var obj = JSON.parse(lines[i]);
      var q = normalizeItem(obj);
      if (q) out.push(q);
    } catch(e){ /* skip malformed line */ }
  }
  return out;
}

function parseJSONText(text){
  var data;
  try { data = JSON.parse(text); } catch(e){ return []; }
  var arr = Array.isArray(data) ? data
    : (data && Array.isArray(data.questions)) ? data.questions
    : (data && Array.isArray(data.data)) ? data.data
    : [];
  return arr.map(normalizeItem).filter(Boolean);
}

function parseXLSXBuffer(buf){
  if (!window.XLSX) return [];
  var wb = XLSX.read(buf, { type:'array' });
  var sheet = wb.Sheets[wb.SheetNames[0]];
  var rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
  return rows.map(normalizeItem).filter(Boolean);
}

function mergeQuestions(items){
  var map = {};
  ALL.forEach(function(q){ map[q.id]=q; });
  items.forEach(function(q){ map[q.id]=q; });
  ALL = Object.keys(map).map(function(k){ return map[k]; });
  rebuildIndexes();
}

function persistBank(){ return Store.set(BANK_KEY, JSON.stringify(ALL), false); }

function finishImport(items, fileName){
  if (!items || items.length===0){
    STATE.importMessage = '「'+escapeHtml(fileName)+'」未解析出有效題目，請確認欄位是否包含 科目/題號/題型/題目/選項1-3/正確答案(選項編號)。';
    STATE.importIsError = true;
    render();
    return;
  }
  var before = ALL.length;
  mergeQuestions(items);
  var added = ALL.length - before;
  STATE.importMessage = '已從「'+escapeHtml(fileName)+'」匯入 '+items.length+' 題（新增 '+added+' 題，題庫共 '+ALL.length+' 題）';
  STATE.importIsError = false;
  if (STATE.bankSources.indexOf(fileName)<0) STATE.bankSources.push(fileName);
  Store.set(BANKSRC_KEY, JSON.stringify(STATE.bankSources), false);
  STATE.screen = 'home';
  persistBank();
  render();
}

function handleFile(file){
  if (!file) return;
  var name = file.name.toLowerCase();
  var isExcel = /\.(xlsx|xls)$/.test(name);
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var items = [];
      if (isExcel){
        items = parseXLSXBuffer(e.target.result);
      } else {
        var text = e.target.result;
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        if (/\.json$/.test(name)){
          items = parseJSONText(text);
        } else if (/\.csv$/.test(name)){
          items = parseCSVText(text);
        } else {
          items = parseTXTText(text);
          if (items.length===0) items = parseCSVText(text);
          if (items.length===0) items = parseJSONText(text);
        }
      }
      finishImport(items, file.name);
    } catch(err){
      STATE.importMessage = '匯入失敗：「'+escapeHtml(file.name)+'」解析發生錯誤（'+escapeHtml(err.message||'')+'）';
      STATE.importIsError = true;
      render();
    }
  };
  reader.onerror = function(){
    STATE.importMessage = '匯入失敗：無法讀取「'+escapeHtml(file.name)+'」';
    STATE.importIsError = true;
    render();
  };
  if (isExcel) reader.readAsArrayBuffer(file); else reader.readAsText(file,'UTF-8');
}

function clearBank(){
  askConfirm('確定要清除全部題庫嗎？此動作無法復原（作答紀錄與錯題本會一併清除）。', doClearBank, {okText:'清除', danger:true});
}
function doClearBank(){
  ALL = [];
  rebuildIndexes();
  STATE.wrongBank = [];
  STATE.seenBank = [];
  STATE.cumulative = { answered:0, correct:0 };
  STATE.reviewStats = { answered:0, correct:0 };
  STATE.examStats = { answered:0, correct:0 };
  STATE.quiz = null;
  STATE.reviewQuiz = null;
  STATE.examQuiz = null;
  STATE.setupConfigured = false;
  STATE.showFullSetup = false;
  Store.set(BANK_KEY, JSON.stringify(ALL), false);
  saveProgress();
  Store.set(SESSION_KEY, '', false);
  Store.set(REVIEW_SESSION_KEY, '', false);
  Store.set(EXAM_SESSION_KEY, '', false);
  Store.set(LASTKIND_KEY, '', false);
  STATE.bankSources = [];
  Store.set(BANKSRC_KEY, '', false);
  STATE.examPaper = null;
  Store.set(EXAMPAPER_KEY, '', false);
  Store.set(SETUP_DONE_KEY, '', false);
  STATE.screen = 'import';
  STATE.importMessage = '';
  render();
}

/* ---------- progress / session persistence ---------- */
function saveProgress(){
  Store.set(PROGRESS_KEY, JSON.stringify({ wrongBank: STATE.wrongBank, seenBank: STATE.seenBank, cumulative: STATE.cumulative, reviewStats: STATE.reviewStats, examStats: STATE.examStats }), false);
}
function loadProgress(){
  return Store.get(PROGRESS_KEY, false).then(function(raw){
    if (!raw) return;
    try {
      var p = JSON.parse(raw);
      STATE.wrongBank = (p.wrongBank||[]).filter(function(id){ return id in BY_ID; });
      STATE.seenBank = (p.seenBank||[]).filter(function(id){ return id in BY_ID; });
      applyStatsFrom(p);
    } catch(e){}
  });
}
var KIND_LABEL = { practice:'練習', review:'複習錯題', exam:'測驗' };
var KIND_SESSION_KEY = { practice:SESSION_KEY, review:REVIEW_SESSION_KEY, exam:EXAM_SESSION_KEY };
function emptyStats(){ return { answered:0, correct:0 }; }
function applyStatsFrom(p){
  STATE.cumulative = p.cumulative || emptyStats();
  STATE.reviewStats = p.reviewStats || emptyStats();
  STATE.examStats = p.examStats || emptyStats();
}
function statsOf(kind){
  return kind==='review' ? STATE.reviewStats : (kind==='exam' ? STATE.examStats : STATE.cumulative);
}
function getQuizSlot(kind){
  return kind==='review' ? STATE.reviewQuiz : (kind==='exam' ? STATE.examQuiz : STATE.quiz);
}
function setQuizSlot(kind, quiz){
  if (kind==='review') STATE.reviewQuiz = quiz;
  else if (kind==='exam') STATE.examQuiz = quiz;
  else STATE.quiz = quiz;
}
function hasPaused(kind){
  var q = getQuizSlot(kind);
  return !!(q && q.questions && q.questions.length);
}
function saveSession(){
  if (STATE.screen!=='quiz') return;
  var q = getQuizSlot(STATE.quizKind);
  if (q){
    Store.set(KIND_SESSION_KEY[STATE.quizKind], JSON.stringify(q), false);
    Store.set(LASTKIND_KEY, STATE.quizKind, false);
  }
}
function clearSessionOf(kind){ Store.set(KIND_SESSION_KEY[kind], '', false); }
function activeQuiz(){
  return getQuizSlot(STATE.quizKind);
}

/* ---------- in-page confirm dialog ---------- */
function askConfirm(message, onYes, opts){
  opts = opts || {};
  var old = document.getElementById('confirmMask');
  if (old) old.parentNode.removeChild(old);
  var mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'confirmMask';
  var box = document.createElement('div');
  box.className = 'modal-box';
  var msg = document.createElement('div');
  msg.className = 'modal-msg';
  msg.textContent = message;
  var row = document.createElement('div');
  row.className = 'modal-btns';
  function close(){ if (mask.parentNode) mask.parentNode.removeChild(mask); }
  if (!opts.noCancel){
    var no = document.createElement('button');
    no.className = 'btn secondary';
    no.textContent = opts.cancelText || '取消';
    no.addEventListener('click', close);
    row.appendChild(no);
  }
  var yes = document.createElement('button');
  yes.className = 'btn '+(opts.danger ? 'modal-danger' : 'brass');
  yes.textContent = opts.okText || '確定';
  yes.addEventListener('click', function(){ close(); if (onYes) onYes(); });
  row.appendChild(yes);
  box.appendChild(msg); box.appendChild(row); mask.appendChild(box);
  mask.addEventListener('click', function(e){ if (e.target===mask && !opts.noCancel) close(); });
  document.body.appendChild(mask);
  yes.focus();
}

/* ---------- helpers ---------- */
function escapeHtml(s){
  return (s===undefined||s===null?'':s.toString()).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function selectedClassList(){
  return CLASS_ORDER.filter(function(c){ return STATE.selectedClasses[c]; });
}
function selectedTotal(){
  var classes = selectedClassList();
  var types = STATE.setup.types;
  return ALL.filter(function(q){
    return classes.indexOf(q.class)>=0 && types[q.type];
  }).length;
}

/* ---------- quiz lifecycle ---------- */
function startQuiz(){
  var classes = selectedClassList();
  var types = STATE.setup.types;
  var pool = ALL.filter(function(q){ return classes.indexOf(q.class)>=0 && types[q.type]; });
  if (pool.length===0) return;
  if (STATE.setup.randomOrder) pool = shuffle(pool);
  var chosen = pool.map(function(q){
    var opts = q.options.map(function(o){ return {option:o.option, answer:o.answer}; });
    if (STATE.setup.randomOptions) opts = shuffle(opts);
    return { id:q.id, class:q.class, sn:q.sn, type:q.type, question:q.question, remark:q.remark, explanation:q.explanation, options:opts };
  });
  STATE.quiz = {
    questions: chosen,
    index: 0,
    selections: {}, // id -> array of selected indices
    submitted: {}, // id -> true
    recordedIds: [],
    startedAt: Date.now()
  };
  STATE.quizKind = 'practice';
  STATE.screen = 'quiz';
  STATE.jumpPanelOpen = false;
  STATE.jumpSelectedClass = null;
  STATE.setupConfigured = true;
  STATE.showFullSetup = false;
  Store.set(SETUP_DONE_KEY, 'true', false);
  saveSession();
  render();
}

/* ---------- mock exam: proportional sampling ---------- */
var MOCK_TOTAL = 70;
var MOCK_MULTI_TOTAL = 5;   // 複選 5 題，其餘為單選（65 題）

function allocateLargestRemainder(weights, total){
  var keys = Object.keys(weights);
  var sum = keys.reduce(function(a,k){ return a+weights[k]; }, 0);
  var out = {}, rems = [], used = 0;
  keys.forEach(function(k){
    var raw = sum>0 ? weights[k]*total/sum : 0;
    out[k] = Math.floor(raw);
    used += out[k];
    rems.push({k:k, r:raw-out[k]});
  });
  rems.sort(function(a,b){ return b.r-a.r; });
  for (var i=0; i<total-used && i<rems.length; i++) out[rems[i].k]++;
  return out;
}

// returns {total, plan:[{cls, n, multi, single}]} or null if the bank is empty
function mockPlan(){
  if (!ALL.length) return null;
  var counts = {}, multiAvail = {};
  ALL.forEach(function(q){
    counts[q.class] = (counts[q.class]||0)+1;
    if (q.type==='Multi') multiAvail[q.class] = (multiAvail[q.class]||0)+1;
  });
  var N = Math.min(MOCK_TOTAL, ALL.length);
  var quota = allocateLargestRemainder(counts, N);
  var multiTarget = Math.min(MOCK_MULTI_TOTAL, N);
  var mRatio = N>0 ? multiTarget/N : 0;
  var m = {}, cap = {}, sum = 0;
  CLASS_ORDER.forEach(function(c){
    cap[c] = Math.min(quota[c], multiAvail[c]||0);
    m[c] = Math.min(Math.floor(quota[c]*mRatio), cap[c]);
    sum += m[c];
  });
  while (sum<multiTarget){
    var best = null, bestDef = -1;
    CLASS_ORDER.forEach(function(c){
      if (m[c]>=cap[c]) return;
      var def = quota[c]*mRatio - m[c];
      if (def>bestDef){ bestDef = def; best = c; }
    });
    if (best===null) break;
    m[best]++; sum++;
  }
  var plan = CLASS_ORDER.filter(function(c){ return quota[c]>0; }).map(function(c){
    return { cls:c, n:quota[c], multi:m[c], single:quota[c]-m[c] };
  });
  return { total:N, multi:sum, single:N-sum, plan:plan };
}

function setExamTime(m){
  m = Math.max(1, Math.min(300, parseInt(m,10) || 60));
  STATE.examTimeLimit = m;
  Store.set(EXAMTIME_KEY, String(m), false);
}

function buildExamQuestions(){
  var mp = mockPlan();
  if (!mp) return [];
  var singles = [], multis = [];
  mp.plan.forEach(function(p){
    singles = singles.concat(shuffle(ALL.filter(function(q){ return q.class===p.cls && q.type!=='Multi'; })).slice(0, p.single));
    multis = multis.concat(shuffle(ALL.filter(function(q){ return q.class===p.cls && q.type==='Multi'; })).slice(0, p.multi));
  });
  // 單選題在前、複選題在後
  return singles.concat(multis).map(function(q){
    var opts = q.options.map(function(o){ return {option:o.option, answer:o.answer}; });
    return { id:q.id, class:q.class, sn:q.sn, type:q.type, question:q.question, remark:q.remark, explanation:q.explanation, options:opts };
  });
}

function saveExamPaper(){
  Store.set(EXAMPAPER_KEY, STATE.examPaper ? JSON.stringify(STATE.examPaper) : '', false);
}
function drawExamPaper(){
  var qs = buildExamQuestions();
  STATE.examPaper = qs.length ? { questions: qs, results: null } : null;
  saveExamPaper();
}
function ensureExamPaper(){
  if (!STATE.examPaper && ALL.length) drawExamPaper();
}

function startMockQuiz(){
  ensureExamPaper();
  var paper = STATE.examPaper;
  if (!paper || paper.results || hasPaused('exam')) return;
  var limitMin = Math.max(1, Math.min(300, parseInt(STATE.examTimeLimit,10) || 60));
  STATE.examQuiz = {
    questions: JSON.parse(JSON.stringify(paper.questions)), index: 0, selections: {}, submitted: {}, recordedIds: [],
    startedAt: Date.now(), timeLimitSec: limitMin*60
  };
  STATE.quizKind = 'exam';
  STATE.screen = 'quiz';
  STATE.jumpPanelOpen = false;
  STATE.jumpSelectedClass = null;
  saveSession();
  render();
}

function playRefreshAnim(){
  var ic = document.querySelector('.exam-refresh .rf-ic');
  var card = document.querySelector('.section-title + .card');
  if (ic){ ic.classList.remove('spin'); void ic.offsetWidth; ic.classList.add('spin'); }
  if (card){ card.classList.remove('rf-flash'); void card.offsetWidth; card.classList.add('rf-flash'); }
}
function refreshExamPaper(){
  if (hasPaused('exam')) return;
  var taken = !!(STATE.examPaper && STATE.examPaper.results);
  var msg = taken ? '確定要刷新題目嗎？\n將重新抽取一份新題目，目前這份題目與「瀏覽測驗題目」的內容會被取代。'
                  : '確定要刷新題目嗎？\n將重新抽取一份新題目，目前這份題目會被取代。';
  askConfirm(msg, function(){ drawExamPaper(); render(); playRefreshAnim(); }, {okText:'刷新題目', danger:true});
}

function examRemainingSec(){
  var q = STATE.examQuiz;
  if (!q || !q.timeLimitSec) return 0;
  return Math.max(0, Math.ceil((q.startedAt + q.timeLimitSec*1000 - Date.now())/1000));
}
function examExpired(){
  var q = STATE.examQuiz;
  return !!(q && q.timeLimitSec && examRemainingSec()<=0);
}
function examAnsweredCount(){
  var q = STATE.examQuiz;
  if (!q) return 0;
  return q.questions.filter(function(x){ var sl = q.selections[x.id]; return sl && sl.length>0; }).length;
}

function startWrongReview(){
  var ids = STATE.wrongBank.filter(function(id){ return id in BY_ID; });
  if (ids.length===0) return;
  var qs = shuffle(ids).map(function(id){
    var q = BY_ID[id];
    var opts = q.options.map(function(o){ return {option:o.option, answer:o.answer}; });
    return { id:q.id, class:q.class, sn:q.sn, type:q.type, question:q.question, remark:q.remark, explanation:q.explanation, options:shuffle(opts) };
  });
  STATE.reviewQuiz = {
    questions:qs, index:0, selections:{}, submitted:{}, recordedIds:[],
    startedAt: Date.now()
  };
  STATE.quizKind = 'review';
  STATE.screen = 'quiz';
  STATE.jumpPanelOpen = false;
  STATE.jumpSelectedClass = null;
  saveSession();
  render();
}

function formatTime(sec){
  sec = Math.max(0,sec);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

function currentQuestion(){
  var quiz = activeQuiz();
  if (!quiz) return null;
  return quiz.questions[quiz.index];
}

function gradeAndRecord(q){
  var quiz = activeQuiz();
  if (quiz.recordedIds.indexOf(q.id)>=0) return;
  quiz.recordedIds.push(q.id);
  var sel = quiz.selections[q.id]||[];
  var correctIdx = [];
  q.options.forEach(function(o,i){ if(o.answer) correctIdx.push(i); });
  var isCorrect = sel.length===correctIdx.length && sel.every(function(i){ return correctIdx.indexOf(i)>=0; });
  // 練習／複習錯題／測驗 each keep their own separate statistics
  var st = statsOf(STATE.quizKind);
  st.answered++;
  if (isCorrect) st.correct++;
  var wbIdx = STATE.wrongBank.indexOf(q.id);
  if (!isCorrect && wbIdx<0){
    STATE.wrongBank.push(q.id);
  }
  // the 已練習 record only follows 練習; review / exam attempts don't touch it
  if (STATE.quizKind==='practice' && STATE.seenBank.indexOf(q.id)<0) STATE.seenBank.push(q.id);
  saveProgress();
}

function toggleOption(idx){
  var q = currentQuestion();
  if (!q) return;
  var quiz = activeQuiz();
  if (quiz.submitted[q.id]) return;
  if (STATE.quizKind==='exam'){
    if (examExpired()){ finishQuiz(true); return; }
    var cur = quiz.selections[q.id] ? quiz.selections[q.id].slice() : [];
    if (q.type==='Single'){ cur = [idx]; }
    else { var pi = cur.indexOf(idx); if (pi>=0) cur.splice(pi,1); else cur.push(idx); }
    quiz.selections[q.id] = cur;
    saveSession();
    render();
    return;
  }
  if (q.type==='Single'){
    quiz.selections[q.id] = [idx];
    quiz.submitted[q.id] = true;
    gradeAndRecord(q);
  } else {
    var arr = quiz.selections[q.id] ? quiz.selections[q.id].slice() : [];
    var p = arr.indexOf(idx);
    if (p>=0) arr.splice(p,1); else arr.push(idx);
    quiz.selections[q.id] = arr;
  }
  saveSession();
  render();
}
function confirmMultiAnswer(){
  var q = currentQuestion();
  if (!q) return;
  var quiz = activeQuiz();
  if (!quiz.selections[q.id] || quiz.selections[q.id].length===0) return;
  quiz.submitted[q.id] = true;
  gradeAndRecord(q);
  saveSession();
  render();
}
function toggleManualFlag(){
  var q = currentQuestion();
  if (!q) return;
  var i = STATE.wrongBank.indexOf(q.id);
  if (i>=0) STATE.wrongBank.splice(i,1); else STATE.wrongBank.push(q.id);
  saveProgress();
  render();
}
function sessionClassCounts(quiz){
  var counts = {};
  var order = [];
  quiz.questions.forEach(function(q){
    if (!(q.class in counts)){ counts[q.class]=0; order.push(q.class); }
    counts[q.class]++;
  });
  order.sort(function(a,b){ return CLASS_ORDER.indexOf(a)-CLASS_ORDER.indexOf(b); });
  return { counts: counts, order: order };
}

function confirmJumpTo(){
  var quiz = activeQuiz();
  var cls = STATE.jumpSelectedClass;
  var input = document.getElementById('jumpInput2');
  if (!quiz || !cls || !input) return;
  var n = parseInt(input.value, 10);
  if (isNaN(n)) return;
  var sc = sessionClassCounts(quiz);
  var max = sc.counts[cls] || CLASS_COUNTS[cls] || n;
  n = Math.max(1, Math.min(max, n));
  var targetIdx = indexOfQuestionInQuiz(quiz, cls, n);
  if (targetIdx >= 0){
    closeJumpPanel();
    goToIndex(targetIdx);
  } else {
    askConfirm(cls+'第 '+n+' 題不在本次範圍內', null, {okText:'知道了', noCancel:true});
  }
}
function goToIndex(i){
  var quiz = activeQuiz();
  if (!quiz || i<0 || i>=quiz.questions.length) return;
  quiz.index = i;
  saveSession();
  render();
}
function nextQuestion(){
  var quiz = activeQuiz();
  if (quiz.index < quiz.questions.length-1){ goToIndex(quiz.index+1); }
}
function prevQuestion(){ goToIndex(activeQuiz().index-1); }

function isLastAnsweredInPractice(){
  var quiz = activeQuiz();
  return quiz.index===quiz.questions.length-1 && quiz.submitted[quiz.questions[quiz.index].id];
}

function finishQuiz(timeUp){
  var quiz = activeQuiz();
  var isExamKind = STATE.quizKind==='exam';
  var graded = quiz.questions.map(function(q){
    var sel = quiz.selections[q.id]||[];
    var correctIdx = [];
    q.options.forEach(function(o,i){ if(o.answer) correctIdx.push(i); });
    var answered = isExamKind ? sel.length>0 : !!quiz.submitted[q.id];
    var isCorrect = answered && sel.length===correctIdx.length && sel.every(function(i){ return correctIdx.indexOf(i)>=0; });
    return { q:q, answered:answered, correct:isCorrect };
  });
  var correctCount = graded.filter(function(g){ return g.correct; }).length;
  var answeredCount = graded.filter(function(g){ return g.answered; }).length;
  var total = graded.length;
  var newlyWrong = graded.filter(function(g){ return g.answered && !g.correct; }).length;
  var byClass = {};
  graded.forEach(function(g){
    var c = g.q.class;
    if (!byClass[c]) byClass[c] = {total:0, correct:0};
    byClass[c].total++;
    if (g.correct) byClass[c].correct++;
  });
  var elapsedSec = Math.floor((Date.now()-quiz.startedAt)/1000);
  if (isExamKind && quiz.timeLimitSec) elapsedSec = Math.min(elapsedSec, quiz.timeLimitSec);
  if (isExamKind){
    // 測驗 is graded all at once at the end, into its own separate record
    graded.forEach(function(g){
      if (!g.answered) return;
      STATE.examStats.answered++;
      if (g.correct) STATE.examStats.correct++;
      else if (STATE.wrongBank.indexOf(g.q.id)<0) STATE.wrongBank.push(g.q.id);
    });
    saveProgress();
  }
  STATE.results = {
    kind: STATE.quizKind,
    timeUp: !!timeUp,
    selections: JSON.parse(JSON.stringify(quiz.selections || {})),
    graded: graded, correctCount: correctCount, answeredCount: answeredCount, total: total,
    newlyWrong: newlyWrong, byClass: byClass, elapsedSec: elapsedSec
  };
  if (isExamKind && STATE.examPaper){
    STATE.examPaper.results = STATE.results;
    saveExamPaper();
  }
  STATE.screen = 'results';
  setQuizSlot(STATE.quizKind, null);
  clearSessionOf(STATE.quizKind);
  render();
}

function retryWrongFromResults(){
  if (!STATE.results) return;
  var ids = STATE.results.graded.filter(function(g){ return !g.correct; }).map(function(g){ return g.q.id; });
  if (ids.length===0) return;
  var qs = ids.map(function(id){
    var g = STATE.results.graded.filter(function(x){ return x.q.id===id; })[0];
    var opts = g.q.options.map(function(o){ return {option:o.option, answer:o.answer}; });
    return { id:g.q.id, class:g.q.class, sn:g.q.sn, type:g.q.type, question:g.q.question, remark:g.q.remark, explanation:g.q.explanation, options:shuffle(opts) };
  });
  var kind = STATE.results.kind || 'practice';
  setQuizSlot(kind, { questions:shuffle(qs), index:0, selections:{}, submitted:{}, recordedIds:[], startedAt:Date.now() });
  STATE.quizKind = kind;
  STATE.screen = 'quiz';
  STATE.jumpPanelOpen = false;
  STATE.jumpSelectedClass = null;
  saveSession();
  render();
}

function goHome(){
  STATE.jumpPanelOpen = false;
  STATE.jumpSelectedClass = null;
  var k = (STATE.screen==='results' && STATE.results) ? STATE.results.kind : STATE.quizKind;
  if (k==='exam'){
    if (STATE.screen==='quiz' && examExpired()){ finishQuiz(true); return; }
    ensureExamPaper();
    STATE.screen = 'examsetup';
  } else {
    STATE.screen = 'setup';
  }
  render();
}

function resetKindProgress(kind){
  var msgs = {
    practice:'確定要重置「練習」紀錄嗎？（練習的累計正確率與已練習紀錄將清空，題庫與其他紀錄不受影響）',
    review:'確定要重置「複習錯題」紀錄嗎？（複習的累計正確率與錯題本將清空，題庫與其他紀錄不受影響）',
    exam:'確定要重置「測驗」紀錄嗎？（測驗的累計正確率將清空，題庫與其他紀錄不受影響）'
  };
  askConfirm(msgs[kind], function(){ doResetKind(kind); }, {okText:'重置', danger:true});
}
function doResetKind(kind){
  if (kind==='practice'){ STATE.cumulative = emptyStats(); STATE.seenBank = []; }
  else if (kind==='review'){ STATE.reviewStats = emptyStats(); STATE.wrongBank = []; }
  else { STATE.examStats = emptyStats(); }
  setQuizSlot(kind, null);
  clearSessionOf(kind);
  saveProgress();
  render();
}

function adjustTextScale(delta){
  STATE.textScale = Math.min(1.6, Math.max(0.8, Math.round((STATE.textScale+delta)*10)/10));
  render();
}

function toggleDarkMode(){
  STATE.darkMode = !STATE.darkMode;
  document.body.classList.toggle('dark', STATE.darkMode);
  Store.set(DARKMODE_KEY, STATE.darkMode ? 'true' : '', false);
  render();
}

/* ---------- rendering ---------- */
var appEl;

function render(){
  if (!appEl) appEl = document.getElementById('app');
  var html = '';
  html += renderCover();
  html += '<div class="body">';
  if (STATE.screen==='import') html += renderImportScreen();
  else if (STATE.screen==='home') html += renderHomeScreen();
  else if (STATE.screen==='setup') html += renderSetupScreen();
  else if (STATE.screen==='examsetup') html += renderExamSetupScreen();
  else if (STATE.screen==='quiz') html += renderQuizScreen();
  else if (STATE.screen==='results') html += renderResultsScreen();
  else if (STATE.screen==='examreview') html += renderExamReviewScreen();
  html += '</div>';
  appEl.innerHTML = html;
  bindEvents();
}

  var showModes = false;

    h += '<div class="msg-banner'+(STATE.importIsError?' error':'')+'">'+STATE.importMessage+'</div>';
  }

  // resume paused practice quiz callout
  var hasPausedQuiz = !!(STATE.quiz && STATE.quiz.questions && STATE.quiz.questions.length);
  if (hasPausedQuiz){
    var answeredSoFar = STATE.quiz.questions.filter(function(q){ return STATE.quiz.submitted[q.id]; }).length;
    h += '<div class="wrongbank-callout"><div class="txt">尚有進行中的練習（已作答 '+answeredSoFar+'／'+STATE.quiz.questions.length+' 題）</div><button class="btn brass" data-act="resume-quiz">繼續練習</button></div>';
  }

  // resume paused wrong-review callout
  var hasPausedReview = !!(STATE.reviewQuiz && STATE.reviewQuiz.questions && STATE.reviewQuiz.questions.length);
  if (hasPausedReview){
    var reviewAnsweredSoFar = STATE.reviewQuiz.questions.filter(function(q){ return STATE.reviewQuiz.submitted[q.id]; }).length;
    h += '<div class="wrongbank-callout"><div class="txt">尚有進行中的錯題複習（已作答 '+reviewAnsweredSoFar+'／'+STATE.reviewQuiz.questions.length+' 題）</div><button class="btn brass" data-act="resume-review">繼續複習</button></div>';
  }

  // wrong bank callout
  var wbCount = STATE.wrongBank.filter(function(id){ return id in BY_ID; }).length;
  if (wbCount>0){
    if (!hasPausedReview){
      h += '<div class="wrongbank-callout"><div class="txt">錯題本中有 '+wbCount+' 題尚待複習</div><button class="btn brass" data-act="review-wrong">複習錯題</button></div>';
    } else {
      h += '<div class="wrongbank-callout"><div class="txt">錯題本中有 '+wbCount+' 題尚待複習，請先於上方「繼續複習」或完成後再開始新的複習</div></div>';
    }
  }

  // three separate records: 練習 / 複習錯題 / 測驗
  ['practice','review'].forEach(function(k){
    var st = statsOf(k);
    var a = st.answered>0 ? Math.round(st.correct/st.answered*100) : 0;
    h += '<div class="stat-line"><span>'+KIND_LABEL[k]+'紀錄：累計已作答 '+st.answered+' 題　正確率 '+a+'%</span><a data-act="reset-progress" data-kind="'+k+'">重置</a></div>';
  });

  var total = selectedTotal();
  var canStart = total>0 && (STATE.setup.types.Single || STATE.setup.types.Multi);

  if (STATE.setupConfigured && !STATE.showFullSetup){
    // condensed view: selections already made previously, skip the full form
    var classesSel = selectedClassList();
    var typesSel = [];
    if (STATE.setup.types.Single) typesSel.push('單選');
    if (STATE.setup.types.Multi) typesSel.push('複選');
    h += '<div class="card">';
    h += '<div style="font-size:13px;color:var(--ink-soft);line-height:1.7;">';
    h += '已選科目：'+escapeHtml(classesSel.join('、')||'無')+'<br>';
    h += '題型：'+escapeHtml(typesSel.join('、')||'無')+'<br>';
    h += '符合篩選條件共 '+total+' 題';
    h += '</div>';
    if (!hasPausedQuiz){
      h += '<div class="start-btn-wrap"><button class="btn brass start-btn" data-act="start-quiz" '+(canStart?'':'disabled')+'>開始練習</button></div>';
    } else {
      h += '<div class="hint" style="margin-top:10px;">尚有進行中的練習，請先於上方「繼續練習」後再開始新的練習。</div>';
    }
    h += '<div class="select-links" style="margin-top:10px;margin-bottom:0;"><a data-act="show-full-setup">修改科目／題型設定</a></div>';
    h += '</div>';
    return h;
  }

  // subject selection
  h += '<h2 class="section-title">選擇科目</h2>';
  h += '<div class="card">';
  h += '<div class="select-links"><a data-act="select-all-classes">全選</a><a data-act="select-none-classes">全不選</a></div>';
  h += '<div class="class-grid">';
  CLASS_ORDER.forEach(function(c){
    var checked = STATE.selectedClasses[c] ? 'checked' : '';
    h += '<label class="class-item"><input type="checkbox" data-class="'+escapeHtml(c)+'" '+checked+'><span>'+escapeHtml(c)+'</span><span class="cnt">'+CLASS_COUNTS[c]+'</span></label>';
  });
  h += '</div></div>';

  // question type (checkbox style)
  h += '<h2 class="section-title">題型</h2>';
  h += '<div class="card"><div style="display:flex;flex-direction:column;gap:8px;">';
  h += '<label class="class-item"><input type="checkbox" data-act="toggle-type" data-type="Single" '+(STATE.setup.types.Single?'checked':'')+'><span>單選題</span></label>';
  h += '<label class="class-item"><input type="checkbox" data-act="toggle-type" data-type="Multi" '+(STATE.setup.types.Multi?'checked':'')+'><span>複選題</span></label>';
  h += '</div></div>';

  // random order toggles (moved above 作答模式)
  h += '<div class="card">';
  h += '<div class="checkline" style="margin-top:0;"><input type="checkbox" id="randomOrderChk" '+(STATE.setup.randomOrder?'checked':'')+'><span>隨機出題順序</span></div>';
  h += '<div class="checkline"><input type="checkbox" id="randomOptionsChk" '+(STATE.setup.randomOptions?'checked':'')+'><span>隨機選項順序</span></div>';
  h += '<div class="checkline"><input type="checkbox" id="showAnswersChk" '+(STATE.setup.showAllAnswers?'checked':'')+'><span>顯示全部答案</span></div>';
  h += '</div>';

  // question count hint (practice mode always uses all filtered questions)
  h += '<div class="stat-line"><span>符合篩選條件共 '+total+' 題</span></div>';

  h += '<div class="start-btn-wrap"><button class="btn brass start-btn" data-act="start-quiz" '+(canStart?'':'disabled')+'>開始練習</button></div>';

  if (STATE.setupConfigured){
    h += '<div class="select-links" style="margin-top:10px;"><a data-act="hide-full-setup">收合設定</a></div>';
  }

  return h;

function renderQuizScreen(){
  var quiz = activeQuiz();
  var q = currentQuestion();
  if (!q) return '<div class="empty-state">找不到題目</div>';
  var idx = quiz.index;
  var total = quiz.questions.length;
  var submitted = !!quiz.submitted[q.id];
  var sel = quiz.selections[q.id]||[];
  var isFlagged = STATE.wrongBank.indexOf(q.id)>=0;
  var isExam = STATE.quizKind==='exam';
  var h = '';

  if (isExam){
    var remain = examRemainingSec();
    h += '<div class="exam-timer'+(remain<=300?' warn':'')+'" id="examTimer">⏱ 剩餘時間 '+formatTime(remain)+'</div>';
  }


  h += '<div class="entry-bar"><div class="entry-left">';
  var subjSn = parseInt(q.sn,10);
  var subjTotal = CLASS_COUNTS[q.class] || total;
  if (isExam){
    h += '<span>第 '+(idx+1)+'／'+total+' 題</span>';
    h += '<span class="tag">'+escapeHtml(q.class)+'</span>';
    h += '<span class="tag">'+(q.type==='Multi'?'複選':'單選')+'</span>';
  } else {
    h += '<span>'+escapeHtml(q.class)+' 第'+subjSn+'／'+subjTotal+'題</span>';
    h += '<span class="tag">'+(q.type==='Multi'?'複選':'單選')+'</span>';
    h += '<button class="jump-open-btn" data-act="jump-open">跳題</button>';
  }
  h += '</div><div class="entry-right">';
  h += '<button class="zoom-btn" data-act="zoom" data-delta="-0.1">A-</button>';
  h += '<span style="font-size:11px;color:var(--ink-soft);">'+Math.round(STATE.textScale*100)+'%</span>';
  h += '<button class="zoom-btn" data-act="zoom" data-delta="0.1">A+</button>';
  if (!isExam) h += '<button class="flag-btn" data-act="toggle-flag" title="加入錯題本">'+(isFlagged?'★':'☆')+'</button>';
  h += '</div></div>';

  h += '<div class="progress-bar-track"><div class="progress-bar-fill" style="width:'+Math.round(((idx+1)/total)*100)+'%;"></div></div>';

  if (STATE.jumpPanelOpen && !isExam){
    h += renderJumpPanel(quiz);
  }

  h += '<div class="question-text" style="font-size:'+(18*STATE.textScale)+'px;">'+(isExam ? (idx+1) : subjSn)+'. '+escapeHtml(q.question)+'</div>';

  if (q.type==='Multi' && !submitted) h += '<div class="multi-hint">本題為複選題，請選出所有正確選項</div>';

  var revealAnswers = STATE.setup.showAllAnswers && !isExam;
  q.options.forEach(function(o,i){
    var cls = 'option-row';
    var mark = String.fromCharCode(65+i);
    var isSel = sel.indexOf(i)>=0;
    if (submitted){
      if (o.answer) cls += ' correct';
      else if (isSel) cls += ' wrong';
    } else {
      if (isSel) cls += ' selected';
      if (revealAnswers && o.answer) cls += ' correct';
    }
    var inputType = q.type==='Multi' ? 'checkbox' : 'radio';
    var markChar = mark;
    if (!submitted && isSel) markChar = '✔';
    if (submitted){
      markChar = o.answer ? '✔' : (isSel ? '✕' : mark);
    } else if (revealAnswers && o.answer){
      markChar = '✔';
    }
    h += '<div class="'+cls+'" data-act="pick-option" data-idx="'+i+'">';
    h += '<span class="mark">'+markChar+'</span>';
    h += '<span style="font-size:'+(16*STATE.textScale)+'px;white-space:pre-line;">'+escapeHtml(o.option)+'</span>';
    h += '</div>';
  });

  if (submitted && q.remark){
    h += '<div class="remark-box">'+escapeHtml(q.remark)+'</div>';
  }

  if (submitted && q.explanation){
    var expOpen = !!STATE.explanationOpen[q.id];
    h += '<div class="explanation-wrap">';
    h += '<div class="explanation-toggle" data-act="toggle-explanation"><span>'+(expOpen?'▾':'▸')+' 答案解釋</span></div>';
    if (expOpen){
      h += '<div class="remark-box explanation-box" style="font-size:'+(16*STATE.textScale)+'px;">'+escapeHtml(q.explanation)+'</div>';
    }
    h += '</div>';
  }
  if (q.type==='Multi' && !submitted && !isExam){
    h += '<div class="btn-row"><button class="btn brass" data-act="confirm-multi" '+(sel.length===0?'disabled':'')+'>確認送出</button></div>';
  }

  h += '<div class="nav-row"><button class="btn secondary" data-act="prev" '+(idx===0?'disabled':'')+'>← 上一題</button><div class="spacer"></div>';
  if (isExam){
    h += '<button class="btn secondary" data-act="next" '+(idx===total-1?'disabled':'')+'>下一題 →</button>';
  } else if (isLastAnsweredInPractice()){
    h += '<button class="btn brass" data-act="finish-practice">'+({practice:'結束練習',review:'結束複習',exam:'結束測驗'}[STATE.quizKind])+'，查看結果</button>';
  } else {
    h += '<button class="btn secondary" data-act="next" '+(idx===total-1?'disabled':'')+'>下一題 →</button>';
  }
  h += '</div>';
  if (isExam){
    h += '<div class="btn-row" style="justify-content:center;"><button class="btn brass" data-act="finish-exam">結束測驗</button></div>';
  }

  return h;
}

function renderResultsScreen(){

    h += '<div class="auto-note">已自動將 '+r.newlyWrong+' 題答錯的題目加入錯題本</div>';
  }

  h += '<table class="class-table"><thead><tr><th>科目</th><th>題數</th><th>答對</th><th>正確率</th></tr></thead><tbody>';
  Object.keys(r.byClass).forEach(function(c){

  h += '<div class="center-btns">';

  if (r.kind==='exam') h += '<button class="btn brass" data-act="open-exam-review">瀏覽測驗題目</button>';
  h += '<button class="btn secondary" data-act="home">'+(r.kind==='exam' ? '返回首頁' : '返回首頁')+'</button>';
  h += '</div>';

  return h;
}

/* ---------- event binding ---------- */
function bindEvents(){
  var el;

  el = document.getElementById('dropZone');
  if (el){
    el.addEventListener('click', function(){ document.getElementById('fileInput').click(); });
    el.addEventListener('dragover', function(e){ e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', function(){ el.classList.remove('dragover'); });
    el.addEventListener('drop', function(e){
      e.preventDefault(); el.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  }
  var fi = document.getElementById('fileInput');
  if (fi) fi.addEventListener('change', function(e){ if (e.target.files[0]) handleFile(e.target.files[0]); });

  var jumpInput2 = document.getElementById('jumpInput2');
  if (jumpInput2) jumpInput2.addEventListener('keydown', function(e){
    if (e.key==='Enter'){ e.preventDefault(); confirmJumpTo(); }
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function(node){
    node.addEventListener('click', function(){
      var act = node.getAttribute('data-act');
      handleAction(act, node);
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-class]'), function(node){
    node.addEventListener('change', function(){
      STATE.selectedClasses[node.getAttribute('data-class')] = node.checked;
      render();
    });
  });

  var randomOrderChk = document.getElementById('randomOrderChk');
  if (randomOrderChk) randomOrderChk.addEventListener('change', function(){ STATE.setup.randomOrder = randomOrderChk.checked; });
  var randomOptionsChk = document.getElementById('randomOptionsChk');
  if (randomOptionsChk) randomOptionsChk.addEventListener('change', function(){ STATE.setup.randomOptions = randomOptionsChk.checked; });
  var examTimeInput = document.getElementById('examTimeInput');
  if (examTimeInput) examTimeInput.addEventListener('change', function(){ setExamTime(examTimeInput.value); render(); });
  var showAnswersChk = document.getElementById('showAnswersChk');
  if (showAnswersChk) showAnswersChk.addEventListener('change', function(){ STATE.setup.showAllAnswers = showAnswersChk.checked; });
}

function confirmFinishExam(){
  if (!STATE.examQuiz) return;
  if (examExpired()){ finishQuiz(true); return; }
  var left = STATE.examQuiz.questions.length - examAnsweredCount();
  var msg = left>0 ? '尚有 '+left+' 題未作答，確定要結束測驗並計分嗎？' : '確定要結束測驗並計分嗎？';
  askConfirm(msg, function(){ if (STATE.examQuiz) finishQuiz(false); }, {okText:'結束測驗'});
}

function handleAction(act, node){
  if (act==='go-import'){ STATE.screen='import'; STATE.importMessage=''; render(); }
  else if (act==='clear-bank'){ clearBank(); }
  else if (act==='review-wrong'){ startWrongReview(); }
  else if (act==='resume-quiz'){ STATE.quizKind = 'practice'; STATE.screen = 'quiz'; render(); }
  else if (act==='resume-exam'){
    STATE.quizKind = 'exam';
    if (examExpired()){ finishQuiz(true); return; }
    STATE.screen = 'quiz'; render();
  }
  else if (act==='open-practice'){ STATE.importMessage = ''; STATE.screen = 'setup'; render(); }
  else if (act==='open-exam'){
    if (examExpired()){ STATE.quizKind = 'exam'; finishQuiz(true); return; }
    STATE.importMessage = '';
    ensureExamPaper();
    STATE.screen = 'examsetup'; render();
  }
  else if (act==='open-exam-review'){ STATE.examReviewFrom = 'results'; STATE.examReviewIndex = 0; STATE.screen = 'examreview'; render(); window.scrollTo(0,0); }
  else if (act==='open-exam-review-home'){
    if (!STATE.examPaper || !STATE.examPaper.results) return;
    STATE.results = STATE.examPaper.results;
    STATE.examReviewFrom = 'home'; STATE.examReviewIndex = 0; STATE.screen = 'examreview'; render(); window.scrollTo(0,0);
  }
  else if (act==='exam-review-back'){ STATE.screen = 'results'; render(); window.scrollTo(0,0); }
  else if (act==='exam-review-home'){ ensureExamPaper(); STATE.screen = 'examsetup'; render(); window.scrollTo(0,0); }
  else if (act==='toggle-review-palette'){ STATE.reviewPaletteOpen = !STATE.reviewPaletteOpen; render(); }
  else if (act==='refresh-exam'){ refreshExamPaper(); }
  else if (act==='review-prev'){ STATE.examReviewIndex = Math.max(0, STATE.examReviewIndex-1); render(); window.scrollTo(0,0); }
  else if (act==='review-next'){ STATE.examReviewIndex = Math.min((STATE.results ? STATE.results.graded.length : 1)-1, STATE.examReviewIndex+1); render(); window.scrollTo(0,0); }
  else if (act==='review-goto'){ STATE.examReviewIndex = parseInt(node.getAttribute('data-i'),10)||0; render(); window.scrollTo(0,0); }
  else if (act==='toggle-review-explanation'){
    var rq = STATE.results && STATE.results.graded[STATE.examReviewIndex];
    if (rq){ STATE.explanationOpen[rq.q.id] = !STATE.explanationOpen[rq.q.id]; render(); }
  }
  else if (act==='exam-time-step'){ setExamTime((parseInt(STATE.examTimeLimit,10)||60) + parseInt(node.getAttribute('data-d'),10)); render(); }
  else if (act==='go-modes'){ STATE.screen = 'home'; render(); }
  else if (act==='set-exam-time'){ setExamTime(parseInt(node.getAttribute('data-min'),10)); render(); }
  else if (act==='finish-exam'){ confirmFinishExam(); }
  else if (act==='resume-review'){ STATE.quizKind = 'review'; STATE.screen = 'quiz'; render(); }
  else if (act==='show-full-setup'){ STATE.showFullSetup = true; render(); }
  else if (act==='hide-full-setup'){ STATE.showFullSetup = false; render(); }
  else if (act==='reset-progress'){ resetKindProgress(node.getAttribute('data-kind')); }
  else if (act==='select-all-classes'){ CLASS_ORDER.forEach(function(c){ STATE.selectedClasses[c]=true; }); render(); }
  else if (act==='select-none-classes'){ CLASS_ORDER.forEach(function(c){ STATE.selectedClasses[c]=false; }); render(); }
  else if (act==='toggle-type'){
    var t = node.getAttribute('data-type');
    var other = t==='Single' ? 'Multi' : 'Single';
    if (STATE.setup.types[t] && !STATE.setup.types[other]){ /* keep at least one selected: no-op */ }
    else STATE.setup.types[t] = !STATE.setup.types[t];
    if (!STATE.setup.types.Single && !STATE.setup.types.Multi) STATE.setup.types[t] = true;
    render();
  }
  else if (act==='start-quiz'){ startQuiz(); }
  else if (act==='start-mock'){ startMockQuiz(); }
  else if (act==='pick-option'){ toggleOption(parseInt(node.getAttribute('data-idx'),10)); }
  else if (act==='confirm-multi'){ confirmMultiAnswer(); }
  else if (act==='toggle-flag'){ toggleManualFlag(); }
  else if (act==='toggle-explanation'){
    var qq = currentQuestion();
    if (qq){ STATE.explanationOpen[qq.id] = !STATE.explanationOpen[qq.id]; render(); }
  }
  else if (act==='zoom'){ adjustTextScale(parseFloat(node.getAttribute('data-delta'))); }
  else if (act==='toggle-dark'){ toggleDarkMode(); }
  else if (act==='prev'){ prevQuestion(); }
  else if (act==='next'){ nextQuestion(); }
  else if (act==='goto'){ goToIndex(parseInt(node.getAttribute('data-i'),10)); }
  else if (act==='jump-open'){ openJumpPanel(); }
  else if (act==='jump-cancel'){ closeJumpPanel(); }
  else if (act==='jump-pick-class'){ pickJumpClass(node.getAttribute('data-class')); }
  else if (act==='jump-back'){ backToJumpClassList(); }
  else if (act==='jump-confirm'){ confirmJumpTo(); }
  else if (act==='finish-practice'){ finishQuiz(); }
  else if (act==='retry-wrong'){ retryWrongFromResults(); }
  else if (act==='home'){
    if (STATE.screen==='quiz' && STATE.quizKind==='exam') confirmFinishExam();
    else goHome();
  }
}

/* ---------- init ---------- */
function init(){
  Promise.all([
    Store.get(BANK_KEY, false),
    loadProgressRaw(),
    Store.get(SESSION_KEY, false),
    Store.get(REVIEW_SESSION_KEY, false),
    Store.get(DARKMODE_KEY, false),
    Store.get(SETUP_DONE_KEY, false),
    Store.get(EXAM_SESSION_KEY, false),
    Store.get(LASTKIND_KEY, false),
    Store.get(EXAMTIME_KEY, false),
    Store.get(BANKSRC_KEY, false),
    Store.get(EXAMPAPER_KEY, false)
  ]).then(function(results){
    var bankRaw = results[0];
    var progressRaw = results[1];
    var sessionRaw = results[2];
    var reviewSessionRaw = results[3];
    var darkRaw = results[4];
    var setupDoneRaw = results[5];
    var examSessionRaw = results[6];
    var examTimeRaw = results[8];
    var bankSrcRaw = results[9];
    var examPaperRaw = results[10];
    try { var ep = examPaperRaw ? JSON.parse(examPaperRaw) : null; STATE.examPaper = (ep && ep.questions && ep.questions.length) ? ep : null; } catch(e){ STATE.examPaper = null; }
    try { STATE.bankSources = bankSrcRaw ? JSON.parse(bankSrcRaw) : []; } catch(e){ STATE.bankSources = []; }
    if (examTimeRaw) STATE.examTimeLimit = Math.max(1, Math.min(300, parseInt(examTimeRaw,10) || 60));
    STATE.darkMode = darkRaw === 'true';
    STATE.setupConfigured = setupDoneRaw === 'true';
    document.body.classList.toggle('dark', STATE.darkMode);
    if (bankRaw){
      try { ALL = JSON.parse(bankRaw); } catch(e){ ALL = []; }
    }
    rebuildIndexes();
    if (progressRaw){
      try {
        var p = JSON.parse(progressRaw);
        STATE.wrongBank = (p.wrongBank||[]).filter(function(id){ return id in BY_ID; });
        STATE.seenBank = (p.seenBank||[]).filter(function(id){ return id in BY_ID; });
        applyStatsFrom(p);
      } catch(e){}
    }
    [['practice',sessionRaw],['review',reviewSessionRaw],['exam',examSessionRaw]].forEach(function(pair){
      if (!pair[1]) return;
      try {
        var sq = JSON.parse(pair[1]);
        if (sq && sq.questions && sq.questions.length) setQuizSlot(pair[0], sq);
      } catch(e){}
    });
    var resumed = false;
    if (!resumed){
      STATE.screen = ALL.length>0 ? 'home' : 'import';
    }
    render();
  });
}
function loadProgressRaw(){ return Store.get(PROGRESS_KEY, false); }

// 測驗 countdown: refresh the clock every second; end the test automatically at 0
setInterval(function(){
  if (STATE.screen!=='quiz' || STATE.quizKind!=='exam' || !STATE.examQuiz) return;
  var remain = examRemainingSec();
  if (remain<=0){ finishQuiz(true); return; }
  var el = document.getElementById('examTimer');
  if (el){
    el.textContent = '⏱ 剩餘時間 '+formatTime(remain);
    el.classList.toggle('warn', remain<=300);
  }
}, 1000);

init();
})();
</script>
