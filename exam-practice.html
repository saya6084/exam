日財北國稅審二字第0940042787號函】"},{"id":"存匯-378","class":"存匯","sn":"378","type":"Multi","question":"有關退休公教人員再任公職期間仍儲存優惠存款(尚未辦理優惠存款銷戶),下列敘述何者正確?","options":[{"option":"再任期間不得申請質借,如於再任前已辦理質借者,其質借本息應於存戶辦理優惠存款銷戶時一併收回","answer":true},{"option":"本行於接獲再任通知時,對已辦理質借者,不得逕自溯自再任之日起,將其優惠存款辦理質借抵償","answer":true},{"option":"存戶來行辦理優惠存款銷戶時,居住於臺灣地區者,得委託親友代為辦理","answer":true}],"remark":"【103.9.29營運優字第10300294731號函、優惠存款-銷戶標準作業流程SOP、優惠存款-續存標準作業流程SOP】"},{"id":"存匯-379","class":"存匯","sn":"379","type":"Multi","question":"甲儲存整存整付儲蓄存款期限3年,為申報綜所稅之需,存期中來行申請改存特種存本取息儲蓄存款,下列敘述何者正確?","options":[{"option":"可沿用舊帳號","answer":false},{"option":"起息日及到期日仍照原存單日期","answer":true},{"option":"應將舊戶銷帳轉入新戶","answer":true}],"remark":"【定期儲蓄存款-存本取息、特種存本取息儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-380","class":"存匯","sn":"380","type":"Multi","question":"整存整付儲蓄存款逾期轉存定期存款得自原到期日起息者為下列何者?","options":[{"option":"逾期1個月內轉存1年期以下者","answer":true},{"option":"不分轉存期限逾期在2個月內者","answer":false},{"option":"逾期2個月內轉存1年期以上者","answer":true}],"remark":"【定期儲蓄存款-整存整付、整存零付儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-381","class":"存匯","sn":"381","type":"Multi","question":"綜合存款之定期性存款質借利率,下列何者正確?","options":[{"option":"按各該筆定期(儲)存款利率加計年息1.5%分別計算","answer":true},{"option":"還款時依存款利率由高而低","answer":true},{"option":"質借時依存款利率由低而高","answer":true}],"remark":"【綜合存款業務標準作業流程(SOP)】"},{"id":"存匯-382","class":"存匯","sn":"382","type":"Multi","question":"綜合存款之定期性存款質借之規定為下列何者?","options":[{"option":"依存款金額9成","answer":true},{"option":"存款得轉讓第三人","answer":false},{"option":"存款不得設質第三人","answer":true}],"remark":"【綜合存款業務標準作業流程(SOP)】"},{"id":"存匯-383","class":"存匯","sn":"383","type":"Multi","question":"綜合存款集下列何者於同一帳戶內?","options":[{"option":"活期性存款","answer":true},{"option":"定期性存款","answer":true},{"option":"擔保放款","answer":true}],"remark":"【綜合存款業務標準作業流程(SOP)】"},{"id":"存匯-384","class":"存匯","sn":"384","type":"Multi","question":"開立綜合存款(乙綜)之對象為下列何者?","options":[{"option":"公司行號","answer":false},{"option":"非營利法人","answer":true},{"option":"自然人","answer":true}],"remark":"【綜合存款業務標準作業流程(SOP)】"},{"id":"存匯-385","class":"存匯","sn":"385","type":"Multi","question":"有關新臺幣數位存款帳戶,下列敘述何者錯誤?","options":[{"option":"屬新臺幣活期儲蓄存款無摺戶,零元開戶","answer":true},{"option":"限本國成年人申辦","answer":true},{"option":"申請時可讓客戶自行選擇申請晶片金融卡或VISA達人金融卡","answer":true}],"remark":"【數位存款開戶標準作業流程】"},{"id":"存匯-386","class":"存匯","sn":"386","type":"Multi","question":"有關可轉讓定期存單的敘述,下列敘述何者正確?","options":[{"option":"可轉讓定期存單中途不可提取或請求變更契約內容","answer":true},{"option":"可以辦理質借","answer":false},{"option":"不必留存印鑑卡,轉讓時亦不必向本行辦理過戶手續","answer":true}],"remark":"【可轉讓定期存單作業標準作業流程SOP】"},{"id":"存匯-387","class":"存匯","sn":"387","type":"Multi","question":"有關政治獻金專戶,下列敘述何者錯誤?","options":[{"option":"政治獻金專戶不欲繼續使用,無須取得監察院之政治獻金專戶結清銷戶函文,可逕行辦理結清銷戶","answer":true},{"option":"有關以「OOO政黨名稱全稱」為抬頭並禁止背書轉讓之票據,逕存入政治獻金專戶,並以擔保背書之方式辦理","answer":true},{"option":"政治獻金專戶在未經許可前,該帳戶不得收受政治獻金","answer":false}],"remark":"【111.5.6銀營運乙字第11100029701號函】"},{"id":"存匯-388","class":"存匯","sn":"388","type":"Multi","question":"父母代理未成年子女辦理開立活儲戶時,應如何辦理?","options":[{"option":"父母之一方應持雙方之同意書","answer":true},{"option":"只要父母任一方同意書","answer":false},{"option":"父母離婚、一方死亡或雙方皆無法行使監護權,對於未成年人有監護權者應檢具證明文件及同意書辦理","answer":true}],"remark":"【102.4.19銀營運乙字第10200018301號函】"},{"id":"存匯-389","class":"存匯","sn":"389","type":"Multi","question":"受理活期性存款開戶,實施雙重身分證明文件查核,下列敘述何者錯誤?","options":[{"option":"個人戶除身分證件外,另應徵提其他可資證明身分之第二證件,以有照片者為優先,次為無照片者,惟應擇一辦理","answer":false},{"option":"非個人戶,如已徵取公司設立等登記證照,得作為該非個人戶代表人(負責人)之第二身分證明文件另如公司戶開戶,已徵取登記證照,並已上經濟部網站查詢並留存公司登記資料,得免再徵取其他董事會議紀錄等文件","answer":true},{"option":"徵提之第二項證明文件,應影印作開戶傳票附件","answer":true}],"remark":"【OCR開戶標準作業流程、開戶知識庫】"},{"id":"存匯-390","class":"存匯","sn":"390","type":"Multi","question":"存款帳戶及其疑似不法或顯屬異常交易管理辦法第十三條第一項第一款所稱臨櫃受理開立存款帳戶(DBU)應實施雙重身分證明文件之種類釋疑,有關個人戶部分,下列敘述何者正確?","options":[{"option":"持國民身分證者,應徵提其他具辨識力之身分證明文件,如健保卡、護照、駕照或學生證等","answer":true},{"option":"未持有居留證之外國自然人,應徵提合法入境簽證(或戳記)之外國護照","answer":false},{"option":"未持有居留證之大陸地區人民應徵提內政部移民署核發之入出境許可證、中華民國統一證號基資表,及其他具辨識力之身分證明文件","answer":true}],"remark":"【104.5.29銀營運乙字第10400183191號函】"},{"id":"存匯-391","class":"存匯","sn":"391","type":"Multi","question":"依據中華民國銀行商業同業公會全國聯合會修訂之「支票存款戶處理規範」第三點第一項之規定,下列哪些人員不得申請開立支票存款戶?","options":[{"option":"無行為能力人","answer":true},{"option":"限制行為能力人","answer":true},{"option":"受輔助宣告之人","answer":true}],"remark":""},{"id":"存匯-392","class":"存匯","sn":"392","type":"Multi","question":"為防杜人頭帳戶,打擊金融犯罪,下列敘述何者正確?","options":[{"option":"開戶時應透過行內全球資訊網「聯徵信用資訊查詢」項下查詢身分證資料是否正確,如因當時電腦系統故障,應於故障排除後之次營業日終止前完成查詢","answer":true},{"option":"存款帳戶如屬偽冒開戶者應立即通報警調單位","answer":true},{"option":"受理開戶應實施身分證明文件查核並留存身分證明文件及影像","answer":true}],"remark":"【臺灣銀行股份有限公司存款開戶審核、風險控管暨警示帳戶聯防作業要點】"},{"id":"存匯-393","class":"存匯","sn":"393","type":"Multi","question":"有關辦理公司開戶雙重身分證明文件,下列敘述何者錯誤?","options":[{"option":"負責人應提示相關證明文件並親自辦理外,應比照個人開戶透過行內全球資訊網「聯徵信用資訊查詢」項下查詢身分證資料是否正確","answer":false},{"option":"已徵取公司設立等登記證照者,對負責人應徵取第二身分證明文件","answer":true},{"option":"已徵取公司登記證照,並上經濟部網站查詢並留存公司登記資料,得免再徵取其他董事會議紀錄等文件","answer":true}],"remark":"【OCR開戶標準作業流程、開戶知識庫】"},{"id":"存匯-394","class":"存匯","sn":"394","type":"Multi","question":"有關本行人像暨身分證影像查詢系統,下列敘述何者正確?","options":[{"option":"受理客戶開立活期性存款帳戶,皆應確實建立影像檔","answer":false},{"option":"無行為能力人開立存摺類存款時,應留存任一法定代理人之人像,並應於人像暨身分證影像查詢系統上備註訊息","answer":true},{"option":"存款移存時,有關人像或身分證證件資料之拍攝,應由受理之營業單位為之","answer":true}],"remark":"【臺灣銀行股份有限公司存款開戶審核、風險控管暨警示帳戶聯防作業要點、非使用(OCR)開戶標準作業流程(SOP)、存款移存標準作業流程(SOP)】"},{"id":"存匯-395","class":"存匯","sn":"395","type":"Multi","question":"有關應予以婉拒開戶之情形,下列何者正確?","options":[{"option":"疑似使用假名、人頭、虛設行號或虛設法人團體開設帳戶者","answer":true},{"option":"提供之文件資料可疑、模糊不清、不願提供其他佐證資料或提供之文件資料無法進行查證者","answer":true},{"option":"持用偽、變造身分證明文件或出示之身分證明文件均為影本","answer":true}],"remark":"【銀行防制洗錢及打擊資恐注意事項範本】"},{"id":"存匯-396","class":"存匯","sn":"396","type":"Multi","question":"在完成確認客戶身分措施前,原則上不得與該客戶建立業務關係。下列何種情形屬於得先建立關係後再完成驗證的例外情況?","options":[{"option":"為避免對客戶業務之正常運作造成干擾所必須","answer":true},{"option":"屬於臨時性交易","answer":false},{"option":"可在合理可行之情形下儘速完成客戶及實質受益人之身分驗證","answer":true}],"remark":"【金融機構防制洗錢辦法】"},{"id":"存匯-397","class":"存匯","sn":"397","type":"Multi","question":"存款帳戶如經認定為疑似不法或顯屬異常交易者,銀行應採取之處理措施,下列敘述何者錯誤?","options":[{"option":"警示帳戶之警示期限自每次通報時起算,逾3年自動失其效力,但有繼續警示之必要者,原通報機關應於期限屆滿前再行通報之","answer":true},{"option":"存款帳戶經通報為警示帳戶者,僅暫停該帳戶使用提款卡、語音轉帳、網路轉帳及其他電子支付功能,匯入款項逕以退匯方式退回匯款","answer":true},{"option":"存款帳戶屬衍生管制帳戶者,應即通知金融聯合徵信中心,並暫停該帳戶全部交易功能,匯入款項逕以退匯方式退回匯款行","answer":true}],"remark":"【存款帳戶及其疑似不法或顯屬異常交易管理辦法】"},{"id":"存匯-398","class":"存匯","sn":"398","type":"Multi","question":"存款帳戶經通報為警示帳戶者,應即通知財團法人金融聯合徵信中心,下列敘述何者不正確?","options":[{"option":"暫停該帳戶全部交易功能,匯入款項逕以退匯方式退回匯款行","answer":false},{"option":"該帳戶正常使用無需控管","answer":true},{"option":"該帳戶法院來函不可執行扣押","answer":true}],"remark":"【存款帳戶及其疑似不法或顯屬異常交易管理辦法】"},{"id":"存匯-399","class":"存匯","sn":"399","type":"Multi","question":"有關警示帳戶,下列敘述何者正確?","options":[{"option":"無法確認該帳戶是否屬遭歹徒持偽(變)造或他人之身分證件冒名開立者,應函詢警察機關查明回復","answer":true},{"option":"各營業單位接獲警示帳戶之通報後,直接向金融聯合徵信中心通報","answer":false},{"option":"存款帳戶經通報為警示帳戶者,應即通知金融聯合徵信中心,並暫停該帳戶全部交易功能,匯入款項逕以退匯方式退回匯款行","answer":true}],"remark":"【詐騙案件通報標準作業流程(SOP)及存款帳戶及其疑似不法或顯屬異常交易管理辦法】"},{"id":"存匯-400","class":"存匯","sn":"400","type":"Multi","question":"為協助民眾返還仍滯留於「警示帳戶」內剩餘款,被害人於申請時,應提示何文件,下列敘述何者正確?","options":[{"option":"刑事案件報案三聯單","answer":true},{"option":"匯(轉)入款項之證明文件","answer":true},{"option":"申請不實致金融機構受有損失,由該被害人負一切法律責任之切結書等文件","answer":true}],"remark":"【93.8.12.銀營一乙字第09300171351號函】"},{"id":"存匯-401","class":"存匯","sn":"401","type":"Multi","question":"對「警示帳戶」與法院命令執行扣押,下列敘述何者正確?","options":[{"option":"於接獲法院扣押命令時,若債務人之存款帳戶已遭警調機關要求設立為警示帳戶者,仍應依法院命令執行扣押","answer":true},{"option":"若債務人之存款帳戶已被法院扣押,日後接獲警調機關要求設立為警示帳戶時,應函告警調機關無法設定為警示帳戶","answer":false},{"option":"有關警示帳戶內爭議款項之相關事實認定,案關當事人對法院之扣押命令有所爭執,應循司法途徑解決","answer":true}],"remark":"【94.3.10.銀營一乙字第09400045471號函、94.4.21.銀營一乙字第09400082681號函】"},{"id":"存匯-402","class":"存匯","sn":"402","type":"Multi","question":"司法、軍法、稅務、監察、審計及其他依法律規定具有調查權之機關,查詢客戶交易資料下列何者正確?","options":[{"option":"有查詢銀行客戶存、放款、保管箱等有關資料之需要者,得依據各該法律規定,正式備文逕洽相關銀行查詢","answer":true},{"option":"回函應以密件處理並說明附件資料係客戶個人隱私,應注意保密","answer":true},{"option":"無需密件處理","answer":false}],"remark":"【行政院金融監督管理委員會95年05月23日金管銀(一)字第09510002020號令】"},{"id":"存匯-403","class":"存匯","sn":"403","type":"Multi","question":"繼承人持有分割協議書並經全體繼承人簽章同意時,若該分割協議書業經法院或民間公證人公證或經提示其他繼承人之印鑑證明書證明印鑑相符者,得依分割協議書所列內容,由分割結果獲得本行存款之人領取存款,本行得以何種方式辦理?","options":[{"option":"匯款、轉帳入該等繼承人本人帳戶","answer":true},{"option":"簽發該等繼承人為受款人之本行支票","answer":true},{"option":"該等繼承人為領取現金之方式","answer":true}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-404","class":"存匯","sn":"404","type":"Multi","question":"被繼承人在臺灣無繼承人,僅大陸有繼承人時,何者正確?","options":[{"option":"免遺產管理人","answer":false},{"option":"現役軍人由國防部後備司令部為遺產管理人","answer":true},{"option":"一般人民由法院指定財政部國有財產署為遺產管理人","answer":true}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-405","class":"存匯","sn":"405","type":"Multi","question":"有關金融機構辦理公務機關查詢及解繳扣押款收費作業要點,下列敘述何者正確?","options":[{"option":"對於因扣押命令案件所函復法院(行政執行署)查詢客戶存款資料部分,不收取查詢費用","answer":true},{"option":"扣押命令案件解繳扣押案款支付時,收取新臺幣250元作業費用","answer":true},{"option":"收取之作業成本費用以「手續費收入-存款業務服務費-公務機關查詢」會計科目列帳","answer":true}],"remark":"【101.12.26.銀營運乙字第10150350071號函】"},{"id":"存匯-406","class":"存匯","sn":"406","type":"Multi","question":"對支票存款之新開戶者,下列敘述何者錯誤?","options":[{"option":"公司組織者,應持公司登記證明文件(如主管機關核准公司登記之核准函、公司設立/變更登記表或公司登記證明書等),至經濟部商工登記資料系統查詢公司登記,並列印查詢結果備查。另得至財政部稅務入口網站查詢並列印稅籍登記資料,作為實際徵信及查核之參考(非強制規定客戶必須持有稅籍登記資料)","answer":false},{"option":"不具法人人格之行號或團體,得僅以該行號或團體為戶名","answer":true},{"option":"核發空白支票、空白本票一律以25張為原則","answer":true}],"remark":""},{"id":"存匯-407","class":"存匯","sn":"407","type":"Multi","question":"對支票存款戶之票據掛失止付,下列敘述何者錯誤?","options":[{"option":"通知止付人應於提出止付通知後五個營業日內向本行提出已為聲請公示催告之證明,否則止付通知失其效力","answer":true},{"option":"受理發票人掛失完全空白票據及業經掛失完全空白票據之註銷,可免登報聲明","answer":false},{"option":"對到期日前之票據受理掛失時,應先予登記,俟到期日再依規定辦理。但票據權利人仍應依規定於止付通知後五個營業日內,向本行提出已為聲請公示催告之證明","answer":true}],"remark":""},{"id":"存匯-408","class":"存匯","sn":"408","type":"Multi","question":"有關支票存款戶交換票據抵用,下列敘述何者正確?","options":[{"option":"應徵提連帶保證人二人(企業戶應包括主要負責人及實際經營者),但支存戶資信良好者,營業單位主管得視情況酌減或免徵提連帶保證人","answer":true},{"option":"企業戶每戶最高新臺幣一千五百萬元,自然人每戶最高新臺幣五百萬元,由營業單位經理核定辦理","answer":true},{"option":"簽訂抵用契約期限最長二年,在契約期限及額度內循環承作","answer":true}],"remark":"【一般支票存款──支票存款戶交換票據抵用標準作業流程】"},{"id":"存匯-409","class":"存匯","sn":"409","type":"Multi","question":"有關不具法人人格之行號或團體開立支票存款戶,下列敘述何者正確?","options":[{"option":"以負責人名義申請開戶,行號或團體名稱可併列於戶名內,惟應以全銜列示","answer":true},{"option":"對象別以個人登錄","answer":false},{"option":"其併列書寫方式,宜配合「台灣票據交換所建立支票存款戶基本資料檔組織型態歸類說明」規定,將負責人姓名併列於行號或團體名稱之後","answer":true}],"remark":"【96.9.27.金管銀一字第09600380972號函】"},{"id":"存匯-410","class":"存匯","sn":"410","type":"Multi","question":"有關新臺幣數位存款帳戶,下列敘述何者正確?","options":[{"option":"客戶自行於本行線上申請專區進行申辦","answer":true},{"option":"每月存取交易明細以電子郵件寄送對帳單通知存戶(當月有交易才寄送)","answer":true},{"option":"若有警示註記惟已解除,經主管同意後得受理開戶","answer":true}],"remark":"【數位存款開戶標準作業流程】"},{"id":"存匯-411","class":"存匯","sn":"411","type":"Multi","question":"有關受理劃線載明受款人並禁止背書轉讓之支票,受款人以委任取款之目的而為背書者,下列敘述何者正確?","options":[{"option":"先以V0006歸戶查詢","answer":true},{"option":"應於支票背面記載「票面金額委託OOO取款」,並由受款人及受任人共同背書以完成委任手續","answer":true},{"option":"受款人已設立帳戶者,可以委任取款方式領款","answer":false}],"remark":"【93.10.28.銀營一乙字第09300230761號函及94.1.17.銀營一乙字第09400006521號函】"},{"id":"存匯-412","class":"存匯","sn":"412","type":"Multi","question":"下列敘述何者正確?","options":[{"option":"票據上經執行法院記載假處分事由者,各金融業者即不得接受提示交換。倘執票人仍逕向付款行提示,該付款行雖未接獲法院之執行命令,仍應以「經法院依假處分裁定禁止提示付款」之理由辦理退票","answer":true},{"option":"為拓展無息存款,對支票存款新開戶者,得視其實際需要彈性核給空白支票","answer":true},{"option":"支票上之號碼金額經塗改後,不論是否與文字金額相符,概以金額經塗改予以退票","answer":false}],"remark":"【金融業者處理假處分票據應注意事項、92.11.6.銀營一乙字第09200250621號函、91.11.13.銀融乙字第09101241371號函】"},{"id":"存匯-413","class":"存匯","sn":"413","type":"Multi","question":"本行支票存款戶申辦優良存戶交換票據抵用,下列敘述何者正確?","options":[{"option":"申請抵用之票據,限申辦當日營業單位提出之本埠他行票據,經向付款銀行查證已獲交換通過者;但支存戶為發票人之交換票據亦得抵用","answer":false},{"option":"每戶抵用額度以其在受理營業單位最近六個月支票存款平均餘額之六倍及活期性存款平均餘額之三倍為限","answer":true},{"option":"抵用票據如遭退票,應即通知支存戶補足,未及補足而經本行墊款時,應於墊付日起十日內償還之","answer":true}],"remark":"【本行支票存款戶交換票據抵用處理辦法】"},{"id":"存匯-414","class":"存匯","sn":"414","type":"Multi","question":"有關新臺幣數位存款帳戶,下列敘述何者正確?","options":[{"option":"經審核客戶資料並成功開戶後,系統會自動發送E-MAIL通知客戶","answer":true},{"option":"客戶非僅具本國稅務居民時,應於10個營業日內請客戶填寫FATCA/CRS聲明書並經主管審核後辦理","answer":false},{"option":"拒絕受理案件於選擇「拒絕開戶理由」後,系統自動編寫電子郵件,並由主管執行放行交易,發送E-MAIL通知客戶","answer":true}],"remark":"【數位存款開戶標準作業流程】"},{"id":"存匯-415","class":"存匯","sn":"415","type":"Multi","question":"有關派赴機關、團體或企業收付款項業務,下列敘述何者錯誤?","options":[{"option":"外出收付款項人員與記帳人員可為同一人,每日收付款項應作當日帳處理;若不及於當日處理,取得客戶同意後,始得以次日帳處理","answer":true},{"option":"機關、團體或企業留存本行備驗之印鑑卡,由單位主管或授權核章主管指定專人妥善保管於上鎖之箱櫃","answer":false},{"option":"涉及客戶帳務者,各營業單位應於當月最後營業日,執行申請對帳單作業,並於次月十日前辦理發送作業(遇例假日順延)","answer":true}],"remark":"【出納業務-標準作業流程】"},{"id":"存匯-416","class":"存匯","sn":"416","type":"Multi","question":"有關匯出匯款臨時性交易,下列何者錯誤?","options":[{"option":"對於達新臺幣3萬元(含)以上之臨時性交易需確認其身分,並可留存證件影本,不可僅予以記錄備查","answer":true},{"option":"匯款臨時性交易,指非本行客戶辦理匯款","answer":false},{"option":"非自然人匯款臨時性交易,高階管理人及實質受益人資料應鍵入AMLRLS(關聯人資料系統)檢核","answer":true}],"remark":"【國內匯兌-匯出匯款連線作業標準作業流程(SOP)】"},{"id":"存匯-417","class":"存匯","sn":"417","type":"Multi","question":"下列有關匯款金額限制之敘述,何者正確?","options":[{"option":"同業匯款金額不受限制,但仍不得超過本行跨行業務清算基金餘額","answer":true},{"option":"聯行匯款金額沒有上限","answer":true},{"option":"每份匯款申請書最高25億","answer":false}],"remark":""},{"id":"存匯-418","class":"存匯","sn":"418","type":"Multi","question":"證券匯款之敘述下列何者為正確?","options":[{"option":"每筆匯款不受新台幣5,000萬元之限制","answer":true},{"option":"一般民眾與證券商及證券商與證券商間之匯款均屬之","answer":false},{"option":"手續費之收費依現行入戶電匯標準計收","answer":true}],"remark":""},{"id":"存匯-419","class":"存匯","sn":"419","type":"Multi","question":"跨行匯款以尚未入戶方式匯入可辦理何項業務?","options":[{"option":"定期存款","answer":true},{"option":"整存整付儲蓄存款","answer":true},{"option":"本行支票","answer":true}],"remark":""},{"id":"存匯-420","class":"存匯","sn":"420","type":"Multi","question":"匯入款解款行尚未入戶,如有退匯之情事,解款行在作退匯(R1001之匯款種類14)交易,下列何者必須輸入?","options":[{"option":"原匯款日","answer":true},{"option":"原匯款種類","answer":true},{"option":"原匯款編號","answer":true}],"remark":"【國內匯兌篇業務手冊】"},{"id":"存匯-421","class":"存匯","sn":"421","type":"Multi","question":"匯款已成功匯出至匯款人指定的帳號及戶名後,匯款人才通知誤匯,下列敘述何者錯誤?","options":[{"option":"匯款行應即以銀行名義通知解款行退匯","answer":true},{"option":"匯款行僅能協助存戶追索匯款","answer":false},{"option":"緊急從解款行在本行同業存款帳戶扣除相同金額","answer":true}],"remark":""},{"id":"存匯-422","class":"存匯","sn":"422","type":"Multi","question":"有關匯款下列敘述何者正確?","options":[{"option":"匯款支票之掛失止付須於解款行辦理","answer":true},{"option":"顧客來某分行辦理跨行匯款,該分行貸方應帳列聯行往來—20","answer":true},{"option":"匯款支票依票據法之規定,執票人須於發票日起一年內為付款之提示","answer":true}],"remark":""},{"id":"存匯-423","class":"存匯","sn":"423","type":"Multi","question":"本行於下列何者情形提前與承租人終止保管箱租約,應按月計收租金,不足一個月者,按日計收租金,並按年率百分之五加計利息後,退還溢付之租金?","options":[{"option":"本行因修繕、遷移保管箱或其他原因須暫停保管箱之使用,或因故須請承租人調換其他保管箱而承租人未於本行以書面指定期限內辦理調換保管箱事宜者","answer":true},{"option":"本行結束保管箱業務者","answer":true},{"option":"本行依法院扣押命令,配合執行破封開箱作業者","answer":false}],"remark":"【保管箱作業-續租、退租標準作業流程】"},{"id":"存匯-424","class":"存匯","sn":"424","type":"Multi","question":"保管箱承租人亡故後,其相關繼承作業,下列何者正確?","options":[{"option":"接獲繼承人通知承租戶已死亡,應於印鑑比對系統備註,並以保管箱連線作業系統登錄限制開箱設定","answer":true},{"option":"應由全體繼承人或共同委託人會同國稅局人員辦理開箱作業清點物品","answer":true},{"option":"會同國稅局人員清點後,如箱內物品未能於當日領回,應立即將前揭物品鎖回箱內,俟繼承人及相關文件齊全再行辦理繼承手續領回","answer":false}],"remark":"【保管箱作業-繼承、破封開箱、領回置放物標準作業流程】"},{"id":"存匯-425","class":"存匯","sn":"425","type":"Multi","question":"有關傳真指示扣帳,下列敘述何者正確?","options":[{"option":"存戶申請是項業務,應檢附授權,經營業單位敘明受理之理由,逐級簽至單位主管核准後辦理,並作當日無傳票附件","answer":false},{"option":"存戶傳真之取款憑條或其他指示扣帳文件,應由存匯業務主管指定之經辦人員受理,並設簿登記","answer":true},{"option":"經辦人員應於收到傳真文件之當日起三個營業日內取得存款戶之取款憑條及其他指示扣帳文件之正本,由原交易發生時之驗印及核章人員確實核對原留印鑑、金額及核章,並將取款憑條及其他指示扣帳文件正本裝訂於傳真文件後作為附件,憑以銷案","answer":true}],"remark":"【存款業務總則篇-傳真指示扣帳標準作業流程(SOP)】"},{"id":"存匯-426","class":"存匯","sn":"426","type":"Multi","question":"有關存單、存摺掛失補發業務,下列敘述何者錯誤?","options":[{"option":"受監護宣告之成年人,由監護人親自辦理","answer":false},{"option":"受理掛失時,以P60交易【項目06存摺遺失、(1)登錄】做存摺止扣,即臨櫃提款、ATM提款、授權扣帳、網路轉帳等交易全部暫停","answer":true},{"option":"單一帳戶餘額未達新臺幣15萬元者,得免電洽存戶進行後續查證作業","answer":true}],"remark":"【存款業務總則篇(支票存款、可轉讓定期存單除外)-存單、存摺掛失補發標準作業流程(SOP)】"},{"id":"存匯-427","class":"存匯","sn":"427","type":"Multi","question":"下列敘述何者錯誤?","options":[{"option":"綜合存款之定期存款得在本金九成範圍內向本行申請質押借款,質借依照本行規定之質借利率計息,目前按定期(儲)存款利率加1.5%計息","answer":false},{"option":"傳真指示扣款戶如遇存戶掛失更換或變更原留印鑑,應請存戶依授權書第八條約定,重新出具授權書並逐級簽至單位主管核准","answer":true},{"option":"公司籌備處開戶時係以自然人流程開立帳戶,俟籌設完竣並取得核准證件,無論負責人是否未變更,皆應沿用原帳號並以更換印鑑方式辦理,申請轉換成公司戶,以保障公司權益","answer":true}],"remark":"【綜合存款業務標準作業流程(SOP)、存款業務總則篇-傳真指示扣帳標準作業流程(SOP)、存款業務總則篇(支票存款除外)-印鑑更換標準作業流程(SOP)】"},{"id":"存匯-428","class":"存匯","sn":"428","type":"Multi","question":"稅捐稽徵機關查詢存戶存款等有關資料,下列敘述何者正確?","options":[{"option":"依稅捐稽徵法第三十條規定,向金融機構查詢客戶之資金往來紀錄,應報財政部核准","answer":true},{"option":"為核課遺產稅需要,向各金融機構函詢繼承人及其生存配偶截至被繼承人「死亡日」之存款餘額時,毋須報經財政部核可","answer":true},{"option":"向各金融機構查詢納稅義務人於金融機構特定時點之帳戶(含存、放款)餘額,須經報財政部核准","answer":false}],"remark":"【財政部70.12.03.台財稅第40060號函、行政院金融監督管理委員會銀行局 95 年 06 月 07 日銀局(一)字第 09510002220 號函】"},{"id":"存匯-429","class":"存匯","sn":"429","type":"Multi","question":"下列敘述何者正確?","options":[{"option":"稅捐稽徵機關依稅捐稽徵法第三十條規定,向本行函查納稅義務人之資金往來紀錄,以作為課稅資料時,應報經財政部核准","answer":true},{"option":"行政院衛生署及各直轄市與縣市衛生局為執行違法案件之調查,得逕向銀行查詢匿名販售藥物、食品及化粧品之帳戶持有人基本資料","answer":false},{"option":"行政院海岸巡防署、海洋巡防總局及海岸巡防總局、法務部調查局、警察機關(包括軍事警察機關)、受理財產申報機關為辦案需要,向銀行查詢客戶存放款以外基本資料時,可備文逕洽銀行辦理","answer":true}],"remark":"【行政院金融監督管理委員會95年05月23日金管銀(一)字第09510002020號令、本行102年4月30日銀營運乙字第10200019991號函】"},{"id":"存匯-430","class":"存匯","sn":"430","type":"Multi","question":"有關存戶申請以郵寄方式結清銷戶,下列敘述何者正確?","options":[{"option":"帳戶餘額以不超過新臺幣10萬元(不含未支付之活期性存款利息),且足敷支付本項申請之相關費用為限","answer":true},{"option":"存戶如選擇將帳戶餘額匯入他行本人之帳戶,得請其提供該帳戶存摺封面影本或其他證明文件以供確認","answer":true},{"option":"申請書內容應包括戶名、帳號、結清之意思表示、帳戶餘額處理方式及支票存款結清之相關規定","answer":true}],"remark":"【存款業務總則篇(支票存款除外)-存摺類存款結清銷戶標準作業流程(SOP)】"},{"id":"存匯-431","class":"存匯","sn":"431","type":"Multi","question":"薪資轉帳存款,其員工如離職、退休、停職等,目前規定及實際作業下列何者為是?","options":[{"option":"可由其機關通知自離職次日起調降利率改按一般活期儲蓄利率計息","answer":true},{"option":"依據存款人通知調降利率改按一般活期儲蓄利率計息","answer":true},{"option":"營業單位依據R277表調降利率改按一般活期儲蓄利率計息","answer":true}],"remark":"【機關、團體、工商企業薪資轉帳存款標準作業流程(SOP)】"},{"id":"存匯-432","class":"存匯","sn":"432","type":"Multi","question":"機關團體員工儲蓄存款,下列敘述何者正確?","options":[{"option":"限額新台幣200萬元","answer":false},{"option":"機關團體與本行營業單位簽約","answer":true},{"option":"總存款3成轉為定期性存款","answer":true}],"remark":"【業務輯要-儲】"},{"id":"存匯-433","class":"存匯","sn":"433","type":"Multi","question":"辦理自動櫃員機(ATM)業務,下列何者錯誤?","options":[{"option":"出納主辦(密碼掌管者)或其職務代理人職務更動時,應即更改密碼;出納主辦(密碼掌管者)差假、受訓、公出時,期間若交付密碼與代理人使用,上班後亦應更改密碼,另每年6月及12月應定期更換一次;單位主管可視安全需求隨時指示更改密碼","answer":true},{"option":"廠商派員前來進行軟硬體維修自動化服務機器時,應查明工程師身分,並指派職員全程在場監督(行外自動化服務機器已採委外作業,由委外服務廠商派員會同廠商處理,惟ATM軟體或硬體維護涉及申請「自動櫃員機防護軟體之Ticket」時,本行仍應指派職員會同監督處理),嚴禁廠商攜出機體內配件或資料及禁止以非營業單位提供之任何儲存媒體抄入或抄出自動化服務機器之資料,被指派之職員於廠商維修完畢後,應依規定辦理維修情形登錄,並列印「自動化服務機器維修記錄表」陳核,並將廠商之維修單黏貼於前揭記錄表上,依序保管一年備查","answer":false},{"option":"營業單位每個營業日定時派員巡查行內外自動櫃員機使用情形,特別注意自動化服務機器周邊環境是否有遭歹徒裝置側錄器","answer":true}],"remark":"【臺灣銀行股份有限公司自動化服務機器業務處理要點】"},{"id":"存匯-434","class":"存匯","sn":"434","type":"Multi","question":"有關本行自動化服務機器之管理,下列何者正確?","options":[{"option":"存戶操作自動化服務機器,每一階段均有限制時間,逾時未完成操作時,機器將退出卡片,存戶須重新輸入","answer":true},{"option":"自動化服務機器裝設之隱藏式監視設備其錄影保管期限至少六個月","answer":true},{"option":"營業時間中如有鈔匣內鈔券即將用罄、夾鈔或其他與鈔券有關事故,應由管庫主管(鑰匙掌管者)及出納主辦(密碼掌管者)共同處理,行外之自動櫃員機並宜有警衛或保全人員隨同處理。至於如交易明細表用罄、機器故障或卡片留置等與鈔券無關之事故,則由營業部門經辦處理","answer":true}],"remark":"【臺灣銀行股份有限公司自動化服務機器業務處理要點】"},{"id":"存匯-435","class":"存匯","sn":"435","type":"Multi","question":"辦理晶片金融卡之作廢,下列何者正確?","options":[{"option":"由經辦人員保管滿一年後辦理銷燬","answer":false},{"option":"卡片銷毀後之作廢卡片已銷毀清冊自行留存5年備查","answer":true},{"option":"卡片銷燬時間定於每年一月間","answer":true}],"remark":""},{"id":"存匯-436","class":"存匯","sn":"436","type":"Multi","question":"有關跨國提款手續費說明下列何者正確?","options":[{"option":"於港澳地區貼有財金標誌之ATM提款每筆收取NT$100元","answer":true},{"option":"於國外貼有PLUS標誌之ATM提款每筆收取NT$75元+交易金額1.55%國際組織手續費","answer":true},{"option":"於國外貼有Cirrus標誌之ATM提款每筆收取NT$75元+交易金額1.1%國際組織手續費","answer":true}],"remark":""},{"id":"存匯-437","class":"存匯","sn":"437","type":"Multi","question":"有關晶片金融卡之敘述下列何者正確?","options":[{"option":"最多可有八個約定轉出帳號及八個約定轉入帳號","answer":true},{"option":"晶片金融卡之磁條所存放之約定轉出帳號即為卡片帳號","answer":true},{"option":"在僅提供磁條密碼交易之國外ATM提款,可選擇任一約定轉出帳號為提領帳號","answer":false}],"remark":""},{"id":"存匯-438","class":"存匯","sn":"438","type":"Multi","question":"有關金融卡雲支付下列何者正確?","options":[{"option":"須持有本行有效之實體晶片金融卡","answer":true},{"option":"實體晶片金融卡主帳號以外之約定轉出帳號亦可下載金融卡雲支付","answer":false},{"option":"金融卡雲支付每日交易限額與實體晶片金融卡每日交易限額合併計算","answer":true}],"remark":""},{"id":"存匯-439","class":"存匯","sn":"439","type":"Multi","question":"下列敘述何者正確?","options":[{"option":"客戶尚未領取之密碼與卡片應分人保管","answer":true},{"option":"各營業單位可代聯行換發卡片","answer":true},{"option":"金融卡晶片密碼解鎖聯行可代為辦理","answer":true}],"remark":""},{"id":"存匯-440","class":"存匯","sn":"440","type":"Multi","question":"有關本行分行即時製發卡及密碼之規定,下列敘述何者錯誤?","options":[{"option":"客戶申請卡片時,由分行產生密碼單交付客戶使用","answer":true},{"option":"分行即時製發卡,客戶不需申請即可於國外貼有Cirrus標誌之ATM進行跨國提款功能","answer":true},{"option":"已臨櫃製卡客戶未領取之卡片,應交由製卡人員統一保管","answer":true}],"remark":""},{"id":"存匯-441","class":"存匯","sn":"441","type":"Multi","question":"繳款書之何種項目如有錯誤時或依據法令需要轉正者,應由原繳款機關填製「轉正通知書」送交原收款代庫辦理轉正手續?","options":[{"option":"科目名稱及代號","answer":true},{"option":"金額","answer":false},{"option":"款項所屬年度","answer":true}],"remark":""},{"id":"存匯-442","class":"存匯","sn":"442","type":"Multi","question":"國庫機關初次辦理收入退還時,下列敘述何者正確?","options":[{"option":"應填具開辦國庫收入退還申請書及印鑑卡2份","answer":true},{"option":"不須附財政部同意函","answer":true},{"option":"開戶資料須輸入電腦","answer":false}],"remark":""},{"id":"存匯-443","class":"存匯","sn":"443","type":"Multi","question":"有關國庫機關專戶存款之開戶手續,除檢附開戶申請書及印鑑外,尚須具備之其他文件,下列敘述何者正確?","options":[{"option":"中央政府各機關開戶時,須提供財政部同意函","answer":true},{"option":"國軍部隊開戶時,申請書應由國防部財務單位簽證","answer":true},{"option":"「國立大學附設中、小學」開戶時,應由教育部財務單位於申請書簽證","answer":false}],"remark":""},{"id":"存匯-444","class":"存匯","sn":"444","type":"Multi","question":"○○機關持財政部核准開立「機關專戶存款-保管款專戶」之公函開戶時,國庫經辦行不得受理開立何種帳戶?","options":[{"option":"活期存款戶","answer":true},{"option":"支票存款戶","answer":true},{"option":"機關專戶存款-特種基金專戶","answer":true}],"remark":""},{"id":"存匯-445","class":"存匯","sn":"445","type":"Multi","question":"本行收受國庫機關專戶存款之計息方式,下列敘述何者正確?","options":[{"option":"經費款帳戶不予計息","answer":true},{"option":"保管款帳戶及特種基金帳戶依存款類別及期間與存款機關商訂","answer":true},{"option":"依本行各期別存款牌告利率計息","answer":true}],"remark":""},{"id":"存匯-446","class":"存匯","sn":"446","type":"Multi","question":"各代庫受理定期性國庫機關專戶存款時,憑國庫機關專戶存款戶申請書辦理,其手續下列何者正確?","options":[{"option":"由該戶之活期性存款撥款轉存並沿用該撥款帳戶之戶名及印鑑","answer":true},{"option":"定期性存款解約提取之本金及利息,均應轉回原撥款帳戶","answer":true},{"option":"由代庫簽發「國庫機關專戶定期存款回單」,交存款機關收執,該回單無需送代庫機構保管","answer":true}],"remark":""},{"id":"存匯-447","class":"存匯","sn":"447","type":"Multi","question":"有關遺失機關專戶支票(以下簡稱公庫支票)辦理掛失止付手續,下列敘述何者正確?","options":[{"option":"遺失空白公庫支票,應登報聲明作廢","answer":true},{"option":"應向公庫主管機關申請","answer":false},{"option":"經保付之公庫支票不得掛失","answer":true}],"remark":""},{"id":"存匯-448","class":"存匯","sn":"448","type":"Multi","question":"委託機關送存之保管品,如屬原封或露封之契據時,經辦行應如何辦理?","options":[{"option":"編製「借:保管品-公庫保管品(國庫、直轄市庫、縣市庫、鄉鎮市庫)」及「貸:應付保管品-公庫保管品(國庫、直轄市庫、縣市庫、鄉鎮市庫)」科目傳票","answer":true},{"option":"每件一律以一元列帳","answer":true},{"option":"無須記帳","answer":false}],"remark":""},{"id":"存匯-449","class":"存匯","sn":"449","type":"Multi","question":"下列何者為正確?","options":[{"option":"經辦行之出納部門所收存之公庫保管品勿須設簿登記","answer":false},{"option":"委託機關送存之原封保管品封套之每一密封處,應加蓋機關全部原留印鑑","answer":true},{"option":"保管品之真偽及其時效,由委託機關自行負責","answer":true}],"remark":""},{"id":"存匯-450","class":"存匯","sn":"450","type":"Multi","question":"經辦行收存露封保管之有價證券時,應如何辦理?","options":[{"option":"應按其面額記帳","answer":true},{"option":"有價證券係以外幣計價者,應以上年度營業終了時本行外幣結帳價格(匯率)折算新台幣入帳","answer":true},{"option":"保管品申請書應由委託機關加蓋全部原留印鑑","answer":true}],"remark":""},{"id":"存匯-451","class":"存匯","sn":"451","type":"Multi","question":"為落實內部控管,本行凡有駐外代收稅費款業務之單位,下列敘述何者正確?","options":[{"option":"應將駐外業務列入自行查核範圍","answer":true},{"option":"若派駐人員與該公庫機關相處情形良好,為維繫與該機關既有之公誼,該員不宜調動以保住庫款不致流失","answer":false},{"option":"所收款項列次日帳處理者,應登記「營業時間外經收稅費款備查簿」","answer":true}],"remark":""},{"id":"存匯-452","class":"存匯","sn":"452","type":"Multi","question":"有關稅款經收手續,下列敘述何者正確?","options":[{"option":"應檢視繳款書(稅單)各欄之填寫有無遺漏,如商號名稱、統一編號等","answer":true},{"option":"有條碼繳款書(稅單)可直接於繳款書上修改資料並於更正處簽章","answer":false},{"option":"稅款經收人員有誤填或更正滯納金或利息等欄位,應於更正處加蓋經收人印章","answer":true}],"remark":""},{"id":"存匯-453","class":"存匯","sn":"453","type":"Multi","question":"櫃員於營業終了後或例假日經收之稅款,應於稅款繳款書各聯蓋何種印章?","options":[{"option":"當日「收款章」日戳","answer":true},{"option":"次日「收款章」日戳","answer":false},{"option":"「次日記帳」戳記,列次日帳","answer":true}],"remark":""},{"id":"存匯-454","class":"存匯","sn":"454","type":"Multi","question":"納稅義務人以他行即期支票繳稅時,櫃員應如何辦理?","options":[{"option":"在稅款繳款書(稅單)各聯加蓋當日日戳「收款章」及蓋「票據繳稅,兌現後生效」戳記","answer":true},{"option":"於完成前項手續後,即將收據聯及臺灣銀行經收稅費款項證明聯發給納稅人","answer":true},{"option":"俟票款兌現後登錄入帳,摘要輸入「L」即期票據、原代收日輸入「票據兌現日期」入帳","answer":false}],"remark":""},{"id":"存匯-455","class":"存匯","sn":"455","type":"Multi","question":"依稅捐稽徵法第48條之1規定於110年11月30日修正施行後自動補繳稅款者,下列敘述何者正確?","options":[{"option":"免收滯納金","answer":true},{"option":"僅按日加計利息,所加計利息係依各年度一月一日郵政儲金一年期定期儲金固定利率計算","answer":true},{"option":"僅收滯納金不收利息","answer":false}],"remark":""},{"id":"存匯-456","class":"存匯","sn":"456","type":"Multi","question":"臨櫃經收「分期繳納」之營利事業所得稅、綜合所得稅、遺產及贈與稅等稅單,下列敘述何者正確?","options":[{"option":"於「原訂繳納期間」內繳納者,無須加徵分期繳納利息及滯納金","answer":true},{"option":"於「分期繳納期間」內繳納者,應加徵分期繳納利息,分期利息起算日為「原訂繳納期間屆滿日」之翌日","answer":true},{"option":"如逾分期繳納期限繳納者,應加徵分期繳納利息及滯納金","answer":true}],"remark":""},{"id":"存匯-457","class":"存匯","sn":"457","type":"Multi","question":"下列何者正確?","options":[{"option":"黃金存摺網銀開戶檢核表(DPD29)若有資料,須至內政部戶政司及司法院網站家事事件公告專區查詢客戶國民身分證補換領紀錄及受輔助/監護宣告","answer":true},{"option":"未成年人無父母或父母均不能行使親權時,得由監護人陪同或代為辦理黃金存摺帳戶","answer":false},{"option":"未成年人辦理回售新臺幣計價黃金存摺時,回售款項僅可存入其新臺幣存摺帳戶,不得提領現金","answer":true}],"remark":""},{"id":"存匯-458","class":"存匯","sn":"458","type":"Multi","question":"本行DBU黃金存摺客戶可轉換下列何種金品?","options":[{"option":"1公斤黃金條塊","answer":true},{"option":"1台兩臺銀金鑽條塊","answer":true},{"option":"1英兩澳洲袋鼠金幣","answer":true}],"remark":""},{"id":"存匯-459","class":"存匯","sn":"459","type":"Multi","question":"本行大批銷售黃金存摺及訂有牌價之黃金條塊、金幣、白金幣價格折讓標準之敘述,何者正確?","options":[{"option":"適用「銷售」及「回售」時","answer":false},{"option":"單筆銷售單一幣別黃金存摺達3公斤(含)以上開始折讓","answer":true},{"option":"僅適用「銷售」時","answer":true}],"remark":""},{"id":"存匯-460","class":"存匯","sn":"460","type":"Multi","question":"下列黃金存摺之敘述,何者正確?","options":[{"option":"黃金存摺可先開戶,日後再伺機買進黃金","answer":true},{"option":"黃金存摺是黃金保管帳戶,並無孳息,故本行無需掣開利息扣繳憑單","answer":true},{"option":"黃金存摺為免綜合所得稅商品","answer":false}],"remark":""},{"id":"存匯-461","class":"存匯","sn":"461","type":"Multi","question":"有關客戶將黃金存摺餘額數量回售予本行,下列敍述何者為錯?","options":[{"option":"當客戶為使用統一發票之營業人時,無須請客戶開立免稅統一發票予本行","answer":true},{"option":"回售新臺幣/美元/人民幣計價黃金存摺款項,只要扣印花稅,皆可以現金方式支付貨款予客戶","answer":true},{"option":"客戶未攜帶黃金存摺本子,只要確認為本人,即可比照存款填寫「臺灣銀行新臺幣/外匯存款有摺戶無摺取款申請書暨同意書」","answer":true}],"remark":""},{"id":"存匯-462","class":"存匯","sn":"462","type":"Multi","question":"下列何項金品如無瑕疵,客戶可憑身分證/居留證正本(或中華民國統一證號基本資料表及護照)及原購買或補繳差價之收據或統一發票正本回售予本行?","options":[{"option":"1英兩幻彩條塊","answer":true},{"option":"1英兩袋鼠金幣","answer":true},{"option":"1台兩臺銀金鑽條塊","answer":true}],"remark":""},{"id":"存匯-463","class":"存匯","sn":"463","type":"Multi","question":"為強化交易驗印機制,辦理下列何項交易時,應洽請其他櫃員先執行「G6090分人驗印」交易?","options":[{"option":"P1720客戶臨櫃買進實體貴金屬商品,其款項連動新臺幣存款達100萬(含)以上者","answer":false},{"option":"P1810客戶本人臨櫃回售黃金存摺數量達1,000公克(含)以上且以現金支付者","answer":true},{"option":"P1811臨櫃以黃金存摺轉換金品重量達1,000公克(含)以上者","answer":true}],"remark":""},{"id":"存匯-464","class":"存匯","sn":"464","type":"Multi","question":"下列有關客戶回售新臺幣計價黃金存摺敍述,何者正確?","options":[{"option":"得由未成年人單獨親臨營業單位辦理回售黃金存摺","answer":false},{"option":"父母代理未成年子女臨櫃回售新臺幣計價黃金存摺,其款項須存入本行未成年子女存款帳戶","answer":true},{"option":"受理受輔助人臨櫃回售新臺幣計價黃金存摺,其款項須存入本行受輔助人存款帳戶","answer":true}],"remark":""},{"id":"存匯-465","class":"存匯","sn":"465","type":"Multi","question":"下列何者係出納基金之支付範圍?","options":[{"option":"出納人員超額保險之保險費(指信用保險高於一般行員標準部份之保險費)","answer":false},{"option":"各單位出納人員辦理收付事項發生錯失而非屬保險公司承保或賠償範圍者","answer":true},{"option":"使用機器收付及兌換現金發生錯失,而無法辨明責任者","answer":true}],"remark":""},{"id":"存匯-466","class":"存匯","sn":"466","type":"Multi","question":"下列敘述何者正確?","options":[{"option":"管庫主管或出納主辦職務異動時應將鑰匙移交並變更密碼","answer":true},{"option":"依規定每14個日曆日至少「測試警鈴」一次","answer":true},{"option":"櫃員現金箱之副鑰匙及密碼應由櫃員會同會計主辦加封後交由櫃員主任保管","answer":false}],"remark":""},{"id":"存匯-467","class":"存匯","sn":"467","type":"Multi","question":"有關保管箱作業下列敘述何者正確?","options":[{"option":"辦理保管箱破封開箱,箱內物品應與公證人共同清點並包裹簽章封存送出納保管,並立即以書面通知承租戶於6個月期限內領回","answer":true},{"option":"保管箱庫房監視錄影系統人員應每日於營業時間前、中隨時檢查錄影資料與容量是否足以儲存6個月","answer":true},{"option":"應於每年一月將前一年度作廢之鎖頭/磁卡列清冊簽陳單位主管核准,會同會計人員辦理銷毀,並應留存銷毀清冊保管3年備查","answer":true}],"remark":"【保管箱作業-繼承、破封開箱、領回置放物標準作業流程、庫房、鑰匙、磁卡、鎖頭及監視系統管理標準作業流程】"},{"id":"存匯-468","class":"存匯","sn":"468","type":"Multi","question":"退休人員之優惠存款契約期滿時,由受理優惠存款機構逕依經審定之可辦理優存金額及法定優存利率辦理續存。但退休人員有下列何種情形,不適用之?","options":[{"option":"暫停或停止優惠存款權利","answer":true},{"option":"溢領或誤領優惠存款利息","answer":true},{"option":"於優惠存款契約期滿時出境且戶籍經戶政機關辦理遷出登記","answer":true}],"remark":"【優惠存款辦法第9條】"},{"id":"外匯-001","class":"外匯","sn":"001","type":"Single","question":"依現行規定,在中華民國境內辦理多少金額以上等值外匯收支或交易之資金所有者或需求者,應依「外匯收支或交易申報辦法」申報?","options":[{"option":"美金一萬元","answer":false},{"option":"美金五十萬元","answer":false},{"option":"新臺幣五十萬元","answer":true}],"remark":"〔外匯收支或交易申報辦法〕"},{"id":"外匯-002","class":"外匯","sn":"002","type":"Single","question":"匯出、入匯款之匯款分類,申報匯款性質,下列何者為是?","options":[{"option":"辦理匯出匯款居住民依結購外匯之資金用途、非居住民應依結購外匯之資金來源","answer":false},{"option":"辦理匯入匯款居住民應依結售外匯之資金來源、非居住民依結售外匯之資金用途","answer":false},{"option":"以上皆是","answer":true}],"remark":"〔銀行業輔導客戶申報外匯收支或交易應注意事項〕"},{"id":"外匯-003","class":"外匯","sn":"003","type":"Single","question":"凡在我國境內居住,未滿十八歲之自然人,其每筆結匯金額未達新臺幣多少金額等值外幣者,指定銀行得於查驗結匯人身分文件後,逕行辦理結匯?","options":[{"option":"三千元","answer":false},{"option":"一萬元","answer":false},{"option":"五十萬元","answer":true}],"remark":"〔銀行業輔導客戶申報外匯收支或交易應注意事項〕"},{"id":"外匯-004","class":"外匯","sn":"004","type":"Single","question":"軍政機關申請結購進口外匯或匯出匯款時,金額在美金一百萬元以下者,應如何辦理?","options":[{"option":"填妥外匯收支或交易申報書,逕行辦理結購","answer":true},{"option":"報由主管機關核轉財政部核准後辦理","answer":false},{"option":"報經央行核准後辦理","answer":false}],"remark":"〔軍政機關外匯審核準則〕"},{"id":"外匯-005","c ":"F3501","answer":false},{"option":"F0212","answer":false}],"remark":"〔86.12.17國管營字第26/1207號函、87.5.22國管營字第2-6/2993號函及97.7.16財清字第09700024301號函、外匯業務操作手冊〕"},{"id":"外匯-026","class":"外匯","sn":"026","type":"Single","question":"本行DBU外匯綜合存款可質借幣別計有哪五種幣別?","options":[{"option":"美金、港幣、英鎊、日圓、歐元","answer":true},{"option":"美金、港幣、澳幣、日圓、歐元","answer":false},{"option":"美金、英鎊、澳幣、日圓、歐元","answer":false}],"remark":"〔本行外匯綜合存款辦法〕"},{"id":"外匯-027","class":"外匯","sn":"027","type":"Single","question":"匯出匯款案件轉列「其他應付款─逾期戶-外匯業務(票匯、信匯)」已逾十五年者,下列會計作業處理何者為是?","options":[{"option":"轉列 雜項收入─懸帳轉銷","answer":true},{"option":"轉列應付帳款-退匯(票匯)","answer":false},{"option":"仍列其他應付款─逾期戶(票匯、信匯)","answer":false}],"remark":"〔外匯匯出匯款標準作業流程〕"},{"id":"外匯-028","class":"外匯","sn":"028","type":"Single","question":"申報義務人委託其他個人代辦新臺幣結匯申報時,應以何者之名義填報,受託人應檢附委託書、委託人及受託人之身分證明文件?","options":[{"option":"委託人","answer":true},{"option":"受託人","answer":false},{"option":"承辦銀行","answer":false}],"remark":"〔外匯收支或交易申報辦法〕"},{"id":"外匯-029","class":"外匯","sn":"029","type":"Single","question":"營業單位發現客戶持偽(變)造外國幣券來行兌換,下列處理方式何者為是?","options":[{"option":"經收顧客持兌之外國幣券發現有偽(變)造幣券時,除當面向持兌人說明係偽(變)造幣券外,應加蓋『偽(變)造作廢』章,並經持兌人同意後,將原件截留,掣給收據","answer":false},{"option":"持兌之偽(變)造外國幣券總值在美金貳佰元以上或持兌之偽(變)造外國幣券總值未達美金貳佰元,且持兌人情形可疑或不同意經辦機構截留致無法處理者,應立刻記明持兌人之真實姓名、國籍、職業及住址,並報請警察機關偵辦","answer":false},{"option":"以上皆是","answer":true}],"remark":"〔偽造變造外國幣券處理辦法〕"},{"id":"外匯-030","class":"外匯","sn":"030","type":"Single","question":"下列何者為非?","options":[{"option":"於非營業時間發送任何電文,皆需在SWALLOW系統經2個不同的有權人覆核、放行才可去電","answer":true},{"option":"客戶持國外匯款人提供之「UETR」,分行僅可於SWALLOW系統查詢是否有來電","answer":false},{"option":"本行目前僅pacs.008、pacs.009cov適用「gpi功能」","answer":false}],"remark":"〔109.6.30國通字第10900025371號函、外匯端末系統(SWIFT gpi)操作說明、SWIFT 電文整合平台系統操作手冊〕"},{"id":"外匯-031","class":"外匯","sn":"031","type":"Single","question":"匯入匯款電文為下列何者情況時,應先查證該筆款項確實入帳並留存相關證明(例如進帳的對帳單)做為傳票附件後始進行解款事宜?","options":[{"option":"發報電文銀行為本行存同行且與該筆匯入款項之入帳行相同","answer":false},{"option":"發報電文銀行為本行通匯行但非該筆匯入款項之入帳行","answer":true},{"option":"電文來自財金公司清算系統","answer":false}],"remark":"〔外匯匯入匯款標準作業流程(SOP)〕"},{"id":"外匯-032","class":"外匯","sn":"032","type":"Single","question":"有關端末連線工作站SWIFT MT來電筆數之控管,下列敘述何者為非?","options":[{"option":"分行每營業日列印之SWIFT來電電文筆數及序號應與當日列印之H0105相符,如有不符,應查明是否漏印等原因","answer":false},{"option":"分行除於端末連線工作站注意有無漏印電文等異常外,尚應注意在AML系統中是否有來電被疑似命中制裁名單,但尚未由主管於AML系統接受(ACCEPT)放行","answer":false},{"option":"主管於AML系統拒絕(REJECT)或取消(CANCEL)後,分行端末就能收到電文","answer":true}],"remark":"〔96.12.28國通字第09600065871號函及107.10.15國通字第10700037971號函、國內分行SWIFT電文收發SOP〕"},{"id":"外匯-033","class":"外匯","sn":"033","type":"Single","question":"若國內分行於端末連線工作站發送SWIFT MT電文後,查詢H02-01「中心當日發送電文明細查詢」,下列何者為非?","options":[{"option":"若AML狀態欄顯示空白,表示該電文無須送AML系統自動掃描","answer":true},{"option":"若AML狀態欄顯示「C」(AMLCLOSE),表示該電文送AML掃描時,電文送AML系統的功能被關閉","answer":false},{"option":"AML系統異常,分行審慎評估後,電文仍需緊急發送時,分行可於SWALLOW系統執行電文重送AML系統或BYPASS AML作業","answer":false}],"remark":"〔107.10.15國通字第10700037971號函、國內分行SWIFT電文收發SOP〕"},{"id":"外匯-034","class":"外匯","sn":"034","type":"Single","question":"有關本行外幣可轉讓定期存單(以下簡稱外幣NCD)之敘述,下列何者為是?(A)外幣NCD屬外匯存款,亦為票券金融管理法所稱之短期票券(B)發行形式:採無實體方式發行(C)發行面額:以美元10萬元、歐元10萬元、澳幣10萬元、人民幣50萬元及日圓500萬元之倍數發行之(D)發行期限:最短為一個月,最長不得逾一年","options":[{"option":"AB","answer":true},{"option":"ABC","answer":false},{"option":"ABD","answer":false}],"remark":"〔104.12.31國業字第10400052371號函、105.11.1銀國際乙字第10500038711號函〕"},{"id":"外匯-035","class":"外匯","sn":"035","type":"Single","question":"本行外匯定期存款採行何種利率計息?","options":[{"option":"浮動利率","answer":false},{"option":"固定利率","answer":true},{"option":"得由存戶選擇浮動或固定利率","answer":false}],"remark":"〔本行外匯存款辦法〕"},{"id":"外匯-036","class":"外匯","sn":"036","type":"Single","question":"臨時性法人、團體客戶辦理達新臺幣(含等值外幣)多少金額以上之單筆現金收或付或換鈔交易時(多筆顯有關聯之通貨交易合計達該等值金額以上時,亦同),須徵提「法人、團體聲明書(防制洗錢及打擊資恐專用)」?","options":[{"option":"3萬元","answer":false},{"option":"5萬元","answer":false},{"option":"50萬元","answer":true}],"remark":"〔107年4月13日國業字第10700012201號〕"},{"id":"外匯-037","class":"外匯","sn":"037","type":"Single","question":"法人如公司戶、商業(行號)及團體等買賣人民幣現鈔規定為何?","options":[{"option":"每次買賣人民幣現鈔之限額為人民幣2萬元","answer":false},{"option":"禁止購買","answer":false},{"option":"無相關額度限制","answer":true}],"remark":"〔臺灣銀行DBU客戶辦理人民幣業務問答集〕"},{"id":"外匯-038","class":"外匯","sn":"038","type":"Single","question":"客戶回售本行出售之美國運通旅行支票,每人每日可回售之金額不得逾等值美金多少元?","options":[{"option":"USD25,000","answer":true},{"option":"USD50,000","answer":false},{"option":"無金額限制","answer":false}],"remark":"〔104.11.26國業字第10450013251號〕"},{"id":"外匯-039","class":"外匯","sn":"039","type":"Single","question":"指定銀行辦理大陸地區經許可之直接投資匯款,下列何者為是?","options":[{"option":"應於主管機關原核准投資文件等加註結匯金額、日期並簽章","answer":false},{"option":"個案累積投資金額在一百萬美元(含)以下者,得逕行受理投資人匯出投資款至大陸地區,不須確認經濟部核准投資文件","answer":false},{"option":"以上皆是","answer":true}],"remark":"〔銀行業受理對大陸地區匯出匯款及匯入匯款申報案件應確認事項〕"},{"id":"外匯-040","class":"外匯","sn":"040","type":"Single","question":"客戶申請票匯退匯時,除下列何種匯票外,應先查明該款項是否仍列帳於「匯出匯款-國外」科目,再請匯款人於票據背書後連同原始收據繳回原票,同時拍發SWIFT camt.108(或MT 111)通知國外解款行註銷該匯票?","options":[{"option":"SOLA CHECK","answer":false},{"option":"TRS","answer":false},{"option":"CRS","answer":true}],"remark":"〔外匯匯出匯款標準作業流程〕"},{"id":"外匯-041","class":"外匯","sn":"041","type":"Single","question":"保兌銀行之責任,下列何者為是?","options":[{"option":"開狀銀行不履行義務時,保兌銀行始負其責任","answer":false},{"option":"對受益人負有不可撤銷的與獨立的兌付或讓購的責任","answer":true},{"option":"保兌銀行可對出口商行使追索權","answer":false}],"remark":"〔UCP 600第8條〕"},{"id":"外匯-042","class":"外匯","sn":"042","type":"Single","question":"受益人對於信用狀修改書之接受或拒絕應予知會,如受益人怠於知會,則符合該信用狀及尚待接受之任何修改書之提示,將視為受益人如何表示?","options":[{"option":"不接受該修改書之通知,自此刻起信用狀並無修改","answer":false},{"option":"接受該修改書之知會,自此刻起信用狀並即予修改","answer":true},{"option":"接受部份修改書之通知,自此刻起信用狀部份修改生效","answer":false}],"remark":"〔UCP 600第10條〕"},{"id":"外匯-043","class":"外匯","sn":"043","type":"Single","question":"信用狀可在任何銀行使用者,任何銀行為下列何者?","options":[{"option":"保兌銀行","answer":false},{"option":"轉讓銀行","answer":false},{"option":"指定銀行","answer":true}],"remark":"〔UCP 600第2條〕"},{"id":"外匯-044","class":"外匯","sn":"044","type":"Single","question":"如電傳載明「明細後送」,則該項電傳將視為何者?","options":[{"option":"視為可憑使用之信用狀","answer":false},{"option":"視為可憑使用之修改書","answer":false},{"option":"不視為可憑使用之信用狀或修改書","answer":true}],"remark":"〔UCP 600第11條〕"},{"id":"外匯-045","class":"外匯","sn":"045","type":"Single","question":"開狀銀行如利用通知銀行之服務向受益人為信用狀之通知時,須利用何者之服務為修改書之通知?","options":[{"option":"不同銀行","answer":false},{"option":"相同銀行","answer":true},{"option":"押匯銀行","answer":false}],"remark":"〔UCP 600第9條〕"},{"id":"外匯-046","class":"外匯","sn":"046","type":"Single","question":"審查單據之標準,下列何者為是?","options":[{"option":"信用狀未要求之單據,將不予理會,並可退還提示人","answer":false},{"option":"依信用狀本文、單據本身及國際標準銀行實務審閱時,單據本身上下文、單據彼此間及單據與信用狀間之資料,無須完全一致,但不得互相牴觸","answer":false},{"option":"以上皆是","answer":true}],"remark":"〔UCP 600第14條〕"},{"id":"外匯-047","class":"外匯","sn":"047","type":"Single","question":"兌付包含下列何者?","options":[{"option":"即期付款和延期付款","answer":false},{"option":"承兌","answer":false},{"option":"以上皆是","answer":true}],"remark":"〔UCP 600第2條〕"},{"id":"外匯-048","class":"外匯","sn":"048","type":"Single","question":"求償銀行如未能自補償銀行獲得補償時,其所發生之利息須由何者負責?","options":[{"option":"開狀銀行","answer":true},{"option":"押匯銀行","answer":false},{"option":"補償銀行","answer":false}],"remark":"〔UCP 600第13條〕"},{"id":"外匯-049","class":"外匯","sn":"049","type":"Single","question":"除信用狀另有規定外,補償銀行之費用應由何者負擔?","options":[{"option":"押匯銀行","answer":false},{"option":"開狀銀行","answer":true},{"option":"通知銀行","answer":false}],"remark":"〔UCP 600第13條〕"},{"id":"外匯-050","class":"外匯","sn":"050","type":"Single","question":"除單據另有表明外,具有何者性質之單據,銀行將認其為正本而予以接受?","options":[{"option":"顯示由單據簽發人親手書寫、打字、打孔或蓋章","answer":false},{"option":"顯示係製作在單據簽發人之原始用箋上","answer":false},{"option":"以上皆是","answer":true}],"remark":"〔UCP 600第17條〕"},{"id":"外匯-051","class":"外匯","sn":"051","type":"Single","question":"信用狀要求運送單據、保險單據及商業發票以外之單據時,如信用狀未規定該等單據係由何人簽發及其措辭或其資料內容,在何種條件下,銀行將就所提示者照單接受?","options":[{"option":"其內容顯示符合所需單據之功能","answer":false},{"option":"與所提示之任何其他規定之單據彼此不相牴觸","answer":false},{"option":"以上皆是","answer":true}],"remark":"〔UCP 600第14條〕"},{"id":"外匯-052","class":"外匯","sn":"052","type":"Single","question":"除信用狀另有規定外,銀行可否接受載有簽發日期早於信用狀開發日期之單據,但以該單據係於信用狀及統一慣例所定期限內提示者為限?","options":[{"option":"可","answer":true},{"option":"不可","answer":false},{"option":"視情況","answer":false}],"remark":"〔UCP 600第14條〕"},{"id":"外匯-053","class":"外匯","sn":"053","type":"Single","question":"提單有「intended vessel」時,須於提單上以裝載註記(on board notation)表明下列何者?","options":[{"option":"貨物業已裝載之日期即可","answer":false},{"option":"裝載該等貨物之船名即可","answer":false},{"option":"裝運日期及實際船舶之名稱","answer":true}],"remark":"〔UCP 600第20條〕"},{"id":"外匯-054","class":"外匯","sn":"054","type":"Single","question":"若提單未表明信用狀敘明之裝載港為裝載港,即使提單以預先印定措辭表明貨物業已裝載於標名之船舶,仍須以裝載註記(on board notation)表明下列何者?","options":[{"option":"裝載港即可","answer":false},{"option":"裝載船名即可","answer":false},{"option":"裝載港、裝運日期及船舶名稱","answer":true}],"remark":"〔UCP 600第20條〕"},{"id":"外匯-055","class":"外匯","sn":"055","type":"Single","question":"如信用狀要求提示傭船提單,銀行將接受下述何種性質之單據?","options":[{"option":"包含任何載明其係受傭船契約規範者且就其表面顯示業經船長或船東或傭船人或代替或代表船長或船東或傭船人之標名代理人簽署","answer":false},{"option":"表明貨物業已於信用狀敘明之裝載港裝運於標名之船舶","answer":false},{"option":"以上皆是","answer":true}],"remark":"〔UCP 600第22條〕"},{"id":"外匯-056","class":"外匯","sn":"056","type":"Single","question":"下列何者為是?(A)出口押匯額度建檔應輸入F3501(核定外匯額度—新約/換約),如有保證人,於輸入L3102(從債務人資料登錄/解除)後,再執行L0159(從債務人資料查詢),相關輸入及查詢資料須列印供主管覆核(B)出口押匯於接獲開狀銀行之承兌通知及到期日時,應於E5000承兌到期日註記(C)出口押匯拒付案件之催理應陳副理核定或轉陳經理核定","options":[{"option":"A","answer":false},{"option":"BC","answer":false},{"option":"ABC","answer":true}],"remark":"〔辦理出口押匯標準作業流程(SOP)〕"},{"id":"外匯-057","class":"外匯","sn":"057","type":"Single","question":"如信用狀未要求在航空運送單據上註記實際裝運日期時,如仍有表明該日期之特殊註記,應以何種日期為其裝運日期?","options":[{"option":"簽發日期","answer":false},{"option":"註記之日期","answer":true},{"option":"飛行班次及日期欄內之日期","answer":false}],"remark":"〔UCP 600第23條〕"},{"id":"外匯-058","class":"外匯","sn":"058","type":"Single","question":"航空運送單據之功能,下列何者為非?","options":[{"option":"物權證書","answer":true},{"option":"貨物收據","answer":false},{"option":"運送契約","answer":false}],"remark":"〔國貿實務〕"},{"id":"外匯-059","class":"外匯","sn":"059","type":"Single","question":"有關本行辦理出口押匯案件,以下敘述何者為非?","options":[{"option":"受理出口押匯案件,應人工設簿並登記收件時間、公司名稱、信用狀號碼及金額後,再將押匯單據分發給各單據審核人員","answer":true},{"option":"須逐案填寫「外匯交易審查檢視表(進出口專用)」","answer":false},{"option":"外匯主管辦理出口押匯案件核章時,應確實核對信用狀背面之背書並於已押匯金額處蓋章;會計人員應核對該筆信用狀可用餘額,並於可用餘額處蓋章","answer":false}],"remark":"〔出口業務標準作業流程SOP〕"},{"id":"外匯-060","class":"外匯","sn":"060","type":"Single","question":"若信用狀規定之運送單據為「A non-negotiable copy of a bill of lading consigned to order of shipper and indicated the shipment date」,而未敘明提示期限,則相關文件應於何時提示始不構成晚提示?","options":[{"option":"裝運日後之21個曆日","answer":false},{"option":"裝運日後之21個銀行營業日","answer":false},{"option":"信用狀有效期限內","answer":true}],"remark":"〔UCP 600第14條〕"},{"id":"外匯-061","class":"外匯","sn":"061","type":"Single","question":"除信用狀特別授權外,下列何種保險單據將不予接受?","options":[{"option":"由保險公司或保險人所簽發之保險單據","answer":false},{"option":"由保險公司或保險人之代理人所簽發之保險單據","answer":false},{"option":"由保險經紀人所簽發之投保通知書","answer":true}],"remark":"〔UCP 600第28條〕"},{"id":"外匯-062","class":"外匯","sn":"062","type":"Single","question":"有關本行外匯單摺及匯票之管理,下列敘述何者為非?","options":[{"option":"櫃員向單摺保管櫃員領用單摺時,應立即詳實登載於「外匯存摺、存單、匯票領用紀錄表」,該紀錄表於使用後應保管6個月","answer":false},{"option":"每日營業終了後,保管櫃員務必以「Z0135」(重要單摺庫存明細查詢)交易查詢,列印重要單摺庫存明細並確實盤點無誤","answer":false},{"option":"會計人員應每月不定期再次清點外匯部門已領取之空白存摺、存單及匯票等,並註記於「重要單摺庫存明細查詢Z0135」妥善保管3個月備查","answer":true}],"remark":"〔106.5.25國業字第10600017771號函〕"},{"id":"外匯-063","class":"外匯","sn":"063","type":"Single","question":"如信用狀未以包裝單位或個別件數規定數量,且動支之總金額未逾信用狀金額,則貨物之數量在未逾多少上下之差額係屬容許?","options":[{"option":"3%","answer":false},{"option":"5%","answer":true},{"option":"10%","answer":false}],"remark":"〔UCP 600第30條〕"},{"id":"外匯-064","class":"外匯","sn":"064","type":"Single","question":"含一套以上運送單據之提示,下列何者將不認為是部分裝運?","options":[{"option":"同一運輸工具起運且為同一航次,如表明同一裝運日期縱目的地不同","answer":false},{"option":"同一運輸工具起運且為同一航次,如表明同一目的地縱裝運日期不同","answer":true},{"option":"同一運輸工具起運且為同一航次,如表明同一裝載港縱目的地不同","answer":false}],"remark":"〔UCP 600第31條〕"},{"id":"外匯-065","class":"外匯","sn":"065","type":"Single","question":"若信用狀修改書規定「This amendment shall enter into force unless rejected by the beneficiary within 14 days after the issuing date of this amendment」,則下列何者為是?","options":[{"option":"受益人必須在14日內表示拒絕或接受,超過14日修改書自動失效","answer":false},{"option":"因受益人未在14日內表示拒絕,修改書自動生效","answer":false},{"option":"依據受益人提示之文件是否符合修改書內容而決定修改書是否生效","answer":true}],"remark":"〔UCP 600第10條〕"},{"id":"外匯-066","class":"外匯","sn":"066","type":"Single","question":"受理客戶申請SOLA匯票掛失止付,應核對申請人身分證件及原始收據後,拍發SWIFT camt.108(或MT111)電文向國外付款行要求掛失止付,同時電腦作掛失止付交易,俟國外付款行回電確認止付後,再作退匯通知交易將該筆「匯出匯款-國外」帳轉入「其他應付款-票據掛失止付備付款」,應於多久後將款項退還申請人?","options":[{"option":"6個月","answer":true},{"option":"1年","answer":false},{"option":"2年","answer":false}],"remark":"〔外匯匯出匯款標準作業流程〕"},{"id":"外匯-067","class":"外匯","sn":"067","type":"Single","question":"信用狀裝運期間之期日用語,如:「to」、 「until」、「till」、 「from」等字及其他類似意義之文字,將解讀為下列何者?","options":[{"option":"包括所提及之期日","answer":true},{"option":"不包括所提及之期日","answer":false},{"option":"未規定","answer":false}],"remark":"〔UCP 600第3條〕"},{"id":"外匯-068","class":"外匯","sn":"068","type":"Single","question":"辦理信用狀轉讓,下列敘述何者為非?","options":[{"option":"信用狀金額及單價得予以減少","answer":false},{"option":"信用狀有效期限及提示期間得予以縮短","answer":false},{"option":"保險單據之投保百分比得予以減少,以符合信用狀規定之投保金額","answer":true}],"remark":"〔UCP 600第38條〕"},{"id":"外匯-069","class":"外匯","sn":"069","type":"Single","question":"如信用狀被轉讓予甲、乙二個第二受益人,其中第二受益人甲拒絕修改書(如:信用狀修改要求提示產地證明書),第二受益人乙接受修改書,第二受益人甲提示之單據未包含產地證明書時,是否構成瑕疵?","options":[{"option":"不構成瑕疵","answer":true},{"option":"構成瑕疵","answer":false},{"option":"以上皆非","answer":false}],"remark":"〔UCP 600第38條〕"},{"id":"外匯-070","class":"外匯","sn":"070","type":"Single","question":"A銀行開出一張信用狀指定B銀行為REIMBURSING BANK,則A銀行應向B銀行發出下列何者?","options":[{"option":"REIMBURSEMENT UNDERTAKING","answer":false},{"option":"REIMBURSEMENT CLAIM","answer":false},{"option":"REIMBURSEMENT AUTHORIZATION","answer":true}],"remark":"〔URR 725第2條〕"},{"id":"外匯-071","class":"外匯","sn":"071","type":"Single","question":"有關「補償授權」下列敘述何者為是?","options":[{"option":"信用狀以電傳方式開出,開狀銀行應以信函方式發出補償授權","answer":false},{"option":"多份補償授權可集中在一份電傳中","answer":false},{"option":"不可將信用狀或修改書之副本以取代或附加於補償授權上,倘補償銀行接獲類此文件,將不予理會","answer":true}],"remark":"〔URR 725 第6條〕"},{"id":"外匯-072","class":"外匯","sn":"072","type":"Single","question":"下列何者不應列明於補償授權中?","options":[{"option":"求償前須預先通知開狀銀行","answer":true},{"option":"額外可支付金額及寬容範圍(如有者)","answer":false},{"option":"指定之求償銀行","answer":false}],"remark":"〔URR 725第6條〕"},{"id":"外匯-073","class":"外匯","sn":"073","type":"Single","question":"在MT740上有L/C有效期限之規定,補償銀行對該日期視為何者?","options":[{"option":"視為求償之有效期限","answer":false},{"option":"視為求償之最後提示日期","answer":false},{"option":"不予理會","answer":true}],"remark":"〔URR 725第7條〕"},{"id":"外匯-074","class":"外匯","sn":"074","type":"Single","question":"補償銀行在收到補償請求之日後最多有幾個銀行營業日處理該項請求?","options":[{"option":"3個","answer":true},{"option":"7個","answer":false},{"option":"5個","answer":false}],"remark":"〔URR 725第11條〕"},{"id":"外匯-075","class":"外匯","sn":"075","type":"Single","question":"URC522規定,如未經銀行事先同意,貨運單據得否以該銀行或其指定人為受貨人?","options":[{"option":"得","answer":false},{"option":"不得","answer":true},{"option":"以上皆是","answer":false}],"remark":"〔URC522第10條〕"},{"id":"外匯-076","class":"外匯","sn":"076","type":"Single","question":"根據URC522及我國票據法規定,下列何者為非?","options":[{"option":"光票託收,部分付款得予接受,但以付款地現行法律所允許,且在其所許範圍及條件內為限","answer":false},{"option":"部分付款後,財務單據得交付付款人","answer":true},{"option":"跟單託收,部分付款僅於託收指示書特別授權得予受理","answer":false}],"remark":"〔URC522第19條〕"},{"id":"外匯-077","class":"外匯","sn":"077","type":"Single","question":"託收銀行接到拒絕付款的通知須於幾天內指示如何處理單據,否則提示銀行得逕行退回單據?","options":[{"option":"30天","answer":false},{"option":"60天","answer":true},{"option":"90天","answer":false}],"remark":"〔URC522第26條〕"},{"id":"外匯-078","class":"外匯","sn":"078","type":"Single","question":"依「本行出口押匯額度管理辦法」規定,押匯墊款每筆融通期限最長不得超過多久?","options":[{"option":"三個月","answer":false},{"option":"六個月","answer":false},{"option":"一年","answer":true}],"remark":"〔臺灣銀行股份有限公司出口押匯額度管理辦法〕"},{"id":"外匯-079","class":"外匯","sn":"079","type":"Single","question":"依「本行出口押匯額度管理辦法」規定,核定增加之臨時額度, 下列何者為是?","options":[{"option":"得併入出口押匯額度內,循環使用","answer":false},{"option":"限於核定日起三十日內動支,且不得循環使用","answer":true},{"option":"限於核定日之當月動支,且不得循環使用","answer":false}],"remark":"〔臺灣銀行股份有限公司出口押匯額度管理辦法〕"},{"id":"外匯-080","class":"外匯","sn":"080","type":"Single","question":"受理進口開狀應注意事項,下列何者為是?","options":[{"option":"全額結匯開狀案件,應以本行為受貨人,並辦妥適當種類之保險","answer":false},{"option":"對於客戶欲以微小之瑕疵或信用狀以外理由主張拒付,以規避其付款責任,開狀銀行應予以婉拒","answer":true},{"option":"信用狀運送單據為cargo receipt,亦適用UCP600第14條C項有關包含一份正本運送單據之提示其提示期間之規定","answer":false}],"remark":"〔進口實務〕"},{"id":"外匯-081","class":"外匯","sn":"081","type":"Single","question":"依「本行進口押匯額度管理辦法」規定,申請人申請開發信用狀時,應於下列何者價格條件案件辦妥以本行為受益人之保險單據?","options":[{"option":"CIF、CIP","answer":false},{"option":"C&I","answer":false},{"option":"FAS、FOB、CFR","answer":true}],"remark":"〔臺灣銀行股份有限公司進口押匯額度管理辦法〕"},{"id":"外匯-082","class":"外匯","sn":"082","type":"Single","question":"依「臺灣銀行進口融資辦法」規定,除經核定之特殊個案外,每筆融資得視其需要核定期限,但最長不得超過幾天?","options":[{"option":"60天","answer":false},{"option":"120天","answer":false},{"option":"180天","answer":true}],"remark":"〔臺灣銀行股份有限公司進口融資辦法〕"},{"id":"外匯-083","class":"外匯","sn":"083","type":"Single","question":"信用狀項下單據,受益人如未向L/C規定之指定銀行提示,而直接向開狀銀行提示,下列何者為非?","options":[{"option":"原規定在指定銀行到期之有效期限、單據提示期間將變更為在開狀銀行到期","answer":false},{"option":"如為保兌信用狀,將喪失保兌銀行之保障,保兌條款將形同失效","answer":false},{"option":"開狀銀行之拒絕單據不須於收到單據後第五個營業日終了之前儘速辦理","answer":true}],"remark":"〔UCP 600第6、8、14條〕"},{"id":"外匯-084","class":"外匯","sn":"084","type":"Single","question":"匯款pacs.008電文的匯款人相關欄位,應至少包含哪些資訊?","options":[{"option":"匯款人名稱、地址","answer":false},{"option":"匯款人名稱、扣款帳號或可查證該項匯款之「獨立序號」","answer":false},{"option":"匯款人名稱、扣款帳號或可查證該項匯款之「獨立序號」、地址","answer":true}],"remark":"〔外匯匯出匯款標準作業流程〕"},{"id":"外匯-085","class":"外匯","sn":"085","type":"Single","question":"信用狀規定drafts at 180 days after B/L date drawn on Issuing Bank,並指示銀行claim reimbursement from Reimbursing Bank at sight basis,則求償銀行應如何處理?","options":[{"option":"以即期方式向補償銀行求償","answer":true},{"option":"提單日後180天向補償銀行求償本金","answer":false},{"option":"信用狀條款自相矛盾,應請開狀銀行修改","answer":false}],"remark":"〔外匯實務〕"},{"id":"外匯-086","class":"外匯","sn":"086","type":"Single","question":"有關外匯數位存款之性質,下列敘述何者正確?","options":[{"option":"屬外匯活期存款無摺戶,以零元辦理開戶","answer":false},{"option":"同一客戶申請開立外匯數位存款帳戶以1戶為限(已開戶且未銷戶)","answer":true},{"option":"可辦理臨櫃提款業務","answer":false}],"remark":"〔外匯數位存款帳戶開戶標準作業流程(SOP)〕"},{"id":"外匯-087","class":"外匯","sn":"087","type":"Single","question":"有關外匯數位存款之開戶作業流程,下列敘述何者為非?","options":[{"option":"客戶使用之IP位址及留存的手機號碼、電子郵件或通訊地址,如有與其他客戶相同時,務必確認原因,並註明調查結果","answer":false},{"option":"拒絕受理開戶案件須由主管執行「V0287電子郵件審核發送」","answer":false},{"option":"客戶為行員親屬並留存本行員工電子郵件信箱之案件,亦可受理其開戶","answer":true}],"remark":"〔外匯數位存款帳戶開戶標準作業流程(SOP)〕"},{"id":"外匯-088","class":"外匯","sn":"088","type":"Single","question":"有關辦理自然人臨櫃申請外匯存款銷戶時(繼承案件除外),確有遺失存摺、印鑑之情事者,得採簽立「臺灣銀行存摺類存款銷戶申請書暨同意書(自然人適用)」辦理,下列辦理情形何者為非?","options":[{"option":"執行Q40銷戶交易,摘要欄須選擇「JMS 掛失銷戶」作業","answer":false},{"option":"須將銷戶申請同意書(正面)、印鑑卡(正、反面),掃描至「身分證基本資料影像掃描開戶作業系統」妥善保存","answer":false},{"option":"限存款餘額未達等值新臺幣1萬元者始可受理","answer":true}],"remark":"〔外匯存款解約結清銷戶標準作業流程(SOP)〕"},{"id":"外匯-089","class":"外匯","sn":"089","type":"Single","question":"本行開出一張Shipment from New York to Keelung之L/C後,進口商申請修改PRICE TERM由原來之FOB變更為CIF,則應修改那些條款?","options":[{"option":"PRICE TERM 改為CIF NEW YORK,B/L改為FREIGHT COLLECT,刪除保險單據條款","answer":false},{"option":"PRICE TERM 改為CIF KEELUNG,B/L改為FREIGHT PREPAID,增加保險單據條款","answer":true},{"option":"PRICE TERM 改為CIF NEW YORK,B/L改為FREIGHT PREPAID,增加保險單據條款","answer":false}],"remark":"〔Incoterms 2020〕"},{"id":"外匯-090","class":"外匯","sn":"090","type":"Single","question":"辦理「副提單背書」,下列何者為非?","options":[{"option":"應注意債權的確保","answer":false},{"option":"應追蹤單據是否寄達","answer":false},{"option":"應向船公司換回擔保提貨書","answer":true}],"remark":"〔進口業務標準作業流程〕"},{"id":"外匯-091","class":"外匯","sn":"091","type":"Single","question":"依信用狀統一慣例規定,除信用狀另有要求外,商業發票無須簽署,當信用狀規定〝a certificate is required on the Commercial Invoice〞,則該商業發票須如何處理?","options":[{"option":"須Dated不須Signed","answer":false},{"option":"不須Dated但要Signed","answer":false},{"option":"必須Dated & Signed" 易金額尚具浮動性,得不將寬容度納入投保金額","answer":false},{"option":"保險金額應為貨物價額或發票金額之110%,如信用狀訂有金額寬容度,應將增加之寬容度納入投保金額","answer":true},{"option":"因屬買方投保案件,保險利益歸屬買方,無須要求以本行為受益人辦理保險","answer":false}],"remark":"〔外匯實務〕"},{"id":"外匯-099","class":"外匯","sn":"099","type":"Single","question":"承作讓購(NEGOTIATION)的銀行一定不是下列何者?","options":[{"option":"通知銀行","answer":false},{"option":"保兌銀行","answer":false},{"option":"開狀銀行","answer":true}],"remark":"〔UCP 600第7條〕"},{"id":"外匯-100","class":"外匯","sn":"100","type":"Single","question":"依「本行出口押匯額度管理辦法」規定,核定增加之臨時額度,最高在原額度多少範圍內?","options":[{"option":"二分之一","answer":false},{"option":"三分之一","answer":true},{"option":"衡酌客戶當次需求,無限制","answer":false}],"remark":"〔臺灣銀行股份有限公司出口押匯額度管理辦法〕"},{"id":"外匯-101","class":"外匯","sn":"101","type":"Single","question":"出口商所製作之單據,如其相互間之簽章不一致,則下列何者為是?","options":[{"option":"構成瑕疵","answer":false},{"option":"不構成瑕疵","answer":true},{"option":"構成單據間之歧異","answer":false}],"remark":"〔UCP 600第14條〕"},{"id":"外匯-102","class":"外匯","sn":"102","type":"Single","question":"A公司提示符合信用狀條款之單據向信用狀指定之甲銀行請求承兌,經其承兌後,卻未於到期日為付款,此時下列何者正確?","options":[{"option":"A公司將因此喪失其取得款項之權利","answer":false},{"option":"A公司可另開立匯票以開狀銀行為付款人,請求其承兌","answer":false},{"option":"A公司可請開狀銀行付款","answer":true}],"remark":"〔UCP 600第7條〕"},{"id":"外匯-103","class":"外匯","sn":"103","type":"Single","question":"第一受益人憑國外開來之Master L/C,至本行申請開發Back to Back L/C,因本行通常在轉開之信用狀上會註明「This credit is subject to the final payment of the Master Credit」,因此下列何者為是?","options":[{"option":"本行不負任何風險","answer":false},{"option":"本行應負開狀銀行之責任","answer":true},{"option":"視第一受益人之信用情形而定","answer":false}],"remark":"〔UCP 600第7條〕"},{"id":"外匯-104","class":"外匯","sn":"104","type":"Single","question":"依UCP 600之規定,Citibank, New York Branch將認其在何地之分行為不同之銀行(Separate Bank)?","options":[{"option":"Seattle","answer":false},{"option":"Chicago","answer":false},{"option":"Taipei","answer":true}],"remark":"〔UCP 600第3條〕"},{"id":"外匯-105","class":"外匯","sn":"105","type":"Single","question":"開狀銀行於9月8日簽發修改書,委由通知銀行通知受益人,受益人於9月11日收到修改書,開狀銀行於何時起受該修改書不可撤銷之拘束 :"自然人與法人","answer":false}],"remark":""},{"id":"外匯-162","class":"外匯","sn":"162","type":"Single","question":"有關衍生性金融商品客戶風險屬性評估之敘述,何者正確?","options":[{"option":"專業機構投資人與高淨值投資法人需每年定期辦理風險屬性評估作業","answer":false},{"option":"法人客戶申請衍生性金融商品額度期限為兩年者,其風險屬性評估作業得每兩年辦理一次","answer":false},{"option":"擬承作遠匯、換匯交易以外之衍生性金融商品客戶,其風險屬性評估作業由財務部符合衍生性金融商品業務經辦資格之法金行銷人員辦理,評估完成後交由營業單位建檔並留存備查","answer":true}],"remark":"〔營業單位申請衍生性金融商品額度標準作業流程〕"},{"id":"外匯-163","class":"外匯","sn":"163","type":"Single","question":"下列叙述何者正確?","options":[{"option":"選擇權買方支付權利金,取得執行選擇權之權利","answer":true},{"option":"選擇權賣方支付權利金,取得執行選擇權之權利","answer":false},{"option":"選擇權買方支付權利金,有被執行選擇權之義務","answer":false}],"remark":""},{"id":"外匯-164","class":"外匯","sn":"164","type":"Single","question":"客戶賣給本行三個月期美元買權/新台幣賣權名目本金USD1,000,000,三個月期USD/TWD匯率風險權數為4.7%,則本筆交易客戶所需信用額度為何?","options":[{"option":"USD47,000","answer":true},{"option":"USD94,000","answer":false},{"option":"USD470,000","answer":false}],"remark":""},{"id":"外匯-165","class":"外匯","sn":"165","type":"Multi","question":"申報義務人應於檢附所填申報書及相關證明文件,經由銀行業向中央銀行申請核准後,始得辦理新臺幣結匯,有關其結匯金額下列何者為是?","options":[{"option":"個人、團體每年累積結購或結售金額超過等值一千萬美元之必要性匯款","answer":true},{"option":"公司、行號每年累積結購或結售金額超過等值一億美元之必要性匯款","answer":true},{"option":"非居住民每筆結匯金額超過等值十萬美元之匯款","answer":true}],"remark":"〔外匯收支或交易申報辦法、中央銀行113.11.01台央外伍字第1130041114號函、113.11.05銀國際乙字第11301164411號函〕"},{"id":"外匯-166","class":"外匯","sn":"166","type":"Multi","question":"客戶填寫外匯收支或交易申報書時,下列敘述何者為是?","options":[{"option":"如為他人代填案件,仍須由申報義務人確認申報事項無誤後簽名或蓋章,以明責任","answer":true},{"option":"結匯性質應詳實填報,得以匯款分類編號替代之","answer":false},{"option":"申報書之金額不得更改,其他項目如經更改,應請申報義務人加蓋印章或由本人簽字","answer":true}],"remark":"〔銀行業輔導客戶申報外匯收支或交易應注意事項〕"},{"id":"外匯-167","class":"外匯","sn":"167","type":"Multi","question":"承作自然人辦理人民幣跨境匯款至大陸地區,下列何者無法辦理?","options":[{"option":"領有我國國民身分證之個人","answer":false},{"option":"持中華民國臺灣地區居留證者","answer":true},{"option":"持外國護照之外國人","answer":true}],"remark":"〔銀行業辦理外匯業務管理辦法第五十二條〕"},{"id":"外匯-168","class":"外匯","sn":"168","type":"Multi","question":"本行辦理買入光票業務,對於未核給申請人買入光票額度之買入限額規定,下列何者為是?","options":[{"option":"公司、行號或團體每筆最高限額為等值美金五萬元","answer":true},{"option":"自然人每筆最高限額為等值美金五千元","answer":true},{"option":"公營事業或政府機關每筆最高限額為等值美金十萬元","answer":false}],"remark":"〔本行買入外幣光票處理要點〕"},{"id":"外匯-169","class":"外匯","sn":"169","type":"Multi","question":"下列敘述何者為非?","options":[{"option":"本行買入美國境外地區不流通之美鈔券(即舊版),每1美元收取新臺幣0.3元之處理費,倘客戶提示本人原購買之結匯水單,得免收舊版處理費","answer":true},{"option":"美鈔以外之雜幣破污損券,得以託收方式處理,每張收取新臺幣100元之手續費","answer":true},{"option":"客戶持舊版美鈔券兌換國際流通之美鈔券,依本行當日牌告之美元現金買出、買入價差收取費用,每筆最低TWD100,不再加收舊版處理費","answer":false}],"remark":"〔臺灣銀行收兌舊版外幣現鈔、破污損券及受理託收等業務之收費標準一覽表〕"},{"id":"外匯-170","class":"外匯","sn":"170","type":"Multi","question":"有關經由本行買入或託收之光票,下列敘述何者為是?","options":[{"option":"須經票載之受款人背書","answer":true},{"option":"所有受理之票據在寄出前均須加蓋本行之擔保背書章","answer":true},{"option":"票據正反面攝影或影印存檔","answer":true}],"remark":"〔光票買入及託收標準作業流程〕"},{"id":"外匯-171","class":"外匯","sn":"171","type":"Multi","question":"為避免偽鈔詐騙及加強防制洗錢,本行對於收受美金現鈔設立收受額度,以下何者為是?","options":[{"option":"一般分行之櫃員對於個人戶每次收受限額為美金30,000元(含)","answer":false},{"option":"超過櫃員收受額度,在美金100,000元(含)以內需經營業單位主管或單位主管授權之各級主管同意","answer":true},{"option":"如逾美金100,000元,應透過營業部出納科以託收方式辦理,俟該等款項入帳後,再支付予客戶","answer":true}],"remark":"〔105.3.31國際乙字第10500011671號函〕"},{"id":"外匯-172","class":"外匯","sn":"172","type":"Multi","question":"依本行「外匯定期存單質借作業要點」規定,下列敘述何者為是?","options":[{"option":"申請質借人限原存款人,且質借幣別以原存款幣別為限","answer":true},{"option":"質借期限最長不得超過原存款到期日","answer":true},{"option":"質借額度最高不得超過存單金額之八成,且質借之外幣並應撥入該借款人之同幣別外匯活期存款帳戶","answer":false}],"remark":"〔本行外匯定期存單質借作業要點〕"},{"id":"外匯-173","class":"外匯","sn":"173","type":"Multi","question":"有關外匯綜合存款業務,下列敘述何者為是?","options":[{"option":"外匯綜合存款未經本行同意,不得轉讓或設定質權予第三人","answer":false},{"option":"外匯綜合存款戶得在原定期存款相同幣別之九成之範圍或不同幣別之八成範圍內質借","answer":true},{"option":"外匯市場變動激烈時,本行得暫停辦理不同幣別之質借與不同幣別間兌換之存取款","answer":true}],"remark":"〔本行外匯綜合存款辦法〕"},{"id":"外匯-174","class":"外匯","sn":"174","type":"Multi","question":"指定銀行辦理大陸地區人民合法繼承或領受臺灣地區人民遺產、軍公教及公營事業機關(構)人員保險死亡給付、撫卹(慰)金、餘額退伍金及其衍生孳息之匯款,下列何者為是?","options":[{"option":"大陸地區人民合法繼承臺灣地區人民遺產,每人匯出金額不得逾新臺幣二百萬元之等值外幣,但大陸地區人民為我國國民配偶者不在此限","answer":true},{"option":"保險死亡給付、撫卹(慰)金、餘額退伍金總額,匯出金額不得逾新臺幣三百萬元之等值外幣","answer":false},{"option":"匯款人為大陸地區繼承人或在臺代理人","answer":true}],"remark":"〔銀行業受理對大陸地區匯出匯款及匯入匯款申報案件應確認事項〕"},{"id":"外匯-175","class":"外匯","sn":"175","type":"Multi","question":"Standby L/C與Commercial L/C之差異,下列何者為是?","options":[{"option":"L/C未註明時,前者可撤銷,後者不可撤銷","answer":false},{"option":"前者以不動支為常態,後者以動支為常態","answer":true},{"option":"前者為保證債務之償還、契約之履行等,後者為支付貨款","answer":true}],"remark":"〔UCP 600第1條〕"},{"id":"外匯-176","class":"外匯","sn":"176","type":"Multi","question":"如信用狀要求〝insurance against all risks 〞(投保全險),銀行將接受下列何者之保險單據?","options":[{"option":"含有任何〝all risks 〞(全險)之註記或條款之保險單據,不論其有無冠以〝全險〞之標題","answer":true},{"option":"保險單據含有任何〝 all risks 〞(全險)之註記或條款,即使其表明某些險別已排除","answer":true},{"option":"保險單據表明投保倫敦保險協會貨物條款ICC(A)","answer":true}],"remark":"〔UCP 600第28條及ISBP745 K18〕"},{"id":"外匯-177","class":"外匯","sn":"177","type":"Multi","question":"匯出匯款pacs.008電文的匯款人相關欄位,應至少包含哪些資訊?","options":[{"option":"匯款人姓名","answer":true},{"option":"扣款帳號或可查證該項匯款之「獨立序號」","answer":true},{"option":"匯款人地址","answer":true}],"remark":"〔108.6.24國業字第10800025881號、外匯匯出匯款標準作業流程(SOP)]"},{"id":"外匯-178","class":"外匯","sn":"178","type":"Multi","question":"有關私立就業服務機構代理外籍勞工結匯在臺薪資匯款(簡稱「外勞仲介代理匯款」),以下敘述何者正確?","options":[{"option":"以逐筆匯款至各最終受款人帳戶之方式受理","answer":true},{"option":"為求作業效率,可以打包方式進行(即以單筆彙總金額方式結匯匯款至當地單一受款人帳戶,再由該受款人進行後續逐筆交付給外勞指定之最終受款人)","answer":false},{"option":"請客戶原則上於同一家分行進行代理外勞匯款,以利分行後續追蹤與持續監控作業","answer":true}],"remark":"〔108.8.27國業字第10800033991號]"},{"id":"外匯-179","class":"外匯","sn":"179","type":"Multi","question":"如信用狀要求提示〝Inspection Certificate in duplicate〞,下列何者為是?","options":[{"option":"須提示一份正本及一份副本檢驗證明書","answer":true},{"option":"檢驗證明書簽發日期得晚於裝運日期,但不可遲於提示日","answer":true},{"option":"證明貨物已經檢驗,且資料內容不與其他規定單據相牴觸者,即視為符合信用狀之規定","answer":true}],"remark":"〔UCP 600第14條、17條及ISBP745 Q2〕"},{"id":"外匯-180","class":"外匯","sn":"180","type":"Multi","question":"提示瑕疵單據遭開狀銀行拒付,實務上受益人可以補正或重新製作正確單據以替換原來瑕疵單據,以符合信用狀之條款,下列何者為是?","options":[{"option":"該替換單據須於信用狀有效期限內提示","answer":true},{"option":"替換之前須先取得開狀銀行之許可","answer":false},{"option":"須注意信用狀所規定之單據提示期間之限制","answer":true}],"remark":"〔UCP 600第6、14條〕"},{"id":"外匯-181","class":"外匯","sn":"181","type":"Multi","question":"下列何者將構成單據瑕疵?","options":[{"option":"Commercial Invoice另標示Sample的數量,但規定為免費(Free of charge)","answer":true},{"option":"Commercial Invoice另標示discount charge,但Net Amount不超過信用狀金額","answer":false},{"option":"Commercial Invoice表明信用狀規定之貿易條件所顯示之價值以外的費用或成本","answer":true}],"remark":"〔ISBP745 C7、C12〕"},{"id":"外匯-182","class":"外匯","sn":"182","type":"Multi","question":"開狀銀行若決定拒付,則應注意下列何者?","options":[{"option":"若本筆單據係由其他分行代收再轉交本分行者,應自本分行收到單據後第5個營業日終了前迅速電傳通知拒付","answer":false},{"option":"於拒付電文中應敘明拒絕兌付","answer":true},{"option":"如寄單銀行於其 Covering  Letter已列明一切瑕疵者,仍必須於拒付電文中應敘明有關之各項瑕疵","answer":true}],"remark":"〔UCP 600第16條〕"},{"id":"外匯-183","class":"外匯","sn":"183","type":"Multi","question":"依UCP600規定,銀行將接受下述何種性質之運送單據?","options":[{"option":"表明貨物裝載或將裝載於甲板上","answer":false},{"option":"載有〝託運人自行裝貨點數〞及〝據託運人稱內裝〞之條款","answer":true},{"option":"以信用狀受益人以外之人為貨物之發貨人","answer":true}],"remark":"〔UCP 600第14、26條〕"},{"id":"外匯-184","class":"外匯","sn":"184","type":"Multi","question":"信用狀統一慣例中,有關信用狀之轉讓,下列何者為是?","options":[{"option":"銀行除依其明示同意之範圍及方式外,無義務轉讓信用狀","answer":true},{"option":"第二受益人可申請再作轉讓予隨後之任何受益人","answer":false},{"option":"除於轉讓當時另有約定外,有關轉讓所發生之ㄧ切費用(諸如手續費、規費、工本費或支出),須由第一受益人負擔","answer":true}],"remark":"〔UCP 600第38條〕"},{"id":"外匯-185","class":"外匯","sn":"185","type":"Multi","question":"信用狀統一慣例中,有關款項之讓與,下列何者為是?","options":[{"option":"信用狀必須表示可轉讓之事實","answer":false},{"option":"係指受益人依準據法之規定,將其於該信用狀下可得或將得款項讓與之權利","answer":true},{"option":"該款項之讓與,與信用狀項下權利行使之讓與無關","answer":true}],"remark":"〔UCP 600第39條〕"},{"id":"外匯-186","class":"外匯","sn":"186","type":"Multi","question":"依「本行出口押匯額度管理辦法」/「本行進口押匯額度管理辦法」規定,出、進口押匯額度之核定,下列何者正確?","options":[{"option":"應每年重新核定一次","answer":true},{"option":"申請人需用額度超過營業單位主管權限時,依授信作業程序專案報請總行核定","answer":true},{"option":"對資信良好、往來正常或提供足額擔保之客戶得二年核定一次","answer":true}],"remark":"〔臺灣銀行股份有限公司出、進口押匯額度管理辦法〕"},{"id":"外匯-187","class":"外匯","sn":"187","type":"Multi","question":"信用狀及修改書之通知,下列何者為是?","options":[{"option":"通知銀行於收到完整且明確之指示後,即必須辦理該信用狀之通知","answer":false},{"option":"銀行受託通知信用狀或修改書,但選擇不通知時,則須將此意旨儘速告知所由收受信用狀、修改書或通知書之銀行","answer":true},{"option":"銀行受託通知信用狀或修改書,但無法確信該信用狀、修改書或通知書外觀之真實性時,則須將此意旨儘速告知外觀上顯示所由收受指示之銀行,若通知銀行或第二通知銀行仍選擇通知,則須告知受益人或第二通知銀行其無法確信該信用狀、修改書或通知書外觀之真實性","answer":true}],"remark":"〔UCP 600第9條〕"},{"id":"外匯-188","class":"外匯","sn":"188","type":"Multi","question":"依「辦理銀行同業所開信用狀保兌作業要點」規定,本行保兌之對象,下列何者為是?","options":[{"option":"限與本行建有通匯關係者","answer":true},{"option":"世界銀行排名之認定,以英國「銀行家」雜誌最近一年按第一類資本額多寡之排名為準","answer":true},{"option":"未列入世界排名之銀行,不得敘作","answer":false}],"remark":"〔臺灣銀行股份有限公司辦理銀行同業所開信用狀保兌作業要點〕"},{"id":"外匯-189","class":"外匯","sn":"189","type":"Multi","question":"依「辦理銀行同業所開信用狀保兌作業要點」規定,下列何者為是?","options":[{"option":"辦理本業務之各同業最高額度及其國家風險額度(本國同業除外)控管事宜,由國際部統籌辦理","answer":true},{"option":"各營業單位擬承作時,應先電洽國際部核配額度後辦理","answer":true},{"option":"若保兌對象未與本行建有通匯關係,由營業單位簽具擬承作意見,提報國際部依各核定階層授權額度核定","answer":false}],"remark":"〔臺灣銀行股份有限公司辦理銀行同業所開信用狀保兌作業要點〕"},{"id":"外匯-190","class":"外匯","sn":"190","type":"Multi","question":"如信用狀規定Payment under reserve prohibited,而出口商之單據又有瑕疵,則押匯銀行宜以何種方式處理單據?","options":[{"option":"由受益人出具切結書而給予融通辦理押匯","answer":false},{"option":"電詢開狀銀行,俟授權後再辦理押匯","answer":true},{"option":"先寄單據,俟開狀行付款後再行撥款","answer":true}],"remark":"〔外匯實務〕"},{"id":"外匯-191","class":"外匯","sn":"191","type":"Multi","question":"若單據之提示經審核後決定係屬符合,則下列何者為是?","options":[{"option":"開狀銀行必須為兌付","answer":true},{"option":"保兌銀行必須為兌付或讓購,並將單據寄送開狀銀行","answer":true},{"option":"指定銀行於兌付或讓購後應將單據寄送保兌銀行或開狀銀行","answer":true}],"remark":"〔UCP 600第15條〕"},{"id":"外匯-192","class":"外匯","sn":"192","type":"Multi","question":"有關本行臺外幣現鈔兌換機之作業方式,下列敘述何者為是?","options":[{"option":"新臺幣現鈔兌換外幣現鈔","answer":true},{"option":"外幣現鈔兌換新臺幣現鈔","answer":true},{"option":"持本國銀行晶片金融卡結購提領外幣現鈔,並自該卡所屬新臺幣帳戶內自動扣取等值新臺幣款項","answer":true}],"rema <script>
(function(){
"use strict";

/* ---------- storage wrapper ----------
   Uses Claude's window.storage when available (in-chat use).
   Falls back to localStorage automatically when the file is opened
   standalone in a phone/desktop browser, so progress still persists. */
var LS_PREFIX = 'examprep::';
function lsGet(key){
  try { return localStorage.getItem(LS_PREFIX+key); } catch(e){ return null; }
}
function lsSet(key, value){
  try {
    if (value === '' || value === null || value === undefined) localStorage.removeItem(LS_PREFIX+key);
    else localStorage.setItem(LS_PREFIX+key, value);
  } catch(e){ /* storage unavailable (e.g. private mode) - ignore */ }
}
var Store = {
  get: function(key, shared){
    shared = !!shared;
    if (window.storage){
      return window.storage.get(key, shared)
        .then(function(r){ return r ? r.value : null; })
        .catch(function(){ return lsGet(key); });
    }
    return Promise.resolve(lsGet(key));
  },
  set: function(key, value, shared){
    shared = !!shared;
    if (window.storage){
      return window.storage.set(key, value, shared)
        .then(function(){ return true; })
        .catch(function(){ lsSet(key, value); return true; });
    }
    lsSet(key, value);
    return Promise.resolve(true);
  }
};

var BANK_KEY = 'examprep-bank-v1';
var PROGRESS_KEY = 'examprep-progress-v1';
var SESSION_KEY = 'examprep-session-v1';
var DARKMODE_KEY = 'examprep-darkmode-v1';
var SETUP_DONE_KEY = 'examprep-setup-done-v1';

/* ---------- data holders ---------- */
var ALL = [];
var CLASS_ORDER = [];
var CLASS_COUNTS = {};
var BY_ID = {};

var STATE = {
  screen: 'import', // import | setup | quiz | results
  selectedClasses: {},
  setup: {
    types: { Single:true, Multi:true },
    randomOrder: false,
    randomOptions: false
  },
  quiz: null,
  wrongBank: [],
  seenBank: [],
  cumulative: { answered:0, correct:0 },
  textScale: 1,
  importMessage: '',
  importIsError: false,
  results: null,
  darkMode: false,
  explanationOpen: {},
  jumpPanelOpen: false,
  jumpSelectedClass: null,
  setupConfigured: false,
  showFullSetup: false
};

/* ---------- indexing ---------- */
var REMARK_INDEX = {}; // REMARK_INDEX[class][normalizedRemark] = [sn, sn, ...] (questions sharing the same citation)

function normalizeRemarkKey(s){
  if (!s) return '';
  s = s.toString().trim();
  // strip one leading/trailing bracket of any common style so 【..】〔..〕[..](..)（..） all group together
  s = s.replace(/^[\u3010\u3014\[\(\uFF08]+/, '');
  s = s.replace(/[\u3011\u3015\]\)\uFF09]+$/, '');
  return s.trim();
}

function rebuildIndexes(){
  CLASS_ORDER = [];
  CLASS_COUNTS = {};
  BY_ID = {};
  REMARK_INDEX = {};
  ALL.forEach(function(q){
    if(!(q.class in CLASS_COUNTS)){ CLASS_COUNTS[q.class]=0; CLASS_ORDER.push(q.class); }
    CLASS_COUNTS[q.class]++;
    BY_ID[q.id]=q;
    var key = normalizeRemarkKey(q.remark);
    if (key){
      if (!REMARK_INDEX[q.class]) REMARK_INDEX[q.class] = {};
      if (!REMARK_INDEX[q.class][key]) REMARK_INDEX[q.class][key] = [];
      REMARK_INDEX[q.class][key].push(q.sn);
    }
  });
  CLASS_ORDER.forEach(function(c){ if(!(c in STATE.selectedClasses)) STATE.selectedClasses[c]=true; });
  STATE.wrongBank = (STATE.wrongBank||[]).filter(function(id){ return id in BY_ID; });
  STATE.seenBank = (STATE.seenBank||[]).filter(function(id){ return id in BY_ID; });
}

function relatedSnList(q){
  if (!q || !q.remark) return [];
  var key = normalizeRemarkKey(q.remark);
  var group = (REMARK_INDEX[q.class] && REMARK_INDEX[q.class][key]) || [];
  return group.filter(function(sn){ return sn !== q.sn; });
}

function indexOfQuestionInQuiz(quiz, cls, sn){
  var target = parseInt(sn, 10);
  var targetIsNum = !isNaN(target);
  for (var i=0;i<quiz.questions.length;i++){
    var qq = quiz.questions[i];
    if (qq.class!==cls) continue;
    if (qq.sn===sn) return i;
    if (targetIsNum && parseInt(qq.sn,10)===target) return i;
  }
  return -1;
}

/* ---------- normalization / parsing ---------- */
function toBool(v){
  if (v === true) return true;
  if (v === false || v === undefined || v === null) return false;
  var s = v.toString().trim().toLowerCase();
  return s === 'true' || s === '1' || s === 'y' || s === 'yes' || s === '對' || s === '是';
}

function csvRowToQuestion(row){
  if (!row) return null;
  function get(){
    for (var i=0;i<arguments.length;i++){
      var k = arguments[i];
      if (row[k] !== undefined && row[k] !== null && row[k].toString().trim() !== '') return row[k];
    }
    return '';
  }
  var cls = get('科目','class','Class').toString().trim();
  var sn = get('題號','sn','SN').toString().trim();
  var typeRaw = get('題型','type','Type').toString().trim();
  var type = /Multi|複選/i.test(typeRaw) ? 'Multi' : 'Single';
  var question = get('題目','question','Question').toString().trim();
  var opt1 = get('選項1','option1','選項一').toString().trim();
  var opt2 = get('選項2','option2','選項二').toString().trim();
  var opt3 = get('選項3','option3','選項三').toString().trim();
  var opt4 = get('選項4','option4','選項四').toString().trim();
  var optTexts = [opt1,opt2,opt3,opt4].filter(function(s){ return s.length>0; });
  var correctRaw = get('正確答案(選項編號)','正確答案','answer','Answer').toString();
  var correctNums = correctRaw.split(/[,，、\s]+/).map(function(s){ return parseInt(s,10); }).filter(function(n){ return !isNaN(n); });
  var options = optTexts.map(function(t,i){ return { option:t, answer: correctNums.indexOf(i+1)>=0 }; });
  var remark = get('法源依據/備註','備註','法源依據','remark','Remark').toString().trim();
  var explanation = get('答案解釋','解釋','explanation','Explanation').toString().trim();
  if (!cls || !sn || !question || options.length<2) return null;
  return { id: cls+'-'+sn, class:cls, sn:sn, type:type, question:question, options:options, remark:remark, explanation:explanation };
}

function normalizeItem(item){
  if (!item || typeof item !== 'object') return null;
  if (Array.isArray(item.options) && item.options.length && typeof item.options[0] === 'object' && ('option' in item.options[0] || 'text' in item.options[0])){
    var cls = (item.class||item['科目']||'').toString().trim();
    var sn = (item.sn||item['題號']||'').toString().trim();
    var typeRaw = (item.type||item['題型']||'Single').toString().trim();
    var type = /Multi|複選/i.test(typeRaw) ? 'Multi' : 'Single';
    var question = (item.question||item['題目']||'').toString().trim();
    var options = item.options.map(function(o){
      return { option:(o.option!==undefined?o.option:o.text||'').toString().trim(), answer: toBool(o.answer) };
    }).filter(function(o){ return o.option.length>0; });
    var remark = (item.remark!==undefined?item.remark:(item['法源依據/備註']||item['備註']||'')).toString().trim();
    var explanation = (item.explanation!==undefined?item.explanation:(item['答案解釋']||item['解釋']||'')).toString().trim();
    if (!cls || !sn || !question || options.length<2) return null;
    return { id: cls+'-'+sn, class:cls, sn:sn, type:type, question:question, options:options, remark:remark, explanation:explanation };
  }
  return csvRowToQuestion(item);
}

function parseCSVText(text){
  if (!window.Papa) return [];
  var res = Papa.parse(text, { header:true, skipEmptyLines:true });
  return (res.data||[]).map(normalizeItem).filter(Boolean);
}

function parseTXTText(text){
  var lines = text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  var out = [];
  for (var i=0;i<lines.length;i++){
    try {
      var obj = JSON.parse(lines[i]);
      var q = normalizeItem(obj);
      if (q) out.push(q);
    } catch(e){ /* skip malformed line */ }
  }
  return out;
}

function parseJSONText(text){
  var data;
  try { data = JSON.parse(text); } catch(e){ return []; }
  var arr = Array.isArray(data) ? data
    : (data && Array.isArray(data.questions)) ? data.questions
    : (data && Array.isArray(data.data)) ? data.data
    : [];
  return arr.map(normalizeItem).filter(Boolean);
}

function parseXLSXBuffer(buf){
  if (!window.XLSX) return [];
  var wb = XLSX.read(buf, { type:'array' });
  var sheet = wb.Sheets[wb.SheetNames[0]];
  var rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
  return rows.map(normalizeItem).filter(Boolean);
}

function mergeQuestions(items){
  var map = {};
  ALL.forEach(function(q){ map[q.id]=q; });
  items.forEach(function(q){ map[q.id]=q; });
  ALL = Object.keys(map).map(function(k){ return map[k]; });
  rebuildIndexes();
}

function persistBank(){ return Store.set(BANK_KEY, JSON.stringify(ALL), false); }

function finishImport(items, fileName){
  if (!items || items.length===0){
    STATE.importMessage = '「'+escapeHtml(fileName)+'」未解析出有效題目，請確認欄位是否包含 科目/題號/題型/題目/選項1-3/正確答案(選項編號)。';
    STATE.importIsError = true;
    render();
    return;
  }
  var before = ALL.length;
  mergeQuestions(items);
  var added = ALL.length - before;
  STATE.importMessage = '已從「'+escapeHtml(fileName)+'」匯入 '+items.length+' 題（新增 '+added+' 題，題庫共 '+ALL.length+' 題）';
  STATE.importIsError = false;
  STATE.screen = 'setup';
  persistBank();
  render();
}

function handleFile(file){
  if (!file) return;
  var name = file.name.toLowerCase();
  var isExcel = /\.(xlsx|xls)$/.test(name);
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var items = [];
      if (isExcel){
        items = parseXLSXBuffer(e.target.result);
      } else {
        var text = e.target.result;
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        if (/\.json$/.test(name)){
          items = parseJSONText(text);
        } else if (/\.csv$/.test(name)){
          items = parseCSVText(text);
        } else {
          items = parseTXTText(text);
          if (items.length===0) items = parseCSVText(text);
          if (items.length===0) items = parseJSONText(text);
        }
      }
      finishImport(items, file.name);
    } catch(err){
      STATE.importMessage = '匯入失敗：「'+escapeHtml(file.name)+'」解析發生錯誤（'+escapeHtml(err.message||'')+'）';
      STATE.importIsError = true;
      render();
    }
  };
  reader.onerror = function(){
    STATE.importMessage = '匯入失敗：無法讀取「'+escapeHtml(file.name)+'」';
    STATE.importIsError = true;
    render();
  };
  if (isExcel) reader.readAsArrayBuffer(file); else reader.readAsText(file,'UTF-8');
}

/* ---------- helpers ---------- */
function escapeHtml(s){
  return (s===undefined||s===null?'':s.toString()).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function shuffle(arr){
  var a = arr.slice();
  for (var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function selectedClassList(){
  return CLASS_ORDER.filter(function(c){ return STATE.selectedClasses[c]; });
}
function selectedTotal(){
  var classes = selectedClassList();
  var types = STATE.setup.types;
  return ALL.filter(function(q){
    return classes.indexOf(q.class)>=0 && types[q.type];
  }).length;
}

/* ---------- quiz lifecycle ---------- */
function startQuiz(){
  var classes = selectedClassList();
  var types = STATE.setup.types;
  var pool = ALL.filter(function(q){ return classes.indexOf(q.class)>=0 && types[q.type]; });
  if (pool.length===0) return;
  if (STATE.setup.randomOrder) pool = shuffle(pool);
  var chosen = pool.map(function(q){
    var opts = q.options.map(function(o){ return {option:o.option, answer:o.answer}; });
    if (STATE.setup.randomOptions) opts = shuffle(opts);
    return { id:q.id, class:q.class, sn:q.sn, type:q.type, question:q.question, remark:q.remark, explanation:q.explanation, options:opts };
  });
  STATE.quiz = {
    questions: chosen,
    index: 0,
    selections: {}, // id -> array of selected indices
    submitted: {}, // id -> true
    recordedIds: [],
    startedAt: Date.now()
  };
  STATE.screen = 'quiz';
  STATE.jumpPanelOpen = false;
  STATE.jumpSelectedClass = null;
  STATE.setupConfigured = true;
  STATE.showFullSetup = false;
  Store.set(SETUP_DONE_KEY, 'true', false);
  saveSession();
  render();
}

function startWrongReview(){
  var ids = STATE.wrongBank.filter(function(id){ return id in BY_ID; });
  if (ids.length===0) return;
  var qs = shuffle(ids).map(function(id){
    var q = BY_ID[id];
    var opts = q.options.map(function(o){ return {option:o.option, answer:o.answer}; });
    return { id:q.id, class:q.class, sn:q.sn, type:q.type, question:q.question, remark:q.remark, explanation:q.explanation, options:shuffle(opts) };
  });
  STATE.quiz = {
    questions:qs, index:0, selections:{}, submitted:{}, recordedIds:[],
    startedAt: Date.now()
  };
  STATE.screen = 'quiz';
  STATE.jumpPanelOpen = false;
  STATE.jumpSelectedClass = null;
  saveSession();
  render();
}

function formatTime(sec){
  sec = Math.max(0,sec);
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

function currentQuestion(){
  if (!STATE.quiz) return null;
  return STATE.quiz.questions[STATE.quiz.index];
}

function gradeAndRecord(q){
  var quiz = STATE.quiz;
  if (quiz.recordedIds.indexOf(q.id)>=0) return;
  quiz.recordedIds.push(q.id);
  var sel = quiz.selections[q.id]||[];
  var correctIdx = [];
  q.options.forEach(function(o,i){ if(o.answer) correctIdx.push(i); });
  var isCorrect = sel.length===correctIdx.length && sel.every(function(i){ return correctIdx.indexOf(i)>=0; });
  STATE.cumulative.answered++;
  if (isCorrect) STATE.cumulative.correct++;
  var wbIdx = STATE.wrongBank.indexOf(q.id);
  if (!isCorrect){
    if (wbIdx<0) STATE.wrongBank.push(q.id);
  }
  if (STATE.seenBank.indexOf(q.id)<0) STATE.seenBank.push(q.id);
  saveProgress();
}

function toggleOption(idx){
  var q = currentQuestion();
  if (!q) return;
  var quiz = STATE.quiz;
  if (quiz.submitted[q.id]) return;
  if (q.type==='Single'){
    quiz.selections[q.id] = [idx];
    quiz.submitted[q.id] = true;
    gradeAndRecord(q);
  } else {
    var arr = quiz.selections[q.id] ? quiz.selections[q.id].slice() : [];
    var p = arr.indexOf(idx);
    if (p>=0) arr.splice(p,1); else arr.push(idx);
    quiz.selections[q.id] = arr;
  }
  saveSession();
  render();
}
function confirmMultiAnswer(){
  var q = currentQuestion();
  if (!q) return;
  var quiz = STATE.quiz;
  if (!quiz.selections[q.id] || quiz.selections[q.id].length===0) return;
  quiz.submitted[q.id] = true;
  gradeAndRecord(q);
  saveSession();
  render();
}
function toggleManualFlag(){
  var q = currentQuestion();
  if (!q) return;
  var i = STATE.wrongBank.indexOf(q.id);
  if (i>=0) STATE.wrongBank.splice(i,1); else STATE.wrongBank.push(q.id);
  saveProgress();
  render();
}
function sessionClassCounts(quiz){
  var counts = {};
  var order = [];
  quiz.questions.forEach(function(q){
    if (!(q.class in counts)){ counts[q.class]=0; order.push(q.class); }
    counts[q.class]++;
  });
  order.sort(function(a,b){ return CLASS_ORDER.indexOf(a)-CLASS_ORDER.indexOf(b); });
  return { counts: counts, order: order };
}
function openJumpPanel(){

}
function closeJumpPanel(){

function confirmJumpTo(){
  var quiz = STATE.quiz;
  var cls = STATE.jumpSelectedClass;
  var input = document.getElementById('jumpInput2');
  if (!quiz || !cls || !input) return;
  var n = parseInt(input.value, 10);
  if (isNaN(n)) return;
  var sc = sessionClassCounts(quiz);
  var max = sc.counts[cls] || CLASS_COUNTS[cls] || n;
  n = Math.max(1, Math.min(max, n));
  var targetIdx = indexOfQuestionInQuiz(quiz, cls, n);
  if (targetIdx >= 0){
    closeJumpPanel();
    goToIndex(targetIdx);
  } else {
    alert(cls+'第 '+n+' 題不在本次測驗範圍內');
  }
}
function goToIndex(i){
  var quiz = STATE.quiz;
  if (!quiz || i<0 || i>=quiz.questions.length) return;
  quiz.index = i;
  saveSession();
  render();
}
function nextQuestion(){
