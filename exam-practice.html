<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>考試題庫練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#25507F;
  --navy-deep:#1A3A63;
  --paper:#FDFAF3;
  --brass:#BE9A57;
  --brass-light:#E4D3AE;
  --stamp-green:#2F8F5B;
  --stamp-red:#C24A3C;
  --ink:#2b2b2b;
  --ink-soft:#5b5347;
  --line:#e3d9c2;
  --surface:#ffffff;
  --surface-soft:#FFFDF7;
  --body-bg-1:#E9F1FB;
  --body-bg-2:#FBF7EA;
  --body-bg-3:#FDFAF3;
  --msg-bg:#F1F7EE;
  --msg-border:#bcd9ab;
  --msg-text:#356b2c;
  --msg-err-bg:#FBEDEA;
  --msg-err-border:#e3b3a9;
  --remark-bg:#FBF7EA;
  --wrongbank-bg:#FBF1E3;
  --correct-bg:#F1F8F0;
  --wrong-bg:#FBF0EE;
}
body.dark{
  --navy:#5C93D1;
  --navy-deep:#8FBBEB;
  --paper:#1E232C;
  --brass:#D9BA80;
  --brass-light:#4A3F2A;
  --stamp-green:#5FBE8D;
  --stamp-red:#E28B7A;
  --ink:#EDEAE0;
  --ink-soft:#AFA997;
  --line:#3A4150;
  --surface:#262C37;
  --surface-soft:#232A34;
  --body-bg-1:#11151b;
  --body-bg-2:#15191f;
  --body-bg-3:#181c22;
  --msg-bg:#233428;
  --msg-border:#3d6b46;
  --msg-text:#9fd9ac;
  --msg-err-bg:#3a2624;
  --msg-err-border:#7a4640;
  --remark-bg:#2c2a1e;
  --wrongbank-bg:#2f2a1c;
  --correct-bg:#1c3324;
  --wrong-bg:#3a2420;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:linear-gradient(160deg,var(--body-bg-1) 0%,var(--body-bg-2) 60%,var(--body-bg-3) 100%);
  font-family:'Noto Sans TC',sans-serif;
  color:var(--ink);
  display:flex;
  justify-content:center;
  padding:24px 12px 60px;
  transition:background .2s;
}
.app{
  width:100%;
  max-width:720px;
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 18px 44px rgba(37,80,127,0.18),0 2px 8px rgba(0,0,0,0.06);
  border:1px solid var(--line);
}
.cover{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
  color:#fff;
  padding:18px 20px 16px;
  position:relative;
  min-height:54px;
}
.cover h1{
  font-family:'Noto Serif TC',serif;
  font-weight:900;
  font-size:19px;
  margin:0 0 2px;
  letter-spacing:0.5px;
}
.cover .sub{
  font-size:12.5px;
  opacity:0.86;
  font-family:'IBM Plex Mono',monospace;
}
.cover-actions{
  position:absolute;
  top:14px;
  right:16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.cover-home-btn{
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.4);
  color:#fff;
  font-size:12px;
  padding:6px 12px;
  border-radius:20px;
  cursor:pointer;
}
.cover-home-btn:hover{background:rgba(255,255,255,0.24);}
.dark-toggle-btn{
  background:rgba(255,255,255,0.14);
  border:1px solid rgba(255,255,255,0.4);
  color:#fff;
  font-size:14px;
  width:30px;
  height:30px;
  line-height:1;
  border-radius:50%;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}
.dark-toggle-btn:hover{background:rgba(255,255,255,0.24);}
.body{padding:20px;}
h2.section-title{
  font-family:'Noto Serif TC',serif;
  font-size:16px;
  color:var(--navy-deep);
  margin:0 0 10px;
  border-left:4px solid var(--brass);
  padding-left:10px;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:16px;
}
.msg-banner{
  background:var(--msg-bg);
  border:1px solid var(--msg-border);
  color:var(--msg-text);
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  margin-bottom:16px;
  line-height:1.5;
}
.msg-banner.error{background:var(--msg-err-bg);border-color:var(--msg-err-border);color:var(--stamp-red);}
.drop-zone{
  border:2px dashed var(--brass);
  border-radius:12px;
  padding:32px 16px;
  text-align:center;
  background:var(--surface-soft);
  cursor:pointer;
  transition:background .15s;
}
.drop-zone:hover,.drop-zone.dragover{background:var(--brass-light);}
.drop-zone .big{font-size:15px;color:var(--navy-deep);font-weight:600;margin-bottom:6px;}
.drop-zone .small{font-size:12px;color:var(--ink-soft);}
input[type=file]{display:none;}
.btn{
  display:inline-block;
  font-family:'Noto Sans TC',sans-serif;
  font-size:13px;
  font-weight:600;
  padding:9px 18px;
  border-radius:8px;
  border:1px solid var(--navy);
  background:var(--navy);
  color:#fff;
  cursor:pointer;
  text-align:center;
}
.btn:hover{background:var(--navy-deep);}
.btn.secondary{background:var(--surface);color:var(--navy);}
.btn.secondary:hover{background:#eef3fa;}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff;}
.btn.brass:hover{filter:brightness(0.95);}
.btn.ghost{background:transparent;color:var(--stamp-red);border-color:var(--stamp-red);}
.btn.ghost:hover{background:#fbeeeb;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.bank-summary{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.bank-summary .count{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--navy-deep);font-weight:700;}
.bank-summary .count span{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:8px;}
.class-item{display:flex;align-items:center;gap:8px;font-size:13.5px;}
.class-item input{accent-color:var(--navy);width:16px;height:16px;}
.class-item .cnt{margin-left:auto;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);font-size:12px;}
.select-links{font-size:12px;color:var(--navy);margin:6px 0 2px;}
.select-links a{color:var(--navy);cursor:pointer;text-decoration:underline;margin-right:12px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px;color:var(--ink-soft);}
.checkline input{accent-color:var(--navy);width:15px;height:15px;}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.wrongbank-callout{
  background:var(--wrongbank-bg);border:1px solid var(--brass);border-radius:10px;
  padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.wrongbank-callout .txt{font-size:13px;color:var(--navy-deep);}
.stat-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
.stat-line a{color:var(--navy);cursor:pointer;text-decoration:underline;}
.start-btn-wrap{margin-top:6px;}
.start-btn{width:100%;padding:14px;font-size:15.5px;border-radius:10px;}

/* quiz screen */
.entry-bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.entry-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tag{background:var(--surface-soft);color:var(--navy-deep);border-radius:12px;padding:2px 9px;font-size:11.5px;}
.entry-right{display:flex;align-items:center;gap:10px;}
.zoom-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1;}
.flag-btn{border:none;background:none;font-size:18px;cursor:pointer;color:var(--brass);}
.timer{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--navy-deep);}
.progress-bar-track{height:6px;background:#eee0c4;border-radius:4px;overflow:hidden;margin-bottom:16px;}
.jump-open-btn{
  background:var(--surface-soft);border:1px solid var(--brass);color:var(--navy-deep);
  border-radius:12px;padding:2px 10px;font-size:11.5px;font-weight:600;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;
}
.jump-open-btn:hover{background:var(--brass-light);}
.jump-panel{
  background:var(--surface);border:1px solid var(--brass);border-radius:10px;
  padding:12px 14px;margin:-6px 0 16px;
}
.jump-panel-title{font-size:13px;font-weight:600;color:var(--navy-deep);margin-bottom:10px;}
.jump-class-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.jump-class-btn{
  border:1px solid var(--line);background:var(--surface-soft);color:var(--navy-deep);
  border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.jump-class-btn:hover{border-color:var(--brass);}
.jump-class-btn .cnt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
.jump-input-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.jump-input-row .jump-cancel-btn{margin-left:auto;}
.jump-input-row input[type=number]{
  width:80px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px;
  font-family:'IBM Plex Mono',monospace;background:var(--surface);color:var(--ink);text-align:center;
}
.jump-cancel-btn{font-size:12px;padding:5px 12px;}
.jump-go-btn{font-size:12px;padding:5px 12px;}
.related-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 16px;font-size:12.5px;}
.related-label{color:var(--ink-soft);}
.related-chip{
  border:1px solid var(--brass);background:var(--surface-soft);color:var(--navy-deep);
  border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
}
.related-chip:hover{background:var(--brass-light);}
.related-chip.seen{background:var(--brass);color:#fff;border-color:var(--brass);}
.related-chip.disabled{
  border-color:var(--line);color:var(--ink-soft);cursor:not-allowed;background:transparent;opacity:0.65;
}
.progress-bar-fill{height:100%;background:var(--brass);transition:width .2s;}
.question-text{font-size:18px;line-height:1.65;margin-bottom:16px;color:var(--ink);font-weight:600;}
.option-row{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--surface);font-size:16px;line-height:1.55;
}
.option-row:hover{border-color:var(--brass);}
.option-row .mark{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px;}
.option-row.correct{border-color:var(--stamp-green);background:var(--correct-bg);}
.option-row.correct .mark{background:var(--stamp-green);border-color:var(--stamp-green);}
.option-row.wrong{border-color:var(--stamp-red);background:var(--wrong-bg);}
.option-row.wrong .mark{background:var(--stamp-red);border-color:var(--stamp-red);}
.option-row.selected:not(.correct):not(.wrong){border-color:var(--navy);}
.option-row input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px;flex:0 0 auto;}
.remark-box{
  background:var(--remark-bg);border:1px solid var(--brass);border-radius:8px;padding:10px 14px;
  font-size:13px;color:var(--navy-deep);margin:6px 0 16px;
}
.explanation-wrap{ margin:6px 0 16px; }
.explanation-toggle{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;
  font-size:13px;color:var(--brass);font-weight:600;padding:4px 2px;
}
.explanation-toggle:hover{ text-decoration:underline; }
.explanation-box{
  background:transparent;border-style:dashed;margin:4px 0 0;
}
.multi-hint{font-size:12px;color:var(--brass);margin:-4px 0 10px;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;}
.nav-row .spacer{flex:1;}

/* results */
.hero{text-align:center;padding:20px 0 10px;}
.hero .score{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:700;line-height:1;}
.hero .score.green{color:var(--stamp-green);}
.hero .score.gold{color:var(--brass);}
.hero .score.red{color:var(--stamp-red);}
.hero .score small{font-size:18px;font-weight:400;color:var(--ink-soft);}
.hero .sub{font-size:13px;color:var(--ink-soft);margin-top:6px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0;}
.stat-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;}
.stat-cell .num{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:700;color:var(--navy-deep);}
.stat-cell .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.auto-note{font-size:12.5px;color:var(--brass);text-align:center;margin-bottom:14px;}
table.class-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px;}
table.class-table th,table.class-table td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center;}
table.class-table th{color:var(--ink-soft);font-weight:600;font-size:12px;}
.center-btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:6px;}
.empty-state{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13.5px;}
</style>
</head>

:"按存款時所約定之利率8折計息","answer":false}],"remark":"【存款業務總則篇(支票存款除外)-定期性存款中途解約標準作業流程(SOP)】"},{"id":"存匯-034","class":"存匯","sn":"034","type":"Single","question":"綜合存款項下之定期性存款到期,若未約定到期不續存時,電腦處理方式何者正確?","options":[{"option":"依原約定之金額、期限、利率條件轉存","answer":true},{"option":"到期本利一併依原約定期限及利率轉存","answer":false},{"option":"將到期本利存入該綜合存款之活期性帳戶","answer":false}],"remark":"【綜合存款業務標準作業流程(SOP)】"},{"id":"存匯-035","class":"存匯","sn":"035","type":"Single","question":"在中華民國境內有固定營業場所之營利事業,如有各類所得扣繳率標準第二條規定之存款利息所得,每次應扣繳稅額不超過多少元者免予扣繳?","options":[{"option":"新臺幣1仟元","answer":false},{"option":"新臺幣2仟元","answer":true},{"option":"新臺幣5仟元","answer":false}],"remark":"【105.02.04銀營運字第10500007831號函】"},{"id":"存匯-036","class":"存匯","sn":"036","type":"Single","question":"有關存單領息相關作業,下列敘述何者有誤?","options":[{"option":"利息領取現金時,T10傳票簽蓋原留印鑑","answer":false},{"option":"利息領現或轉入他人帳戶須扣繳千分之四印花稅","answer":false},{"option":"若將利息轉入存款人於金融同業存款帳戶者,利息支出傳票內仍須加蓋原留印鑑,且應註明金融同業之名稱及帳戶號碼,以為免扣印花稅之依據","answer":true}],"remark":"【存款業務總則篇-定期性存款期中領息標準作業流程SOP】"},{"id":"存匯-037","class":"存匯","sn":"037","type":"Single","question":"機關、學校、團體或公司行號辦理定期存款,下列敘述何者為非?","options":[{"option":"應以其登記名稱為戶名","answer":false},{"option":"未留存其負責人印鑑者,應由負責人填具授權書,或於印鑑卡背面記載「本戶以○○○蓋章(或簽名)代理負責人處理本戶一切事宜」字樣,並經負責人簽名蓋章","answer":false},{"option":"存款逾期提取時,其逾期利息按提取日本行活期儲蓄存款牌告利率折合日息單利計息。但該存款到期日至提取日期間,本行活期儲蓄存款牌告利率有調整時,應按調整之牌告利率分段計息","answer":true}],"remark":"【定期存款業務-標準作業流程(SOP)】"},{"id":"存匯-038","class":"存匯","sn":"038","type":"Single","question":"外埠通訊轉期續存,下列何者為正確?","options":[{"option":"需註明原存單帳號及擬轉存種類期限等相關資料","answer":true},{"option":"於辦妥續存後回信應附上新存單","answer":false},{"option":"只須告知擬轉期續存存單帳號即可","answer":false}],"remark":"【存款業務總則篇-定期性存款到期續存標準作業流程(SOP)】"},{"id":"存匯-039","class":"存匯","sn":"039","type":"Single","question":"可轉讓定存單有關規定何者為非?","options":[{"option":"存單一經發行不得中途要求記名或取消記名","answer":false},{"option":"本行可轉讓定期存單利率由財務部訂定","answer":false},{"option":"客戶可以辦理質借","answer":true}],"remark":"【可轉讓定期存單作業標準作業流程SOP】"},{"id":"存匯-040","class":"存匯","sn":"040","type":"Single","question":"有關存戶持「儲蓄免扣證」申請退還代扣利息所得稅款之作業,下列敘述何者錯誤?","options":[{"option":"於利息給付當日申辦者,以P15(存摺類)或T15(存單類)交易登錄,並於免扣證記載該筆退稅資料後,將傳票及免扣證一併送核章主管審核,主管應於免扣證「給付金額」欄前加蓋私章,以確認該筆交易","answer":false},{"option":"存摺(單)類 退稅作業,以P15或T15登記證退稅登錄單作傳票,亦可以轉帳傳票代替","answer":true},{"option":"存戶以現金提領該利息所得稅退稅款,應先查明其利息是否已依給付總額扣繳印花稅,並請存戶加蓋原留印鑑於P15或T15傳票","answer":false}],"remark":"【94.5.13.銀營一乙字第09400105611號函】"},{"id":"存匯-041","class":"存匯","sn":"041","type":"Single","question":"有關可轉讓定期存單,下列敘述何者錯誤?","options":[{"option":"以登記形式發行者,最低發行金額為新臺幣500萬元,並得按10萬元之倍數發行","answer":true},{"option":"以債票形式發行者,得採記名式或無記名式,但發行後持有人不得中途要求記名或取銷記名","answer":false},{"option":"得自由轉讓、設定質權或充作其他之擔保,如喪失時,並得辦理掛失止付","answer":false}],"remark":"【105.10.12財管字第10500033881號函、可轉讓定存單作業標準作業流程(SOP)】"},{"id":"存匯-042","class":"存匯","sn":"042","type":"Single","question":"有關可轉讓定期存單之敘述,下列何者有誤?","options":[{"option":"本存單之發行期限最短為一個月,最長不得超過一年","answer":false},{"option":"本存單得作為授信之擔保品或充作其他之擔保,並得持向發行單位辦理質借","answer":true},{"option":"本存單遺失時,持有人得向原發行單位辦理掛失止付,並依法向法院辦理公示催告,其手續比照票據掛失止付規定辦理","answer":false}],"remark":"【可轉讓定存單作業標準作業流程(SOP)】"},{"id":"存匯-043","class":"存匯","sn":"043","type":"Single","question":"可轉讓定期存單到期逾期提取,除到期日為休假日應予補息外,其逾期息如何計息?","options":[{"option":"照活存利率計息","answer":false},{"option":"自逾期之日起停止計息","answer":true},{"option":"照活儲利率計息","answer":false}],"remark":"【可轉讓定存單作業標準作業流程(SOP)】"},{"id":"存匯-044","class":"存匯","sn":"044","type":"Single","question":"定期存單到期日為休假日,於次營業日提取時,其逾期利息應按存單利率另給付休假日之利息,但在第二個營業日提取時,應按照何種利率,給付逾期息?但該存款到期日至提取日期間,本行牌告利率有調整者,應按調整之牌告利率分段計息。","options":[{"option":"活期存款利率","answer":true},{"option":"活期儲蓄存款利率","answer":false},{"option":"原存單利率","answer":false}],"remark":"【存款業務總則篇-定期性存款到期續存標準作業流程SOP】"},{"id":"存匯-045","class":"存匯","sn":"045","type":"Single","question":"定期性存款在存款中途不得申請下列何者?","options":[{"option":"解約提取","answer":false},{"option":"將「機動」利率變更為「固定」利率或「固定」利率變更為「機動」利率","answer":true},{"option":"質押借款","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-046","class":"存匯","sn":"046","type":"Single","question":"有關綜合存款之利率及計息方式,下列敘述何者為非?","options":[{"option":"活期性存款部份,每日最低起息金額為活期存款新臺幣壹萬元/活期儲蓄存款新臺幣伍仟元,每半年計息一次,滾入本金","answer":false},{"option":"借款部份可在定期性存款金額之九成範圍內辦理質借,質借方式按定期性存款承作之先後順序質借","answer":true},{"option":"質借利率依各該筆定期(儲)存款利率加計年息1.5%分別計算","answer":false}],"remark":"【綜合存款業務標準作業流程(SOP)】"},{"id":"存匯-047","class":"存匯","sn":"047","type":"Single","question":"有關存款設定質權的相關規定何者有誤?","options":[{"option":"辦理質權設定時,應由存戶與質權人聯名填具質權設定通知書,並附具存單(存單背面須蓋原留印鑑)","answer":false},{"option":"存款利息領取無須經質權人同意,可直接存入出質人帳戶","answer":true},{"option":"解除質權時,應由質權人填具質權消滅通知書,蓋具質權人原留印鑑附具存單辦理","answer":false}],"remark":"【存款業務總則篇-存款設定質權標準作業流程SOP】"},{"id":"存匯-048","class":"存匯","sn":"048","type":"Single","question":"有關行員儲蓄存款,員工調職時下列敘述何者正確?","options":[{"option":"得視員工本人需要決定是否辦理移存新服務單位","answer":true},{"option":"應於接到調職通知書之日起1個月內申請移存至新調職之單位,逾期未申請移存者,其逾期部份按照一般活期儲蓄存款利率計息","answer":false},{"option":"應於接到調職通知書之日起3個月內申請移存至新調職之單位,逾期未申請移存者,其逾期部份按照一般活期儲蓄存款利率計息","answer":false}],"remark":"【行員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-049","class":"存匯","sn":"049","type":"Single","question":"有關行員儲蓄存款-退休金戶,下列敘述何者錯誤?","options":[{"option":"退休人員須於退休金請領日起15工作日內,親持國民身分證、原留印鑑、存摺、本行核定退休公函、一次退休金支付表及各單位開立之「優惠存款證明書」等相關文件,至開戶行辦理行員定期儲蓄存款","answer":false},{"option":"改進方案,於96年12月31日前服務年資所計算之退休金,不論金額多寡皆適用年利率13%計息,97年1月1日後服務年資所計算之退休金適用本行三年定期儲蓄存款機動利率加計3%計息,惟退休金優惠存款不得超過新台幣500萬元","answer":true},{"option":"退休人員再任有給職務且具有公務人員退休資遣撫卹法第77條所定情事,於再任期間,退休金存款不可續存","answer":false}],"remark":"【行員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-050","class":"存匯","sn":"050","type":"Single","question":"以下何者為非?","options":[{"option":"本行退休助理辦事員以上各級正式職員可儲存員工退休金儲蓄存款","answer":false},{"option":"支領警察官待遇之駐衛警員可儲存員工退休金儲蓄存款","answer":true},{"option":"每年3月21日起至6月20日辦理退休人員校對作業,校對單依日期排序專卷保管5年","answer":false}],"remark":"【行員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-051","class":"存匯","sn":"051","type":"Single","question":"有關「財政部所屬國營銀行員工優惠存款改革方案」,下列何者錯誤?","options":[{"option":"於107年7月1日起,得儲存13%優惠存款最高額度原為3,059,077元,後經陸續調增軍公教待遇,爰114年以後退休者,13%優惠存款最高額度已調增為3,519,692元","answer":false},{"option":"退休人員之員工定額儲蓄優惠存款(職員:48萬,工員:28萬)於退休後能繼續享有優惠利率","answer":true},{"option":"退休金優惠存款合計以500萬元為限","answer":false}],"remark":"【行員儲蓄存款標準作業流程(SOP)、107.7.10銀營運乙字第10700040511號函、114.5.12營運存字第11400038331號函】"},{"id":"存匯-052","class":"存匯","sn":"052","type":"Single","question":"在職員工及退休人員亡故時,應於何時終止行員儲蓄存款優惠利息?","options":[{"option":"自其亡故之次日起","answer":true},{"option":"保留至其身故後第一次結息日為止","answer":false},{"option":"保留至其辦理繼承日為止","answer":false}],"remark":"【行員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-053","class":"存匯","sn":"053","type":"Single","question":"本行退休人員李君退休金存款500萬元,於115.3.10死亡,其家屬於115.4.10通知本行並辦理行員儲蓄存款繼承及結清手續,該戶應先收回何時段之利息?","options":[{"option":"自115.3.11起至115.4.9日止之利息","answer":true},{"option":"自115.3.10起至115.4.9日止之利息","answer":false},{"option":"自115.4.1日起至115.4.9日止之利息","answer":false}],"remark":"【行員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-054","class":"存匯","sn":"054","type":"Single","question":"何種身分不可辦理行員定額存款?","options":[{"option":"應召入伍者(包括常備兵訓練)","answer":false},{"option":"留職停薪者","answer":false},{"option":"因案停職者","answer":true}],"remark":"【行員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-055","class":"存匯","sn":"055","type":"Single","question":"有關公教儲蓄存款,下列敘述何者錯誤?","options":[{"option":"每人限開一戶,每月存入次數限一次","answer":false},{"option":"臨櫃存入交易限原存行(即開戶行)辦理,若受款帳號屬聯行帳戶,應以劃收報單請原存行辦理存入","answer":false},{"option":"存戶調職至其他機關,得不結清舊戶、逕行開立新戶","answer":true}],"remark":"【公教人員儲蓄存款標準作業流程】"},{"id":"存匯-056","class":"存匯","sn":"056","type":"Single","question":"公教儲蓄存款每月存入款項應如何辦理?","options":[{"option":"存款人親自辦理存入手續","answer":false},{"option":"由各存入機關學校之會計、出納人員於核薪時彙存","answer":true},{"option":"委託他人代辦存入手續","answer":false}],"remark":"【公教人員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-057","class":"存匯","sn":"057","type":"Single","question":"公教儲蓄存款之存款利率係按本行存款牌告何種利率?","options":[{"option":"2年期定期儲蓄存款固定利率","answer":false},{"option":"2年期定期儲蓄存款機動利率","answer":true},{"option":"1年期定期儲蓄存款機動利率計息","answer":false}],"remark":"【公教人員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-058","class":"存匯","sn":"058","type":"Single","question":"公教人員儲蓄存款,每月限存金額為新臺幣多少元?","options":[{"option":"職員1萬元工友5千元","answer":true},{"option":"職員工友各1萬元","answer":false},{"option":"職員工友各5千元","answer":false}],"remark":"【公教人員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-059","class":"存匯","sn":"059","type":"Single","question":"公教人員儲蓄存款,下列何者為正確?","options":[{"option":"離職者應馬上結清銷戶","answer":false},{"option":"奉准退休支領月退休金者不宜再存儲","answer":true},{"option":"不管離職或退休者均應馬上結清銷戶","answer":false}],"remark":"【公教人員儲蓄存款標準作業流程(SOP)】"},{"id":"存匯-060","class":"存匯","sn":"060","type":"Single","question":"有關擬參選人設立政治獻金專戶敘述,何者為非?","options":[{"option":"擬參選人之政治獻金專戶內之存款,不得強制執行。但因從事競選活動或其他政治相關活動所生之債務,不在此限","answer":false},{"option":"本行受理擬參選人開立政治獻金專戶以1個為限,零元開戶,出具「零存款餘額證明書」交其收執,並提醒1週內儘速向監察院申請專戶之許可(許可函副知開立行),始得開始收受政治獻金","answer":false},{"option":"往年選舉的政治獻金專戶尚未結清銷戶,今年可以沿用,不用新開立帳戶","answer":true}],"remark":"【111.5.6銀營運乙字第11100029701號函】"},{"id":"存匯-061","class":"存匯","sn":"061","type":"Single","question":"有關政治獻金專戶,下列敘述何者正確?","options":[{"option":"擬參選人政治獻金專戶孳息非屬擬參選人個人所得,扣繳義務人於給付擬參選人政治獻金專戶之孳息時,尚無須辦理扣繳及申報扣繳憑單","answer":true},{"option":"擬參選人政治獻金專戶孳息,因同一身分字號所有帳號均適用同一扣取身分,故扣取補充保險費","answer":false},{"option":"政黨政治獻金專戶孳息非屬其所得來源之一,扣繳義務人給付政黨政治獻金專戶之孳息,無須辦理扣繳及申報扣繳憑單","answer":false}],"remark":"【111.5.6銀營運乙字第11100029701號函】"},{"id":"存匯-062","class":"存匯","sn":"062","type":"Single","question":"有關政治獻金下列敘述何者錯誤?","options":[{"option":"政治獻金專戶變更,原專戶應辦理銷戶,並將存款餘額以現金、匯款、轉帳方式轉入新專戶內","answer":true},{"option":"專戶以一個為限,非經監察院同意,不得自行變更或廢止","answer":false},{"option":"政治獻金專戶在未經許可前,該帳戶不得收受政治獻金","answer":false}],"remark":"【94.3.25.銀營一乙字第09400058621號函】"},{"id":"存匯-063","class":"存匯","sn":"063","type":"Single","question":"有關政治獻金捐贈款項之存入作業,下列敘述何者錯誤?","options":[{"option":"捐贈人超過新臺幣10萬元(100,001元起),可以「無摺存款」方式為之","answer":true},{"option":"超過新臺幣3萬元(30,001元起),應留存「捐贈人」之名稱、電話、地址及身分證字號或統一編號","answer":false},{"option":"新臺幣1萬元以下(含10,000元),宜留存「捐贈人」之名稱、電話,匿名捐贈原則上是可以的,但是不可以用別人的名義捐贈,也不可以超過新臺幣1萬元","answer":false}],"remark":"【111.5.6銀營運乙字第11100029701號函】"},{"id":"存匯-064","class":"存匯","sn":"064","type":"Single","question":"客戶來行開戶,如為中華民國境內無居所之個人或在中華民國境內有居所,持有居留證者,若無法確認其當年度在台居留期限是否超過183天,其利息之扣繳稅率為下列何者?","options":[{"option":"10%","answer":false},{"option":"免扣稅","answer":false},{"option":"20%","answer":true}],"remark":"【所得稅法第88條及各類所得扣繳率標準第3條】"},{"id":"存匯-065","class":"存匯","sn":"065","type":"Single","question":"下列何種存款戶,得免使用「開戶檢核表」?","options":[{"option":"公教存款","answer":true},{"option":"綜合理財帳戶","answer":false},{"option":"股票上市公司活期性存款帳戶","answer":false}],"remark":"【臺灣銀行股份有限公司存款開戶審核、風險控管暨警示帳戶聯防作業要點】"},{"id":"存匯-066","class":"存匯","sn":"066","type":"Single","question":"有關辦理大陸人士開戶審核作業,下列敘述何者為非?","options":[{"option":"大陸地區人民開戶未持居留證者,第一證件應持內政部移民署入出境許可證及中華民國統一證號基本資料表","answer":false},{"option":"無需查詢聯徵中心資料庫有無遭警察機關通報設定警示帳戶且未解除警示之情事","answer":true},{"option":"大陸地區法人應取得經濟部核准設立之公司登記證明文件","answer":false}],"remark":"【開戶知識庫】"},{"id":"存匯-067","class":"存匯","sn":"067","type":"Single","question":"下列敘述何者錯誤?","options":[{"option":"不具法人人格之公寓大廈管理委員會,如持有向主管機關報備之文件,得以該委員會名義開立支票存款戶","answer":true},{"option":"為防杜人頭帳戶,個人開戶除須本人親持身分證辦理外,同時須於金融聯合徵信中心查詢Z21、Z22聯徵資料與雙重身分證明文件查核","answer":false},{"option":"在我國依法核准登記之外國公司在台分公司,故其在臺分公司不須取得本公司授權,得以分公司名義開戶","answer":false}],"remark":"【OCR開戶標準作業流程、開戶知識庫】"},{"id":"存匯-068","class":"存匯","sn":"068","type":"Single","question":"查詢「Z21」、「Z22」(行內資訊網-聯徵信用資訊查詢),下列何者為是?","options":[{"option":"如外來人口且為本行既有客戶,持居留證開戶涉新舊證號變更,請查詢「Z25外來人口新舊統一證號資料查詢」,無須執行「V0205新舊證號影像檔合併」","answer":false},{"option":"個人戶及公司、行號及團體之負責人應查詢「Z21」、「Z22」,負責人為外國人僅查詢「Z21」","answer":false},{"option":"如有警示註記尚未解除者,倘因就業薪資轉帳需要可開立帳戶,開戶後應將薪資帳戶設為衍生管制帳戶(P61-15)控管","answer":true}],"remark":"【OCR開戶標準作業流程】"},{"id":"存匯-069","class":"存匯","sn":"069","type":"Single","question":"下列何者為非?","options":[{"option":"分公司應以總公司名義開戶,須將分公司名稱並列於戶名內,並提出總公司授權分公司開戶之授權書","answer":false},{"option":"公司辦事處或類似辦事處組織雖不具獨立法人資格,不得為權利義務之主體,為其性質上亦為公司之分支機構,得比照現行規範之開戶模式辦理","answer":false},{"option":"子公司應以總公司名義開戶,須將子公司名稱並列於戶名內,並提出總公司授權子公司開戶之授權書","answer":true}],"remark":"【OCR開戶標準作業流程】"},{"id":"存匯-070","class":"存匯","sn":"070","type":"Single","question":"以下敘述何者正確?","options":[{"option":"活期存款開戶初次存入金額不得低於新台幣1000元,規定起息金額為5000元","answer":false},{"option":"甲種綜合存款開戶初次存入金額不得低於新台幣1000元,規定起息金額為5000元","answer":false},{"option":"活期儲蓄存款開戶採零元開戶,規定起息金額為5000元","answer":true}],"remark":"【活期存款、活期儲蓄存款、綜合存款存戶須知】"},{"id":"存匯-071","class":"存匯","sn":"071","type":"Single","question":"有關FATCA/CRS辨識作業,下列敘述何者錯誤?","options":[{"option":"既有客戶臨櫃開立新帳戶時,尚未完成CRS辨識,應徵提自我聲明書","answer":false},{"option":"已徵提過自我聲明書之客戶,若無稅籍或身分異動,可不用向客戶重新徵提","answer":false},{"option":"若客戶為美國公民/稅務居民,應填寫自我聲明書及W-8BEN表","answer":true}],"remark":"【遵循美國海外帳戶稅收遵循法案(FATCA)暨金融機構執行共同申報及盡職審查作業(CRS)標準作業流程(SOP)-客戶辨識】"},{"id":"存匯-072","class":"存匯","sn":"072","type":"Single","question":"下列敘述何者正確?","options":[{"option":"來臺就學海外學生申請開戶,依據我國民法規定屬限制行為能力人者,須取得經駐外館驗證之法定代理人同意書","answer":false},{"option":"社工陪同接受安置未成年人申請開戶時,應檢具地方主管機關公文(敘明開戶之兒少姓名、陪同開戶人員姓名)","answer":true},{"option":"受僱於民營企業之未成年人為轉帳劃薪需要,經雇主證明僱傭關係後即可開戶","answer":false}],"remark":"【開戶知識庫】"},{"id":"存匯-073","class":"存匯","sn":"073","type":"Single","question":"有關無行為能力人開戶,下列敘述何者錯誤?","options":[{"option":"無行為能力人,應由法定代理人代為開戶","answer":false},{"option":"印鑑卡正面僅留存法定代理人印鑑","answer":true},{"option":"印鑑卡背面應留存法定代理人之簽章","answer":false}],"remark":"【93.12.30. 銀營一乙字第09300275031號函】"},{"id":"存匯-074","class":"存匯","sn":"074","type":"Single","question":"下列開立之戶名何者為是?","options":[{"option":"匡復漢室國際數位人才招募中心股份有限公司(負責人:劉玄德)開戶,其戶名為「匡復漢室國際數位人才招募中心股份有限公司劉玄德」","answer":false},{"option":"天母國際首席精品鹹酥雞商號(負責人:霸道總裁獅子王)開戶,其戶名為 「天母國際首席精品鹹酥雞商號霸道總裁獅子王」","answer":true},{"option":"財團法人金龍品茶研訓院 (負責人:茶裏王),其戶名為「財團法人金龍品茶研訓院茶裏王」","answer":false}],"remark":"【OCR開戶標準作業流程】"},{"id":"存匯-075","class":"存匯","sn":"075","type":"Single","question":"下列何種情形,應拒絕客戶之開戶申請,並將此等客戶之基本資料建立拒絕開戶資料庫?","options":[{"option":"委託開戶,經確認本人及代理人之身分及留存相關確認憑證備查者","answer":false},{"option":"客戶已被設定為警示帳戶列管,但為就業薪資轉帳開立帳戶需要,經當事人提出在職證明或任職公司之證明文件者","answer":false},{"option":"疑似使用假名、人頭、虛設行號或虛設法人團體開立存款帳戶者","answer":true}],"remark":"【臺灣銀行股份有限公司存款開戶審核、風險控管暨警示帳戶聯防作業要點】"},{"id":"存匯-076","class":"存匯","sn":"076","type":"Single","question":"有關活期性存款開戶,下列敘述何者正確?","options":[{"option":"簡便融資戶如能確認其所提示證件為最新請領者,得免上網查詢及拍攝國民身分證領補換資料","answer":false},{"option":"無行為能力人應留存所檢附之相片以予掃描","answer":false},{"option":"受監護宣告之人由監護人向金融機構辦理開戶","answer":true}],"remark":"【93.3.23.銀營一字第09300062171號函】"},{"id":"存匯-077","class":"存匯","sn":"077","type":"Single","question":"受理活期性存款開戶,實施雙重身分證明文件查核,下列敘述何者錯誤?","options":[{"option":"個人戶除身分證件外,另應徵提其他可資證明身分之第二證件,以有照片者為優先,次為無照片者,惟應擇一辦理","answer":false},{"option":"非個人戶,如已徵取公司設立等登記證照,得作為該非個人戶代表人(負責人)之第二身分證明文件","answer":false},{"option":"清算中公司若為完成清算目的而有開立活期存款之需要時,得由清算人代表公司,以清算人名義申請開戶","answer":true}],"remark":"【OCR開戶標準作業流程】"},{"id":"存匯-078","class":"存匯","sn":"078","type":"Single","question":"有關非自然人客戶FATCA/CRS身分辨識,下列敘述何者錯誤?","options":[{"option":"金融機構需填寫GIIN,若無GIIN應向客戶徵提W-8BEN-E","answer":false},{"option":"「消極非金融機構實體」需辨識其具控制權人之稅籍","answer":false},{"option":"公司戶應辨識其負責人之稅籍","answer":true}],"remark":"【遵循美國海外帳戶稅收遵循法案(FATCA)暨金融機構執行共同申報及盡職審查作業(CRS)標準作業流程(SOP)-客戶辨識】"},{"id":"存匯-079","class":"存匯","sn":"079","type":"Single","question":"受理自然人申請開設存款帳戶時,「戶名」應如何處理?","options":[{"option":"應依「姓名條例」之規定,以本名立戶","answer":true},{"option":"冠夫姓之女性開戶,戶名可以不冠夫姓","answer":false},{"option":"本國人得以英文名字立戶","answer":false}],"remark":"【業務處理輯要】"},{"id":"存匯-080","class":"存匯","sn":"080","type":"Single","question":"下列有關籌設中之公司申請開立活期性存款戶之敘述,何者錯誤?","options":[{"option":"戶名須表示「籌備處」字樣並列負責人姓名","answer":false},{"option":"無須留存負責人影像檔","answer":true},{"option":"可選擇僅留存籌備處負責人之私章,或留存公司章(須註明籌備處字樣)與籌備處負責人之私章","answer":false}],"remark":"【非OCR開戶標準作業流程/新臺幣存款業務開戶知識庫】"},{"id":"存匯-081","class":"存匯","sn":"081","type":"Single","question":"下列敘述何者錯誤?","options":[{"option":"存戶為受輔助宣告之人者,掛失更換印鑑時,應由輔助人陪同辦理","answer":false},{"option":"受理聯行存戶辦理各項業務申請時,以原存行已留存人像暨身分證影像檔者為限,聯行不得代拍","answer":true},{"option":"受理客戶以電話掛失印鑑或臨櫃申辦存摺類存款帳戶印鑑掛失更換業務,經辦人員皆應先行登錄「P60止扣登錄,項目:01印鑑遺失」,並於完成印鑑掛失更換手續後登錄「P60止扣解除,項目:01印鑑遺失」","answer":false}],"remark":"【存款業務總則篇(支票存款除外)-印鑑掛失更換標準作業流程(SOP)】"},{"id":"存匯-082","class":"存匯","sn":"082","type":"Single","question":"下列何者為非?","options":[{"option":"客戶持居留證辦理開戶,應至內政部移民署「居留證查詢網」辦理驗證查詢","answer":false},{"option":"如客戶有不識字者,可以指印、十字或其他符號代簽名,並經二位見證人於相關文件簽名證明","answer":false},{"option":"如客戶至本行辦理新式外來人口統一證號變更,承辦人員應至內政部移民署「居留證查詢網」辦理驗證查詢","answer":true}],"remark":"【OCR開戶標準作業流程、民法第3條】"},{"id":"存匯-083","class":"存匯","sn":"083","type":"Single","question":"下列敘述何者有誤?","options":[{"option":"辨識法人客戶之實質受益人時,所稱具控制權係指直接、間接持有該法人股份或資本百分之二十五者","answer":true},{"option":"與客戶建立業務關係時,應確認客戶身分","answer":false},{"option":"客戶為法人時,確認客戶之具控制權之最終自然人身分","answer":false}],"remark":"【銀行公會防制洗錢及打擊資恐注意事項範本】"},{"id":"存匯-084","class":"存匯","sn":"084","type":"Single","question":"為落實本行「防制洗錢及打擊資助恐怖主義注意事項」有關確認客戶身分時機,下列敘述何者正確?","options":[{"option":"與客戶建立業務關係新開戶,不含已有各項業務往來客戶新開立帳戶","answer":false},{"option":"進行臨時性交易:辦理新臺幣3萬元以上未達新台幣50萬元之國內現金匯款:確認本人或代理人(代理人辦理者僅需確認代理人身分,匯款單不需記載匯款人本人資料)","answer":false},{"option":"辦理現金達新臺幣50萬元以上 (單筆現金收付或換鈔交易)之臨時性交易時,應進行確認客戶身分措施,確認之對象為客戶、代理人及實質受益人。臨時性交易係指非本行往來客戶於本行辦理之匯款或換鈔等交易,每次均須徵提本人證件,法人戶須徵提主管機關登記文件(須上網確認資料無誤)、股東/出資人名冊、股東等身分證明文件及「聲明書」,委託辦理須徵提委託書及代理人證件","answer":true}],"remark":""},{"id":"存匯-085","class":"存匯","sn":"085","type":"Single","question":"有關「金融機構執行共同申報及盡職審查作業辦法」(CRS),下列敘述何者正確?","options":[{"option":"規範金融機構直接向外國稅務機關執行申報作業","answer":false},{"option":"美國FATCA適用本辦法之規定","answer":false},{"option":"由財政部依稅捐稽徵法訂定","answer":true}],"remark":"【金融機構執行共同申報及盡職審查作業辦法】"},{"id":"存匯-086","class":"存匯","sn":"086","type":"Single","question":"有關既有帳戶盡職審查之規定,何者錯誤?","options":[{"option":"個人帳戶總價值或餘額超過100萬美元者為「高資產帳戶」","answer":false},{"option":"實體帳戶總價值或餘額超過25萬美元為「高資產帳戶」","answer":false},{"option":"金融機構對「高資產帳戶」執行電子搜尋即完成審查作業","answer":true}],"remark":"【遵循美國海外帳戶稅收遵循法案(FATCA)暨金融機構執行共同申報及盡職審查作業(CRS)標準作業流程(SOP)-客戶辨識】"},{"id":"存匯-087","class":"存匯","sn":"087","type":"Single","question":"有關確認客戶身分,下列敘述何者錯誤?","options":[{"option":"由代理人辦理者,應查證代理之事實","answer":false},{"option":"使用可靠來源之資料辨識實質受益人","answer":false},{"option":"只有在高風險情形才需要瞭解業務關係之目的與性質","answer":true}],"remark":"【銀行防制洗錢及打擊資恐注意事項範本】"},{"id":"存匯-088","class":"存匯","sn":"088","type":"Single","question":"金融機構在客戶持續審查時,對於高風險客戶應至少多久要檢視一次?","options":[{"option":"六個月","answer":false},{"option":"一年","answer":true},{"option":"三年","answer":false}],"remark":"【銀行防制洗錢及打擊資恐注意事項範本】"},{"id":"存匯-089","class":"存匯","sn":"089","type":"Single","question":"發現偽冒帳戶時,應如何處理?","options":[{"option":"將該帳戶銷戶,餘額轉入其他應付款","answer":true},{"option":"通知開戶人來行辦理銷戶","answer":false},{"option":"通知被冒名人來行辦理銷戶","answer":false}],"remark":""},{"id":"存匯-090","class":"存匯","sn":"090","type":"Single","question":"警示帳戶當事人在全體金融機構所開立之其他帳戶定義為何?","options":[{"option":"警示帳戶","answer":false},{"option":"衍生管制帳戶","answer":true},{"option":"偽冒帳戶","answer":false}],"remark":"【存款帳戶及其疑似不法或顯屬異常交易管理辦法】"},{"id":"存匯-091","class":"存匯","sn":"091","type":"Single","question":"下列敘述何者錯誤?","options":[{"option":"警示帳戶之警示期限自每次通報時起算,逾 5 年自動失其效力,但有繼續警示之必要者,原通報機關應於期限屆滿前再行通報之","answer":true},{"option":"存款帳戶之款項若已遭扣押或禁止處分,復接獲法院、檢察署或司法警察機關通報為警示帳戶,該帳戶仍應列為警示帳戶,但該等款項優先依扣押或禁止處分命令規定辦理","answer":false},{"option":"對採用委託開戶或開戶後發現可疑之客戶,應以電話、書面或實地查訪等方式再確認,並做適當處理","answer":false}],"remark":"【存款帳戶及其疑似不法或顯屬異常交易管理辦法】"},{"id":"存匯-092","class":"存匯","sn":"092","type":"Single","question":"對警示帳戶作業下列敘述何者錯誤?","options":[{"option":"接獲檢警調單位通知設定警示帳戶,應暫停該帳戶全部交易功能,匯入款項以退匯方式退回匯款行","answer":false},{"option":"客戶設定警示帳戶後,親持相關證件正本再申請開戶者,應予受理","answer":true},{"option":"接獲檢警調單位通知設定警示帳戶後,由國營部或消金部直接於聯徵中心通報警示","answer":false}],"remark":"【詐騙案件通報標準作業流程(SOP)、存款帳戶及其疑似不法或顯屬異常交易管理辦法及114.07.29銀營運乙字第11400060021號函】"},{"id":"存匯-093","class":"存匯","sn":"093","type":"Single","question":"有關警示帳戶,下列敘述何者正確?","options":[{"option":"存款帳戶經通報為警示帳戶者,僅暫停該帳戶使用提款卡、語音轉帳、網路轉帳及其他電子支付功能,匯入款項逕以退匯方式退回匯款行","answer":false},{"option":"警示帳戶衍生之管制帳戶,係指警示帳戶之開戶人所開立之其他帳戶","answer":true},{"option":"各營業單位接獲警示帳戶之通報後,直接向金融聯合徵信中心通報","answer":false}],"remark":"【臺灣銀行股份有限公司存款開戶審核、風險控管暨警示帳戶聯防作業要點】"},{"id":"存匯-094","class":"存匯","sn":"094","type":"Single","question":"為協助民眾處理滯留於金融機構「警示帳戶」內之剩餘款項發還事宜,下列敘述何者錯誤?","options":[{"option":"無法確認該帳戶是否屬遭歹徒持偽(變)造或他人之身分證件冒名開立者,應函詢警察機關查明回復","answer":false},{"option":"於警察機關調閱「警示帳戶」之開戶人、資金明細等相關資料時,於復函中,敘明要求警察機關查復該「警示帳戶」是否屬遭歹徒持偽(變)造或他人之身分證件冒名開立者之情形","answer":false},{"option":"返還剩餘款應以「先進先出」方式辦理","answer":true}],"remark":"【93.10.21.銀營一乙字第09300225721號函】"},{"id":"存匯-095","class":"存匯","sn":"095","type":"Single","question":"被害人提出返還「警示帳戶」剩餘款項申請時,除申請書外,下列何種文件非屬應檢附文件?","options":[{"option":"刑事案件報案三聯單","answer":false},{"option":"申請不實致金融機構受有損失,由該被害人負一切法律責任之切結書","answer":false},{"option":"本行出具之加速警示帳戶還款便函","answer":true}],"remark":"【94.3.3.銀營一字第09400038261號函及詐騙案件通報標準作業流程(SOP)】"},{"id":"存匯-096","class":"存匯","sn":"096","type":"Single","question":"有關執行法院強制執行與「警示帳戶」之關係,下列敘述何者錯誤?","options":[{"option":"債務人之存款帳戶已遭警調機關要求設立為警示帳戶者,仍應將該債務人之存款帳戶依法院命令執行扣押","answer":false},{"option":"若債務人之存款帳戶已被法院扣押,而警調機關日後要求將其設立為警示帳戶者,應函告警調機關該存款帳戶已法院扣押,無法設定為警示帳戶","answer":true},{"option":"若債務人之存款帳戶已被法院扣押,而警調機關日後要求將其設立為警示帳戶者,仍應照辦,惟該扣押款項應依法院判決或強制執行命令分配之","answer":false}],"remark":"【94.3.10.銀營一字第09400045471號函及94.4.21.銀營一字第09400082681號函】"},{"id":"存匯-097","class":"存匯","sn":"097","type":"Single","question":"為防杜警示帳戶戶數新增措施,下列敘述何者錯誤?","options":[{"option":"加強向客戶宣導,提供人頭帳戶供詐騙集團使用應負之法律責任","answer":false},{"option":"對有疑似人頭帳戶之情形,不用限制其使用電子支付系統","answer":true},{"option":"加強開戶行員之警覺性及敏感度之訓練","answer":false}],"remark":"【94.5.18.銀營一字第09400105991號函】"},{"id":"存匯-098","class":"存匯","sn":"098","type":"Single","question":"為有效防範歹徒利用金融機構存款帳戶作為犯罪工具,下列敘述何者錯誤?","options":[{"option":"若發現有涉案帳戶時,應即與有權凍結帳戶之檢察機關聯繫","answer":false},{"option":"客戶開立之其他存款帳戶經通報為警示帳戶尚未解除者,應無例外拒絕客戶開戶之申請,並將此等客戶之基本資料建立拒絕開戶資料庫","answer":true},{"option":"存款帳戶經通報為警示帳戶者,應即通知金融聯合徵信中心,並暫停該帳戶全部交易功能,匯入款項逕以退匯方式退回匯款行","answer":false}],"remark":"【臺灣銀行股份有限公司存款開戶審核、風險控管暨警示帳戶聯防作業要點】"},{"id":"存匯-099","class":"存匯","sn":"099","type":"Single","question":"為防範詐騙集團以偽造身分證盜領存款,下列敘述何者錯誤?","options":[{"option":"應透過行內全球資訊網「聯徵信用資訊查詢」項下查詢身分證資料是否正確,惟得於其無法提供查詢時,以內政部戶役政網站查詢資料作為替代","answer":false},{"option":"個人戶開戶後,其帳戶若有來自四面八方之匯款,可任其利用自動提款機提領,不必特別予以注意","answer":true},{"option":"各營業單位如發現民眾以偽造身分證盜領存款情事,可就近向當地警察機關報案","answer":false}],"remark":"【90.7.25.銀營乙字第11631號函、95.8.8.銀營一乙字第09500202361號函、95.9.5.銀營一乙字第09500226841號函】"},{"id":"存匯-100","class":"存匯","sn":"100","type":"Single","question":"以下關於新臺幣存款小額繼承之敘述,何者有誤?","options":[{"option":"應提供可確認「立切結書人為合法繼承人」之戶籍資料證明文件","answer":false},{"option":"開放繼承人領取現金,惟須收取千分之四印花稅","answer":false},{"option":"繼承人可授權予其朋友來行辦理","answer":true}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-101","class":"存匯","sn":"101","type":"Single","question":"支付繼承款項應注意事項,何者為是?","options":[{"option":"繼承人有數人時,在分割遺產前,由全體繼承人共同領取存款,並簽發以全體繼承人為受款人之本行支票支付,亦得依全體繼承人出具之申請書指示方式辦理","answer":false},{"option":"單一繼承人時,得以匯款、轉帳入繼承人本人帳戶或簽發該繼承人為受款人之本行支票或領取現金之方式辦理","answer":false},{"option":"以上皆是","answer":true}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-102","class":"存匯","sn":"102","type":"Single","question":"存款繼承在新台幣多少元以下免附遺產稅繳稅證明?","options":[{"option":"十萬元","answer":false},{"option":"二十萬元","answer":true},{"option":"二十七萬元","answer":false}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-103","class":"存匯","sn":"103","type":"Single","question":"受輔助宣告人如何辦理繼承?","options":[{"option":"由輔助人代理受輔助人辦理,無需出具受輔助宣告人委託書","answer":false},{"option":"受輔助宣告人自行辦理,無需出具輔助人同意書","answer":false},{"option":"受輔助宣告人偕同輔助人辦理","answer":true}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-104","class":"存匯","sn":"104","type":"Single","question":"臺灣地區與大陸地區人民關係條例第66條第1項規定:大陸地區人民繼承臺灣地區人民之遺產,應於繼承開始起幾年內以書面向被繼承人住所地之法院為繼承之表示;逾期視為拋棄其繼承權?","options":[{"option":"1年","answer":false},{"option":"3年","answer":true},{"option":"2年","answer":false}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-105","class":"存匯","sn":"105","type":"Single","question":"被繼承人在臺灣及大陸均有繼承人,則大陸繼承人得如何向法院聲明繼承意願?","options":[{"option":"得以海峽交流基金會驗證之大陸公證機關出具之授權委託書委託臺灣親友辦理","answer":true},{"option":"須指定遺產管理人","answer":false},{"option":"應向臺灣外交部聲明繼承意願","answer":false}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-106","class":"存匯","sn":"106","type":"Single","question":"以下關於遺囑繼承之敘述,何者為正確?","options":[{"option":"自書遺囑可以打字為之","answer":false},{"option":"遺囑未依法定方式作成或無遺囑執行人者,依一般繼承方式辦理","answer":true},{"option":"受監護宣告、輔助宣告者得為遺囑執行人及遺囑見證人","answer":false}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-107","class":"存匯","sn":"107","type":"Single","question":"繼承人得於知悉其得繼承之時起三個月內,如何拋棄繼承?","options":[{"option":"向親屬會議聲明拋棄繼承","answer":false},{"option":"書面向法院聲請拋棄其繼承權","answer":true},{"option":"向我國駐外機構聲明拋棄繼承並出具簽署之證明","answer":false}],"remark":"【存款繼承標準作業流程】"},{"id":"存匯-108","class":"存匯","sn":"108","type":"Single","question":"甲銀行接獲法院執行命令在新臺幣30萬元範圍內扣押乙存款,經查乙存款為新臺幣100萬元之整存整付存單,是否可予以扣押?","options":[{"option":"不可","answer":false},{"option":"可","answer":true},{"option":"應先通知存戶經其同意後再予以扣押","answer":false}],"remark":""},{"id":"存匯-109","class":"存匯","sn":"109","type":"Single","question":"法院扣押存款之金額低於新臺幣250元者,如何拋棄繼承?","options":[{"option":"毋庸予以扣押但須回覆法院","answer":true},{"option":"毋庸予以扣押,亦不須回覆法院","answer":false},{"option":"仍須扣押並將扣押金額回覆法院","answer":false}],"remark":""},{"id":"存匯-110","class":"存匯","sn":"110","type":"Single","question":"下列敘述何者為非?","options":[{"option":"應配合法院執行命令解繳扣押款","answer":false},{"option":"接獲法院執行命令扣押存款應立即做止扣","answer":false},{"option":"勞工開立之「OOO勞基法退休金專戶」內存款,得以扣押","answer":true}],"remark":""},{"id":"存匯-111","class":"存匯","sn":"111","type":"Single","question":"本行同業存款支票應按金額分色簽發,下列何者正確?","options":[{"option":"淺綠:滿500萬元以上","answer":true},{"option":"淺黃:不滿10萬元","answer":false},{"option":"淺藍:滿100萬以上,不滿500萬元","answer":false}],"remark":"【業務處理手冊-存款篇-銀行同業存款-國內】"},{"id":"存匯-112","class":"存匯","sn":"112","type":"Single","question":"有關票據掛失止付,下列敘述何者錯誤?","options":[{"option":"通知止付人應於提出止付通知後五日內向本行提出已為聲請公示催告之證明,否則止付通知失其效力","answer":false},{"option":"在止付之票據金額未補足前續有止付通知時,應予受理","answer":true},{"option":"對未到期日之票據受理掛失時,應先予登記,俟到期日再依規定辦理,但止付通知人仍應於止付通知後五日內提出已為聲請公示催告之證明","answer":false}],"remark":"【一般支票存款-掛失止付標準作業流程】"},{"id":"存匯-113","class":"存匯","sn":"113","type":"Single","question":"下列敘述何者正確?","options":[{"option":"定期存款中途解約時,如其利率採固定計息者,係以解約日之牌告利率,依單利,按其實際存款期間八折計息","answer":false},{"option":"為配合票信管理新制實施,客戶來行申請票據掛失止付手續,於當日退票交換前,須將票據掛失止付通知書正本送達票據交換所憑以建檔,供社會大眾查詢","answer":false},{"option":"發票地在花蓮市,付款地在高雄市之支票,發票人得於發票日十五日後,向付款銀行申請撤銷付款委託","answer":true}],"remark":"【業務處理輯要-存款】"},{"id":"存匯-114","class":"存匯","sn":"114","type":"Single","question":"支票存款戶申請票據撤銷付款委託時,下列何種情形不得受理?","options":[{"option":"提示期限經過前之支票","answer":true},{"option":"提示期限經過後之支票","answer":false},{"option":"提示期限經過前之本票","answer":false}],"remark":""}, ion":"關於「禁止背書轉讓」之支票,受款人以委任取款之目的而為背書,受任人持上開支票向本行要求代收,下列敘述何者為非?","options":[{"option":"受款人應於支票背面記載「票面金額委託○○取款」","answer":false},{"option":"由受款人與受任人共同簽章以完成委任手續,同時受任人應提示受款人身分證明文件,留存影本作傳票附件","answer":false},{"option":"若受款人已於本行設立帳戶者,仍得以委任取款方式辦理","answer":true}],"remark":"【94.1.17.銀營一乙字第09400006521號函】"},{"id":"存匯-122","class":"存匯","sn":"122","type":"Single","question":"公司、行號及法人團體等支票存款戶辦理印鑑更換,下列敘述何者為非?","options":[{"option":"由負責人(或法定代理人)提示公司登記或主管機關核准證明文件及負責人身分證明文件親自辦理","answer":false},{"option":"不具法人人格之行號或團體更換負責人,應以銷舊戶,由新負責人重新開戶方式辦理","answer":false},{"option":"若經查存戶確為網路借貸平臺業者,應請存戶於6個月內出具「網路借貸平臺業務事業與本行業務持續往來承諾書」予原存行,若未依期提供,分行應與存戶終止業務往來關係","answer":true}],"remark":"【一般支票存款一印鑑更換標準作業流程(SOP)】"},{"id":"存匯-123","class":"存匯","sn":"123","type":"Single","question":"票信管理新制自90年7月1日實施,票據以何種理由退票,無須辦理清償註記?","options":[{"option":"存款不足、發票人簽章不符","answer":false},{"option":"擅自指定金融業者為本票之擔當付款人","answer":false},{"option":"本票提示期限經過後撤銷付款委託","answer":true}],"remark":"【支票存款戶票信狀況註記須知】"},{"id":"存匯-124","class":"存匯","sn":"124","type":"Single","question":"私立學校以校長具名之正式公文擬申辦支票存款帳戶,下列敘述何者正確?","options":[{"option":"直接受理","answer":false},{"option":"須備有董事會之授權書","answer":true},{"option":"校長不需提示雙證件辦理","answer":false}],"remark":"【76.9.1.銀營乙字第10615號函】"},{"id":"存匯-125","class":"存匯","sn":"125","type":"Single","question":"辦理支票存款開戶作業應注意事項,下列敘述何者錯誤?","options":[{"option":"填寫「開戶往來作業檢核表」並逐項勾選,審核開戶證件齊全、留存雙重身分證明文件;申請書及約定書由申請人親簽及勾選往來約定書審閱聲明事項","answer":false},{"option":"如客戶延遲於本行核准後逾二個月辦理開戶,應再次辦理徵信及收取票信查詢費,並重新查詢Z21、Z22、G0053及查詢受監護、輔助宣告情形,且列印留存,並於開戶申請書備註重新查核項目及日期,相關查詢資料一同併入往來約定書保管","answer":true},{"option":"受理非自然人開戶,應由負責人親自簽名或簽名及蓋章於支票存款開戶申請書、支票存款往來約定書及印鑑卡上","answer":false}],"remark":"【一般支票存款-公司、行號/個人開戶標準作業流程(SOP)】"},{"id":"存匯-126","class":"存匯","sn":"126","type":"Single","question":"關於本票未載到期日依票據法第124條及第66條第2項準用第45條規定,除有以特約縮短或延長外,提示期間為發票日起多久內?","options":[{"option":"6個月","answer":true},{"option":"7日","answer":false},{"option":"15日","answer":false}],"remark":"【92.3.21.銀營一乙字第09200059031號函】"},{"id":"存匯-127","class":"存匯","sn":"127" "option":"票據大寫金額之「貳」寫成「兩」字","answer":false},{"option":"支票中文大寫金額書寫「另」字","answer":true},{"option":"支票金額填記於憑票支付欄","answer":false}],"remark":"【中央銀行業務局71.7.16.(71)台央業字第857號函、71.9.9.(71)台央業字第1135號函、69.9.26.(69)台央業字第1249號函】"},{"id":"存匯-134","class":"存匯","sn":"134","type":"Single","question":"委託銀行為擔當付款人之本票,下列敘述何者正確?","options":[{"option":"由銀行對該本票擔保付款","answer":false},{"option":"銀行僅受託擔任該本票之付款而已,並不擔保該本票之付款","answer":true},{"option":"該本票係委託人以現金或存款向銀行申請,由銀行簽發之「本行支票」","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-135","class":"存匯","sn":"135","type":"Single","question":"支票之提示期限經過後,發票人向付款銀行申請撤銷付款委託時,如該支票曾因存款不足退票,付款銀行得否受理撤銷付款委託?","options":[{"option":"仍得受理","answer":true},{"option":"不得受理","answer":false},{"option":"得選擇受理或不受理","answer":false}],"remark":"【業務處理手冊-存款、中央銀行業務局73.5.21(73)台央業字第715號函】"},{"id":"存匯-136","class":"存匯","sn":"136","type":"Single","question":"對支票存款戶之票據掛失止付,下列敘述何者錯誤?","options":[{"option":"通知止付人應於提出止付通知後五個營業日內,向本行提出已為聲請公示催告之證明,否則止付通知失其效力","answer":true},{"option":"受理發票人掛失完全空白票據及業經掛失完全空白票據之註銷,可免登報聲明","answer":false},{"option":"對到期日前之票據受理掛失時,應先予登記,俟到期日再依規定辦理。但票據權利人仍應依規定於止付通知後五日內,向本行提出已為聲請公示催告之證明","answer":false}],"remark":"【票據掛失止付處理規範】"},{"id":"存匯-137","class":"存匯","sn":"137","type":"Single","question":"下列敘述何者錯誤?","options":[{"option":"支票之發票地、付款地均在高雄市,其應於發票日後七日內之法定期限經過後,始得申請撤銷付款委託","answer":false},{"option":"票據依假處分程序,經通知付款行社後,該項票據為執票人提示時,提示人不為禁止提示付款之人,應不得付款","answer":true},{"option":"假處分票據,經禁止提示人提示退票後,執票人如將該票據轉讓他人重提交換,或改委其他行社提示交換者,銀行一律不得接受","answer":false}],"remark":""},{"id":"存匯-138","class":"存匯","sn":"138","type":"Single","question":"有關票據掛失止付手續,下列敘述何者錯誤?","options":[{"option":"票據權利人為止付之通知時,應填具「掛失止付通知書」及「遺失票據申報書」","answer":false},{"option":"付款行庫應即將「掛失止付通知書」及「遺失票據申報書」一併送票據交換所","answer":true},{"option":"通知止付人應於提出止付通知後五日內,向付款行庫提出已為聲請公示催告之證明,否則止付通知失其效力","answer":false}],"remark":"【票據掛失止付處理規範】"},{"id":"存匯-139","class":"存匯","sn":"139","type":"Single","question":"下列敘述何者錯誤?","options":[{"option":"支票經付款行庫保付者,依法得掛失止付","answer":true},{"option":"業經通知止付之票據,票據權利人如聲請票據金額之支付,應俟法院除權判決後,具據憑以辦理,但在公示催告程序開始後,而票據業經到期者,得提供確實擔保予以支付,不能提供擔保時,得請求將票據金額依法提存","answer":false},{"option":"票據掛失止付通知撤銷或未於規定時間內辦理公示催告,付款行庫應通知票據交換所","answer":false}],"remark":"【票據掛失止付處理規範】"},{"id":"存匯-140","class":"存匯","sn":"140","type":"Single","question":"有關發票人於「憑票支付」欄已蓋有受款人印章之支票,經以不同形式之印章背書後提出交換,下列敘述何者正確?","options":[{"option":"以背書不全理由退票","answer":false},{"option":"倘名義上相同,付款行應即受理","answer":true},{"option":"以受款人未以相同印鑑背書理由退票","answer":false}],"remark":"【90.4.30.銀營乙字第07145號函】"},{"id":"存匯-141","class":"存匯","sn":"141","type":"Single","question":"對已辦妥票據掛失止付手續,經向法院辦理公示催告中之票據掛失止付案件,下列敘述何者錯誤?","options":[{"option":"已提存足敷票款時,以「經掛失止付」理由退票;如提存不足,以「存款不足及票據經掛失止付」雙重理由退票","answer":false},{"option":"經辦員應告知通知止付人須於止付通知次日起算五個營業日內,應提出已為聲請公示催告之證明","answer":true},{"option":"「票據掛失止付備付款」如懸帳已久未銷,應積極查明原因,將查明之原因於掛失止付通知書上加註備查,不得轉銷","answer":false}],"remark":"【一般支票存款-掛失止付標準作業流程(SOP)】"},{"id":"存匯-142","class":"存匯","sn":"142","type":"Single","question":"有關不具法人人格之行號或團體開立支票存款戶,下列敘述何者錯誤?","options":[{"option":"應以負責人名義申請開戶,但行號或團體可併列於戶名內","answer":false},{"option":"「提供虛擬資產服務之事業或人員」:鑒於虛擬資產具高度投機性及高風險性,且金流複雜不易有效執行相關交易監控,為妥適控管本行作業風險,本行暫不接受申請開戶","answer":false},{"option":"對象別依個人戶登錄","answer":true}],"remark":"【一般支票存款-公司、行號及其他團體開戶標準作業流程(SOP)】"},{"id":"存匯-143","class":"存匯","sn":"143","type":"Single","question":"有關本行銀行同業支票存款,下列敘述何者錯誤?","options":[{"option":"銀行同業簽發之支票,可由其客戶提領現款","answer":true},{"option":"開設銀行同業支票存款戶,係為其資金調度、委託收解匯款及清算交換差額用","answer":false},{"option":"該銀行同業如因頭寸不足或抵補交換差額需要,不論在交換前或交換後,經本行同意後,將所收金額滿新台幣300萬元以上本行付款之票據逕行轉帳入帳","answer":false}],"remark":"【本行銀行同業支票存款往來約定事項】"},{"id":"存匯-144","class":"存匯","sn":"144","type":"Single","question":"有關票據上之權利,下列敘述何者錯誤?","options":[{"option":"對支票發票人自發票日起算,一年間不行使,因時效而消滅","answer":false},{"option":"支票之執票人,對前手之追索權,四個月間不行使,因時效而消滅","answer":false},{"option":"支票之背書人,對前手之追索權,三個月間不行使,因時效而消滅","answer":true}],"remark":"【票據法第22條】"},{"id":"存匯-145","class":"存匯","sn":"145","type":"Single","question":"支票存款戶銷戶,收回作廢之空白票據應如何處理?","options":[{"option":"應逐張於正面加蓋「空白作廢」戳記及截角或打洞","answer":true},{"option":"作當日之傳票附件","answer":false},{"option":"應保管二年以上,始可辦理銷毀","answer":false}],"remark":"【一般支票存款-結清銷戶標準作業流程(SOP)】"},{"id":"存匯-146","class":"存匯","sn":"146","type":"Single","question":"票據權利人掛失業經簽章而未記載完成之空白票據或空白票據用紙,如經補充記載完成提示時,提示之票據應如何辦理?","options":[{"option":"簽章不符時,以「掛失空白票據」理由退票","answer":true},{"option":"簽章相符時,照付","answer":false},{"option":"簽章相符時,如存款不足,以「存款不足」理由退票","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-147","class":"存匯","sn":"147","type":"Single","question":"票據權利人喪失業經退票之支票時,得否辦理掛失止付?","options":[{"option":"不得辦理","answer":false},{"option":"得辦理","answer":true},{"option":"經票據交換所同意始得辦理","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-148","class":"存匯","sn":"148","type":"Single","question":"依「票據掛失止付處理規範」規定,票據權利人就票載發票日屆至前之支票為止付之通知時,票據權利人須於何時前提出已為聲請公示催告之證明,否則止付通知失其效力?","options":[{"option":"止付通知次日起算五日內","answer":true},{"option":"止付通知後五個營業日內","answer":false},{"option":"發票日後五日內","answer":false}],"remark":"【一般支票存款-掛失止付標準作業流程(SOP)】"},{"id":"存匯-149","class":"存匯","sn":"149","type":"Single","question":"下列何者得受理票據掛失止付?","options":[{"option":"本行支票","answer":true},{"option":"保付支票","answer":false},{"option":"無存款且未經允許墊借票款之票據","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-150","class":"存匯","sn":"150","type":"Single","question":"銀行與支存戶互負債務,經銀行實行抵銷權結清該支存戶,若有第三者匯款至該已結清之支存戶,銀行對該筆匯款應如何處理?","options":[{"option":"可行使抵銷權以償還該支存戶積欠之債務","answer":false},{"option":"暫掛其他應付款,通知存戶應先償還欠款後方可領回","answer":false},{"option":"應辦理退匯","answer":true}],"remark":""},{"id":"存匯-151","class":"存匯","sn":"151","type":"Single","question":"有關媒體交換作業,下列敘述何者錯誤?","options":[{"option":"代付案件提示交換之應付(提出)、應收(提回)交換差額,於提示交換日當日辦理清算","answer":false},{"option":"代付案件提示交換之應付(提出)、應收(提回)交換差額,於提示交換日之次一營業日辦理清算","answer":true},{"option":"該批代付案件之退件交換差額,則於次一營業日辦理清算","answer":false}],"remark":"【台灣票據交換所媒體交換作業要點】"},{"id":"存匯-152","class":"存匯","sn":"152","type":"Single","question":"有關支票存款戶申辦交換票據抵用,下列何者為非?","options":[{"option":"支存戶為發票人之交換票據不得抵用","answer":false},{"option":"抵用額度企業戶每戶最高新臺幣一千五百萬元,自然人每戶最高新臺幣五百萬元,由營業單位經理核定","answer":false},{"option":"企業戶每戶逾新臺幣六千萬元而在新臺幣一億元(含)以下之案件由授信審查部經理核定","answer":true}],"remark":"【業務規章-存款目】"},{"id":"存匯-153","class":"存匯","sn":"153","type":"Single","question":"支票存款戶因存款不足退票後,發票人得自退票之次日起算多久清償票款,得申請註記退票?","options":[{"option":"七個營業日","answer":false},{"option":"一年","answer":false},{"option":"三年","answer":true}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-154","class":"存匯","sn":"154","type":"Single","question":"票據權利人同時掛失止付同一帳號二張票據時,如存戶之存款餘額,尚不足支付任何一張時,應如何處理?","options":[{"option":"二張均可受理掛失","answer":false},{"option":"只能受理其中一張","answer":true},{"option":"二張均不可受理掛失","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-155","class":"存匯","sn":"155","type":"Single","question":"有關受理開立支票存款戶,以下敘述何者錯誤?","options":[{"option":"外國人應在臺設有住所,並須留存護照及居留證影本","answer":false},{"option":"公司、行號及其他團體負責人為外國人者,須在臺設有住所","answer":true},{"option":"政府機關、學校、公營事業申請開戶,應憑正式公文辦理","answer":false}],"remark":"【支票存款戶處理規範】"},{"id":"存匯-156","class":"存匯","sn":"156","type":"Single","question":"支存戶有下列何種情形時,應嚴格控管票據之發給?","options":[{"option":"有簽章不符退票情事","answer":false},{"option":"使用票據有不正常情形","answer":true},{"option":"存款雖被扣押,但已如數提存備付款","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-157","class":"存匯","sn":"157","type":"Single","question":"辦理支票存款各項申請作業,下列敘述何者錯誤?","options":[{"option":"公司或法人戶負責人異動變更印鑑時,應向台灣票據交換所查詢新負責人票信及至司法院網站查詢受監護、輔助宣告情形,同時以K50(變更內容)變更相關主檔。須交付「臺灣銀行股份有限公司履行個人資料保護法告知義務書」,並由經辦人員於申請書上空白處註記「業經臨櫃口頭告知,並交付個資告知內容」等語或同義文字並加蓋私章","answer":false},{"option":"對已製妥之空白票據,如逾期六個月仍未領取,應再洽存戶了解領用票據之使用情形,若無法聯繫得比照結清銷戶收回空白票據作廢方式處理","answer":false},{"option":"自然人存戶單次申請發給空白票據25張(含)以上者,應簽請較高層級主管(經理或副理)核准後辦理","answer":true}],"remark":"【一般支票存款-印鑑更換,一般支票存款空白支、本票標準作業流程(SOP)】"},{"id":"存匯-158","class":"存匯","sn":"158","type":"Single","question":"到期之票據,通知止付人於下列何種情況,得提供本行認可之擔保,申請支付票款?","options":[{"option":"通知止付後","answer":false},{"option":"聲請公示催告後","answer":false},{"option":"取得法院准予公示催告裁定文件後","answer":true}],"remark":"【一般支票存款-掛失止付標準作業流程(SOP)】"},{"id":"存匯-159","class":"存匯","sn":"159","type":"Single","question":"本票之發票人於票據提示期限經過前撤銷付款委託,經執票人提示所發生的退票,未辦妥清償贖回註記,一年內達三張者,自票據交換所通報之日起,應如何處理?","options":[{"option":"各金融業者予以拒絕往來三年","answer":false},{"option":"各金融業者三年內不得再受託擔當本票付款人","answer":true},{"option":"擔當付款金融業者應終止支票存款往來契約","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-160","class":"存匯","sn":"160","type":"Single","question":"銀行被通知,票據權利人已依假處分程序聲請法院裁定禁止占有票據之人向付款行提示付款,該票據經提示時,下列何者為非?","options":[{"option":"當提示人為被禁止提示付款人時,不得付款","answer":false},{"option":"當提示人不為被禁止提示付款人時,不得付款","answer":true},{"option":"票據上經執行法院記載假處分事由者,各金融業者即不得接受提示交換","answer":false}],"remark":"【金融業者處理假處分票據應注意事項】"},{"id":"存匯-161","class":"存匯","sn":"161","type":"Single","question":"本行支票申請變更抬頭人之記載,櫃員受理時應注意事項,下列敘述何者為非?","options":[{"option":"公司、行號及法人團體等申請變更抬頭人,由負責人(或法定代理人、被授權人),提示相關證明文件及「原K31傳票」相同簽章親自辦理","answer":false},{"option":"應確認申請更改之抬頭人是否為資恐防制法指定制裁之個人、法人或團體","answer":false},{"option":"經背書之本行支票,仍得申請變更抬頭人","answer":true}],"remark":"【本行支票內容變更標準作業流程(SOP)】"},{"id":"存匯-162","class":"存匯","sn":"162","type":"Single","question":"辦理票據掛失止付不須檢附下列何者?","options":[{"option":"票據掛失止付通知書","answer":false},{"option":"遺失票據申報書","answer":false},{"option":"登報","answer":true}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-163","class":"存匯","sn":"163","type":"Single","question":"見票即付之本票,執票人對發票人自發票日起算多久不行使,因時效而消滅?","options":[{"option":"一年","answer":false},{"option":"二年","answer":false},{"option":"三年","answer":true}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-164","class":"存匯","sn":"164","type":"Single","question":"銀行可否應存戶之要求於空白支票或本票上加印存戶指定之樣式?","options":[{"option":"可以","answer":true},{"option":"不可以","answer":false},{"option":"無此規定","answer":false}],"remark":"【支票存款戶處理規範】"},{"id":"存匯-165","class":"存匯","sn":"165","type":"Single","question":"存戶簽發以本行為擔當付款人之本票,下列何種情形應予退票?","options":[{"option":"非本行印發之本票,但係委託票券公司承銷並經本行同意擔當付款人","answer":false},{"option":"本行終止擔當付款人之委託後所簽發之本票","answer":true},{"option":"未記載受款人者","answer":false}],"remark":"【業務處理手冊-存款】"},{"id":"存匯-166","class":"存匯","sn":"166","type":"Single","question":"本行支票存款戶申辦優良存戶交換票據抵用,下列敘述何者正確?","options":[{"option":"申請抵用之票據,限申請抵用當日本埠之交換票據,經向付款銀行查證已獲交換通過者","answer":true},{"option":"每戶抵用額度以其在受理營業單位最近六個月支票存款平均餘額之三倍為限","answer":false},{"option":"支存戶簽發之票據得申請抵用","answer":false}],"remark":"【本行支票存款戶交換票據抵用處理辦法】"},{"id":"存匯-167","class":"存匯","sn":"167","type":"Single","question":"本行支票申請內容變更,下列敘述何者為非?","options":[{"option":"除立即存入更改後票據權利人本行帳戶,可由有權人員簽章更改外,其餘以收回原支票,另簽一紙支票之方式處理","answer":false},{"option":"收回原本行支票時,須於票背加蓋「本支票申請更改抬頭(或申請/取消禁止背書轉讓),重新轉開OOO新支票一紙」,另於原本行支票申請書上註明受理日期及申請變更抬頭人(或申請/取消禁止背書轉讓)","answer":false},{"option":"「本行支票內容變更申請書」正本應做手續費傳票附件","answer":true}],"remark":"【本行支票內容變更標準作業流程(SOP)】"},{"id":"存匯-168","class":"存匯","sn":"168","type":"Single","question":"營業單位所收之代收票據,透過「集中作業系統」掃描傳送至作業中心,台中分行存戶存入華南銀行豐原分行付款之即期票據,該分行應使用何種批次掃描?","options":[{"option":"次交票據","answer":true},{"option":"一般託收","answer":false},{"option":"即入即出","answer":false}],"remark":""},{"id":"存匯-169","class":"存匯","sn":"169","type":"Single","question":"營業單位所收之代收票據,透過「集中作業系統」掃描傳送至作業中心,批次卡資料錯誤,下列敘述何者正確?","options":[{"option":"批次類別錯誤,實體票據尚在營業單位,以業務通訊通知作業中心「整批刪除」錯誤批次,再重新掃描正確的批次卡及票據","answer":true},{"option":"批次總金額錯誤,實體票據尚在營業單位,以業務通訊通知作業中心「整批刪除」錯誤批次,再重新選擇正確的批次及掃描票據","answer":false},{"option":"票據掃描重疊,以業務通訊通知作業中心刪除該張影像,再重新選擇原批次及掃描該張票據","answer":false}],"remark":""},{"id":"存匯-170","class":"存匯","sn":"170","type":"Single","question":"營業單位之代收票據,透過「集中作業系統」掃描傳送至作業中心,由作業中心負責資料登打作業,請問哪一種批次卡之票據到期日毋庸作業中心逐筆登打,由系統自動以次營業日作為票面到期日?","options":[{"option":"即入即出","answer":false},{"option":"次交票據","answer":true},{"option":"一般託收","answer":false}],"remark":""},{"id":"存匯-171","class":"存匯","sn":"171","type":"Single","question":"臨櫃人員收到託收票據時,在票據上一律加蓋何種印章以符規定?","options":[{"option":"親收章","answer":true},{"option":"交換章","answer":false},{"option":"轉帳章","answer":false}],"remark":""},{"id":"存匯-172","class":"存匯","sn":"172","type":"Single","question":"使用即入即出批次作業,由收票行以限時掛號將票據及代收票據提送明細表逕寄何處?","options":[{"option":"所屬作業中心","answer":false},{"option":"付款行","answer":false},{"option":"提示交換之作業中心","answer":true}],"remark":""},{"id":"存匯-173","class":"存匯","sn":"173","type":"Single","question":"有關櫃員現金箱管理,下列敘述何者錯誤?","options":[{"option":"各營業單位應每日互換或互點櫃員現金箱,無例外情形","answer":true},{"option":"如囿於實際狀況,無法每日互換櫃員現金箱,則採櫃員互點(非固定一組),須於現金箱明細表上填寫核符並簽章,俾利內部控管及責任歸屬","answer":false},{"option":"現金互換及互點方式,不適用於特殊性質櫃檯(如硬幣兌換、機場外幣兌換等)","answer":false}],"remark":"【出納業務-標準作業流程】"},{"id":"存匯-174","class":"存匯","sn":"174","type":"Single","question":"大出納櫃員收款超過授權額度者,依傳票金額點收相符後,傳票及收據聯之處理以何者為正確?","options":[{"option":"傳票上加蓋「現金收付章」登入現金收入記錄表,收據聯加蓋「櫃員章」後交給客戶","answer":false},{"option":"傳票上加蓋「現金收付章」登入記錄表連同收據聯,送主管人員核章並加蓋「腰圓形行名章」後交給客戶","answer":false},{"option":"傳票上加蓋「現金收付章」登入記錄表連同收據聯,送主管人員核章並加蓋「腰圓形行名章」、私章於收據上後交客戶","answer":true}],"remark":"【出納業務-標準作業流程、重要單證中文簽章辦法】"},{"id":"存匯-175","class":"存匯","sn":"175","type":"Single","question":"有關櫃員現金管理,下列敘述何者錯誤?","options":[{"option":"發生現金短少,需應先經單位主管同意,始得帳列「其他應收款-溢付短收現金」","answer":false},{"option":"發生現金溢收,不論金額多寡,均依規定帳列「其他應付款-待轉款項」","answer":true},{"option":"發生現金溢收或短少等情事,應依當日現金收付記錄表逐筆勾稽並調閱影像,查明短少或溢收緣由,並立即向會計、出納主管及轄管業務主辦人員報告","answer":false}],"remark":"【出納業務-標準作業流程】"},{"id":"存匯-176","class":"存匯","sn":"176","type":"Single","question":"有關國內整批匯款作業,如逾16:50分跨行匯出,致交易滯留本行匯款系統中心端,查詢R0061(匯出入失敗查詢)處理結果為尚未解碼,下列說明何者錯誤?","options":[{"option":"每營業日匯款系統開機後,匯款經辦應先執行R75(前營業日交易確認)交易,查看前一日匯款狀況","answer":false},{"option":"逾時匯出滯留本行匯款系統中心端之交易,應於次日再自行匯出","answer":true},{"option":"「RT-DLY-1018報表」可供營業單位查詢前營業日未匯出匯款明細、總筆數及總金額","answer":false}],"remark":"【國內匯兌-匯出匯款連線作業標準作業流程(SOP)】"},{"id":"存匯-177","class":"存匯","sn":"177","type":"Single","question":"金融機構辦理國內匯款作業確認客戶身份原則,下列何者錯誤?","options":[{"option":"新臺幣3萬以上50萬以下(不含)之國內現金匯款,及新臺幣3萬元以上之國內匯款,應核驗匯款人身份","answer":false},{"option":"若為代理人辦理匯款,應於匯款申請書加註代理人姓名及身分證號碼(或統一證號)","answer":false},{"option":"若為代理人辦理3萬元以下匯款,應核對匯款人及代理人證件","answer":true}],"remark":"【108.6.28.銀營運乙字第10800578441號函】"},{"id":"存匯-178","class":"存匯","sn":"178","type":"Single","question":"有關國內匯款,下列何者錯誤?","options":[{"option":"跨行匯款截止時間為16時50分","answer":false},{"option":"當系統異常時,有跨行匯款需延長時間者,須於下午15時30分前通知國內營運部","answer":false},{"option":"同一時間受理跨行匯款,依規定合計金額達10億以上,匯出前應先通知國內營運部","answer":true}],"remark":"【國內匯兌篇業務手冊及匯出匯款SOP】"},{"id":"存匯-179","class":"存匯","sn":"179","type":"Single","question":"下列有關臨時性匯款客戶何者錯誤?","options":[{"option":"指非本行客戶辦理匯款","answer":false},{"option":"新臺幣3萬元(含)以上之臨時性交易,須進行確認客戶身分措施,客戶為自然人(含代理人)須徵提身分證明文件並留存身分證明文件影本","answer":true},{"option":"客戶為非自然人時,須徵提「法人、團體聲明書」,並取得主管機關登記文件、公司章程或類似之權力文件、股東名冊、公司年報等其他可信文件或資料來源進行驗證","answer":false}],"remark":"【國內匯兌-匯出匯款連線作業標準作業流程(SOP)】"},{"id":"存匯-180","class":"存匯","sn":"180","type":"Single","question":"下列敘述何者錯誤?","options":[{"option":"申請中央登錄債券各項登記,自然人及法人應在本行登記單位開立債券帳戶及活期性存款帳戶","answer":false},{"option":"客戶承購中央登錄債券,得透過本行登記單位委託財務部以票券商名義投標","answer":true},{"option":"本行所屬單位經報中央銀行核備者,得經辦中央登錄債券各項登記業務","answer":false}],"remark":"【臺灣銀行股份有限公司辦理中央登錄債券作業要點】"},{"id":"存匯-181","class":"存匯","sn":"181","type":"Single","question":"有關本行中央登錄債券作業,下列敘述何者正確?","options":[{"option":"該債券為記名式,其承購、轉讓、繳存準備、設定質權及充公務上之保證等事項,均應依本作業要點之規定辦理登記,非經登記,不得對抗第三人","answer":true},{"option":"本行登記單位應按得標單位別,於發行次一營業日規定時間前,辦妥承購繳款","answer":false},{"option":"債券發行日,本行逕依得標單位填具之「承購登記申請書」所載承購客戶別,轉入客戶之債券帳戶","answer":false}],"remark":"【臺灣銀行股份有限公司辦理中央登錄債券作業要點】"},{"id":"存匯-182","class":"存匯","sn":"182","type":"Single","question":"為因應同業競爭,授權單位主管對中央登錄債券客戶最近半年之債券平均餘額達新台幣多少億元,其帳戶維護費享有優惠措施之權限,下列敘述何者錯誤?","options":[{"option":"1-5億元給予9折","answer":true},{"option":"10億元給予8折","answer":false},{"option":"20億元給予7折及30億元給予6折","answer":false}],"remark":"【臺灣銀行辦理中央登錄債券手續費收費標準】"},{"id":"存匯-183","class":"存匯","sn":"183","type":"Single","question":"有關本行辦理票券清算交割業務,下列敘述何者錯誤?","options":[{"option":"票券清算交割業務係依據銀行營業執照中之「經中央主管機關核准之代理服務業務」辦理,各分行應先檢視本身營業執照是否有已加註,或須先辦理換照事宜,經辦人員須擁有票券人員執照","answer":true},{"option":"營業部擔任「清算交割銀行」承轉行","answer":false},{"option":"營業單位欲辦理票券清算交割業務應先函報總行核備","answer":false}],"remark":"【92.12.22.銀營一乙字第09200287611號函】"},{"id":"存匯-184","class":"存匯","sn":"184","type":"Single","question":"下列匯款作業敘述何者錯誤?","options":[{"option":"匯款金額新臺幣三萬元(含)以上、伍拾萬元(不含)以下之現金匯款,及新臺幣三萬元以上之轉帳匯款,應檢視匯款人或代理人身分","answer":false},{"option":"臨櫃經辦執行R1001交易進行即時姓名檢核時,其掃描結果為疑似命中,經AML經辦調查、AML主管覆核為拒絕交易,臨櫃經辦須將其拒絕交易之匯款申請書及列印檢核結果,併同作為當日無傳票附件","answer":false},{"option":"臨櫃經辦執行R1001交易進行即時姓名檢核時,其檢核結果確係資恐法之制裁份子,應拒絕交易並將款項歸還匯款人","answer":true}],"remark":"【國內匯兌-匯出匯款連線作業標準作業流程(SOP)、107.04.23營運存字第10700023641號函、106.07.04法洗錢字第10600014391號函】"},{"id":"存匯-185","class":"存匯","sn":"185","type":"Single","question":"匯款人與扣款帳戶不一致時之匯款,下列何者錯誤?","options":[{"option":"倘交易金額達50萬,應填寫「國內匯出匯款作業檢核表」","answer":false},{"option":"匯款金額達50萬元(含)以上時,須影印匯款人及代理人(如有)身分證明文件,併同檢核表留存","answer":true},{"option":"匯款金額不論多寡皆需於備註「匯款人非扣款帳戶本人」","answer":false}],"remark":"【國內匯兌-匯出匯款連線作業標準作業流程(SOP)】"},{"id":"存匯-186","class":"存匯","sn":"186","type":"Single","question":"匯款金額在櫃員授權限額內,其回條聯(收據)加蓋何種印章與私章後交客戶收執?","options":[{"option":"櫃員章","answer":false},{"option":"親收章","answer":false},{"option":"現金收付章或轉帳章","answer":true}],"remark":""},{"id":"存匯-187","class":"存匯","sn":"187","type":"Single","question":"匯入匯款若出現〝尚未入戶〞且經AML系統執行姓名檢核屬未命中,經由匯款櫃員查證帳號、戶名無誤後,下列敘述何者錯誤?","options":[{"option":"收款人帳號為公庫存款,執行R2600交易立即入收款人帳戶","answer":false},{"option":"收款人帳號為非公庫存款,於執行R2600交易後,需由主管執行R2601核對放行後,始入收款人帳戶(靜止戶、警示戶、公教戶除外)","answer":false},{"option":"營業中務必要隨時查詢R0059交易確認匯款入帳狀態","answer":true}],"remark":"【107年5月4日營運存字第10700023671號函】"},{"id":"存匯-188","class":"存匯","sn":"188","type":"Single","question":"非入戶匯款尚未解款銷帳前,如需要改匯,應向何處申請退匯後重新改匯?","options":[{"option":"解款行","answer":false},{"option":"匯款行","answer":true},{"option":"就近聯行","answer":false}],"remark":""},{"id":"存匯-189","class":"存匯","sn":"189","type":"Single","question":"為符合防制洗錢及打擊資恐規範,國內新臺幣單筆匯出匯款作業下列敘述何者錯誤?","options":[{"option":"當AML系統(國內防制洗錢及打擊資恐系統)關閉或故障時,即不須執行姓名檢核","answer":true},{"option":"當AML系統掃描後,有疑似命中者,須通知AML相關人員調查覆核後,並經AML主管為放行交易,才可續行交易","answer":false},{"option":"不論金額大小或是否已申報大額通貨交易,如有疑似洗錢或資恐表徵,均應申報可疑交易","answer":false}],"remark":"【國內匯兌篇業務手冊及匯出匯款SOP/控管點】"},{"id":"存匯-190","class":"存匯","sn":"190","type":"Single","question":"保管箱承租人申請遺失鑰匙補發,除信安分行自動化保管箱因需整組更換鎖頭及鑰匙,其每件作業費用為新台幣(以下同)一千元整,其餘分行之承租人應給付每件遺失鑰匙補發作業費用多少元?","options":[{"option":"參佰元","answer":false},{"option":"伍佰元","answer":true},{"option":"捌佰元","answer":false}],"remark":"【保管箱作業-庫房、鑰匙、磁卡、鎖頭及監視系統管理標準作業流程】"},{"id":"存匯-191","class":"存匯","sn":"191","type":"Single","question":"保管箱承租人租期屆滿,經本行以書面通知於指定期限(30日)內至本行辦理續租或退租手續,承租人已逾該指定期限達多久而未辦者,本行得請求公證人,會同辦理破封開箱手續 ?","options":[{"option":"二個月","answer":false},{"option":"三個月","answer":true},{"option":"四個月","answer":false}],"remark":"【保管箱作業-繼承、破封開箱、領回置放物標準作業流程】"},{"id":"存匯-192","class":"存匯","sn":"192","type":"Single","question":"本行員工保管箱優惠辦法規定,何者錯誤?","options":[{"option":"適用在本行服務滿一年以上在職員工","answer":false},{"option":"保證金及租金七折優惠","answer":true},{"option":"本行退休人員亦為優惠適用對象","answer":false}],"remark":"【保管箱作業-租用、開箱標準作業流程】"},{"id":"存匯-193","class":"存匯","sn":"193","type":"Single","question":"下列敘述何者正確?","options":[{"option":"本行辦理破封開箱作業,應請國稅局人員會同辦理","answer":false},{"option":"破封開箱後,若承租人仍有積欠租金,本行無權拍賣箱內物品抵償","answer":false},{"option":"客戶逾期未繳租金,若催理期程皆無延誤,最快滿4個月即可辦理破封開箱作業","answer":true}],"remark":"【保管箱作業-繼承、破封開箱、領回置放物標準作業流程】"},{"id":"存匯-194","class":"存匯","sn":"194","type":"Single","question":"有關保管箱鑰匙交付作業,下列何者正確?","options":[{"option":"正鑰匙由保管箱經辦於攝錄鏡頭範圍內當客戶面拆封鑰匙袋交付","answer":false},{"option":"副鑰匙彌封,應於「保管箱(副)鑰匙袋」正面及背面彌封處加蓋承租戶原留印鑑及加註封存日期","answer":false},{"option":"保管箱主管應填具保管物品通知書,即時將「保管箱(副)鑰匙袋」,送交出納部門列入保管品保管","answer":true}],"remark":"【保管箱作業-租用、開箱標準作業流程】"},{"id":"存匯-195","class":"存匯","sn":"195","type":"Single","question":"保管箱業務場所相關監視系統之錄影影像資料,應至少保存多久?","options":[{"option":"永久保留","answer":false},{"option":"三個月","answer":false},{"option":"六個月","answer":true}],"remark":"【保管箱作業-庫房、鑰匙、磁卡、鎖頭及監視系統管理標準作業流程】"},{"id":"存匯-196","class":"存匯","sn":"196","type":"Single","question":"有關保管箱破封開箱作業,於新台幣(以下同)多少金額以內,自行洽詢公證人估算破封開箱費用並簽陳單位主管核准?","options":[{"option":"3萬元","answer":false},{"option":"5萬元","answer":false},{"option":"10萬元","answer":true}],"remark":"【保管箱作業-繼承、破封開箱、領回置放物標準作業流程】"},{"id":"存匯-197","class":"存匯","sn":"197","type":"Single","question":"保管箱承租人於到期續約日以現金繳付租金,應以何種科目列帳?","options":[{"option":"借:現金、貸:預收收入","answer":true},{"option":"借:現金、貸:手續費收入-保管手續費","answer":false},{"option":"借:現金、貸:什項收人-其他收入","answer":f ,{"id":"存匯-281","class":"存匯","sn":"281","type":"Single","question":"受款人為政府機關之公庫支票,票面未劃平行線,提示時應如何辦理?","options":[{"option":"經審視背書與票載受款人相符,即可照付現金","answer":false},{"option":"須覓具代庫機構認可之保證人簽章,始得付現","answer":false},{"option":"應存入該機關之公庫帳戶,不得提現","answer":true}],"remark":""},{"id":"存匯-282","class":"存匯","sn":"282","type":"Single","question":"公庫支票正面記載禁止背書轉讓時,下列何者為是?","options":[{"option":"不需加蓋機關原留印鑑,即生效力","answer":true},{"option":"必須加蓋機關原留印鑑,始生效力","answer":false},{"option":"僅須加蓋機關主管印鑑即可","answer":false}],"remark":""},{"id":"存匯-283","class":"存匯","sn":"283","type":"Single","question":"下列敘述何者錯誤?","options":[{"option":"公庫支票經背書轉讓者,不得撤銷平行線","answer":false},{"option":"公庫機關專戶支票不得委任取款","answer":true},{"option":"以個人為抬頭並禁止背書轉讓之機關專戶支票,無論金額大小,皆須核對提領人身份證明文件,如有不符則不予付款","answer":false}],"remark":""},{"id":"存匯-284","class":"存匯","sn":"284","type":"Single","question":"劃平行線並載有禁止背書轉讓之公庫支票(含公庫機關專戶存款支票),得由下列何者持向付款代庫申請匯往受款人在其他金融機構之帳戶?","options":[{"option":"受款人","answer":false},{"option":"發票機關","answer":true},{"option":"以上皆可","answer":false}],"remark":""},{"id":"存匯-285","class":"存匯","sn":"285","type":"Single","question":"依「中央銀行委託金融機構辦理國庫事務要點」之規定,國庫機關專戶存款,以下何種性質別存款不得計息?","options":[{"option":"經費款專戶","answer":true},{"option":"保管款專戶","answer":false},{"option":"特種基金專戶","answer":false}],"remark":""},{"id":"存匯-286","class":"存匯","sn":"286","type":"Single","question":"國庫機關專戶存款支票,受款人為政府機關者,不論劃線與否或票面是否記載禁止背書轉讓,如經受款人填具繳款書(或支出收回書)持向代庫辦理繳庫,此時代庫可否受理?","options":[{"option":"不得受理","answer":false},{"option":"填具切結書表示一切後果自行負責後,予以受理","answer":false},{"option":"應予受理","answer":true}],"remark":""},{"id":"存匯-287","class":"存匯","sn":"287","type":"Single","question":"遺失空白國庫機關專戶存款支票辦理掛失止付手續應否登報?","options":[{"option":"應登報","answer":true},{"option":"免登報","answer":false},{"option":"立切結書一切責任自付,可免登報","answer":false}],"remark":""},{"id":"存匯-288","class":"存匯","sn":"288","type":"Single","question":"遺失載有「禁止背書轉讓」之公庫機關專戶存款支票,辦理掛失止付手續時,如經原發票機關於掛失止付通知書上簽蓋全部原留印鑑,並同意另行補發支票者,應如何辦理?","options":[{"option":"免向法院聲請公示催告","answer":true},{"option": "type":"Single","question":"國庫保管品收存逾幾年以上時,國庫經辦行得洽請委託機關儘速處理?","options":[{"option":"十年","answer":true},{"option":"五年","answer":false},{"option":"三年","answer":false}],"remark":""},{"id":"存匯-297","class":"存匯","sn":"297","type":"Single","question":"營業單位經收稅款漏未留存或遺失報核聯及收款機構留存聯,下列敘述何者錯誤?","options":[{"option":"應依無條碼繳款書作業方式,登錄縣市代號、稅目細稅代號(國稅為860、地方稅為870)、統一編號及金額","answer":false},{"option":"應以待查稅款處理,以A8101登錄「應付代收款-待查稅款」","answer":true},{"option":"次營業日可於行內全球資訊網-報表管理系統查詢C060報表,備註欄為待查稅款","answer":false}],"remark":""},{"id":"存匯-298","class":"存匯","sn":"298","type":"Single","question":"各代收稅款金融機構每營業日所收之稅款,其繳款書報核聯須送交稽徵機關者,應於次營業日幾時前,將報核聯區分本、外轄並連同彙計單送達當地稽徵機關?","options":[{"option":"十二時","answer":true},{"option":"十時","answer":false},{"option":"十三時","answer":false}],"remark":""},{"id":"存匯-299","class":"存匯","sn":"299","type":"Single","question":"本行各分行或委託同業金融機構派員常駐政府機關經收各項稅費款,作業時間為下列何者?","options":[{"option":"原則上配合各該政府機關上下班時間","answer":true},{"option":"依據銀行業上下班時間為準","answer":false},{"option":"為保障運鈔安全,避開上下班尖峰時段,縮短作業時間為上午十時至下午三時","answer":false}],"remark":""},{"id":"存匯-300","class":"存匯","sn":"300","type":"Single","question":"稅款經收人員經收已逾限繳日期之扣繳稅額繳款書時,下列敘述何者為是?","options":[{"option":"扣繳稅額繳款書勾選「自動補扣繳」者,應計算加計利息,未勾選「自動補扣繳」者,應計算滯納金","answer":false},{"option":"如為電腦列印之條碼化繳款書,以人手勾選「自動補扣繳」者,因納稅資料與條碼內容不符,則不予代收,並請扣繳義務人以自動補扣繳方式重新列印繳款書","answer":false},{"option":"以上皆是","answer":true}],"remark":""},{"id":"存匯-301","class":"存匯","sn":"301","type":"Single","question":"本行代理公庫單位派駐行外收款處借用週轉金,以不超過多少元為原則,並應報總行核備?","options":[{"option":"壹拾萬元","answer":false},{"option":"貳拾萬元","answer":true},{"option":"參拾萬元","answer":false}],"remark":""},{"id":"存匯-302","class":"存匯","sn":"302","type":"Single","question":"本行為提升服務品質,配合各縣市政府財會系統實施公庫單據、帳務電子化,以取代人手的製單,請問該電子化服務設備為下列何者?","options":[{"option":"就學貸款入口網","answer":false},{"option":"公庫服務網","answer":true},{"option":"學雜費入口網","answer":false}],"remark":""},{"id":"存匯-303","class":"存匯","sn":"303","type":"Single","question":"縣市代庫金融機構應縣市政府所屬機關請求派員常駐經收稅費款時,除應報經金融監督管理委員會核准外,下列敘述何者正確?","options":[{"option":"不得兼辦代收稅費款以外之業務","answer":true},{"option":"可兼辦該機關內員工之活期儲蓄存款","answer":false},{"option":"報經其總行核准後可兼辦其他業務","answer":false}],"remark":""},{"id":"存匯-304","class":"存匯","sn":"304","type":"Single","question":"本行各代庫單位委託其他金融機構派員常駐當地政府機關經收各項稅費款,視實際情況需要補貼派駐津貼時,得在最高不超過新台幣多少元之額度內,自行在「手續費用-代理收付手續費」項下列支,並報行核備?","options":[{"option":"三萬元","answer":true},{"option":"五萬元","answer":false},{"option":"十萬元","answer":false}],"remark":""},{"id":"存匯-305","class":"存匯","sn":"305","type":"Single","question":"依現行規定,轉帳納稅之約定及終止,應於稅款開徵前多久以前申請,逾此期限,應轉知申請人:「雖予受理,惟將併入下一期開徵時配合辦理」?","options":[{"option":"二個月","answer":true},{"option":"一個月","answer":false},{"option":"十五天","answer":false}],"remark":""},{"id":"存匯-306","class":"存匯","sn":"306","type":"Single","question":"代收各稅繳款書報核聯須移送稽徵機關,下列何者為是?","options":[{"option":"無條碼繳款書","answer":false},{"option":"有條碼之機關團體銷售貨物及勞務申報銷售額與營業稅繳款書(稅目別407)","answer":false},{"option":"以上皆是","answer":true}],"remark":""},{"id":"存匯-307","class":"存匯","sn":"307","type":"Single","question":"納稅義務人為公司行號並以現金繳納稅款達新台幣50萬元(含)以上,依「金融機構防制洗錢辦法」規定,下列敘述何者錯誤?","options":[{"option":"免向調查局申報","answer":false},{"option":"只須對繳款人即公司行號進行「制裁及恐佈分子名單」檢核","answer":true},{"option":"應確認代理人身分及留存相關紀錄憑證","answer":false}],"remark":""},{"id":"存匯-308","class":"存匯","sn":"308","type":"Single","question":"稽徵機關依照規定展延繳款者限繳日期,應如何辦理?","options":[{"option":"應以稽徵單位經辦人員電話通知為依據辦理","answer":false},{"option":"由納稅義務人填寫申請書,並經稽徵機關經辦人員加蓋私章予以認可即予辦理","answer":false},{"option":"應以稽徵機關核准延期章所註明之展延日為準","answer":true}],"remark":""},{"id":"存匯-309","class":"存匯","sn":"309","type":"Single","question":"繳稅取款委託書為下列何者專用?","options":[{"option":"繳納燃料費專用","answer":false},{"option":"綜合所得稅結算申報專用","answer":true},{"option":"適用於所有應繳納稅款","answer":false}],"remark":""},{"id":"存匯-310","class":"存匯","sn":"310","type":"Single","question":"為便利納稅義務人繳納稅款,得由納稅義務人以不逾限繳日期之未到期票據繳納,並立即發給收據的是下列何者?","options":[{"option":"牌照稅","answer":false},{"option":"地價稅","answer":false},{"option":"結算申報之綜合所得稅及暫繳申報之營利事業所得稅","answer":true}],"remark":""},{"id":"存匯-311","class":"存匯","sn":"311","type":"Single","question":"自動報繳之稅款繳款書大小寫金額不符時,應如何辦理?","options":[{"option":"以大寫金額為準","answer":false},{"option":"以金額較大者為收款依據","answer":false},{"option":"請報繳人更改至相符並蓋章","answer":true}],"remark":""},{"id":"存匯-312","class":"存匯","sn":"312","type":"Single","question":"櫃員收到稅款繳款書及同業付款票據,於審核繳款書各要項無誤後,應在繳款書各聯加蓋「收款章」,其日期應為下列何者?","options":[{"option":"經收當日","answer":true},{"option":"票款收妥日","answer":false},{"option":"如已逾稅款限繳日期,又對繳款人有信心,為免其受罰,可蓋該稅款之限繳日日期","answer":false}],"remark":""},{"id":"存匯-313","class":"存匯","sn":"313","type":"Single","question":"納稅義務人以支票繳納稅款,下列敘述何者錯誤?","options":[{"option":"所得稅結算申報(每年5月1日至5月31日及暫繳申報(每年9月1日至9月30日)期間,納稅義務人以不逾限繳日期之未到期支票繳納稅款,各代收稅款處不得拒絕受理","answer":false},{"option":"稅款經收人員核對支票及自繳繳款書填註無誤後,應於繳款書各聯加蓋「票據繳納,兌現後生效」戳記及當日現金章或轉帳戳記及經收人員私章後,將收據聯及證明聯發還給納稅義務人","answer":false},{"option":"以2張以上未逾所得稅結算申報或暫繳申報期間之未到期票據繳納同筆稅款時,以晚到期票據之發票日或到期日為準","answer":true}],"remark":""},{"id":"存匯-314","class":"存匯","sn":"314","type":"Single","question":"納稅義務人以支票繳稅時,櫃員除在稅款繳款書(稅單)各聯加蓋當日「收款章」外,並蓋「票據繳稅,兌現後生效」戳記後,將收據聯發給納稅人。如繳稅支票因存款不足遭致退票,下列處理方式何者為非?","options":[{"option":"應依據支票背面所填寫之電話號碼聯絡納稅義務人前來補繳稅款","answer":false},{"option":"如前來補繳稅款已逾期者,因其前係以支票於限繳期限繳稅,故可免收滯納金或加計利息","answer":true},{"option":"如連絡不到繳款人無法收回收據時,應將所退票據連同稅單其餘各聯(應註銷原蓋收款章戳記)及處理經過函報稅款所屬稽徵機關,由其處理","answer":false}],"remark":""},{"id":"存匯-315","class":"存匯","sn":"315","type":"Single","question":"某公司於二月四日發放員工薪資,所扣繳之稅款最遲應於何時前向公庫繳清?","options":[{"option":"二月十日","answer":false},{"option":"二月二十八日","answer":false},{"option":"三月十日","answer":true}],"remark":""},{"id":"存匯-316","class":"存匯","sn":"316","type":"Single","question":"依稅捐稽徵法第20條有關逾期繳納稅捐加徵滯納金之規定,自111年1月1日修正施行,每逾幾日按滯納稅額加徵百分之一滯納金?","options":[{"option":"一日","answer":false},{"option":"二日","answer":false},{"option":"三日","answer":true}],"remark":""},{"id":"存匯-317","class":"存匯","sn":"317","type":"Single","question":"對逾滯納期限繳納之稅款,應加計滯納利息時所依據之利率為下列何者?","options":[{"option":"本行每年1月1日之1年期定期存款固定利率","answer":false},{"option":"中華郵政股份有限公司每年1月1日之1年期定期儲金固定利率","answer":true},{"option":"每年1月1日八大公股銀行1年期定期存款平均利率","answer":false}],"remark":""},{"id":"存匯-318","class":"存匯","sn":"318","type":"Single","question":"納稅義務人逾滯納期限始繳交稅款,除加徵滯納金外,尚須加計滯納利息的是下列何者?","options":[{"option":"房屋稅及地價稅","answer":false},{"option":"證券交易稅","answer":false},{"option":"遺產稅及營業稅","answer":true}],"remark":""},{"id":"存匯-319","class":"存匯","sn":"319","type":"Single","question":"為降低代收稅款發生短、溢收情事,下列敘述何者錯誤?","options":[{"option":"收受逾期稅款應至財政部稅務入口網「線上服務/線上稅務試算」專區執行滯納金、滯納利息試算,並列印試算結果作為傳票附件,供核章主管覆核","answer":false},{"option":"扣繳稅額繳款書條碼版之收款機構留存聯,納稅人以手寫勾選「自動補扣繳」欄位得免收滯納金,應加計利息","answer":true},{"option":"續上,如未勾選「自動補扣繳」者,視同一般案件,應收取滯納金","answer":false}],"remark":""},{"id":"存匯-320","class":"存匯","sn":"320","type":"Single","question":"依本行改進代收款項作業措施,納稅義務人來行繳納稅款後,下列敘述何者為正確?","options":[{"option":"現金繳稅輸入電腦後,熱感應式印表機列印「代收款項客戶確認聯」,該確認聯交客戶核對無誤後,請客戶於密碼輸入器(PINPAD)按ENTER鍵確認","answer":false},{"option":"櫃員應發給客戶繳款憑證為稅單之收據聯及熱感式印表機輸出之臺灣銀行經收稅費款項證明聯","answer":false},{"option":"以上皆是","answer":true}],"remark":""},{"id":"存匯-321","class":"存匯","sn":"321","type":"Single","question":"納稅義務人遺失已繳納繳款書收據聯,申請補發時應如何辦理?","options":[{"option":"向原代收稅款金融機構申請","answer":false},{"option":"應向稽徵機關申請核發繳納證明","answer":true},{"option":"以上皆可","answer":false}],"remark":""},{"id":"存匯-322","class":"存匯","sn":"322","type":"Single","question":"稅款收妥後,在尚未傳送繳稅資料前,如繳款人要求退還所繳稅款時,依「稅款經收手冊」,應如何辦理?","options":[{"option":"得依其實務作業逕予退還","answer":false},{"option":"向繳款人委婉說明請其洽稽徵機關辦理退還","answer":false},{"option":"以上皆可","answer":true}],"remark":""},{"id":"存匯-323","class":"存匯","sn":"323","type":"Single","question":"各項稅單存查聯,如未合併傳票裝訂,而採單獨裝訂者,至少須保存至中央政府總決算公布日起幾年以上始得銷燬?","options":[{"option":"五年","answer":true},{"option":"十年","answer":false},{"option":"二十年","answer":false}],"remark":""},{"id":"存匯-324","class":"存匯","sn":"324","type":"Single","question":"本行金采卡「黃金回饋點數」兌換黃金存入黃金存摺作業,網路銀行客戶可登入網路銀行,在我的信用卡項下點選「黃金回饋換購」,當可用大於多少(含)以上點數,於該頁面逕行申請兌換?","options":[{"option":"100","answer":false},{"option":"200","answer":true},{"option":"300","answer":false}],"remark":""},{"id"
